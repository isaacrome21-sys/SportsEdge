name: cfb-mlb-manual-hybrid-audit-v1

on:
  push:
    branches:
      - cfb-audit-v1-2-hardening
    paths:
      - "sportsedge/sports/cfb/**"
      - "sportsedge/core/leakage.py"
      - "sportsedge/core/prior_decay.py"
      - "sportsedge/core/probability_contract.py"
      - "sportsedge/core/certification_lifecycle.py"
      - "sportsedge/core/decision_provenance.py"
      - "sportsedge/core/manual_input_contract.py"
      - "sportsedge/core/policy_bundle.py"
      - "sportsedge/core/promotion_record.py"
      - "sportsedge/devig.py"
      - "sportsedge/generic_card_pipeline.py"
      - "sportsedge/mlb_evidence_invalidation.py"
      - "sportsedge/mlb_distribution_validation.py"
      - "sportsedge/mlb_truth_gate_v1.py"
      - "sportsedge/mlb_coverage.py"
      - "config/cfb_*.json"
      - "config/mlb_truth_gate_v1.json"
      - "config/mlb_market_benchmark_v1.json"
      - "config/mlb_validation_policy_v1.json"
      - "config/manual_hybrid_governance_v1.json"
      - "config/manual_hybrid_evidence_gate_v1.json"
      - "config/manual_hybrid_policy_freeze_v1.json"
      - "config/provider_degrade_matrix_v1.json"
      - "config/schemas/cfb_*.json"
      - "config/schemas/decision_provenance_v1.schema.json"
      - "docs/SPORTSEDGE_MANUAL_HYBRID_AUDIT_CANONICAL_V1.md"
      - "tests/test_cfb_audit_v12.py"
      - "tests/test_cfb_audit_v12_residual.py"
      - "tests/test_cfb_run_machine_finish.py"
      - "tests/test_cfb_audit_manifest_provenance.py"
      - "tests/test_manual_hybrid_audit_governance.py"
      - "tests/test_manual_input_contract.py"
      - "tests/test_policy_bundle.py"
      - "tests/test_promotion_record.py"
      - "tests/test_mlb_distribution_validation.py"
      - "tests/test_mlb_truth_gate_v1.py"
      - "tests/test_mlb_coverage.py"
      - "tests/test_devig_temporal_pair.py"
      - ".github/workflows/cfb-audit-v12.yml"
  pull_request:
    branches: [main]
    paths:
      - "sportsedge/sports/cfb/**"
      - "sportsedge/core/leakage.py"
      - "sportsedge/core/prior_decay.py"
      - "sportsedge/core/probability_contract.py"
      - "sportsedge/core/certification_lifecycle.py"
      - "sportsedge/core/decision_provenance.py"
      - "sportsedge/core/manual_input_contract.py"
      - "sportsedge/core/policy_bundle.py"
      - "sportsedge/core/promotion_record.py"
      - "sportsedge/devig.py"
      - "sportsedge/generic_card_pipeline.py"
      - "sportsedge/mlb_evidence_invalidation.py"
      - "sportsedge/mlb_distribution_validation.py"
      - "sportsedge/mlb_truth_gate_v1.py"
      - "sportsedge/mlb_coverage.py"
      - "config/cfb_*.json"
      - "config/mlb_truth_gate_v1.json"
      - "config/mlb_market_benchmark_v1.json"
      - "config/mlb_validation_policy_v1.json"
      - "config/manual_hybrid_governance_v1.json"
      - "config/manual_hybrid_evidence_gate_v1.json"
      - "config/manual_hybrid_policy_freeze_v1.json"
      - "config/provider_degrade_matrix_v1.json"
      - "config/schemas/cfb_*.json"
      - "config/schemas/decision_provenance_v1.schema.json"
      - "docs/SPORTSEDGE_MANUAL_HYBRID_AUDIT_CANONICAL_V1.md"
      - "tests/test_cfb_audit_v12.py"
      - "tests/test_cfb_audit_v12_residual.py"
      - "tests/test_cfb_run_machine_finish.py"
      - "tests/test_cfb_audit_manifest_provenance.py"
      - "tests/test_manual_hybrid_audit_governance.py"
      - "tests/test_manual_input_contract.py"
      - "tests/test_policy_bundle.py"
      - "tests/test_promotion_record.py"
      - "tests/test_mlb_distribution_validation.py"
      - "tests/test_mlb_truth_gate_v1.py"
      - "tests/test_mlb_coverage.py"
      - "tests/test_devig_temporal_pair.py"
      - ".github/workflows/cfb-audit-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-hybrid-audit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile audit modules
        run: >-
          python -m compileall -q
          sportsedge/sports/cfb
          sportsedge/core/leakage.py
          sportsedge/core/prior_decay.py
          sportsedge/core/probability_contract.py
          sportsedge/core/certification_lifecycle.py
          sportsedge/core/decision_provenance.py
          sportsedge/core/manual_input_contract.py
          sportsedge/core/policy_bundle.py
          sportsedge/core/promotion_record.py
          sportsedge/devig.py
          sportsedge/generic_card_pipeline.py
          sportsedge/mlb_evidence_invalidation.py
          sportsedge/mlb_distribution_validation.py
          sportsedge/mlb_truth_gate_v1.py
          sportsedge/mlb_coverage.py
      - name: Run CFB audit acceptance tests
        run: python -m unittest tests.test_cfb_audit_v12 -v
      - name: Run CFB residual-risk acceptance tests
        run: python -m unittest tests.test_cfb_audit_v12_residual -v
      - name: Run CFB manifest provenance tests
        run: python -m unittest tests.test_cfb_audit_manifest_provenance -v
      - name: Run Manual Hybrid governance tests
        run: python -m unittest tests.test_manual_hybrid_audit_governance -v
      - name: Run Manual input contract tests
        run: python -m unittest tests.test_manual_input_contract -v
      - name: Run policy bundle tests
        run: python -m unittest tests.test_policy_bundle -v
      - name: Run promotion record tests
        run: python -m unittest tests.test_promotion_record -v
      - name: Run temporal devig pair tests
        run: python -m unittest tests.test_devig_temporal_pair -v
      - name: Run MLB distribution validation tests
        run: python -m unittest tests.test_mlb_distribution_validation -v
      - name: Run MLB Truth Gate tests
        run: python -m unittest tests.test_mlb_truth_gate_v1 -v
      - name: Run MLB coverage tests
        run: python -m unittest tests.test_mlb_coverage -v
      - name: Run existing CFB run-machine regression tests
        run: python -m unittest tests.test_cfb_run_machine_finish -v
