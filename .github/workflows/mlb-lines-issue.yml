name: mlb-lines-issue

# Phone → card with no agent in the loop: open an "MLB lines → card" issue,
# this job transcribes the lines, runs the SportsEdge engines and replies
# on the issue with the card.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

# GitHub treats issue-triggered workflows as low-trust and defaults their cache
# token to read-only. Only the repository owner is allowed to run this job, and
# the cached path contains public MLB history data only, so allow same-day writes.
cache-mode: write

concurrency:
  group: mlb-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  card:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'mlb-lines') || startsWith(github.event.issue.title, '[MLB LINES]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Slate date
        id: day
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      # Team/pitcher history is strictly prior to the slate date, so it can't change
      # during the day. Reusing it makes the 2nd+ board of the day much faster.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/mlb-history
          key: mlb-lines-history-v1-${{ runner.os }}-${{ steps.day.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            mlb-lines-history-v1-${{ runner.os }}-${{ steps.day.outputs.date }}-

      - name: Transcribe lines from the issue
        id: intake
        env:
          BODY: ${{ github.event.issue.body }}
          # Lines have no book timestamp: stamp at intake (last edit wins).
          OBSERVED: ${{ github.event.issue.updated_at }}
        run: |
          printf '%s' "$BODY" > issue_body.txt
          if PYTHONPATH=. python scripts/intake_mlb_lines_issue.py --body-file issue_body.txt \
               --observed-at "$OBSERVED" --issue "$ISSUE" > intake.out; then
            cat intake.out >> "$GITHUB_OUTPUT"
          else
            { echo "Couldn't read these lines, so no card was run:"; echo; echo '```'; cat intake_error.txt; echo '```';
              echo; echo "Edit the issue to fix them and it will rerun."; } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
            exit 1
          fi

      - name: Run SportsEdge engines
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.intake.outputs.path }}" --run-date "${{ steps.intake.outputs.slate }}" --max-age-minutes 60 --output artifacts/manual_mlb_snapshot_card.json

      - name: Render card and reply now
        run: |
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --out-dir artifacts/mlb_myspari
          gh issue comment "$ISSUE" --body-file artifacts/mlb_myspari/card.md

      - name: Retrieve pregame context (display only, after the card is posted)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          PYTHONPATH=. python scripts/acquire_mlb_card_context.py --engine-output artifacts/manual_mlb_snapshot_card.json --out-dir artifacts/mlb_context
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --context-dir artifacts/mlb_context \
            --out-dir artifacts/mlb_myspari_ctx
          gh issue comment "$ISSUE" --body-file artifacts/mlb_myspari_ctx/card.md

      - name: Report engine failure on the issue
        if: failure() && steps.intake.outcome == 'success'
        run: |
          gh issue comment "$ISSUE" --body "The card run failed after intake. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mlb-lines-issue-${{ github.event.issue.number }}
          path: |
            manual_inputs/mlb/*_issue*.json
            artifacts/
          if-no-files-found: warn
