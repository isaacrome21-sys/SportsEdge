name: mlb-lines-issue

# Phone → card with no agent in the loop: open an "MLB lines → card" issue,
# this job transcribes the lines, runs the SportsEdge engines and replies
# on the issue with the card.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

# GitHub treats issue-triggered workflows as low-trust and defaults their cache
# token to read-only. Only the repository owner is allowed to run this job. The
# caches contain only the pinned NumPy runtime and public MLB history data.
cache-mode: write

concurrency:
  group: mlb-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  card:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'mlb-lines') || startsWith(github.event.issue.title, '[MLB LINES]'))
    # Container-backed 1-vCPU runner is optimized for short issue automation and
    # avoids the full VM provisioning cost seen in the phone-path smoke tests.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify slim Python runtime
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m pip --version

      # Keep the slim runtime cache separate from full-VM runners. First slim run
      # installs once; warm issue runs restore the pinned cp312 package directly.
      - name: Restore phone runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime-deps
          key: mlb-lines-runtime-v2-${{ runner.os }}-${{ runner.arch }}-slim-py312-numpy253
      - name: Install runtime dependencies
        if: steps.runtime.outputs.cache-hit != 'true'
        run: python3 -m pip install --disable-pip-version-check --target .runtime-deps numpy==2.5.3

      - name: Slate date
        id: day
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      # Team/pitcher history is strictly prior to the slate date, so it can't change
      # during the day. Reusing it makes the 2nd+ board of the day much faster.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/mlb-history
          key: mlb-lines-history-v1-${{ runner.os }}-${{ steps.day.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            mlb-lines-history-v1-${{ runner.os }}-${{ steps.day.outputs.date }}-

      - name: Transcribe lines from the issue
        id: intake
        env:
          BODY: ${{ github.event.issue.body }}
          # Lines have no book timestamp: stamp at intake (last edit wins).
          OBSERVED: ${{ github.event.issue.updated_at }}
        run: |
          printf '%s' "$BODY" > issue_body.txt
          if PYTHONPATH=.runtime-deps:. python3 scripts/intake_mlb_lines_issue.py --body-file issue_body.txt \
               --observed-at "$OBSERVED" --issue "$ISSUE" > intake.out; then
            cat intake.out >> "$GITHUB_OUTPUT"
          else
            { echo "Couldn't read these lines, so no card was run:"; echo; echo '```'; cat intake_error.txt; echo '```';
              echo; echo "Edit the issue to fix them and it will rerun."; } > comment.md
            python3 scripts/post_github_issue_comment.py --issue "$ISSUE" --body-file comment.md
            exit 1
          fi

      - name: Run SportsEdge engines
        run: PYTHONPATH=.runtime-deps:. python3 scripts/run_manual_mlb_snapshot.py --input "${{ steps.intake.outputs.path }}" --run-date "${{ steps.intake.outputs.slate }}" --max-age-minutes 60 --output artifacts/manual_mlb_snapshot_card.json

      - name: Render card and reply now
        run: |
          PYTHONPATH=.runtime-deps:. python3 scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --out-dir artifacts/mlb_myspari
          python3 scripts/post_github_issue_comment.py --issue "$ISSUE" --body-file artifacts/mlb_myspari/card.md

      - name: Retrieve pregame context (display only, after the card is posted)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          PYTHONPATH=.runtime-deps:. python3 scripts/acquire_mlb_card_context.py --engine-output artifacts/manual_mlb_snapshot_card.json --out-dir artifacts/mlb_context
          PYTHONPATH=.runtime-deps:. python3 scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --context-dir artifacts/mlb_context \
            --out-dir artifacts/mlb_myspari_ctx
          python3 scripts/post_github_issue_comment.py --issue "$ISSUE" --body-file artifacts/mlb_myspari_ctx/card.md

      - name: Report engine failure on the issue
        if: failure() && steps.intake.outcome == 'success'
        run: |
          printf 'The card run failed after intake. Run log: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > failure_comment.txt
          python3 scripts/post_github_issue_comment.py --issue "$ISSUE" --body-file failure_comment.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mlb-lines-issue-${{ github.event.issue.number }}
          path: |
            manual_inputs/mlb/*_issue*.json
            artifacts/
          if-no-files-found: warn
