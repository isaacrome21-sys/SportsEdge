name: mlb-lines-issue

# Phone → card with no agent in the loop: open an "MLB lines → card" issue,
# this job transcribes the lines, runs the SportsEdge engines and replies
# on the issue with the card.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

# GitHub treats issue-triggered workflows as low-trust and defaults their cache
# token to read-only. Only the repository owner is allowed to run this job. The
# caches contain only the pinned NumPy runtime and public MLB history data.
cache-mode: write

concurrency:
  group: mlb-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  card:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'mlb-lines') || startsWith(github.event.issue.title, '[MLB LINES]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # The live smoke showed NumPy installation taking ~3.7 seconds, while
      # setup-python itself was ~0.2 seconds. Cache the installed cp312 package,
      # not just pip's download cache, so warm phone runs skip installation.
      - name: Restore phone runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime-deps
          key: mlb-lines-runtime-v1-${{ runner.os }}-${{ runner.arch }}-py312-numpy253
      - name: Install runtime dependencies
        if: steps.runtime.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check --target .runtime-deps numpy==2.5.3

      - name: Test MLB lines intake regression
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          PYTHONPATH=.runtime-deps:. python -m pytest -q tests/test_mlb_lines_issue2578.py tests/test_mlb_actionable_release_guard.py tests/test_render_quote_move_guard.py

      - name: Slate date
        id: day
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      # Team/pitcher history is strictly prior to the slate date, so it can't change
      # during the day. Reusing it makes the 2nd+ board of the day much faster.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/mlb-history
          key: mlb-lines-history-v2-${{ runner.os }}-${{ steps.day.outputs.date }}

      - name: Transcribe lines from the issue
        id: intake
        env:
          BODY: ${{ github.event.issue.body }}
          # Lines have no book timestamp: stamp at intake (last edit wins).
          OBSERVED: ${{ github.event.issue.updated_at }}
        run: |
          printf '%s' "$BODY" > issue_body.txt
          if PYTHONPATH=.runtime-deps:. python scripts/intake_mlb_lines_issue.py --body-file issue_body.txt \
               --observed-at "$OBSERVED" --issue "$ISSUE" > intake.out; then
            cat intake.out >> "$GITHUB_OUTPUT"
          else
            { echo "Couldn't read these lines, so no card was run:"; echo; echo '```'; cat intake_error.txt; echo '```';
              echo; echo "Edit the issue to fix them and it will rerun."; } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
            exit 1
          fi

      - name: Report skipped MLB lines on the issue
        if: steps.intake.outcome == 'success'
        run: |
          if [ -s intake_warnings.txt ]; then
            {
              echo "MLB intake skipped these informational or unparseable lines (no rows created):"
              echo
              cat intake_warnings.txt
            } > intake_warning_comment.md
            gh issue comment "$ISSUE" --body-file intake_warning_comment.md
          fi

      - name: Run SportsEdge engines
        run: |
          started=$(date +%s)
          PYTHONPATH=.runtime-deps:. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.intake.outputs.path }}" --run-date "${{ steps.intake.outputs.slate }}" --max-age-minutes 60 --output artifacts/manual_mlb_snapshot_card.json
          echo "mlb_engine_seconds=$(( $(date +%s) - started ))"

      - name: Render PRE-CONTEXT audit artifact
        run: |
          # Keep the fast pre-context render for audit/debugging, but do not post it.
          # The user-facing issue receives one context-bound final card only.
          PYTHONPATH=.runtime-deps:. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --pre-context \
            --out-dir artifacts/mlb_myspari

      - name: Retrieve pregame context and post unified final card
        timeout-minutes: 5
        run: |
          # Context is best-effort by lane. If a public source is unavailable, the
          # final card still renders and reports the missing lane instead of forcing
          # manual re-entry of Statcast/lineups/weather/etc.
          timeout 240s env PYTHONPATH=.runtime-deps:. python scripts/acquire_mlb_card_context.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --out-dir artifacts/mlb_context \
            --workers 6 || true
          PYTHONPATH=.runtime-deps:. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --context-dir artifacts/mlb_context \
            --out-dir artifacts/mlb_myspari_ctx
          gh issue comment "$ISSUE" --body-file artifacts/mlb_myspari_ctx/card.md

      # Issue edits replace the visible quote board. Save each actual pregame
      # Captured receipt on a review branch; never write to protected main.
      # This step runs AFTER the final card so the snapshot includes paper picks.
      - name: Preserve MLB PAPER snapshot via draft evidence PR
        if: steps.intake.outcome == 'success'
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          branch="automation/mlb-paper-snapshots-issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git checkout -b "$branch" origin/main
          fi
          if ! PYTHONPATH=.runtime-deps:. python scripts/record_line_snapshot.py \
               --sport mlb --issue "$ISSUE" \
               --body-file issue_body.txt --title "$TITLE" \
               --card-md artifacts/mlb_myspari_ctx/card.md \
               --require-card-quote-match \
               --bound-input-json "${{ steps.intake.outputs.path }}" \
               --max-capture-lag-seconds 180 \
               --root ledger/line_snapshots 2>mlb_snapshot_refusal.txt; then
            reason="$(tail -n 1 mlb_snapshot_refusal.txt | tr -cd '[:alnum:] _:+.-' | cut -c1-180)"
            gh issue comment "$ISSUE" --body "MLB PAPER SNAPSHOT REFUSED: ${reason:-reason unavailable}. No eligible entry/close or CLV recorded. See run logs."
            exit 0
          fi
          path="ledger/line_snapshots/mlb/$ISSUE.jsonl"
          git add -- "$path"
          if git diff --cached --quiet; then
            echo "MLB snapshot unchanged; no evidence commit necessary."
            exit 0
          fi
          git commit -m "evidence: append MLB paper snapshot for issue #$ISSUE"
          if ! git push origin "HEAD:refs/heads/$branch"; then
            gh issue comment "$ISSUE" --body "MLB PAPER SNAPSHOT PUSH BLOCKED: conflicting evidence branch update. This capture was not saved; rerun the issue capture workflow after resolving the branch conflict. No eligible CLV recorded."
            exit 1
          fi
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head "$branch" \
              --title "MLB PAPER snapshots for lines issue #$ISSUE" \
              --body "Append-only MLB DK issue capture evidence, pregame chronology evaluated at grade time. PAPER only. Independent receipt review required; no promotion."
          fi

      - name: Report engine failure on the issue
        if: failure() && steps.intake.outcome == 'success'
        run: |
          gh issue comment "$ISSUE" --body "The card run failed after intake. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mlb-lines-issue-${{ github.event.issue.number }}
          path: |
            manual_inputs/mlb/*_issue*.json
            artifacts/
          if-no-files-found: warn
