name: mlb-pitcher-k-forward-validation

on:
  pull_request:
    paths:
      - 'config/research/mlb_pitcher_k_forward_validation_v1.json'
      - 'sportsedge/mlb_pitcher_k_forward_validation.py'
      - 'scripts/capture_mlb_pitcher_k_forward.py'
      - 'scripts/finalize_mlb_pitcher_k_forward.py'
      - 'sportsedge/mlb_pitcher_k_forward_readout.py'
      - 'tests/test_mlb_pitcher_k_forward_validation.py'
      - 'tests/test_mlb_pitcher_k_forward_readout.py'
      - '.github/workflows/mlb-pitcher-k-forward-validation.yml'
  workflow_run:
    workflows:
      - mlb-prop-pit-archive
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: mlb-pitcher-k-forward-validation-${{ github.event.pull_request.number || 'runtime' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile forward lane
        run: |
          python -m py_compile \
            sportsedge/mlb_pitcher_k_forward_validation.py \
            sportsedge/mlb_pitcher_k_forward_readout.py \
            scripts/capture_mlb_pitcher_k_forward.py \
            scripts/finalize_mlb_pitcher_k_forward.py
      - name: Test frozen fit, receipt, and one-look readout contracts
        run: >-
          python -m pytest -q
          tests/test_mlb_pitcher_k_forward_validation.py
          tests/test_mlb_pitcher_k_forward_readout.py

  capture-and-settle:
    needs: contract
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Fetch immutable evidence branch
        run: git fetch origin data
      - name: Capture prospective pitcher-K predictions and settle finals
        run: >-
          python scripts/capture_mlb_pitcher_k_forward.py
          --output-root data/mlb_pitcher_k_forward
          --cache-dir .cache/mlb-pitcher-k-forward
      - name: Finalize one-look readout only when the frozen minimum is reached
        run: python scripts/finalize_mlb_pitcher_k_forward.py --root data/mlb_pitcher_k_forward
      - name: Persist create-only forward receipts
        run: |
          python scripts/persist_forward_evidence_data_branch.py \
            --path data/mlb_pitcher_k_forward \
            --branch data \
            --worktree "$RUNNER_TEMP/sportsedge-mlb-pitcher-k-forward-data" \
            --message "evidence: persist prospective MLB pitcher-K validation receipts"
      - name: Upload forward validation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-pitcher-k-forward-validation-${{ github.run_id }}
          path: data/mlb_pitcher_k_forward/**
          if-no-files-found: warn
          retention-days: 90
