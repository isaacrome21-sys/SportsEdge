name: mlb-pitcher-fragility-audit
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_mlb_pitcher_prop_fragility.py
      - tests/test_mlb_pitcher_prop_fragility.py
      - .github/workflows/mlb-pitcher-fragility-audit.yml
  pull_request:
    paths:
      - scripts/audit_mlb_pitcher_prop_fragility.py
      - tests/test_mlb_pitcher_prop_fragility.py
      - .github/workflows/mlb-pitcher-fragility-audit.yml
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test fail-closed pitcher fragility audit
        run: PYTHONPATH=. python -m unittest tests.test_mlb_pitcher_prop_fragility -v
