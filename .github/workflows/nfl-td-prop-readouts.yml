name: nfl-td-prop-readouts
on:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/touchdown_readouts.py'
      - 'sportsedge/sports/nfl/prop_readout_batch.py'
      - 'tests/test_nfl_touchdown_readouts.py'
      - 'tests/test_nfl_prop_readout_batch.py'
      - '.github/workflows/nfl-td-prop-readouts.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.5.3'
      - run: >-
          python -m unittest -v tests.test_nfl_touchdown_readouts
          tests.test_nfl_prop_readout_batch tests.test_football_player_market_readouts
          tests.test_football_period_readouts tests.test_football_kicker_market_readouts
          tests.test_football_nfl_defense_markets
