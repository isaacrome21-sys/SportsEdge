name: reconcile-pr898-bootstrap

on:
  push:
    branches:
      - governance/reconcile-pr898-20260921
    paths:
      - .github/workflows/reconcile-pr898-bootstrap.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-pr898-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Pin protected main and write reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected='ed628eaa978dd11a2097da91fa006067fb55e717'
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$expected" || { echo "MAIN_MOVED:$actual"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('config/freeze_reconciliation_registry_v1.json')
          r = json.loads(p.read_text())
          additions = [
              ('PR_895_RESEARCH_RECONCILIATION', '1e846593bb18929ad295d895ba7c8e4214b76766', 895,
               'NRFI/TD research and reconciliation repair; no model or betting authority granted.'),
              ('PR_896_NFL_RUN_IT_CARD', '49e3b866eea899f6f29f19911337c27aed443eb8', 896,
               'Research-only NFL sides/totals RUN IT card; no Model_P, Truth Gate, staking, or OFFICIAL authority.'),
              ('PR_898_NFL_PROP_ROLE_CHALLENGER', 'ed628eaa978dd11a2097da91fa006067fb55e717', 898,
               'Research NFL prop challenger changed tests/test_nfl_prop* governed inventory; drift is explicitly revoked fail-closed.'),
          ]
          ids = {str(x.get('delta_id')) for x in r.get('deltas', [])}
          shas = {str(x.get('merge_sha')) for x in r.get('deltas', [])}
          for delta_id, sha, pr, note in additions:
              if delta_id not in ids and sha not in shas:
                  r['deltas'].append({'delta_id': delta_id, 'merge_sha': sha, 'pr': pr, 'note': note})
          target = None
          for b in r['bundles']:
              if b.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1':
                  target = b
                  break
          if target is None:
              raise SystemExit('NFL_PROP_MODEL_FREEZE_V1_NOT_FOUND')
          target['disposition'] = {
              'state': 'REVOKED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'prior_forward_clock_invalidated': True,
              'reason': 'PR_898_CHANGED_COVERED_NFL_PROP_TEST_INVENTORY; RESEARCH_CHALLENGER_NOT_MACHINE_REFROZEN; REVOKED_FAIL_CLOSED',
              'trigger_delta_sha': 'ed628eaa978dd11a2097da91fa006067fb55e717',
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'eligibility': False,
                  'staking': False,
                  'official': False,
              },
          }
          r['reconciled_through_sha'] = 'ed628eaa978dd11a2097da91fa006067fb55e717'
          p.write_text(json.dumps(r, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Machine classify reconciliation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py --repo . --current-main-ref origin/main --output /tmp/report.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/report.json'))
          allowed = {'ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE'}
          bad = set(r.get('release_blocks') or []) - allowed
          print('outcome_counts=', r.get('outcome_counts'))
          print('release_blocks=', r.get('release_blocks'))
          if bad:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:' + ','.join(sorted(bad)))
          if any(bool(v) for v in (r.get('authority') or {}).values()):
              raise SystemExit('RECONCILIATION_AUTHORITY_ESCALATION')
          PY
      - name: Test reconciliation contracts
        run: |
          python -m pytest -q tests/test_freeze_reconciliation.py tests/test_reconcile_freeze_deltas_cli.py
      - name: Persist registry only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-pr898-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/reconcile-pr898-bootstrap.yml
          git commit -m 'Governance: reconcile PR898 NFL prop research drift'
          git push origin HEAD:governance/reconcile-pr898-20260921
