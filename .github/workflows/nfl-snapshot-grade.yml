name: nfl-snapshot-grade
on:
  workflow_dispatch:
    inputs:
      date:
        description: NFL scoreboard date (YYYY-MM-DD)
        required: true
        type: string
      issue:
        description: NFL lines issue number
        required: true
        type: string
      game_id:
        description: ESPN event ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Verify strict NFL grading
        run: python -m pytest -q tests/test_nfl_snapshot_grading.py tests/test_nfl_final_scores_capture.py
      - name: Capture finals and grade immutable snapshots
        env:
          SCORE_DATE: ${{ inputs.date }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          GAME_ID: ${{ inputs.game_id }}
        run: |
          set -euo pipefail
          [[ "$SCORE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$GAME_ID" =~ ^[0-9]+$ ]]
          python -m scripts.capture_nfl_final_scores capture --date "$SCORE_DATE" --output-dir artifacts/nfl_finals
          python -m scripts.grade_nfl_snapshots --issue "$ISSUE_NUMBER" --game-id "$GAME_ID" \
            --finals "artifacts/nfl_finals/$SCORE_DATE.json" --output "artifacts/nfl_grades/$ISSUE_NUMBER.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-snapshot-grades-${{ inputs.issue }}
          path: artifacts/
          if-no-files-found: warn
