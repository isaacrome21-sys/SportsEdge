name: archive-mlb-game-odds-failover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-mlb-game-odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
      SPORTSEDGE_ODDS_DAILY_BUDGET_CREDITS: '12'
      SPORTSEDGE_ODDS_BUDGET_LEDGER: .cache/sportsedge/odds-budget/ledger.json
      SPORTSEDGE_ARCHIVE_SOURCE: manual-failover
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical durable MLB archive lane
        run: python -I scripts/run_mlb_archive_lane.py
      - name: Upload failover archive execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-raw-game-odds-failover-${{ github.run_id }}
          path: |
            artifacts/raw_odds/**
            .cache/sportsedge/odds-budget/ledger.json
          if-no-files-found: error
          retention-days: 90
