name: archive-mlb-game-odds-failover

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - props-v6-forward-shadow
    types: [completed]

permissions:
  contents: write

concurrency:
  group: archive-mlb-game-odds
  cancel-in-progress: false

jobs:
  capture:
    # workflow_run executes from the default branch. Keep this guard explicit so
    # only completions of the intended upstream workflow can trigger acquisition.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
      SPORTSEDGE_ODDS_DAILY_BUDGET_CREDITS: '12'
      SPORTSEDGE_ODDS_BUDGET_LEDGER: .cache/sportsedge/odds-budget/ledger.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Bare-environment archive smoke test
        run: python -I scripts/archive_raw_game_odds.py --self-test
      - name: Resolve UTC day
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore durable budget ledger from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
          mkdir -p .cache/sportsedge/odds-budget
          if [ -f .data-branch/runtime/odds-budget/ledger.json ]; then
            cp .data-branch/runtime/odds-budget/ledger.json "$SPORTSEDGE_ODDS_BUDGET_LEDGER"
          fi
      - name: Capture raw game-market snapshot when inside target window
        id: capture
        shell: bash
        run: |
          set +e
          python -I scripts/archive_raw_game_odds.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist budget ledger and status rows to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .data-branch/.git ] && [ ! -f .data-branch/.git ]; then
            echo 'data branch worktree is unavailable' >&2
            exit 98
          fi
          mkdir -p .data-branch/runtime/odds-budget
          mkdir -p ".data-branch/runtime/archive-status/${{ steps.day.outputs.date }}"
          if [ -f "$SPORTSEDGE_ODDS_BUDGET_LEDGER" ]; then
            cp "$SPORTSEDGE_ODDS_BUDGET_LEDGER" .data-branch/runtime/odds-budget/ledger.json
          fi
          if [ -d "artifacts/raw_odds/status/${{ steps.day.outputs.date }}" ]; then
            cp artifacts/raw_odds/status/${{ steps.day.outputs.date }}/*.json ".data-branch/runtime/archive-status/${{ steps.day.outputs.date }}/" 2>/dev/null || true
          fi
          cd .data-branch
          git config user.name 'sportsedge-archive-bot'
          git config user.email 'sportsedge-archive-bot@users.noreply.github.com'
          git add runtime/odds-budget/ledger.json runtime/archive-status || true
          if ! git diff --cached --quiet; then
            git commit -m "archive: persist MLB odds failover run ${{ github.run_id }}"
            git push origin HEAD:data
          fi
      - name: Upload execution status, budget ledger, and raw capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-raw-game-odds-failover-${{ github.run_id }}
          path: |
            artifacts/raw_odds/**
            .cache/sportsedge/odds-budget/ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Propagate capture failure after evidence upload
        if: always()
        shell: bash
        run: |
          code='${{ steps.capture.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Capture step did not emit an exit code.' >&2
            exit 99
          fi
          exit "$code"
