name: run-it-odds-quota-diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - run-it-requests
    paths:
      - .github/workflows/run-it-odds-quota-diagnostic.yml
      - ops/run_it_odds_quota_trigger.json

permissions:
  contents: read

jobs:
  quota:
    concurrency:
      group: sportsedge-paid-odds-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Zero-credit quota probe
        shell: bash
        run: |
          set +e
          python scripts/odds_api_quota_guard.py --minimum-remaining 1 --out artifacts/run_it/odds_quota.json
          code=$?
          echo "quota_probe_exit=$code"
          exit 0
      - name: Upload quota diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-it-odds-quota-diagnostic
          path: artifacts/run_it/odds_quota.json
