name: archive-provider-acceptance-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-provider-acceptance-probe.yml'
      - 'scripts/archive_mlb_binding_acceptance.py'
      - 'sportsedge/game_odds_source.py'
      - 'sportsedge/quote_bridge.py'
      - 'sportsedge/mlb_binding_runtime.py'
      - 'sportsedge/orchestrator.py'
permissions:
  contents: write
jobs:
  mlb-binding-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile acceptance path
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/archive_mlb_binding_acceptance.py \
            sportsedge/game_odds_source.py \
            sportsedge/quote_bridge.py \
            sportsedge/mlb_binding_runtime.py \
            sportsedge/orchestrator.py
      - name: Run real production-path MLB binding acceptance
        id: acceptance
        shell: bash
        run: |
          set +e
          python scripts/archive_mlb_binding_acceptance.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist source-wiring evidence
        if: always()
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
          mkdir -p .data-branch/runtime/mlb-binding-acceptance
          cp -R artifacts/mlb-binding-acceptance/. .data-branch/runtime/mlb-binding-acceptance/ 2>/dev/null || true
          cd .data-branch
          git config user.name sportsedge-archive-bot
          git config user.email sportsedge-archive-bot@users.noreply.github.com
          git add runtime/mlb-binding-acceptance
          if ! git diff --cached --quiet; then
            git commit -m "archive: persist MLB source-binding acceptance ${{ github.run_id }}"
            git push origin HEAD:data
          fi
      - name: Propagate acceptance result
        if: always()
        run: exit '${{ steps.acceptance.outputs.exit_code }}'
