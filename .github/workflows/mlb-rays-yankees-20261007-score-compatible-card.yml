name: mlb-rays-yankees-20261007-score-compatible-card
on:
  push:
    branches: [main]
    paths:
      - manual_inputs/mlb/2026-10-07_rays_yankees_supplied.json
      - .github/workflows/mlb-rays-yankees-20261007-score-compatible-card.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run scored research model using exact DK snapshot
        run: >-
          PYTHONPATH=. python scripts/run_mlb_score_compatible_card_final.py
          --input manual_inputs/mlb/2026-10-07_rays_yankees_supplied.json
          --game-id 'Tampa Bay Rays@New York Yankees'
          --output artifacts/mlb_rays_yankees_20261007_joint_card.json
          --simulations 100000
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-rays-yankees-20261007-joint-card
          path: artifacts/mlb_rays_yankees_20261007_joint_card.json
          if-no-files-found: warn
          retention-days: 14
