name: pr900-nfl-prop-reconcile-bootstrap

on:
  push:
    branches:
      - fix/nfl-prop-challenger-merge-gates-20260921
    paths:
      - .github/workflows/pr900-nfl-prop-reconcile-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/nfl-prop-challenger-merge-gates-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Pin protected main
        run: |
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          expected="ed628eaa978dd11a2097da91fa006067fb55e717"
          test "$actual" = "$expected" || { echo "MAIN_MOVED:$actual"; exit 1; }
      - name: Register merged deltas and revoke stale NFL prop freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/freeze_reconciliation_registry_v1.json')
          r=json.loads(p.read_text())
          additions=[
            {
              'delta_id':'PR_895_MATCHUP_ROLE_RESEARCH_AND_RECONCILIATION',
              'merge_sha':'1e846593bb18929ad295d895ba7c8e4214b76766',
              'pr':895,
              'note':'Research NRFI/TD/scored-board merge plus reconciliation catch-up. Machine matrix determines bundle impact; zero betting authority.'
            },
            {
              'delta_id':'PR_896_NFL_RUN_IT_GAME_CARD',
              'merge_sha':'49e3b866eea899f6f29f19911337c27aed443eb8',
              'pr':896,
              'note':'Research-only NFL sides/totals RUN IT card; props remain separate; zero betting authority.'
            },
            {
              'delta_id':'PR_898_NFL_PROP_ROLE_CHALLENGER',
              'merge_sha':'ed628eaa978dd11a2097da91fa006067fb55e717',
              'pr':898,
              'note':'Research-only NFL prop challenger added covered tests/test_nfl_prop_role_challenger.py; prior NFL prop freeze revoked fail-closed.'
            }
          ]
          seen={str(x.get('merge_sha')) for x in r.get('deltas',[])}
          for row in additions:
              if row['merge_sha'] not in seen:
                  r['deltas'].append(row)
          bundle=next(b for b in r['bundles'] if b['bundle_id']=='NFL_PROP_MODEL_FREEZE_V1')
          bundle['disposition']={
            'state':'REVOKED',
            'revoked_at':'2026-09-21T13:34:04Z',
            'prior_forward_clock_invalidated':True,
            'trigger_delta_sha':'ed628eaa978dd11a2097da91fa006067fb55e717',
            'reason':'PR_898_ADDED_RESEARCH_TEST_UNDER_FROZEN_TESTS_TEST_NFL_PROP_PREFIX; COVERED_BUNDLE_INVENTORY_CHANGED; PRIOR_FREEZE_REVOKED_FAIL_CLOSED',
            'authority':{
              'model_p':False,'truth_gate':False,'promotion':False,'staking':False,'official':False,'validation_attempt':False
            }
          }
          r['reconciled_through_sha']='ed628eaa978dd11a2097da91fa006067fb55e717'
          p.write_text(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Machine classify reconciliation
        run: |
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py --repo . --current-main-ref origin/main --output /tmp/pr900-reconciliation.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pr900-reconciliation.json'))
          print('outcome_counts=',r.get('outcome_counts'))
          print('release_blocks=',r.get('release_blocks'))
          print('authority=',r.get('authority'))
          bad=[x for x in r.get('release_blocks',[]) if x!='ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE']
          if bad:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:'+','.join(bad))
          if any(bool(v) for v in (r.get('authority') or {}).values()):
              raise SystemExit('RECONCILIATION_AUTHORITY_ESCALATION')
          PY
      - name: Focused contracts
        run: |
          python -m pytest -q \
            tests/test_freeze_reconciliation.py \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_nfl_prop_role_challenger.py \
            tests/test_research_nfl_prop_challenger_contract.py
      - name: Persist durable repair and remove bootstrap
        run: |
          rm .github/workflows/pr900-nfl-prop-reconcile-bootstrap.yml
          git config user.name "sportsedge-reconciliation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/pr900-nfl-prop-reconcile-bootstrap.yml
          git commit -m "Reconcile PR898 NFL prop freeze drift fail closed"
          git push origin HEAD:fix/nfl-prop-challenger-merge-gates-20260921
