name: nfl-v2k-attempt5-development-validation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONSUME_ATTEMPT_5 to run the final frozen Attempt 5.'
        required: true
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: nfl-v2k-attempt5-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - run: python -m py_compile scripts/run_nfl_v2k_attempt5.py sportsedge/sports/nfl/v2k_attempt5_market_calibration.py sportsedge/sports/nfl/v2k_attempt5_validation.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_nfl_v2k_attempt5_market_calibration.py

  evaluate:
    if: >-
      github.actor == github.repository_owner && github.ref == 'refs/heads/main' && (
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'CONSUME_ATTEMPT_5') ||
      (github.event_name == 'issues' && github.event.issue.body == 'CONSUME_ATTEMPT_5'))
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Materialize frozen NFL sources
        run: python scripts/materialize_nfl_frozen_sources.py --source-contract config/nfl_promotion_source_freeze_v1.json --output-root artifacts/football/v2k/sources --attestation-out artifacts/football/v2k/source_attestation.json
      - name: Score frozen final Attempt 5
        run: python scripts/run_nfl_v2k_attempt5.py --schedule artifacts/football/v2k/sources/games.csv --out artifacts/football/v2k/nfl_v2k_attempt5.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2k-attempt5-${{ github.sha }}
          path: |
            artifacts/football/v2k/source_attestation.json
            artifacts/football/v2k/nfl_v2k_attempt5.json
          if-no-files-found: error
          retention-days: 90
