name: nfl-fast-manual-board

on:
  push:
    branches:
      - 'run/nfl-fast-*'
    paths:
      - 'manual_inputs/nfl_fast/**'

permissions:
  contents: read

concurrency:
  group: nfl-fast-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Resolve exactly one board
        id: input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find manual_inputs/nfl_fast -maxdepth 1 -type f -name '*.json' -print | sort)
          [[ ${#FILES[@]} -eq 1 ]] || { echo "NFL_FAST_EXACTLY_ONE_INPUT_REQUIRED count=${#FILES[@]}" >&2; exit 1; }
          echo "path=${FILES[0]}" >> "$GITHUB_OUTPUT"
      - name: Fetch strictly-prior NFL history
        run: |
          mkdir -p .cache/nfl-history artifacts
          python scripts/fetch_nflverse_games.py --output .cache/nfl-history/nflverse_games.json
      - name: Run Attempt-9 game card
        run: |
          python scripts/run_nfl_lines_card.py \
            --input "${{ steps.input.outputs.path }}" \
            --history .cache/nfl-history/nflverse_games.json \
            --output artifacts/attempt9_game_card.json
      - name: Diagnose current nflverse source headers
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          for label, url in [
              ("stats2026", "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv"),
              ("injuries2026", "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.csv"),
          ]:
              with urlopen(Request(url, headers={"User-Agent":"SportsEdge/1.0"}), timeout=30) as r:
                  first = r.readline().decode("utf-8-sig").strip()
              print(label + "_HEADER=" + first)
          PY
      - name: Diagnose NO live role priors
        run: |
          python - <<'PY'
          import json
          from sportsedge.sports.nfl.auto_slate import discover_nfl_auto_games
          from sportsedge.sports.nfl.full_auto import fetch_nflverse_depth_charts
          from sportsedge.sports.nfl.live_role_source import fetch_nflverse_player_stats, build_live_team_model
          ticket=json.load(open("manual_inputs/nfl_fast/2026-10-05-atl-no.json"))
          obs=ticket["observed_at"]
          plan=discover_nfl_auto_games(as_of=obs,min_lead_minutes=0,horizon_minutes=14400,game_types=("REG","POST"))
          game=[g for g in plan["games"] if g["away_team_id"]=="ATL" and g["home_team_id"]=="NO"][0]
          depth,_,_=fetch_nflverse_depth_charts(season=game["season"])
          stats,_=fetch_nflverse_player_stats(seasons=[game["season"]-1,game["season"]])
          m=build_live_team_model(team="NO",target_season=game["season"],target_week=game["week"],kickoff=game["kickoff_ts"],observed_at=obs,depth_rows=depth,player_rows=stats,injury_rows=[])
          for row in [m["qb"],*m["skill_players"]]:
              rp=row["role_prior"]
              bad={k:v for k,v in rp.items() if isinstance(v,(int,float)) and v < 0}
              if bad or rp.get("receiving_yards_per_reception",0) <= 0:
                  print("ROLE_DIAG",row["player"],row.get("position"),"YPR",rp.get("receiving_yards_per_reception"),"BAD",bad)
          PY
      - name: Run unified full-board research engine
        run: |
          python scripts/run_nfl_unified_lines_card.py \
            --input "${{ steps.input.outputs.path }}" \
            --history .cache/nfl-history/nflverse_games.json \
            --output artifacts/unified_full_card.json \
            --n-sims 20000 \
            --seed 21
      - name: Print compact results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("attempt9_game_card.json","unified_full_card.json"):
              p=Path("artifacts")/name
              if not p.exists():
                  print(name, "MISSING")
                  continue
              x=json.loads(p.read_text())
              print("==",name,"==")
              print("source_status",x.get("source_status"))
              print("selected_rows",json.dumps(x.get("selected_rows") or [], separators=(",",":")))
              print("games",len(x.get("games") or []))
              for g in x.get("games") or []:
                  print("GAME",g.get("away"),g.get("home"))
                  print("picks",json.dumps(g.get("picks") or [], separators=(",",":")))
                  print("leans",json.dumps(g.get("leans") or [], separators=(",",":")))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-fast-atl-no-${{ github.sha }}
          path: |
            artifacts/
            ${{ steps.input.outputs.path }}
          if-no-files-found: warn
          retention-days: 14
