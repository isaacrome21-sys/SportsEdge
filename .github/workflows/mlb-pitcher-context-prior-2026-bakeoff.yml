name: mlb-pitcher-context-prior-2026-bakeoff
on:
  pull_request:
    paths:
      - scripts/eval_mlb_pitcher_context_vs_prior.py
      - tests/test_mlb_pitcher_context_vs_prior.py
      - .github/workflows/mlb-pitcher-context-prior-2026-bakeoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opponent-context-bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Validate production baseline parity and strict input rules
        run: PYTHONPATH=. python -m unittest tests.test_mlb_pitcher_context_vs_prior -v
      - name: Compare existing opponent-adjusted K and outs against longer prior
        run: >-
          PYTHONPATH=. python scripts/eval_mlb_pitcher_context_vs_prior.py
          --target-date 2026-10-07 --workers 6
          --output artifacts/mlb_pitcher_opp_context_vs_prior_2026.json
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-pitcher-opponent-context-prior-2026
          path: artifacts/mlb_pitcher_opp_context_vs_prior_2026.json
          if-no-files-found: warn
          retention-days: 14
