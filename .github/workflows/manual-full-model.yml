name: manual-full-model

on:
  push:
    branches:
      - manual-full-model-20260811

permissions:
  contents: read

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify core game-market source
        run: python -m pytest -q tests/test_game_odds_source.py
      - name: Acquire fresh DraftKings ML RL totals
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
        run: python scripts/probe_game_odds.py
      - name: Run full SportsEdge MLB prop card on live odds failover
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
        run: python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json
      - name: Upload live MLB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mlb-card
          path: |
            artifacts/live_mlb_card.json
            artifacts/live_game_odds.json
          if-no-files-found: error
          retention-days: 1
