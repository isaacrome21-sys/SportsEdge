name: manual-full-model

on:
  push:
    branches:
      - manual-full-model-20260811

permissions:
  contents: read

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Probe all Odds API key slots safely
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
        run: |
          python - <<'PY'
          import os, json
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def request(key, path, params):
              q = urlencode({'apiKey': key, **params})
              req = Request('https://api.the-odds-api.com'+path+'?'+q, headers={'Accept':'application/json'})
              try:
                  with urlopen(req, timeout=15) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except HTTPError as e:
                  body = e.read().decode('utf-8','replace')
                  try: parsed=json.loads(body)
                  except Exception: parsed={'raw':body[:300]}
                  return e.code, parsed

          keys=[os.environ.get('SPORTSEDGE_ODDS_API_KEY','').strip(), os.environ.get('SPORTSEDGE_ODDS_API_KEY_2','').strip(), os.environ.get('SPORTSEDGE_ODDS_API_KEY_3','').strip()]
          primary=next((k for k in keys if k), None)
          if not primary:
              print('NO_KEYS')
              raise SystemExit(0)
          status, events = request(primary, '/v4/sports/baseball_mlb/events', {})
          print('EVENTS_STATUS', status)
          if status != 200 or not isinstance(events,list):
              raise SystemExit(0)
          now=datetime.now(timezone.utc)
          future=[]
          for e in events:
              try: dt=datetime.fromisoformat(str(e['commence_time']).replace('Z','+00:00'))
              except Exception: continue
              if dt>now: future.append((dt,e))
          future.sort(key=lambda x:x[0])
          if not future:
              print('NO_FUTURE_EVENT')
              raise SystemExit(0)
          event=future[0][1]; eid=event['id']
          print('PROBE_EVENT', event.get('away_team'), '@', event.get('home_team'), event.get('commence_time'))
          for idx,key in enumerate(keys,1):
              if not key:
                  print('KEY_SLOT',idx,'MISSING')
                  continue
              status, body = request(key, f'/v4/sports/baseball_mlb/events/{eid}/odds', {'regions':'us','bookmakers':'draftkings','markets':'batter_hits','oddsFormat':'american','dateFormat':'iso','includeSids':'true'})
              if status==200:
                  books=len(body.get('bookmakers') or []) if isinstance(body,dict) else -1
                  print('KEY_SLOT',idx,'HTTP',status,'BOOKMAKERS',books)
              else:
                  code=body.get('error_code') if isinstance(body,dict) else None
                  print('KEY_SLOT',idx,'HTTP',status,'ERROR_CODE',code)
          PY
      - name: Run full SportsEdge MLB card
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
        run: python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json
      - name: Upload full model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mlb-card
          path: artifacts/live_mlb_card.json
          if-no-files-found: error
          retention-days: 1
