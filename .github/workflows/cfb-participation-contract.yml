name: cfb-participation-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/cfb_prop_participation_model_v1.json'
      - 'config/football_prop_engine_surface.json'
      - 'config/run_it_surface.json'
      - 'sportsedge/sports/cfb/participation_model.py'
      - 'sportsedge/sports/cfb/participation_source_capture.py'
      - 'sportsedge/sports/cfb/participation_pit_readiness.py'
      - 'sportsedge/football_prop_surface.py'
      - 'scripts/cache_cfb_participation_sources.py'
      - 'tests/test_cfb_participation_model.py'
      - 'tests/test_cfb_participation_source_capture.py'
      - 'tests/test_cfb_participation_pit_readiness.py'
      - 'tests/test_football_prop_runtime_truth.py'
      - '.github/workflows/cfb-participation-contract.yml'
      - '.github/workflows/cfb-forward-participation-capture.yml'
  push:
    branches: [main]
    paths:
      - 'config/cfb_prop_participation_model_v1.json'
      - 'config/football_prop_engine_surface.json'
      - 'config/run_it_surface.json'
      - 'sportsedge/sports/cfb/participation_model.py'
      - 'sportsedge/sports/cfb/participation_source_capture.py'
      - 'sportsedge/sports/cfb/participation_pit_readiness.py'
      - 'sportsedge/football_prop_surface.py'
      - 'scripts/cache_cfb_participation_sources.py'
      - 'tests/test_cfb_participation_model.py'
      - 'tests/test_cfb_participation_source_capture.py'
      - 'tests/test_cfb_participation_pit_readiness.py'
      - 'tests/test_football_prop_runtime_truth.py'
      - '.github/workflows/cfb-participation-contract.yml'
      - '.github/workflows/cfb-forward-participation-capture.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile CFB participation boundary
        run: >-
          python -m py_compile
          sportsedge/sports/cfb/participation_model.py
          sportsedge/sports/cfb/participation_source_capture.py
          sportsedge/sports/cfb/participation_pit_readiness.py
          sportsedge/football_prop_surface.py
          scripts/cache_cfb_participation_sources.py
          tests/test_cfb_participation_model.py
          tests/test_cfb_participation_source_capture.py
          tests/test_cfb_participation_pit_readiness.py
          tests/test_football_prop_runtime_truth.py
      - name: Run CFB participation contract tests
        run: >-
          python -m pytest -q
          tests/test_cfb_participation_model.py
          tests/test_cfb_participation_source_capture.py
          tests/test_cfb_participation_pit_readiness.py
          tests/test_football_prop_runtime_truth.py
      - name: Assert checked-in CFB prop state remains NO_ENGINE for the structural reason
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.football_prop_surface import FootballPropSurfaceError, require_executable_prop_surface
          from sportsedge.sports.cfb.participation_pit_readiness import REQUIRED_DATASETS
          from sportsedge.sports.cfb.participation_source_capture import (
              PARTICIPATION_CAPTURE_CONTRACT,
              PBP_PROJECTION_CONTRACT,
          )

          surface=json.loads(Path('config/football_prop_engine_surface.json').read_text())
          cfb=surface['sports']['CFB']
          assert cfb['engine_state']=='NO_ENGINE'
          assert cfb['readiness_state']=='NO_ENGINE'
          assert cfb['promotion_state']=='BLOCKED_NO_VALIDATED_PROBABILITY_ENGINE'
          assert cfb['participation_model_registry']=='config/cfb_prop_participation_model_v1.json'
          assert 'blowout' in cfb['reason'].lower()
          participation=json.loads(Path(cfb['participation_model_registry']).read_text())
          assert participation['status']=='UNFITTED_RESEARCH_ONLY'
          assert participation['engine_validation_status']=='NOT_RUN'
          assert participation['market_data_used_as_feature'] is False
          assert participation['promotion_authority'] is False
          assert participation['activation_authority'] is False
          source_req=participation['training_source_requirements']
          assert source_req['point_in_time_mode']=='FORWARD_CAPTURE_ONLY'
          assert source_req['retroactive_backfill_allowed'] is False
          assert source_req['market_data_allowed_in_model_input'] is False
          assert set(source_req['required_datasets'])==set(REQUIRED_DATASETS)
          assert source_req['capture_contract']==PARTICIPATION_CAPTURE_CONTRACT
          pbp=source_req['play_by_play_raw_policy']
          assert pbp['raw_market_data_present'] is True
          assert pbp['raw_predictive_input_allowed'] is False
          assert pbp['required_projection_contract']==PBP_PROJECTION_CONTRACT
          assert pbp['projection_method']=='EXACT_COLUMN_ALLOWLIST'
          assert pbp['projection_market_data_allowed'] is False
          try:
              require_executable_prop_surface('CFB')
          except FootballPropSurfaceError as exc:
              assert str(exc)=='FOOTBALL_PROP_ENGINE_NOT_IMPLEMENTED:CFB'
          else:
              raise AssertionError('CFB prop surface unexpectedly executable')
          PY
      - name: Assert capture CLI remains predictive-market-blind and forward-only
        run: python scripts/cache_cfb_participation_sources.py --season 2026 --self-test
