name: espn-dk-fallback-live-smoke

on:
  push:
    branches: [espn-dk-game-price-fallback-20260812]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: espn-dk-fallback-live-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy 'scikit-learn==1.9.0' joblib pytest
      - name: Resolve Chicago slate date
        id: slate
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      - name: Require August 12 slate
        run: test "${{ steps.slate.outputs.date }}" = "2026-08-12"
      - name: Restore MLB history cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/mlb-history
          key: sportsedge-mlb-history-v2-${{ runner.os }}-${{ steps.slate.outputs.date }}
          restore-keys: |
            sportsedge-mlb-history-v2-${{ runner.os }}-
      - name: Download exact frozen v4 game artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/sportsedge/game-v4
          gh run download 31558918467 -n core-game-market-rebuild-v3-1-source-bounded -D .cache/sportsedge/game-v4
          echo '49870123d7db6fca2f3b2985453c6aa3c685fb05da146c6c63601efd8623c272  .cache/sportsedge/game-v4/sportsedge_game_score_v4.joblib' | sha256sum -c -
          echo '38c5ca528ffc0f6966e0b1d4be96f26a748467707b36865670cba421a20fe565  .cache/sportsedge/game-v4/sportsedge_nrfi_v4.joblib' | sha256sum -c -
      - name: Verify expanded automation safety tests
        run: >-
          python -m pytest -q
          tests/test_auto_runner.py
          tests/test_odds_api_source.py
          tests/test_auto_native_odds.py
          tests/test_auto_native_odds_fallback.py
          tests/test_espn_game_odds_source.py
          tests/test_mlb_hits_features.py
          tests/test_mlb_total_bases_features.py
          tests/test_mlb_history_cache.py
          tests/test_odds_keyring.py
          tests/test_game_odds_source.py
          tests/test_game_market_contract.py
          tests/test_game_context_gate.py
          tests/test_full_slate_accounting.py
          tests/test_pregame_archive.py
          tests/test_game_card_pipeline.py
          tests/test_game_history_live.py
          tests/test_bettor_card.py
          tests/test_deployment_audit.py
      - name: Attest today's canonical game-model runtime
        env:
          SPORTSEDGE_GAME_SCORE_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_game_score_v4.joblib
          SPORTSEDGE_NRFI_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_nrfi_v4.joblib
          SPORTSEDGE_GAME_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history/game-core
        run: python scripts/attest_live_game_runtime.py
      - name: Run automated MLB Full Model with fallback enabled
        env:
          SPORTSEDGE_QUOTES_URL: ${{ secrets.SPORTSEDGE_QUOTES_URL }}
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_FEATURES_URL: ${{ secrets.SPORTSEDGE_FEATURES_URL }}
          SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
          SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
          SPORTSEDGE_GAME_SCORE_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_game_score_v4.joblib
          SPORTSEDGE_NRFI_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_nrfi_v4.joblib
        run: python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json
      - name: Build full-slate market accounting
        if: always()
        run: python scripts/build_full_slate_accounting.py
      - name: Assert fallback provenance and real candidate path
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/live_mlb_card.json'))
          providers=p.get('provider_status') or []
          assert any(x.get('provider')=='ODDS_API_NATIVE' and x.get('status')=='EXHAUSTED' for x in providers), providers
          assert any(x.get('provider')=='ESPN_WEB_HEADER_DRAFTKINGS' and x.get('status')=='PASS' for x in providers), providers
          results=p.get('results') or []
          game=[x for x in results if x.get('market') in {'MONEYLINE','RUN_LINE','TOTALS'}]
          assert game, 'NO_GAME_PRICE_CANDIDATES_REACHED_RUNTIME'
          assert all(x.get('bet_status') in {'OFFICIAL_BET','PASS','BLOCKED'} for x in game), 'TRUTH_GATE_STATUS_MISSING'
          resolved=[x for x in game if x.get('bet_status')!='BLOCKED']
          blocked=[x for x in game if x.get('bet_status')=='BLOCKED']
          assert resolved, 'NO_RESOLVED_GAME_CANDIDATE_REACHED_MODEL'
          assert all(x.get('model_p') is not None for x in resolved), 'RESOLVED_GAME_CANDIDATE_MODEL_P_MISSING'
          assert all(x.get('model_p') is None for x in blocked), 'BLOCKED_GAME_CANDIDATE_MUST_NOT_HAVE_MODEL_P'
          assert not any(x.get('market') in {'NRFI','YRFI'} for x in results), 'FALLBACK_MUST_NOT_INVENT_NRFI_YRFI_QUOTES'
          print(json.dumps({
              'run_status':p.get('run_status'),
              'results':len(results),
              'game_results':len(game),
              'resolved_game_results':len(resolved),
              'blocked_game_results':len(blocked),
              'blocked_reasons':sorted({x.get('reason') for x in blocked}),
              'provider_status':providers,
          },indent=2))
          PY
      - name: Upload fallback smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-dk-fallback-live-smoke
          path: |
            artifacts/live_mlb_card.json
            artifacts/live_game_runtime_attestation.json
            artifacts/full_slate_accounting.json
          if-no-files-found: warn
          retention-days: 14
