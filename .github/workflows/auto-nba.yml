name: auto-nba

on:
  workflow_dispatch:
    inputs:
      board_json:
        description: "User-supplied NBA board JSON. Required; no sportsbook API is used."
        required: true
        type: string
      results_json:
        description: "Optional completed-game results JSON for ratings v1. Blank uses margin/total on the board."
        required: false
        type: string
  pull_request:
    paths:
      - scripts/run_auto_nba_resilient.py
      - scripts/render_nba_auto_card.py
      - tests/test_run_auto_nba_resilient.py
      - .github/workflows/auto-nba.yml

permissions:
  contents: read

concurrency:
  group: auto-nba
  cancel-in-progress: false

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test NBA card emit
        if: github.event_name == 'pull_request'
        run: python -m unittest tests.test_run_auto_nba_resilient -v
      - name: Run NBA card against screenshot-supplied lines
        if: github.event_name == 'workflow_dispatch'
        env:
          NBA_MANUAL_BOARD_JSON: ${{ inputs.board_json }}
          SPORTSEDGE_NBA_RESULTS: ${{ inputs.results_json }}
        run: |
          set +e
          python scripts/run_auto_nba_resilient.py --output artifacts/live_nba_card.json
          rc=$?
          set -e
          python - << 'PY'
          import json
          from pathlib import Path
          card = json.loads(Path("artifacts/live_nba_card.json").read_text())
          if card.get("odds_api_called") is not False:
              raise SystemExit("NBA_AUTO_ODDS_API_GUARD_FAILED")
          if card.get("governance", {}).get("freeze_status") == "FROZEN" or card.get("governance", {}).get("artifact_sha256"):
              raise SystemExit("NBA_AUTO_FREEZE_WITH_NULL_HASH_FORBIDDEN")
          if card.get("run_status") == "BLOCKED_NO_ODDS":
              raise SystemExit("NBA_AUTO_ZERO_QUOTES")
          bets = [
              row for row in card.get("results") or []
              if row.get("model_p") is not None and row.get("edge") is not None and float(row["edge"]) > 0
          ]
          if int((card.get("funnel") or {}).get("bets_emitted") or 0) != len(bets):
              raise SystemExit("NBA_AUTO_BET_EMIT_MISMATCH")
          print(f"NBA_AUTO_CARD_OK rows={len(card.get('results') or [])} bets={len(bets)}")
          PY
          python scripts/render_nba_auto_card.py --engine-output artifacts/live_nba_card.json --out-dir artifacts/nba_myspari
          exit $rc
      - name: Upload NBA auto card
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-nba-card
          path: |
            artifacts/live_nba_card.json
            artifacts/nba_myspari/
          if-no-files-found: error
          retention-days: 14
