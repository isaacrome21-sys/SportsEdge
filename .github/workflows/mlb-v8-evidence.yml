name: mlb-v8-evidence

on:
  workflow_dispatch:
  schedule:
    # Every ten minutes during broad MLB game hours. The stdlib precheck is cheap;
    # the full canonical model runs only when a qualified V8 capture phase exists.
    - cron: '4,14,24,34,44,54 16-23,0-5 * 9-11 *'

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  forward-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify frozen V8 evidence contracts
        run: |
          python scripts/build_mlb_v8_replay_archive.py --self-test
          python scripts/capture_mlb_v8_forward_evidence.py --self-test
          python scripts/run_mlb_v8_forward_lane.py --self-test
          python scripts/run_mlb_v8_forward_fallback.py --self-test
          python - <<'PY'
          import json
          p=json.load(open('config/mlb_v8_evidence_policy.json'))
          assert p['fail_closed'] is True
          assert p['effective_forward_date_ct'] == '2026-09-03'
          assert p['promotion']['forward_holdout_required'] is True
          print('V8_EVIDENCE_POLICY_OK')
          PY

      - name: Plan current V8 capture windows
        id: plan
        run: |
          python scripts/run_mlb_v8_forward_lane.py --plan-output artifacts/mlb_v8_plan.json
          python - <<'PY'
          import json, os
          p=json.load(open('artifacts/mlb_v8_plan.json'))
          games=p.get('games') or []
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('needs_model=' + ('true' if p.get('needs_model') else 'false') + '\n')
              f.write('has_target_event=' + ('true' if games else 'false') + '\n')
              f.write('slate_date_ct=' + str(p.get('slate_date_ct') or 'unknown') + '\n')
              f.write('target_games=' + str(len(games)) + '\n')
          PY

      - name: Restore MLB history cache
        if: steps.plan.outputs.needs_model == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/sportsedge/mlb-history
          key: sportsedge-mlb-v8-history-${{ runner.os }}-${{ steps.plan.outputs.slate_date_ct }}
          restore-keys: |
            sportsedge-mlb-v8-history-${{ runner.os }}-
            sportsedge-mlb-history-v1-${{ runner.os }}-

      - name: Install canonical MLB runtime dependency
        if: steps.plan.outputs.needs_model == 'true'
        run: python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Run canonical MLB machine for target window
        id: model
        if: steps.plan.outputs.needs_model == 'true'
        env:
          SPORTSEDGE_QUOTES_URL: ${{ secrets.SPORTSEDGE_QUOTES_URL }}
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_FEATURES_URL: ${{ secrets.SPORTSEDGE_FEATURES_URL }}
          SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
          SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
        run: python scripts/run_auto_mlb_resilient.py --output artifacts/live_mlb_card.json

      - name: Materialize immutable V8 decision and close evidence
        id: capture
        if: steps.plan.outputs.needs_model == 'true' && steps.model.outcome == 'success'
        run: >-
          python scripts/run_mlb_v8_forward_lane.py
          --plan artifacts/mlb_v8_plan.json
          --card artifacts/live_mlb_card.json
          --model-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"

      - name: Write target-window terminal status through shared recorder
        if: always() && steps.plan.outputs.has_target_event == 'true'
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: >-
          python scripts/capture_mlb_v8_forward_evidence.py
          --write-status
          --plan artifacts/mlb_v8_plan.json
          --run-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          --git-sha "$GITHUB_SHA"
          --model-outcome "${MODEL_OUTCOME:-not-run}"
          --capture-outcome "${CAPTURE_OUTCOME:-not-run}"

      - name: Upload exact-run V8 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-v8-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mlb_v8_plan.json
            artifacts/live_mlb_card.json
            artifacts/mlb_v8_forward
            artifacts/mlb_v8_status
          if-no-files-found: warn
          retention-days: 30

      - name: Persist target-window evidence or miss to durable data branch
        if: always() && steps.plan.outputs.has_target_event == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add --detach .data-v8 FETCH_HEAD
          if [ -d artifacts/mlb_v8_forward ]; then
            mkdir -p .data-v8/evidence/mlb_v8_forward
            cp -R artifacts/mlb_v8_forward/. .data-v8/evidence/mlb_v8_forward/
          fi
          mkdir -p ".data-v8/runtime/mlb-v8-status/${{ steps.plan.outputs.slate_date_ct }}"
          cp artifacts/mlb_v8_plan.json ".data-v8/runtime/mlb-v8-status/${{ steps.plan.outputs.slate_date_ct }}/plan_${RUN_ID}_${RUN_ATTEMPT}.json"
          cp artifacts/mlb_v8_status/*.json ".data-v8/runtime/mlb-v8-status/${{ steps.plan.outputs.slate_date_ct }}/"
          cd .data-v8
          git config user.name sportsedge-v8-evidence-bot
          git config user.email sportsedge-v8-evidence-bot@users.noreply.github.com
          git add runtime/mlb-v8-status
          if [ -d evidence/mlb_v8_forward ]; then
            git add evidence/mlb_v8_forward
          fi
          git diff --cached --quiet && { echo 'V8 target window produced no durable change'; exit 97; }
          git commit -m "evidence: persist MLB V8 target window ${RUN_ID}:${RUN_ATTEMPT}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:data; then
              exit 0
            fi
            git fetch origin data
            git rebase origin/data
            sleep $((attempt * 2))
          done
          echo 'V8 evidence data-branch persistence failed after retries'
          exit 98
