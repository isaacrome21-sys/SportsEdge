name: whole-model-train

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/public_training_sources_v1.json'
      - 'scripts/build_nfl_attempt9_runtime_artifact.py'
      - 'scripts/nfl_2026_provider_preflight.py'
      - 'scripts/build_ufc_training_artifact.py'
      - 'scripts/fit_mlb_development.py'
      - 'scripts/audit_cfb_model_selection_prereg.py'
      - 'scripts/audit_cfb_pit_readiness.py'
      - 'sportsedge/pga/**'
      - 'tests/test_whole_model_train_plumbing.py'
      - '.github/workflows/whole-model-train.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.3'

      - name: Verify whole-stack plumbing contracts
        run: |
          python -m py_compile \
            scripts/build_nfl_attempt9_runtime_artifact.py \
            scripts/nfl_2026_provider_preflight.py \
            scripts/build_ufc_training_artifact.py \
            scripts/fit_mlb_development.py \
            scripts/audit_cfb_model_selection_prereg.py \
            scripts/audit_cfb_pit_readiness.py
          python -m unittest -q \
            tests.test_whole_model_train_plumbing \
            tests.test_nfl_2026_provider_budget

      - name: Reconstruct exact frozen NFL attempt-9 runtime owner
        run: |
          python scripts/build_nfl_attempt9_runtime_artifact.py \
            --output artifacts/model-stack/nfl_attempt9_runtime_model.json

      - name: Train MLB development lane without sacred 2025 access
        run: |
          python scripts/fit_mlb_development.py \
            --seasons 2021,2022,2023,2024 \
            --validation-season 2024 \
            --out artifacts/model-stack/mlb_development_report.json

      - name: Resolve pinned UFC public-history URLs
        id: ufc_sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg=json.loads(Path('config/public_training_sources_v1.json').read_text())['sources']['ufc_history']
          base=f"https://raw.githubusercontent.com/{cfg['repository']}/{cfg['commit']}"
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key in ('events','results','stats','fighters'):
                  out.write(f"{key}_url={base}/{cfg['files'][key]}\n")
          PY

      - name: Train UFC artifact from pinned factual UFCStats mirror bytes
        run: |
          python -m scripts.build_ufc_training_artifact \
            --event-url '${{ steps.ufc_sources.outputs.events_url }}' \
            --results-url '${{ steps.ufc_sources.outputs.results_url }}' \
            --stats-url '${{ steps.ufc_sources.outputs.stats_url }}' \
            --fighters-url '${{ steps.ufc_sources.outputs.fighters_url }}' \
            --output artifacts/model-stack/ufc_model.json \
            --metrics artifacts/model-stack/ufc_training_metrics.json \
            --promotion-evidence artifacts/model-stack/ufc_promotion_evidence.json

      - name: Audit CFB preregistration without spending an evaluation attempt
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m scripts.audit_cfb_model_selection_prereg \
            --out artifacts/model-stack/cfb_model_selection_prereg.json
          rc=$?
          set -e
          test -s artifacts/model-stack/cfb_model_selection_prereg.json || exit "$rc"
          echo "CFB prereg audit rc=$rc; no fit or score executed"

      - name: Audit CFB PIT readiness without scoring candidates
        run: |
          python -m scripts.audit_cfb_pit_readiness \
            --output artifacts/model-stack/cfb_pit_readiness.json

      - name: Verify PGA engine code surface
        run: |
          python -m py_compile sportsedge/pga/*.py
          python - <<'PY'
          from sportsedge.pga.runner import run_pga
          print({'pga_runner_importable': callable(run_pga), 'automatic_provider': 'BLOCKED_FIELD_AND_LIVE_INPUT'})
          PY

      - name: Write whole-stack disposition manifest
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/model-stack
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('artifacts/model-stack')
          def read(name):
              path=root/name
              if not path.is_file(): return None
              try: return json.loads(path.read_text())
              except Exception: return None

          nfl=read('nfl_attempt9_runtime_model.json')
          mlb=read('mlb_development_report.json')
          ufc=read('ufc_model.json')
          ufc_promo=read('ufc_promotion_evidence.json')
          cfb_prereg=read('cfb_model_selection_prereg.json')
          cfb_pit=read('cfb_pit_readiness.json')
          surface=json.loads(Path('config/run_it_surface.json').read_text())

          report={
              'schema_version':'SPORTSEDGE_WHOLE_MODEL_TRAIN_DISPOSITION_V1',
              'authority':{
                  'creates_model_p':False,
                  'changes_promotion':False,
                  'changes_truth_gate':False,
                  'changes_official':False,
                  'changes_staking':False,
              },
              'lanes':{
                  'NFL':{
                      'state':'RUNNABLE_FROZEN_OWNER_RUNTIME' if nfl else 'FAILED_TO_RECONSTRUCT',
                      'artifact_status': None if not nfl else nfl.get('status'),
                      'promotion_authority':False,
                      'note':'Attempt-9 raw margin/total runtime only; no probability Model_P or inherited production M2 authority.',
                  },
                  'MLB':{
                      'state':'DEVELOPMENT_TRAINED' if mlb else 'FAILED_TO_TRAIN',
                      'status':None if not mlb else mlb.get('status'),
                      'sacred_2025_accessed':None if not mlb else mlb.get('sacred_2025_accessed'),
                      'promotion_authority':False,
                  },
                  'CFB':{
                      'state':'READINESS_AUDITED_NO_ATTEMPT_SPENT',
                      'prereg_status':None if not cfb_prereg else cfb_prereg.get('status'),
                      'pit_readiness':None if not cfb_pit else cfb_pit.get('readiness_state'),
                      'historical_truth_gate_execution_allowed':None if not cfb_pit else cfb_pit.get('historical_truth_gate_execution_allowed'),
                      'promotion_authority':False,
                  },
                  'UFC':{
                      'state':'TRAINED_ARTIFACT' if ufc else 'FAILED_TO_TRAIN',
                      'promotion_status':None if not ufc_promo else ufc_promo.get('status'),
                      'automatic_command':surface['sports']['UFC'].get('automatic_command'),
                      'automatic_blocker':surface['sports']['UFC'].get('automatic_blocker'),
                  },
                  'PGA':{
                      'state':'ENGINE_IMPORTABLE_AUTOMATIC_INPUT_BLOCKED',
                      'automatic_command':surface['sports']['PGA'].get('automatic_command'),
                      'automatic_blocker':surface['sports']['PGA'].get('automatic_blocker'),
                  },
              },
          }
          (root/'manifest.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload whole-stack training diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-model-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/model-stack
          if-no-files-found: error
          retention-days: 30