name: MLB V7 bullpen park sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sportsedge/mlb_v7_bullpen_park_sources.py"
      - "scripts/probe_mlb_v7_bullpen_park_sources.py"
      - "tests/test_mlb_v7_bullpen_park_sources.py"
      - ".github/workflows/mlb-v7-bullpen-park-sources.yml"
  push:
    branches: [main]
    paths:
      - "sportsedge/mlb_v7_bullpen_park_sources.py"
      - "scripts/probe_mlb_v7_bullpen_park_sources.py"
      - "tests/test_mlb_v7_bullpen_park_sources.py"
      - ".github/workflows/mlb-v7-bullpen-park-sources.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact code head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run focused source tests
        run: python -m pytest -q tests/test_mlb_v7_bullpen_park_sources.py tests/test_mlb_v7_final_timecode.py
      - name: Probe real official MLB final feed
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/probe_mlb_v7_bullpen_park_sources.py \
            --game-id 778485 \
            --output-root artifacts/mlb-v7-bullpen-park-probe
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/mlb-v7-bullpen-park-probe/report.json").read_text())
          assert r["bullpen"]["row_count"] == 6
          assert r["bullpen"]["pitch_count_total"] == 119
          assert len(r["bullpen"]["teams"]) == 2
          assert r["park"]["row_count"] == 72
          assert r["park"]["plate_appearances"] == 72
          assert r["park"]["runs"] == 7
          assert r["park"]["home_runs"] == 1
          assert r["park"]["batter_stands"] == ["L", "R"]
          assert r["attestation_written"] is False
          assert r["candidate_training_allowed"] is False
          assert r["promotion_authority"] is False
          print(json.dumps({"bullpen_rows":r["bullpen"]["row_count"],"park_pa":r["park"]["plate_appearances"],"runs":r["park"]["runs"],"state":"SOURCE_PROBE_PASS"},sort_keys=True))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-v7-bullpen-park-source-probe-${{ github.sha }}
          path: artifacts/mlb-v7-bullpen-park-probe
          if-no-files-found: error
          retention-days: 30
