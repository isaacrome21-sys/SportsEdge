name: nfl-score-counts-attempt2-main-trigger

on:
  push:
    branches:
      - main
    paths:
      - 'config/research/nfl_score_counts_attempt2_dispatch_v1.json'

permissions:
  contents: read

concurrency:
  group: nfl-score-counts-attempt-2-main-trigger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate one-shot Attempt-2 marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/research/nfl_score_counts_attempt2_dispatch_v1.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["schema"] == "SPORTSEDGE_NFL_SCORE_COUNTS_G1_ATTEMPT2_DISPATCH_V1"
          assert x["status"] == "ARMED_SINGLE_MAIN_PUSH"
          assert x["candidate_family"] == "NFL_SCORE_COUNTS_G1"
          assert x["attempt_number"] == 2
          assert x["confirmation"] == "CONSUME_SCORE_COUNTS_ATTEMPT_2"
          assert x["rules"]["attempt_1_result_preserved"] is True
          assert x["rules"]["thresholds_unchanged"] is True
          assert x["rules"]["backfill"] is False
          assert x["rules"]["market_data_for_model_fit"] is False
          assert x["rules"]["source_substitution"] is False
          print("attempt2_marker=PASS")
          PY
      - name: Consume frozen development Attempt 2
        run: |
          PYTHONPATH=. python scripts/run_nfl_score_counts_attempt.py \
            --attempt-number 2 \
            --confirm CONSUME_SCORE_COUNTS_ATTEMPT_2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-score-counts-attempt-2-${{ github.sha }}
          path: artifacts/football/score_counts/attempt_2/
          if-no-files-found: warn
          retention-days: 90
