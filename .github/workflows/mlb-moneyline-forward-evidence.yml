name: mlb-moneyline-forward-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
  # The forward PAPER lane must not depend on a separate scheduled workflow
  # actually firing. Direct five-minute cron runs plus one-shot context
  # refresh fallback keep the capture job short and serialize data-branch writes.
  schedule:
    - cron: '*/5 15-23 * * *'
    - cron: '*/5 0-5 * * *'
  workflow_run:
    # Operational heartbeat fallbacks transfer no model, promotion, staking, or
    # OFFICIAL authority. The MLB context refresher is already scheduled every
    # 15 minutes during MLB game hours; this workflow bridges each completion
    # into a single prospective observation without blocking later cron ticks.
    # The PIT
    # starter archive remains an additional one-shot fallback.
    workflows:
      - mlb-game-context-refresh
      - mlb-pit-lineup-starter-archive
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: mlb-moneyline-forward-evidence-v1
  cancel-in-progress: false

jobs:
  capture:
    # A failed upstream workflow must never become an evidence-clock heartbeat.
    # Push, schedule, and manual runs are independent of this guard.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Install frozen runtime dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Resolve UTC evidence day
        id: day
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore immutable daily evidence from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          day='${{ steps.day.outputs.date }}'
          for path in \
            "data/mlb_forward_predictions/$day" \
            "data/mlb_forward_capture/$day" \
            "data/mlb_forward_decisions/$day"; do
            if git cat-file -e "origin/data:$path" 2>/dev/null; then
              git archive origin/data "$path" | tar -x
            fi
          done

      - name: Capture market-blind Model_P predictions
        id: modelp
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/capture_mlb_moneyline_model_p.py \
            --output-dir data/mlb_forward_predictions | tee model_p_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture paired DraftKings MONEYLINE quotes
        id: quotes
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/capture_mlb_direct_paired_ml.py \
            --output-dir data/mlb_forward_capture | tee quote_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze pregame PAPER decisions
        id: decisions
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/capture_mlb_moneyline_paper_decisions.py \
            --prediction-root data/mlb_forward_predictions \
            --quote-root data/mlb_forward_capture \
            --decision-root data/mlb_forward_decisions | tee decision_result.json
          rc=${PIPESTATUS[0]}
          status=$(python -c "import json; print(json.load(open('decision_result.json')).get('status',''))" 2>/dev/null || true)
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist valid evidence create-only to data branch
        id: persist
        shell: bash
        run: |
          set +e
          set -o pipefail
          day='${{ steps.day.outputs.date }}'
          python scripts/persist_forward_evidence_data_branch.py \
            --path "data/mlb_forward_predictions/$day" \
            --path "data/mlb_forward_capture/$day" \
            --path "data/mlb_forward_decisions/$day" \
            --branch data \
            --worktree "$RUNNER_TEMP/sportsedge-mlb-forward-data" | tee persistence_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload prospective evidence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-moneyline-forward-evidence-${{ github.run_id }}
          path: |
            model_p_result.json
            quote_result.json
            decision_result.json
            persistence_result.json
            data/mlb_forward_predictions/${{ steps.day.outputs.date }}/**
            data/mlb_forward_capture/${{ steps.day.outputs.date }}/**
            data/mlb_forward_decisions/${{ steps.day.outputs.date }}/**
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce fail-closed capture status
        if: always()
        shell: bash
        run: |
          model_rc='${{ steps.modelp.outputs.exit_code }}'
          quote_rc='${{ steps.quotes.outputs.exit_code }}'
          decision_rc='${{ steps.decisions.outputs.exit_code }}'
          persist_rc='${{ steps.persist.outputs.exit_code }}'
          test -n "$model_rc" && test "$model_rc" -eq 0
          test -n "$quote_rc" && test "$quote_rc" -eq 0
          test -n "$decision_rc" && test "$decision_rc" -eq 0
          test -n "$persist_rc" && test "$persist_rc" -eq 0
