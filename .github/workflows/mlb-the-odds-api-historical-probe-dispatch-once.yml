name: mlb-the-odds-api-historical-probe-dispatch-once

on:
  push:
    paths:
      - '.github/workflows/mlb-the-odds-api-historical-probe-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bounded MLB historical probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-the-odds-api-historical-probe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date='2026-08-31T18:00:00Z' \
            -f markets='h2h,spreads,totals'
