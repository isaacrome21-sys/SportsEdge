name: mlb-the-odds-api-historical-probe-dispatch-once

on:
  push:
    paths:
      - '.github/trigger-mlb-the-odds-api-historical-probe'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bounded MLB historical probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mlb-the-odds-api-historical-probe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
