name: nfl-v2g-source-bound-artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2g_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2g_artifact.py'
      - 'sportsedge/sports/nfl/source_manifest.py'
      - 'scripts/build_nfl_v2g_source_bound_artifact.py'
      - 'tests/test_build_nfl_v2g_source_bound_artifact.py'
      - '.github/workflows/nfl-v2g-source-bound-artifact.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/nfl/m2_v2g_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2g_artifact.py'
      - 'sportsedge/sports/nfl/source_manifest.py'
      - 'scripts/build_nfl_v2g_source_bound_artifact.py'
      - 'tests/test_build_nfl_v2g_source_bound_artifact.py'
      - '.github/workflows/nfl-v2g-source-bound-artifact.yml'

permissions:
  contents: read

concurrency:
  group: nfl-v2g-source-bound-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-research-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Run focused V2G artifact tests
        run: python -m pytest -q tests/test_build_nfl_v2g_source_bound_artifact.py tests/test_nfl_m2_v2g_artifact.py tests/test_nfl_m2_v2g_candidate.py

      - name: Fetch immutable-by-hash NFL research sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2g/sources/pbp
          fetch_source() {
            local url="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 \
              "$url" -o "$output"
          }
          fetch_source \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            artifacts/football/v2g/sources/games.csv
          for season in $(seq 2016 2025); do
            fetch_source \
              "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" \
              "artifacts/football/v2g/sources/pbp/play_by_play_${season}.csv.gz"
          done

      - name: Build canonical source manifest from exact downloaded bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from sportsedge.sports.nfl.source_manifest import build_nfl_source_manifest, manifest_sha256

          root = Path('artifacts/football/v2g/sources')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          schedule = root / 'games.csv'
          schedule_sha = sha(schedule)
          sources = [{
              'name': 'schedule',
              'uri': 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv',
              'sha256': schedule_sha,
          }]
          for season in range(2016, 2026):
              path = root / 'pbp' / f'play_by_play_{season}.csv.gz'
              sources.append({
                  'name': f'pbp_{season}',
                  'uri': f'https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{season}.csv.gz',
                  'sha256': sha(path),
              })
          manifest = build_nfl_source_manifest(sources, schedule_anchor_sha256=schedule_sha)
          out = Path('artifacts/football/v2g/nfl_v2g_source_manifest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'manifest_sha256': manifest_sha256(manifest), 'source_count': len(sources)}, sort_keys=True))
          PY

      - name: Build V2G research artifact - attempt 1
        env:
          TZ: UTC
        run: >-
          python scripts/build_nfl_v2g_source_bound_artifact.py
          --schedule-file artifacts/football/v2g/sources/games.csv
          --pbp-dir artifacts/football/v2g/sources/pbp
          --source-manifest artifacts/football/v2g/nfl_v2g_source_manifest.json
          --start-season 2016 --end-season 2025
          --artifact-out artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt1.json
          --report-out artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt1.json

      - name: Build V2G research artifact - independent timezone replay
        env:
          TZ: Pacific/Kiritimati
        run: >-
          python scripts/build_nfl_v2g_source_bound_artifact.py
          --schedule-file artifacts/football/v2g/sources/games.csv
          --pbp-dir artifacts/football/v2g/sources/pbp
          --source-manifest artifacts/football/v2g/nfl_v2g_source_manifest.json
          --start-season 2016 --end-season 2025
          --artifact-out artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt2.json
          --report-out artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt2.json

      - name: Enforce V2G byte determinism and non-promotional status
        shell: bash
        run: |
          set -euo pipefail
          cmp artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt1.json \
              artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt2.json
          cmp artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt1.json \
              artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt2.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt1.json').read_text())
          artifact = json.loads(Path('artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt1.json').read_text())
          if report.get('status') != 'RESEARCH_ARTIFACT_BUILT_DETERMINISTICALLY':
              raise SystemExit('NFL_V2G_RESEARCH_ARTIFACT_STATUS_INVALID')
          if report.get('byte_determinism') != 'PASS':
              raise SystemExit('NFL_V2G_BYTE_DETERMINISM_NOT_PASS')
          for payload in (report, artifact):
              if payload.get('promotion_authority') is not False:
                  raise SystemExit('NFL_V2G_PROMOTION_AUTHORITY_MUST_BE_FALSE')
              if payload.get('official_status_granted') is not False:
                  raise SystemExit('NFL_V2G_OFFICIAL_STATUS_MUST_BE_FALSE')
          if report.get('may_create_model_p') is not False:
              raise SystemExit('NFL_V2G_MODEL_P_AUTHORITY_MUST_BE_FALSE')
          print(json.dumps({
              'status': report['status'],
              'artifact_sha256': report['artifact_sha256'],
              'source_manifest_sha256': report['source_manifest_sha256'],
              'event_row_count': report['event_row_count'],
              'promotion_authority': False,
          }, sort_keys=True))
          PY

      - name: Upload source-bound V2G research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2g-source-bound-${{ github.sha }}
          path: |
            artifacts/football/v2g/nfl_v2g_source_manifest.json
            artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt1.json
            artifacts/football/v2g/nfl_m2_v2g_research_artifact_attempt2.json
            artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt1.json
            artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report_attempt2.json
          if-no-files-found: error
          retention-days: 90
