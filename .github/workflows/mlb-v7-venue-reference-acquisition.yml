name: MLB V7 venue reference acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sportsedge/mlb_v7_venue_reference.py"
      - "scripts/acquire_mlb_v7_venue_reference.py"
      - "tests/test_mlb_v7_venue_reference.py"
      - ".github/workflows/mlb-v7-venue-reference-acquisition.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned tests
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run focused venue-reference tests
        run: python -m pytest -q tests/test_mlb_v7_venue_reference.py tests/test_mlb_v7_travel_history.py

      - name: Acquire official MLB 2023-2025 venue reference bundle
        run: |
          PYTHONPATH=. python scripts/acquire_mlb_v7_venue_reference.py \
            --start 2023-01-01 \
            --end 2025-12-31 \
            --output-root artifacts/mlb-v7-venue-reference

      - name: Upload acquisition bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-v7-venue-reference-${{ github.sha }}
          path: artifacts/mlb-v7-venue-reference
          if-no-files-found: error
          retention-days: 30

      - name: Enforce full fixed-fact coverage before attestation is usable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/mlb-v7-venue-reference")
          r = json.loads((root / "acquisition_report.json").read_text())
          assert r["promotion_authority"] is False
          assert r["candidate_training_allowed"] is False
          if r["state"] != "READY_TO_ATTEST":
              raise SystemExit("VENUE_REFERENCE_BLOCKED:" + ",".join(r["blockers"]))
          assert r["coverage_start"] == "2023-01-01"
          assert r["coverage_end"] == "2025-12-31"
          assert r["resolved_venue_count"] == r["discovered_venue_count"]
          assert r["missing_venue_ids"] == []
          assert r.get("attestation_written") is True
          a = json.loads((root / "attestations" / "VENUE_REFERENCE.json").read_text())
          assert a["source_class"] == "VENUE_REFERENCE"
          assert a["semantics"] == {"fixed_facts_only": True}
          assert set(a["fields"]) == {"venue_id", "latitude", "longitude", "timezone"}
          assert len(a["evidence_files"]) == 2
          print(json.dumps({"state": r["state"], "venues": r["resolved_venue_count"]}, sort_keys=True))
          PY
