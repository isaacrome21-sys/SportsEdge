name: cfb-candidate-first-evaluation-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/cfb_model_selection_policy_v1.json'
      - 'config/cfb_model_candidate_prereg_v1.json'
      - 'config/cfb_game_model_freeze.json'
      - 'scripts/audit_cfb_model_selection_prereg.py'
      - 'scripts/audit_cfb_selection_readiness.py'
      - 'sportsedge/sports/cfb/model_selection_prereg.py'
      - 'sportsedge/sports/cfb/acquisition_readiness.py'
      - 'sportsedge/sports/cfb/selection_readiness.py'
      - '.github/workflows/cfb-candidate-first-evaluation-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'config/cfb_model_selection_policy_v1.json'
      - 'config/cfb_model_candidate_prereg_v1.json'
      - 'config/cfb_game_model_freeze.json'
      - 'scripts/audit_cfb_model_selection_prereg.py'
      - 'scripts/audit_cfb_selection_readiness.py'
      - 'sportsedge/sports/cfb/model_selection_prereg.py'
      - 'sportsedge/sports/cfb/acquisition_readiness.py'
      - 'sportsedge/sports/cfb/selection_readiness.py'
      - '.github/workflows/cfb-candidate-first-evaluation-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install contracted runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Audit frozen candidate preregistration
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb
          python scripts/audit_cfb_model_selection_prereg.py \
            --out artifacts/cfb/candidate_prereg_readiness.json

      - name: Fetch immutable evidence branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin data:data
          git worktree add data-branch data

      - name: Resolve reconstructed-selection inputs
        id: selection_inputs
        shell: bash
        run: |
          set -euo pipefail
          root='data-branch/history/cfb/reconstructed-selection'
          acquisition=''
          bundle=''
          [ ! -f "$root/acquisition_manifest.json" ] || acquisition="$root/acquisition_manifest.json"
          [ ! -f "$root/selection_bundle_manifest.json" ] || bundle="$root/selection_bundle_manifest.json"
          echo "acquisition=$acquisition" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Audit reconstructed first-evaluation readiness
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --prereg-report artifacts/cfb/candidate_prereg_readiness.json
            --acquisition-out artifacts/cfb/acquisition_readiness.json
            --out artifacts/cfb/first_evaluation_readiness.json
          )
          [ -z "${{ steps.selection_inputs.outputs.acquisition }}" ] || args+=(--acquisition-manifest "${{ steps.selection_inputs.outputs.acquisition }}")
          [ -z "${{ steps.selection_inputs.outputs.bundle }}" ] || args+=(--selection-bundle "${{ steps.selection_inputs.outputs.bundle }}")
          python scripts/audit_cfb_selection_readiness.py "${args[@]}"

      - name: Assert selection/promotion boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/cfb/first_evaluation_readiness.json').read_text())
          if report.get('historical_pit_required_for_selection') is not False:
              raise SystemExit('CFB_SELECTION_GATE_REINTRODUCED_PIT_DEPENDENCY')
          if report.get('attempts_consumed') != 0 or report.get('evaluation_performed') is not False:
              raise SystemExit('CFB_FIRST_EVAL_READINESS_CONSUMED_ATTEMPT')
          for key in (
              'historical_pit_created', 'model_p_created', 'promotion_authority',
              'evidence_clock_authority', 'eligibility_changed', 'official_authority',
          ):
              if report.get(key) is not False:
                  raise SystemExit(f'CFB_FIRST_EVAL_READINESS_AUTHORITY_LEAK:{key}')
          if report.get('first_evaluation_allowed'):
              if report.get('selection_lane') != 'RECONSTRUCTED_HISTORICAL_NOT_PIT':
                  raise SystemExit('CFB_FIRST_EVAL_WRONG_SELECTION_LANE')
              if report.get('reconstructed_acquisition_ready') is not True:
                  raise SystemExit('CFB_FIRST_EVAL_ALLOWED_WITHOUT_ACQUISITION_READINESS')
              if report.get('reconstructed_selection_bundle_ready') is not True:
                  raise SystemExit('CFB_FIRST_EVAL_ALLOWED_WITHOUT_SELECTION_BUNDLE')
          PY

      - name: Upload first-evaluation readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-first-evaluation-readiness-${{ github.sha }}
          path: |
            artifacts/cfb/candidate_prereg_readiness.json
            artifacts/cfb/acquisition_readiness.json
            artifacts/cfb/first_evaluation_readiness.json
          if-no-files-found: warn
          retention-days: 30
