name: cfb-candidate-first-evaluation-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/cfb_model_selection_policy_v1.json'
      - 'config/cfb_model_candidate_prereg_v1.json'
      - 'config/cfb_truth_gate_v1.json'
      - 'scripts/audit_cfb_model_selection_prereg.py'
      - 'scripts/audit_cfb_pit_readiness.py'
      - 'sportsedge/sports/cfb/model_selection_prereg.py'
      - 'sportsedge/sports/cfb/pit_readiness.py'
      - 'sportsedge/sports/cfb/source_manifest.py'
      - '.github/workflows/cfb-candidate-first-evaluation-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'config/cfb_model_selection_policy_v1.json'
      - 'config/cfb_model_candidate_prereg_v1.json'
      - 'config/cfb_truth_gate_v1.json'
      - 'scripts/audit_cfb_model_selection_prereg.py'
      - 'scripts/audit_cfb_pit_readiness.py'
      - 'sportsedge/sports/cfb/model_selection_prereg.py'
      - 'sportsedge/sports/cfb/pit_readiness.py'
      - 'sportsedge/sports/cfb/source_manifest.py'
      - '.github/workflows/cfb-candidate-first-evaluation-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install contracted runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Audit frozen candidate preregistration
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb
          python scripts/audit_cfb_model_selection_prereg.py \
            --out artifacts/cfb/candidate_prereg_readiness.json

      - name: Fetch immutable evidence branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin data:data
          git worktree add data-branch data

      - name: Resolve persisted CFB evidence inputs
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          current_root='data-branch/history/cfb/current-release'
          current=''
          if [ -d "$current_root" ]; then
            latest="$(find "$current_root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)"
            if [ -n "$latest" ]; then
              candidate="$current_root/$latest/cfb_history_capture/current_release_classification.json"
              [ ! -f "$candidate" ] || current="$candidate"
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

          pit_root='data-branch/history/cfb/pit'
          echo "pit_root=$pit_root" >> "$GITHUB_OUTPUT"
          for pair in \
            'manifest:source_manifest.json' \
            'availability:asof_availability_proof.json' \
            'market:paired_market_evidence.json'; do
            key="${pair%%:*}"
            file="${pair#*:}"
            value=''
            [ ! -f "$pit_root/$file" ] || value="$pit_root/$file"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Audit promotion-grade PIT readiness without consuming an attempt
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --truth-gate config/cfb_truth_gate_v1.json
            --output artifacts/cfb/pit_readiness.json
          )
          [ -z "${{ steps.evidence.outputs.current }}" ] || args+=(--current-release-classification "${{ steps.evidence.outputs.current }}")
          if [ -d "${{ steps.evidence.outputs.pit_root }}" ]; then
            args+=(--evidence-root "${{ steps.evidence.outputs.pit_root }}")
          fi
          [ -z "${{ steps.evidence.outputs.manifest }}" ] || args+=(--pit-source-manifest "${{ steps.evidence.outputs.manifest }}")
          [ -z "${{ steps.evidence.outputs.availability }}" ] || args+=(--availability-proof "${{ steps.evidence.outputs.availability }}")
          [ -z "${{ steps.evidence.outputs.market }}" ] || args+=(--paired-market-evidence "${{ steps.evidence.outputs.market }}")
          python scripts/audit_cfb_pit_readiness.py "${args[@]}"

      - name: Freeze candidate-selection first-evaluation decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          prereg = json.loads(Path('artifacts/cfb/candidate_prereg_readiness.json').read_text())
          pit = json.loads(Path('artifacts/cfb/pit_readiness.json').read_text())
          frozen = json.loads(Path('config/cfb_model_candidate_prereg_v1.json').read_text())
          governance = frozen.get('governance') or {}

          if governance.get('attempts_consumed') != 0:
              raise SystemExit('CFB_FIRST_EVAL_READINESS_EXPECTS_ZERO_ATTEMPTS_CONSUMED')
          if governance.get('evaluation_performed') is not False:
              raise SystemExit('CFB_FIRST_EVAL_READINESS_EXPECTS_NO_PRIOR_EVALUATION')
          for key in ('model_p_created', 'promotion_authority', 'eligibility_changed', 'official_authority'):
              if governance.get(key) is not False:
                  raise SystemExit(f'CFB_FIRST_EVAL_AUTHORITY_FORBIDDEN:{key}')

          prereg_ready = prereg.get('status') == 'READY_FOR_FIRST_EVALUATION'
          pit_ready = pit.get('historical_truth_gate_execution_allowed') is True

          # Scope amendment #730: reconstructed-history candidate-family selection
          # is governed by preregistration/selection policy, not promotion-grade PIT.
          allowed = prereg_ready
          selection_blockers = []
          if not prereg_ready:
              selection_blockers.append('PREREGISTRATION_NOT_READY')
          promotion_pit_blockers = [] if pit_ready else list(
              pit.get('blockers') or ['GENUINE_PIT_SOURCE_CONTRACT_NOT_READY']
          )

          report = {
              'schema_version': 'CFB_FIRST_EVALUATION_READINESS_V2',
              'status': 'FIRST_EVALUATION_ALLOWED' if allowed else 'BLOCKED_SELECTION_PREREGISTRATION',
              'first_evaluation_allowed': allowed,
              'selection_scope_only': True,
              'attempts_consumed': 0,
              'evaluation_performed': False,
              'model_p_created': False,
              'promotion_authority': False,
              'eligibility_changed': False,
              'official_authority': False,
              'preregistration_status': prereg.get('status'),
              'pit_readiness_state': pit.get('readiness_state'),
              'historical_truth_gate_execution_allowed': pit.get('historical_truth_gate_execution_allowed'),
              'forward_clock_allowed': pit.get('forward_clock_allowed'),
              'blockers': selection_blockers,
              'promotion_pit_diagnostic_blockers': promotion_pit_blockers,
              'promotion_pit_is_not_selection_veto': True,
              'do_not_consume_attempt_until_selection_contract_ready': True,
          }
          Path('artifacts/cfb/first_evaluation_readiness.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Assert fail-closed authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/cfb/first_evaluation_readiness.json').read_text())
          for key in ('model_p_created', 'promotion_authority', 'eligibility_changed', 'official_authority'):
              if report.get(key) is not False:
                  raise SystemExit(f'CFB_FIRST_EVAL_READINESS_AUTHORITY_LEAK:{key}')
          if report.get('attempts_consumed') != 0 or report.get('evaluation_performed') is not False:
              raise SystemExit('CFB_FIRST_EVAL_READINESS_CONSUMED_ATTEMPT')
          if report.get('first_evaluation_allowed') and report.get('preregistration_status') != 'READY_FOR_FIRST_EVALUATION':
              raise SystemExit('CFB_FIRST_EVAL_ALLOWED_WITHOUT_PREREGISTRATION')
          if report.get('first_evaluation_allowed') and report.get('selection_scope_only') is not True:
              raise SystemExit('CFB_FIRST_EVAL_SCOPE_NOT_SELECTION_ONLY')
          PY

      - name: Upload first-evaluation readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-first-evaluation-readiness-${{ github.sha }}
          path: |
            artifacts/cfb/candidate_prereg_readiness.json
            artifacts/cfb/pit_readiness.json
            artifacts/cfb/first_evaluation_readiness.json
          if-no-files-found: warn
          retention-days: 30
