name: ufc-full-model

on:
  push:
    branches: [main]
    paths:
      - 'sportsedge/ufc_*.py'
      - 'scripts/*ufc*.py'
      - 'config/*ufc*.json'
      - 'config/dwcs*.json'
      - '.github/workflows/ufc-full-model.yml'
  pull_request:
    paths:
      - 'sportsedge/ufc_*.py'
      - 'scripts/*ufc*.py'
      - 'config/*ufc*.json'
      - 'config/dwcs*.json'
      - '.github/workflows/ufc-full-model.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 2'
    - cron: '0 21 * * 2'
    - cron: '0 15 * * 6'
    - cron: '0 19 * * 6'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      live_inputs_status: ${{ steps.live_inputs.outputs.status }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run UFC tests
        run: >-
          python -m pytest -q
          tests/test_ufc_engine.py
          tests/test_ufc_training.py
          tests/test_ufc_history.py
          tests/test_ufc_promotion.py
          tests/test_ufc_runtime.py
          tests/test_ufc_source.py
      - name: Train chronological UFC model and promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/build_ufc_training_artifact.py \
              --output models/ufc_logistic_v1.json \
              --metrics artifacts/ufc_training_metrics.json \
              --promotion-evidence artifacts/ufc_promotion_evidence.json \
              --promotion-contract config/ufc_promotion_contract_v1.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "UFC history acquisition failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build current UFC fighter/context snapshots
        id: live_inputs
        shell: bash
        run: |
          set +e
          output=$(python scripts/build_ufc_live_inputs.py \
            --fighters data/ufc/fighters_today.json \
            --contexts data/ufc/contexts_today.json \
            --override config/dwcs_s10w3_2026-08-25.json 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          mkdir -p artifacts
          if [ "$rc" -eq 0 ]; then
            echo 'status=READY' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema_version":1,"status":"READY","blocker":null}' > artifacts/ufc_live_input_status.json
            exit 0
          fi
          if printf '%s\n' "$output" | grep -q 'UFC_LIVE_INPUTS_UNAVAILABLE'; then
            echo 'status=BLOCKED' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema_version":1,"status":"BLOCKED","blocker":"UFC_AUTOMATIC_FIGHTER_SNAPSHOT_PROVIDER_REQUIRED"}' > artifacts/ufc_live_input_status.json
            echo 'UFC live card execution is BLOCKED: automatic fighter/context snapshots are unavailable.'
            exit 0
          fi
          echo "Unexpected UFC live-input failure (exit=$rc)" >&2
          exit "$rc"
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s models/ufc_logistic_v1.json
          test -s artifacts/ufc_training_metrics.json
          test -s artifacts/ufc_promotion_evidence.json
          test -s artifacts/ufc_live_input_status.json
          python - <<'PY'
          import json
          m=json.load(open('models/ufc_logistic_v1.json'))
          p=json.load(open('artifacts/ufc_promotion_evidence.json'))
          s=json.load(open('artifacts/ufc_live_input_status.json'))
          assert m['training_rows'] >= 1000
          assert m['holdout_metrics']['n'] >= 100
          assert m['last_training_fight_date'] >= '2026-08-22'
          assert m['history_semantics']['current_fight_stats_in_current_row'] is False
          assert p['status'] in {'PROMOTED','UNVERIFIED'}
          assert isinstance(p.get('blockers'), list)
          assert p['training_source'] == 'Greco1899/scrape_ufc_stats UFCStats mirror'
          assert p['history_semantics']['feature_time'] == 'pre_fight_snapshot'
          assert 'ufc_debut_any' in p['slices']
          assert p['dwcs_specific_validation']['status'] in {'PROMOTED','UNVERIFIED'}
          assert s['status'] in {'READY','BLOCKED'}
          if s['status'] == 'BLOCKED':
              assert s['blocker'] == 'UFC_AUTOMATIC_FIGHTER_SNAPSHOT_PROVIDER_REQUIRED'
          print('UFC_BOOTSTRAP_MODEL_OK', m['training_rows'], m['last_training_fight_date'], m['holdout_metrics'], p['status'], p['blockers'], p['dwcs_specific_validation']['status'], s)
          PY
          if [ "${{ steps.live_inputs.outputs.status }}" = 'READY' ]; then
            test -s data/ufc/fighters_today.json
            test -s data/ufc/contexts_today.json
            python - <<'PY'
          import json
          m=json.load(open('models/ufc_logistic_v1.json'))
          f=json.load(open('data/ufc/fighters_today.json'))
          c=json.load(open('data/ufc/contexts_today.json'))
          assert len(c) >= 1
          assert len(f['fighters']) == 2 * len(c)
          assert f['history_last_fight_date'] == m['last_training_fight_date']
          assert all(int(x.get('rounds', 0)) in {3, 5} for x in c)
          print('UFC_LIVE_INPUTS_READY', f.get('card_source'), len(f['fighters']), len(c))
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ufc-bootstrap-${{ github.run_id }}
          path: |
            models/ufc_logistic_v1.json
            artifacts/ufc_training_metrics.json
            artifacts/ufc_promotion_evidence.json
            artifacts/ufc_live_input_status.json
            data/ufc/fighters_today.json
            data/ufc/contexts_today.json
          if-no-files-found: error

  run-card:
    needs: test-and-build
    if: ${{ needs.test-and-build.outputs.live_inputs_status == 'READY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check live odds credential
        id: odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: bash
        run: |
          if [ -n "$ODDS_API_KEY" ]; then echo 'available=true' >> "$GITHUB_OUTPUT"; else echo 'available=false' >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild model, evidence, and live inputs
        if: ${{ steps.odds.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/build_ufc_training_artifact.py --output models/ufc_logistic_v1.json --metrics artifacts/ufc_training_metrics.json --promotion-evidence artifacts/ufc_promotion_evidence.json --promotion-contract config/ufc_promotion_contract_v1.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          python scripts/build_ufc_live_inputs.py --fighters data/ufc/fighters_today.json --contexts data/ufc/contexts_today.json --override config/dwcs_s10w3_2026-08-25.json
      - name: Run 250k UFC model
        if: ${{ steps.odds.outputs.available == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python scripts/run_ufc_full_model.py
          --fighters data/ufc/fighters_today.json
          --contexts data/ufc/contexts_today.json
          --model-artifact models/ufc_logistic_v1.json
          --promotion-evidence artifacts/ufc_promotion_evidence.json
          --sims 250000
          --output artifacts/ufc_card.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.odds.outputs.available == 'true' }}
        with:
          name: ufc-full-model-${{ github.run_id }}
          path: |
            artifacts/ufc_card.json
            artifacts/ufc_promotion_evidence.json
            artifacts/ufc_training_metrics.json
          if-no-files-found: error
