name: nfl-fair-odds-card

# DK prices come from owner issue intake; the paid/reference-odds job is
# explicitly opt-in so ordinary daily cards never consume Odds API credits.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Share the paid Odds API serialization group with the frozen 2026 captures.
concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  fair-odds:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: DK vs no-vig fair price
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/run_nfl_fair_odds_card.py --out artifacts/nfl_fair_odds.md
          cat artifacts/nfl_fair_odds.md >> "$GITHUB_STEP_SUMMARY"
