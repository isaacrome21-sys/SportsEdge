name: nfl-play-level-attempt1-one-shot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/research/nfl_play_level_attempt1_prelock_v1.json'
      - 'config/research/nfl_play_level_attempt1_implementation_v1.json'
      - 'scripts/run_nfl_play_level_attempt1.py'
      - 'tests/test_nfl_play_level_attempt1.py'
      - '.github/workflows/nfl-play-level-attempt1-one-shot.yml'

permissions:
  contents: read

jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_CORETYPE: ZEN
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen numerical and test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.3' 'pytest==9.1.1'
      - name: Verify implementation before any 2024 access
        run: |
          python -m py_compile scripts/run_nfl_play_level_attempt1.py tests/test_nfl_play_level_attempt1.py
          python -m pytest -q tests/test_nfl_play_level_attempt1.py
      - name: Spend Attempt 1 one-shot 2024 research validation
        run: |
          set -o pipefail
          mkdir -p artifacts/nfl-play-level-attempt1
          python scripts/run_nfl_play_level_attempt1.py             --output artifacts/nfl-play-level-attempt1/result.json             | tee artifacts/nfl-play-level-attempt1/stdout.jsonl
      - name: Assert result authority stays zero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/nfl-play-level-attempt1/result.json').read_text())
          r=p['result']
          if r.get('attempt_spent') is not True:
              raise SystemExit('NFL_ATTEMPT1_RESULT_DID_NOT_MARK_ATTEMPT_SPENT')
          for key in ('creates_model_p','promotion_authority','truth_gate_authority','official_authority','staking_authority','changes_2026_owner'):
              if r.get('authority',{}).get(key) is not False:
                  raise SystemExit(f'NFL_ATTEMPT1_AUTHORITY_LEAK:{key}')
          print(json.dumps({
              'status':r.get('status'),
              'pass':r.get('pass'),
              'n_development':r.get('n_development'),
              'n_validation':r.get('n_validation'),
              'pooled_log_loss':r.get('pooled_log_loss'),
              'rmse':r.get('rmse'),
              'gates':r.get('gates'),
              'receipt_sha256':p.get('receipt_sha256'),
          },sort_keys=True))
          PY
      - name: Upload immutable one-shot receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-play-level-attempt1-one-shot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nfl-play-level-attempt1
          if-no-files-found: warn
          retention-days: 90
