name: props-source-family-ledger

on:
  pull_request:
    paths:
      - 'sportsedge/props_source_family_ledger.py'
      - 'tests/test_props_source_family_ledger.py'
      - '.github/workflows/props-source-family-ledger.yml'

permissions:
  contents: read

jobs:
  source-family-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install contract test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile observational ledger surface
        run: python -m py_compile sportsedge/props_source_family_ledger.py tests/test_props_source_family_ledger.py
      - name: Enforce source-family, price, radar, and zero-authority contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_props_source_family_ledger.py
      - name: Guard against prop-engine authority or Stage 7 bypass
        run: |
          set -euo pipefail
          ! grep -E 'official_authority["'"']?\s*[:=]\s*True|can_create_model_p["'"']?\s*[:=]\s*True|staking_authority["'"']?\s*[:=]\s*True' sportsedge/props_source_family_ledger.py
          ! grep -E 'bind_prop_market\(' sportsedge/props_source_family_ledger.py
