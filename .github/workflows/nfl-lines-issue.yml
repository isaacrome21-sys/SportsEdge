name: nfl-lines-issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

cache-mode: write

concurrency:
  group: nfl-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  card:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'nfl-lines') || startsWith(github.event.issue.title, '[NFL LINES]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore phone runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime-deps
          key: nfl-lines-runtime-v1-${{ runner.os }}-${{ runner.arch }}-py312-numpy253
      - name: Install runtime dependencies
        if: steps.runtime.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check --target .runtime-deps numpy==2.5.3
      - name: Transcribe lines from the issue
        id: intake
        env:
          BODY: ${{ github.event.issue.body }}
          OBSERVED: ${{ github.event.issue.updated_at }}
        run: |
          printf '%s' "$BODY" > issue_body.txt
          if PYTHONPATH=.runtime-deps:. python scripts/intake_nfl_lines_issue.py --body-file issue_body.txt \
               --observed-at "$OBSERVED" --issue "$ISSUE" > intake.out; then
            cat intake.out >> "$GITHUB_OUTPUT"
          else
            { echo "Couldn't read these lines, so no card was run:"; echo; echo '```'; cat intake_error.txt; echo '```'; } > fail.md
            gh issue comment "$ISSUE" --body-file fail.md
            exit 1
          fi
      - name: Price with frozen Attempt 9
        run: |
          PYTHONPATH=.runtime-deps:. python scripts/run_nfl_lines_card.py \
            --input "${{ steps.intake.outputs.path }}" \
            --output artifacts/nfl_phone_card.json
      - name: Render PRE-CONTEXT and reply
        run: |
          PYTHONPATH=.runtime-deps:. python scripts/render_nfl_myspari_card.py \
            --engine-output artifacts/nfl_phone_card.json \
            --snapshot "${{ steps.intake.outputs.path }}" \
            --pre-context \
            --out-dir artifacts/nfl_myspari
          gh issue comment "$ISSUE" --body-file artifacts/nfl_myspari/card.md
      - name: Report engine failure
        if: failure() && steps.intake.outcome == 'success'
        run: |
          gh issue comment "$ISSUE" --body "The NFL card run failed after intake. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-lines-issue-${{ github.event.issue.number }}
          path: |
            manual_inputs/nfl/*_issue*.json
            artifacts/
          if-no-files-found: warn
