name: sportsedge-auto-dk-four-sports

# Owner receives automatic sportsbook intake and cards without pasted lines.
on:
  schedule:
    - cron: '17 10 * * *'
    # Sunday 10:17 AM CT during DST (9:17 AM CT in standard time).
    # Reserve-aware NFL-only quote refresh before the main afternoon slate.
    - cron: '17 15 * * 0'
  # Immediately run one guarded live capture when this workflow merges to main;
  # avoid repeated paid API calls from unrelated repository commits.
  push:
    branches: [main]
    paths:
      - 'scripts/collect_auto_dk_four_sports.py'
      - 'scripts/run_auto_dk_cards.py'
      - 'scripts/render_auto_dk_phone_summary.py'
      - 'scripts/render_sportsedge_png.py'
      - 'scripts/collect_nfl_auto_props.py'
      - 'scripts/run_auto_dk_live_value_card.py'
      - 'sportsedge/auto_dk_canonical_intake.py'
      - 'scripts/fallback_nfl_direct_dk.py'
      - 'sportsedge/sports/nfl/auto_slate.py'
      - '.github/workflows/sportsedge-auto-dk-four-sports.yml'
  pull_request:
    paths:
      - 'scripts/render_auto_dk_phone_summary.py'
      - 'tests/test_auto_dk_phone_summary.py'
      - 'scripts/render_sportsedge_png.py'
      - 'tests/test_sportsedge_png.py'
      - 'scripts/collect_nfl_auto_props.py'
      - 'scripts/run_auto_dk_live_value_card.py'
      - 'sportsedge/auto_dk_canonical_intake.py'
      - 'tests/test_auto_dk_canonical_intake.py'
      - 'tests/test_nfl_auto_props.py'
      - 'scripts/fallback_nfl_direct_dk.py'
      - 'tests/test_nfl_direct_fallback.py'
      - 'sportsedge/sports/nfl/auto_slate.py'
      - 'tests/test_nfl_auto_slate.py'
      - 'scripts/collect_auto_dk_four_sports.py'
      - 'scripts/run_auto_dk_cards.py'
      - 'tests/test_auto_dk_four_sports.py'
      - 'tests/test_lane5_cfb_auto_form2_20261024.py'
      - 'scripts/capture_cfb_form2_slate.py'
      - '.github/workflows/sportsedge-auto-dk-four-sports.yml'
  workflow_dispatch:
    inputs:
      sports:
        description: 'Space-separated subset of NFL CFB MLB NBA; blank = all'
        required: false
        type: string
        default: 'NFL CFB MLB NBA'

permissions:
  contents: read
  issues: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Test automatic source and ranked phone summary
        run: |
          python -m unittest tests.test_auto_dk_four_sports -v
          python -m pip install --disable-pip-version-check pytest==9.1.1 Pillow==12.3.0
          python -m pytest -q tests/test_lane5_cfb_auto_form2_20261024.py tests/test_auto_dk_phone_summary.py tests/test_sportsedge_png.py tests/test_nfl_auto_props.py tests/test_nfl_direct_fallback.py tests/test_nfl_auto_slate.py tests/test_auto_dk_canonical_intake.py tests/test_bet_issue_crosscheck.py tests/test_cfb_zero_blend_owner_20261024.py
  auto:
    if: github.repository_owner == 'isaacrome21-sys' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      CFBD_API_KEY: ${{ secrets.SPORTSEDGE_CFBD_API_KEY || secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned free packages
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test auto DK quote guards without paid requests
        run: python -m unittest tests.test_auto_dk_four_sports -v
      - name: Pull current DK lines plus other-book references
        env:
          SELECTED_SPORTS: ${{ inputs.sports }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%H)" == "15" ]]; then
            # The extra Sunday run is NFL-only: no optional-sport credit spend.
            requested=(NFL)
            echo "NFL_ONLY=true" >> "$GITHUB_ENV"
          elif [[ -n "${SELECTED_SPORTS:-}" ]]; then
            read -ra requested <<< "$SELECTED_SPORTS"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            requested=(NFL CFB)
          else
            requested=(NFL CFB MLB NBA)
          fi
          python scripts/collect_auto_dk_four_sports.py --sports "${requested[@]}" --reserve 76
          cat artifacts/auto_dk/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fast-first two-game value screen before the quote TTL expires
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python scripts/run_auto_dk_live_value_card.py \
            --input-dir artifacts/auto_dk \
            --out-dir artifacts/auto_dk_cards/fast \
            --max-games 2
          test ! -f artifacts/auto_dk_cards/fast/current_value_card.md || cat artifacts/auto_dk_cards/fast/current_value_card.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish near-tip card immediately without waiting on the full-slate model
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sportsedge-fast-value-${{ github.run_id }}
          path: artifacts/auto_dk_cards/fast/
          if-no-files-found: warn
          retention-days: 14
      - name: Independently audit all paired quotes on the full canonical path
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python scripts/run_auto_dk_live_value_card.py \
            --input-dir artifacts/auto_dk \
            --out-dir artifacts/auto_dk_cards
          test ! -f artifacts/auto_dk_cards/current_value_card.md || cat artifacts/auto_dk_cards/current_value_card.md >> "$GITHUB_STEP_SUMMARY"
      - name: Automatic CFB Form 2 QB identity capture (no manual issue)
        # Lane 5 (#2447): fixtures come from the already-paid DK CFB capture;
        # OurLads/ESPN are free. Identity-only, research-only. The sealed
        # digest is a CANDIDATE: pricing admission still needs the external
        # owner pin (loader contract), so nothing here self-admits Form 2.
        if: ${{ always() && env.NFL_ONLY != 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if [ -f artifacts/auto_dk/cfb_odds.json ]; then
            mkdir -p artifacts/auto_dk_cards/cfb_form2
            python scripts/capture_cfb_form2_slate.py \
              --auto-dk-capture artifacts/auto_dk/cfb_odds.json \
              --archive artifacts/auto_dk_cards/cfb_form2/archive \
              --resolved-lines artifacts/auto_dk_cards/cfb_form2/lines_resolved.json \
              --report artifacts/auto_dk_cards/cfb_form2/form2_report.json \
              | tee artifacts/auto_dk_cards/cfb_form2/summary.json
          fi
      - name: Free direct DK fallback on empty NFL API board only
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f artifacts/auto_dk/nfl_odds.json ]; then
            python scripts/fallback_nfl_direct_dk.py --odds-dir artifacts/auto_dk
          fi
      - name: Capture paired NFL player props with independent per-event quota guards
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ -f artifacts/auto_dk/nfl_odds.json ]; then
            python scripts/collect_nfl_auto_props.py --game-odds artifacts/auto_dk/nfl_odds.json --out-dir artifacts/auto_dk_cards --max-games 2
          fi
      - name: Free CFB public pregame capture
        if: env.NFL_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p artifacts/auto_dk_cards/cfb_public
          python scripts/fetch_cfb_sdv_live.py --output-dir artifacts/auto_dk_cards/cfb_public
      - name: Run existing NFL CFB MLB card engines (NBA capture-only)
        run: |
          python scripts/run_auto_dk_cards.py
          cat artifacts/auto_dk_cards/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Render ranked NFL/CFB phone summary
        run: |
          python scripts/render_auto_dk_phone_summary.py \
            --root artifacts/auto_dk_cards \
            --output artifacts/auto_dk_cards/phone_summary.md \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload the DK board, cards, and real PNGs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sportsedge-auto-dk-${{ github.run_id }}
          path: |
            artifacts/auto_dk/
            artifacts/auto_dk_cards/
          if-no-files-found: warn
          retention-days: 14
      - name: Post a phone-viewable daily status
        if: always()
        shell: bash
        run: |
          day=$(TZ=America/Chicago date +%F)
          {
            echo "SportsEdge automatic DK board: $day"
            echo
            test ! -f artifacts/auto_dk/summary.md || cat artifacts/auto_dk/summary.md
            echo
            test ! -f artifacts/auto_dk_cards/fast/current_value_card.md || cat artifacts/auto_dk_cards/fast/current_value_card.md
            echo
            test ! -f artifacts/auto_dk_cards/current_value_card.md || cat artifacts/auto_dk_cards/current_value_card.md
            echo
            test ! -f artifacts/auto_dk_cards/phone_summary.md || cat artifacts/auto_dk_cards/phone_summary.md
            echo
            if [ -f artifacts/auto_dk_cards/cfb_form2/summary.json ]; then
              echo "CFB Form 2 QB capture (identity-only; candidate digest, owner pin required to admit):"
              cat artifacts/auto_dk_cards/cfb_form2/summary.json
              echo
            fi
            echo "Card JSON and PNGs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Model probabilities and quote gaps are never fabricated."
          } > auto_status.md
          existing=$(gh issue list --state all --limit 80 --search "[SPORTSEDGE AUTO] $day in:title" --json number,title --jq ".[] | select(.title==\"[SPORTSEDGE AUTO] $day\") | .number" | head -1)
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file auto_status.md || true
          else
            gh issue create --title "[SPORTSEDGE AUTO] $day" --body-file auto_status.md || true
          fi
