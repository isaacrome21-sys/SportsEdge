name: sportsedge-phone-png-tests

on:
  pull_request:
    paths:
      - 'scripts/render_sportsedge_png.py'
      - 'tests/test_sportsedge_png.py'
      - 'requirements-test.txt'
      - '.github/workflows/sportsedge-phone-png-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/render_sportsedge_png.py'
      - 'tests/test_sportsedge_png.py'
      - '.github/workflows/sportsedge-phone-png-tests.yml'

permissions:
  contents: read

jobs:
  render-three-sports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Confirm genuine three-sport PNG images and probability honesty
        run: python -m pytest -q tests/test_sportsedge_png.py
