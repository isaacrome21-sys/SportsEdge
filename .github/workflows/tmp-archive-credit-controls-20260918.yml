name: tmp-archive-credit-controls-20260918
# Bootstrap only; durable patch excludes workflow bytes.

on:
  push:
    branches:
      - fix/archive-reserve-dk-only-no-mlb-20260918
    paths:
      - '.github/workflows/tmp-archive-credit-controls-20260918.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/archive-reserve-dk-only-no-mlb-20260918
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply durable patch
        run: |
          python scripts/tmp_apply_archive_credit_controls_20260918.py
          python scripts/tmp_fix_archive_credit_test_counts_20260918.py

      - name: Run focused regression suite
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          python -m unittest tests.test_closing_line_archive tests.test_closing_line_archive_v2 tests.test_closing_line_archive_v3 tests.test_closing_line_archive_credit_guard tests.test_market_maker_radar -v
          python -m pytest -q tests/test_reconciliation_catchup_pr815.py tests/test_freeze_reconciliation.py

      - name: Commit durable patch to branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sportsedge-credit-control-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            config/closing_line_archive_policy_v1.json \
            scripts/capture_closing_line_archive_v3.py \
            tests/test_closing_line_archive.py \
            tests/test_closing_line_archive_credit_guard.py \
            tests/test_market_maker_radar.py \
            config/freeze_reconciliation_registry_v1.json \
            tests/test_reconciliation_catchup_pr815.py
          if git diff --cached --quiet; then
            echo 'No durable changes.'
            exit 0
          fi
          git commit -m 'Ops: protect NFL reserve and park MLB archive spend'
          git push origin HEAD:fix/archive-reserve-dk-only-no-mlb-20260918
