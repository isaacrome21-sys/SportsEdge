name: mlb-postseason-starter-workload-audit
on:
  pull_request:
    paths:
      - scripts/audit_mlb_postseason_starter_workload.py
      - tests/test_mlb_postseason_starter_workload.py
      - .github/workflows/mlb-postseason-starter-workload-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-workload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned features runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run official game starter and strict-prior regression tests
        run: PYTHONPATH=. python -m unittest tests.test_mlb_postseason_starter_workload -v
      - name: Score actual 2023-2025 postseason starters and regular-season historical baseline
        run: >-
          PYTHONPATH=. python scripts/audit_mlb_postseason_starter_workload.py
          --workers 8
          --output artifacts/mlb_postseason_starter_workload_2023_2025.json
      - name: Upload immutable research results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-postseason-starter-workload-2023-2025
          path: artifacts/mlb_postseason_starter_workload_2023_2025.json
          if-no-files-found: warn
          retention-days: 14
