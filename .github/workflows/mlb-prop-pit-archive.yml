name: mlb-prop-pit-archive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'scripts/archive_mlb_prop_odds.py'
      - 'sportsedge/draftkings_prop_source.py'
      - 'tests/test_archive_mlb_prop_odds.py'
      - '.github/workflows/mlb-prop-pit-archive.yml'
  push:
    paths:
      - 'scripts/archive_mlb_prop_odds.py'
      - 'sportsedge/draftkings_prop_source.py'
      - 'tests/test_archive_mlb_prop_odds.py'
      - '.github/workflows/mlb-prop-pit-archive.yml'

permissions:
  contents: write

concurrency:
  group: mlb-prop-pit-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    env:
      PYTHONPATH: ${{ github.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Compile archive lane
        run: python -m py_compile scripts/archive_mlb_prop_odds.py sportsedge/draftkings_prop_source.py
      - name: Self-test archive contract
        run: python scripts/archive_mlb_prop_odds.py --self-test
      - name: Run archive unit tests
        run: python -m unittest discover -s tests -p 'test_archive_mlb_prop_odds.py'

  archive:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Capture DraftKings MLB prop PIT quotes
        id: capture
        shell: bash
        run: |
          set +e
          python scripts/archive_mlb_prop_odds.py | tee /tmp/prop_archive_status.json
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist immutable archive to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          git worktree add --detach .data-branch FETCH_HEAD
          mkdir -p .data-branch/runtime/mlb-prop-pit
          cp -R artifacts/prop_odds/. .data-branch/runtime/mlb-prop-pit/ 2>/dev/null || true
          cd .data-branch
          git config user.name sportsedge-archive-bot
          git config user.email sportsedge-archive-bot@users.noreply.github.com
          git add runtime/mlb-prop-pit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: MLB all-prop PIT quotes ${{ github.run_id }}"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort || true; sleep $((attempt * 2)); continue; }
            if git push origin HEAD:data; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-prop-pit-${{ github.run_id }}
          path: artifacts/prop_odds/
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate capture result
        if: always()
        run: exit '${{ steps.capture.outputs.exit_code }}'
