name: mlb-pit-observation-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/mlb_pit_observation.py'
      - 'sportsedge/mlb_pit_joiner.py'
      - 'sportsedge/mlb_additional_pit_joiner.py'
      - 'sportsedge/mlb_pit_archive_router.py'
      - 'sportsedge/mlb_run_machine.py'
      - 'scripts/run_auto_mlb_resilient.py'
      - 'sportsedge/mlb_settlement_evidence.py'
      - 'sportsedge/quote_bridge.py'
      - 'tests/test_mlb_pit_observation.py'
      - 'tests/test_mlb_pit_joiner.py'
      - 'tests/test_mlb_additional_pit_joiner.py'
      - 'tests/test_pr131_133_composition_repairs.py'
      - 'tests/test_composed_tree_settlement_adversarial.py'
      - 'tests/test_pr131_135_canonical_snapshot_replay.py'
      - '.github/workflows/mlb-pit-observation-contract.yml'
  push:
    paths:
      - 'sportsedge/mlb_pit_observation.py'
      - 'sportsedge/mlb_pit_joiner.py'
      - 'sportsedge/mlb_additional_pit_joiner.py'
      - 'sportsedge/mlb_pit_archive_router.py'
      - 'sportsedge/mlb_run_machine.py'
      - 'scripts/run_auto_mlb_resilient.py'
      - 'sportsedge/mlb_settlement_evidence.py'
      - 'sportsedge/quote_bridge.py'
      - 'tests/test_mlb_pit_observation.py'
      - 'tests/test_mlb_pit_joiner.py'
      - 'tests/test_mlb_additional_pit_joiner.py'
      - 'tests/test_pr131_133_composition_repairs.py'
      - 'tests/test_composed_tree_settlement_adversarial.py'
      - 'tests/test_pr131_135_canonical_snapshot_replay.py'
      - '.github/workflows/mlb-pit-observation-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Compile repaired orchestration and PIT modules
        run: >-
          python -m py_compile
          sportsedge/mlb_pit_observation.py
          sportsedge/mlb_pit_joiner.py
          sportsedge/mlb_additional_pit_joiner.py
          sportsedge/mlb_pit_archive_router.py
          sportsedge/mlb_run_machine.py
          scripts/run_auto_mlb_resilient.py
      - name: Run strict PIT observation tests
        run: python -m unittest discover -s tests -p 'test_mlb_pit_observation.py'
      - name: Run count-prop archive join tests
        run: python -m unittest discover -s tests -p 'test_mlb_pit_joiner.py'
      - name: Run additional-market archive join tests
        run: python -m unittest discover -s tests -p 'test_mlb_additional_pit_joiner.py'
      - name: Run PR131-133 composition regressions
        run: python -m unittest discover -s tests -p 'test_pr131_133_composition_repairs.py'
      - name: Run composed-tree adversarial settlement checks
        run: python -m unittest discover -s tests -p 'test_composed_tree_settlement_adversarial.py'
      - name: Run PR131-136 canonical snapshot replay checks
        run: python -m unittest discover -s tests -p 'test_pr131_135_canonical_snapshot_replay.py'
      - name: Recheck settlement separation
        run: python -m unittest discover -s tests -p 'test_mlb_settlement_evidence.py'

# Deliberately no scheduled scoring job yet. Real historical scoring requires:
# - executed live provider quote archives,
# - unique MLB game/player identity binding,
# - executed official-fact artifacts,
# - validated sportsbook settlement rules,
# - pregame model/history artifacts.
