name: tmp-port-cfb-pr821-current-main

on:
  push:
    branches:
      - cfb/verified-candidate-prereg-refreeze-v2-current-main-20260917
    paths:
      - '.github/workflows/tmp-port-cfb-pr821-current-main.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cfb/verified-candidate-prereg-refreeze-v2-current-main-20260917
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Port PR 821 verifier and focused tests
        env:
          SOURCE_SHA: f85b120193582b5c1c37ca04b9362e5ff14e51ee
        run: |
          git show "$SOURCE_SHA:scripts/reconcile_freeze_deltas.py" > scripts/reconcile_freeze_deltas.py
          git show "$SOURCE_SHA:tests/test_reconcile_freeze_deltas_cli.py" > tests/test_reconcile_freeze_deltas_cli.py
          git show "$SOURCE_SHA:tests/test_reconciliation_catchup_pr791.py" > tests/test_reconciliation_catchup_pr791.py

      - name: Apply only candidate refreeze disposition onto current registry
        env:
          SOURCE_SHA: f85b120193582b5c1c37ca04b9362e5ff14e51ee
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_sha = os.environ['SOURCE_SHA']
          path = Path('config/freeze_reconciliation_registry_v1.json')
          current = json.loads(path.read_text())
          source = json.loads(subprocess.check_output(
              ['git', 'show', f'{source_sha}:config/freeze_reconciliation_registry_v1.json'],
              text=True,
          ))

          bundle_id = 'CFB_CANDIDATE_PREREG_FREEZE_V1'
          current_bundle = next(b for b in current['bundles'] if b['bundle_id'] == bundle_id)
          source_bundle = next(b for b in source['bundles'] if b['bundle_id'] == bundle_id)
          if current_bundle['disposition'].get('state') != 'REVOKED':
              raise SystemExit('CURRENT_CANDIDATE_NOT_REVOKED_FAIL_CLOSED')
          if source_bundle['disposition'].get('state') != 'REFROZEN':
              raise SystemExit('SOURCE_CANDIDATE_NOT_MACHINE_REFROZEN')
          if current.get('reconciled_through_sha') != '2b4011058429bd6a689e7a69e0286a7e341629bb':
              raise SystemExit('CURRENT_RECONCILIATION_BOUNDARY_UNEXPECTED:' + str(current.get('reconciled_through_sha')))

          current_bundle['disposition'] = source_bundle['disposition']
          path.write_text(json.dumps(current, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - name: Run focused hosted proof
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_reconciliation_catchup_pr791.py \
            tests/test_reconciliation_catchup_pr815.py

      - name: Verify only intended durable paths changed
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'config/freeze_reconciliation_registry_v1.json',
              'scripts/reconcile_freeze_deltas.py',
              'tests/test_reconcile_freeze_deltas_cli.py',
              'tests/test_reconciliation_catchup_pr791.py',
              '.github/workflows/tmp-port-cfb-pr821-current-main.yml',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit('UNEXPECTED_PORT_PATHS:' + ','.join(sorted(paths)))
          PY

      - name: Persist clean port and remove bootstrap
        run: |
          git config user.name 'sportsedge-cfb-refreeze-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-port-cfb-pr821-current-main.yml
          git add config/freeze_reconciliation_registry_v1.json scripts/reconcile_freeze_deltas.py tests/test_reconcile_freeze_deltas_cli.py tests/test_reconciliation_catchup_pr791.py
          git commit -m 'CFB: clean-port candidate prereg refreeze onto current main'
          git push origin HEAD:cfb/verified-candidate-prereg-refreeze-v2-current-main-20260917
