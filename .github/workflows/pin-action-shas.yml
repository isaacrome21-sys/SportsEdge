name: pin-action-shas
# Verifies all marketplace actions are pinned to immutable commits.
# This workflow is deliberately read-only: it must never mutate main.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pin_github_actions.py'
      - '.github/workflows/pin-action-shas.yml'
  pull_request:
    paths:
      - 'scripts/pin_github_actions.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify action references are already pinned
        run: |
          set -euo pipefail
          python scripts/pin_github_actions.py
          if ! git diff --exit-code -- .github/workflows; then
            echo "UNPINNED_ACTION_REFERENCES: run the pinning tool on a branch and submit the resulting workflow diff by PR" >&2
            exit 1
          fi
          echo "ACTION_SHA_PINS_VERIFIED_READ_ONLY"
