name: nfl-composite-acceptance

# STAGED: install with
#   git mv ops/workflows_pending/nfl-composite-acceptance.yml .github/workflows/
#
# Ruling 8 (Oct 17 2026): composite RUN IT live acceptance on the next real
# multi-game slate (NFL, Sun Oct 18). Captures DK NFL game lines through the
# existing credit-guarded collector (reserve 76), converts them verbatim to
# composite intake, and runs artifacts/run_it_composite.py so each game is
# evaluated at its own recorded instant. 180s freshness unchanged; nothing is
# re-dated. RESEARCH ONLY: no PLAY, no stakes. Grading runs after the games.

on:
  workflow_dispatch:
  push:
    branches: [feat/nfl-composite-acceptance-20261017]
    paths:
      - 'scripts/nfl_ticket_to_composite_lines.py'
      - '.github/workflows/nfl-composite-acceptance.yml'
      - 'ops/nfl_composite_trigger.txt'  # bump to start a run on slate day

permissions:
  contents: read
  issues: write

concurrency:
  group: nfl-composite-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository_owner == 'isaacrome21-sys'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned packages
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Offline tests (converter + composite contract)
        run: python -m pytest -q tests/test_nfl_ticket_to_composite_lines.py tests/test_per_game_composite_20261015.py tests/test_per_game_composite_audit_20261015.py
      - name: Capture DK NFL game lines (credit-guarded)
        run: python scripts/collect_auto_dk_four_sports.py --sports NFL --reserve 76
      - name: Build composite card per slate date
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/composite
          shopt -s nullglob
          found=0
          for t in artifacts/auto_dk/nfl_ticket_*.json; do
            found=1
            d=$(basename "$t" .json); d=${d#nfl_ticket_}
            python scripts/nfl_ticket_to_composite_lines.py --ticket "$t" --output "artifacts/composite/lines_$d.json" || continue
            python artifacts/run_it_composite.py --lines "artifacts/composite/lines_$d.json" --output "artifacts/composite/card_$d.json" > /dev/null \
              || echo "COMPOSITE_REFUSED $d" | tee -a artifacts/composite/refusals.txt
          done
          test "$found" -eq 1 || echo "NO_NFL_TICKET_CAPTURED" | tee artifacts/composite/refusals.txt
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-composite-acceptance-${{ github.run_id }}
          path: |
            artifacts/auto_dk/
            artifacts/composite/
          retention-days: 90
      - name: Post summary to phone issue
        if: always()
        shell: bash
        run: |
          python - <<'PY' > status.md
          import glob, json
          print("NFL composite RUN IT live acceptance (ruling 8) - RESEARCH ONLY, no PLAY/stakes\n")
          for p in sorted(glob.glob("artifacts/composite/card_*.json")):
              c = json.load(open(p)); rows = c.get("evaluated_rows") or []
              st = {}
              for r in rows: st[r.get("status")] = st.get(r.get("status"), 0) + 1
              print(f"- {p.split('card_')[1][:-5]}: {len(rows)} rows, edges {len(c.get('edges') or [])}, statuses {st}")
              for e in (c.get("edges") or [])[:25]:
                  print(f"  - {e.get('game')} | {e.get('selection')} {e.get('line') if e.get('line') is not None else ''} | DK {e.get('odds_american')} | est {e.get('estimate_p')} | edge {e.get('edge_over_break_even_pp')} | EV {e.get('ev_per_dollar')}")
          try: print("\nRefusals:\n" + open("artifacts/composite/refusals.txt").read())
          except FileNotFoundError: pass
          print(f"\nEvidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          PY
          gh issue create --title "[NFL COMPOSITE ACCEPTANCE] run ${{ github.run_id }}" --body-file status.md || true
