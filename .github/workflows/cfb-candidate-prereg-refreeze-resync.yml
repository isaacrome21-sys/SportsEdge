name: cfb candidate prereg refreeze resync

on:
  push:
    branches:
      - cfb/verified-candidate-prereg-refreeze-v2

permissions:
  contents: write

env:
  PYTHONPATH: .
  CURRENT_MAIN_SHA: f397573c06ede6310ae9d1ba932ed67dbedb38ad
  REFREEZE_AT: '2026-09-17T12:46:52Z'

jobs:
  resync-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: cfb/verified-candidate-prereg-refreeze-v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Resync covered readiness bytes and refreeze boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
          git checkout origin/main -- .github/workflows/cfb-candidate-first-evaluation-readiness.yml
          python - <<'PY'
          import json, os
          from pathlib import Path

          registry_path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(registry_path.read_text())
          bundle = next(
              row for row in registry['bundles']
              if row['bundle_id'] == 'CFB_CANDIDATE_PREREG_FREEZE_V1'
          )
          disposition = bundle.get('disposition') or {}
          if disposition.get('state') != 'REFROZEN':
              raise SystemExit('CFB_CANDIDATE_RESYNC_EXPECTED_REFROZEN_START')
          if disposition.get('verification_schema') != 'CFB_CANDIDATE_PREREG_REFREEZE_V1':
              raise SystemExit('CFB_CANDIDATE_RESYNC_SCHEMA_DRIFT')
          disposition['new_freeze_sha'] = os.environ['CURRENT_MAIN_SHA']
          disposition['forward_clock_restart_at'] = os.environ['REFREEZE_AT']
          disposition['reason'] = (
              'MACHINE_VERIFIED_CANDIDATE_PREREG_BYTES_AND_CODE_MANIFEST; '
              'PR791_AND_PR819_IN_ANCESTRY; ZERO_ATTEMPTS; NO_EVALUATION_ROWS; '
              'REFROZEN_FAIL_CLOSED_FOR_SELECTION_SCOPE_ONLY'
          )
          registry_path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')

          test_path = Path('tests/test_reconciliation_catchup_pr791.py')
          text = test_path.read_text()
          text = text.replace(
              'REFREEZE_SHA = "f23d08bcc48c24368a78447c230a4f626afe1178"',
              f'REFREEZE_SHA = "{os.environ["CURRENT_MAIN_SHA"]}"',
          )
          text = text.replace(
              'assert disposition["forward_clock_restart_at"] == "2026-09-17T11:36:44Z"',
              f'assert disposition["forward_clock_restart_at"] == "{os.environ["REFREEZE_AT"]}"',
          )
          test_path.write_text(text)
          PY

      - name: Prove resynced prereg and reconciliation contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cfb_model_selection_prereg.py --out /tmp/cfb_candidate_prereg.json
          python -m pytest -q \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_reconciliation_catchup_pr791.py
          python scripts/build_reconciliation_registry_view.py \
            --output-policy /tmp/freeze_inventory_policy_effective.json \
            --output-registry /tmp/freeze_reconciliation_registry_effective.json \
            --attestation /tmp/reconciliation_coverage_attestation.json
          python scripts/reconcile_freeze_deltas.py \
            --registry /tmp/freeze_reconciliation_registry_effective.json \
            --current-main-ref origin/main \
            --output /tmp/freeze_reconciliation_report.json

      - name: Remove bootstrap and retain resynced governed change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cfb-candidate-prereg-refreeze-resync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/cfb-candidate-first-evaluation-readiness.yml \
            .github/workflows/cfb-candidate-prereg-refreeze-resync.yml \
            config/freeze_reconciliation_registry_v1.json \
            tests/test_reconciliation_catchup_pr791.py
          git commit -m 'CFB: resync candidate prereg refreeze to PR819 boundary'
          git push origin HEAD:cfb/verified-candidate-prereg-refreeze-v2
