name: nfl-game-script-v1-fit

on:
  pull_request:
    paths:
      - 'config/research/nfl_game_script_v1_prelock.json'
      - 'sportsedge/research/nfl_game_script_fit.py'
      - 'scripts/fit_nfl_game_script_v1.py'
      - 'tests/test_nfl_game_script_fit.py'
      - '.github/workflows/nfl-game-script-v1-fit.yml'
  workflow_dispatch:

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile frozen game-script surface
        run: |
          python -m py_compile \
            sportsedge/research/nfl_game_script_fit.py \
            scripts/fit_nfl_game_script_v1.py \
            tests/test_nfl_game_script_fit.py

      - name: Run frozen game-script contract tests before source access
        run: python -m pytest -q tests/test_nfl_game_script_fit.py

      - name: Assert validation season is unreachable
        run: |
          python - <<'PY'
          from sportsedge.research.nfl_game_script_fit import DEVELOPMENT_SEASONS, load_prelock
          prelock = load_prelock()
          assert DEVELOPMENT_SEASONS == tuple(range(2016, 2025))
          assert 2025 not in DEVELOPMENT_SEASONS
          assert prelock["validation_window"]["season"] == 2025
          assert prelock["validation_window"]["one_look"] is True
          print("NFL_GAME_SCRIPT_V1_SOURCE_BOUNDARY_OK")
          PY

      - name: Fetch exact 2016-2024 nflverse CSVs and fit V1
        run: >-
          python scripts/fit_nfl_game_script_v1.py
          --out artifacts/nfl_game_script_v1/nfl_game_script_v1_fit.json
          --summary-out artifacts/nfl_game_script_v1/nfl_game_script_v1_fit_summary.json

      - name: Enforce research-only fit authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fit = json.loads(Path("artifacts/nfl_game_script_v1/nfl_game_script_v1_fit.json").read_text())
          summary = json.loads(Path("artifacts/nfl_game_script_v1/nfl_game_script_v1_fit_summary.json").read_text())

          if fit.get("status") != "FITTED_RESEARCH_ONLY_NOT_VALIDATED":
              raise SystemExit("NFL_GAME_SCRIPT_V1_FIT_STATUS_INVALID")
          if summary.get("validation_season_accessed") is not False:
              raise SystemExit("NFL_GAME_SCRIPT_V1_VALIDATION_ACCESS_FORBIDDEN")
          if summary.get("fit_seasons") != list(range(2016, 2025)):
              raise SystemExit("NFL_GAME_SCRIPT_V1_FIT_WINDOW_INVALID")

          authority = fit.get("authority") or {}
          forbidden_true = (
              "validated_2025",
              "changes_attempt9_owner",
              "creates_model_p",
              "truth_gate_authority",
              "official_authority",
              "promotion_authority",
              "staking_authority",
          )
          for field in forbidden_true:
              if authority.get(field) is not False:
                  raise SystemExit(f"NFL_GAME_SCRIPT_V1_FORBIDDEN_AUTHORITY:{field}")

          print(json.dumps({
              "status": summary["status"],
              "artifact_sha256": summary["artifact_sha256"],
              "n_team_games": summary["n_team_games"],
              "fit_seasons": summary["fit_seasons"],
              "validation_season_accessed": False,
              "buckets": summary["buckets"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-game-script-v1-fit-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/nfl_game_script_v1/nfl_game_script_v1_fit.json
            artifacts/nfl_game_script_v1/nfl_game_script_v1_fit_summary.json
          if-no-files-found: error
          retention-days: 30
