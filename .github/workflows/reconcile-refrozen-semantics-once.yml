name: reconcile-refrozen-semantics-once

on:
  push:
    branches:
      - fix/freeze-reconciliation-inventory-20260914
    paths:
      - .github/workflows/reconcile-refrozen-semantics-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize machine-verifiable REFROZEN bindings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.governance.freeze_reconciliation import bundle_snapshot, resolve_sha

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          changed = []
          for bundle in registry.get('bundles') or []:
              disposition = bundle.get('disposition')
              if not isinstance(disposition, dict) or disposition.get('state') != 'REFROZEN':
                  continue
              old_sha = resolve_sha(Path('.'), str(bundle['freeze_sha']))
              new_sha = resolve_sha(Path('.'), str(disposition['new_freeze_sha']))
              disposition['prior_bundle_hash'] = bundle_snapshot(Path('.'), bundle, old_sha).aggregate_sha256
              disposition['new_bundle_hash'] = bundle_snapshot(Path('.'), bundle, new_sha).aggregate_sha256
              disposition['prior_semantics_invalid_after'] = disposition['forward_clock_restart_at']
              disposition['prior_evidence_invalidation_rule'] = 'HASH_AND_TIME'
              changed.append(bundle['bundle_id'])
          if not changed:
              raise SystemExit('NO_REFROZEN_BUNDLES_FOUND')
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          print('materialized=' + ','.join(changed))
          PY
      - name: Commit registry attestations
        run: |
          git config user.name 'sportsedge-governance-bot'
          git config user.email 'sportsedge-governance-bot@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json
          git diff --cached --quiet && { echo 'NO_REGISTRY_CHANGE'; exit 1; }
          git commit -m 'Governance: bind REFROZEN content and invalidation semantics'
          git push origin HEAD:fix/freeze-reconciliation-inventory-20260914
