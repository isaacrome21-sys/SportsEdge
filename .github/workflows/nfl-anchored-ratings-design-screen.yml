name: nfl-anchored-ratings-design-screen

# Unfrozen design falsification ONLY: never a forward clock or promotion gate.
on:
  pull_request:
    paths:
      - sportsedge/sports/nfl/anchored_ratings_v1.py
      - tests/test_nfl_anchored_ratings_v1.py
      - .github/workflows/nfl-anchored-ratings-design-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronological-design-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Acquire pinned nflverse historical source, not mutable master
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PIN=e4a58ddf0a28523f3919f2bb22bd383db0498b93
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            --header 'Accept: application/vnd.github+json' \
            --header 'User-Agent: SportsEdge-Research-Design-Screen' \
            "https://api.github.com/repos/nflverse/nfldata/git/blobs/${PIN}" \
            --output "${RUNNER_TEMP}/nflverse_source_git_blob.json"
          jq -e '.encoding == "base64" and (.content | type == "string")' \
            "${RUNNER_TEMP}/nflverse_source_git_blob.json" >/dev/null
          jq -r '.content' "${RUNNER_TEMP}/nflverse_source_git_blob.json" | \
            base64 --decode >"${RUNNER_TEMP}/nflverse_games_pinned.csv"
          observed=$(git hash-object "${RUNNER_TEMP}/nflverse_games_pinned.csv")
          if [ "${observed}" != "${PIN}" ]; then
            echo 'PINNED_NFLVERSE_BLOB_MISMATCH' >&2
            exit 1
          fi
          printf '%s\n' "source_git_blob_sha=${observed}" \
            "source_head_sha=${SOURCE_HEAD_SHA}" \
            "checkout_test_merge_sha=${GITHUB_SHA}" \
            'data_role=HISTORICAL_CONSENSUS_CLOSE_NOT_VERIFIED_CLV' \
            >"${RUNNER_TEMP}/nfl_anchored_screen_provenance.txt"
      - name: Execute real chronological 2020-2025 NFL season screen
        id: screen
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m sportsedge.sports.nfl.anchored_ratings_v1 \
            --nflverse-games-csv "${RUNNER_TEMP}/nflverse_games_pinned.csv" \
            --design-years 2020,2021,2022,2023,2024,2025 \
            >"${RUNNER_TEMP}/nfl_anchored_screen.json"
          result=$?
          set -e
          if [ "${result}" -ne 0 ] && [ "${result}" -ne 2 ]; then
            echo "DESIGN_SCREEN_RUNTIME_ERROR_${result}" >&2
            exit "${result}"
          fi
          python -m json.tool "${RUNNER_TEMP}/nfl_anchored_screen.json" >/dev/null
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["counted_rows"] == 0 and not d["verified_clv"] and not d["promotion_authority"] and d["paper_units"] == 0; assert d["design_years"] == [2020,2021,2022,2023,2024,2025]; assert d["status"] in ("FAILED_SCREEN","PASS_DESIGN_SCREEN"); print("HISTORICAL_SCREEN_VERDICT="+d["status"])' "${RUNNER_TEMP}/nfl_anchored_screen.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); summary={"status":d["status"],"design_years":d["design_years"],"skipped":d["skipped"],"markets":{k:{"n":v["n"],"anchored_mae":v.get("anchored_mae"),"consensus_close_mae":v.get("consensus_close_mae"),"failures":v["failures"],"bands":v.get("bands")} for k,v in d["screens"].items()}}; print("NUMERIC_DESIGN_SCREEN="+json.dumps(summary,sort_keys=True,allow_nan=False))' "${RUNNER_TEMP}/nfl_anchored_screen.json"
          printf '%s\n' "exit_code=${result}" >>"${RUNNER_TEMP}/nfl_anchored_screen_provenance.txt"
          # A measured FAILED_SCREEN is an honest research result, not a CI error.
          # It MUST NOT authorize preregistration or any player-card publication.
      - name: Archive immutable-input design verdict and refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-anchored-ratings-design-screen
          path: |
            ${{ runner.temp }}/nflverse_source_git_blob.json
            ${{ runner.temp }}/nfl_anchored_screen.json
            ${{ runner.temp }}/nfl_anchored_screen_provenance.txt
          if-no-files-found: warn
