name: temp-price-fallback-probe
on:
  push:
    branches: [temp-price-fallback-probe-20260812]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect ESPN web-header MLB price data
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib
          url='https://site.web.api.espn.com/apis/v2/scoreboard/header?sport=baseball&league=mlb&region=us&lang=en&contentorigin=espn'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.espn.com/'})
          with urllib.request.urlopen(req,timeout=25) as r: obj=json.load(r)
          out={'top_keys':list(obj),'odds_key_count':json.dumps(obj,separators=(',',':')).count('"odds"'),'sports':[]}
          for sport in obj.get('sports') or []:
            s={'name':sport.get('name'),'slug':sport.get('slug'),'leagues':[]}
            for league in sport.get('leagues') or []:
              events=league.get('events') or []
              le={'name':league.get('name'),'slug':league.get('slug'),'event_count':len(events),'events':[]}
              for e in events[:20]:
                row={'id':e.get('id'),'name':e.get('name'),'date':e.get('date'),'status':e.get('status'),'odds':e.get('odds')}
                comps=e.get('competitions') or []
                if comps:
                  c=comps[0]; row['competition_odds']=c.get('odds'); row['competitors']=[{'name':((x.get('team') or {}).get('displayName')),'homeAway':x.get('homeAway')} for x in c.get('competitors') or []]
                le['events'].append(row)
              s['leagues'].append(le)
            out['sports'].append(s)
          print(json.dumps(out,indent=2,default=str)); open('price_fallback_probe.json','w').write(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: price-fallback-probe
          path: price_fallback_probe.json
