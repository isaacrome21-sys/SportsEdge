name: mlb-context-adjusted-research

on:
  push:
    branches: [research/mlb-context-adjusted-runs-20260929]
    paths:
      - sportsedge/mlb_context_adjusted_research.py
      - sportsedge/mlb_context_adjusted_validation.py
      - sportsedge/mlb_joint_card_research.py
      - sportsedge/mlb_scored_card.py
      - scripts/run_mlb_context_adjusted_research.py
      - scripts/run_mlb_joint_card_research.py
      - tests/test_mlb_context_adjusted_research.py
      - tests/test_mlb_context_adjusted_validation.py
      - tests/test_mlb_joint_card_research.py
      - tests/test_mlb_joint_card_runner.py
      - tests/test_mlb_scored_card.py
      - .github/workflows/mlb-context-adjusted-research.yml
      - manual_inputs/mlb/2026-09-29_dk_full_supplied.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test joint-card and presentation invariants
        run: >-
          PYTHONPATH=. python -m unittest
          tests.test_mlb_context_adjusted_research
          tests.test_mlb_context_adjusted_validation
          tests.test_mlb_joint_card_research
          tests.test_mlb_joint_card_runner
          tests.test_mlb_scored_card -v
      - name: Run coherent BOS-NYY joint card
        run: >-
          PYTHONPATH=. python scripts/run_mlb_joint_card_research.py
          --input manual_inputs/mlb/2026-09-29_dk_full_supplied.json
          --game-id 'Boston Red Sox@New York Yankees'
          --output artifacts/mlb_joint_card_research_bos_nyy_20260929.json
          --simulations 100000
      - name: Upload joint-card result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-joint-card-research-bos-nyy-20260929
          path: artifacts/mlb_joint_card_research_bos_nyy_20260929.json
          if-no-files-found: error
          retention-days: 14
