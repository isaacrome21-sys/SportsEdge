name: mlb-context-adjusted-research

on:
  push:
    branches: [research/mlb-context-adjusted-runs-20260929]
    paths:
      - sportsedge/mlb_context_adjusted_research.py
      - scripts/run_mlb_context_adjusted_research.py
      - tests/test_mlb_context_adjusted_research.py
      - .github/workflows/mlb-context-adjusted-research.yml
      - manual_inputs/mlb/2026-09-29_dk_run_corrected.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test research guards
        run: PYTHONPATH=. python -m unittest tests.test_mlb_context_adjusted_research -v
      - name: Run Sept 29 context-adjusted research slate
        run: >-
          PYTHONPATH=. python scripts/run_mlb_context_adjusted_research.py
          --input manual_inputs/mlb/2026-09-29_dk_run_corrected.json
          --output artifacts/mlb_context_adjusted_research_20260929.json
      - name: Upload research result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-context-adjusted-research-20260929
          path: artifacts/mlb_context_adjusted_research_20260929.json
          if-no-files-found: error
          retention-days: 14
