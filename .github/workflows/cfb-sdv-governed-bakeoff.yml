name: cfb-sdv-governed-bakeoff

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CONSUME_ALL_FOUR_CFB_SDV_ATTEMPTS
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  bakeoff:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'CONSUME_ALL_FOUR_CFB_SDV_ATTEMPTS') ||
      (github.event_name == 'issues' && github.event.issue.body == 'CONSUME_ALL_FOUR_CFB_SDV_ATTEMPTS')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Verify frozen prereg hashes
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('config/cfb_sportsdataverse_candidate_prereg_v1.json').read_text())
          h=p['hash_binding']
          subprocess.run(['python','scripts/cfb_sportsdataverse_prereg_hash.py','--verify-code',h['code_manifest_sha256'],'--verify-config',h['config_bundle_sha256']],check=True)
          PY
      - name: Fetch immutable data branch
        run: |
          git fetch --no-tags origin data:data
          git worktree add data-branch data
      - name: Resolve frozen evaluation rows
        id: rows
        run: |
          set -euo pipefail
          p='data-branch/history/cfb/sportsdataverse-selection/training_rows.json'
          test -f "$p" || { echo 'CFB_SDV_TRAINING_ROWS_MISSING'; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"
      - name: Consume governed four-candidate attempt budget
        env:
          CONFIRM: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.confirm }}
        run: |
          python scripts/run_cfb_sportsdataverse_bakeoff.py \
            --rows "${{ steps.rows.outputs.path }}" \
            --confirm "$CONFIRM" \
            --out artifacts/cfb/sportsdataverse_bakeoff_result.json
      - name: Enforce frozen 200-shuffle null selection control
        run: |
          python - <<'PY'
          import copy, hashlib, json, random
          from pathlib import Path
          from sportsedge.sports.cfb.sportsdataverse_bakeoff import evaluate_native_candidates

          rows_path = Path("${{ steps.rows.outputs.path }}")
          result_path = Path("artifacts/cfb/sportsdataverse_bakeoff_result.json")
          prereg = json.loads(Path("config/cfb_sportsdataverse_candidate_prereg_v1.json").read_text())
          policy_path = Path("config/cfb_model_selection_policy_v1.json")
          policy = json.loads(policy_path.read_text())
          rows = json.loads(rows_path.read_text())

          families = list(prereg["candidate_selection_policy"]["family_order"])
          if families != list(policy["candidate_families_predeclared"]):
              raise SystemExit("CFB_SDV_NULL_POLICY_FAMILY_MISMATCH")
          placebo = policy.get("placebo_policy") or {}
          if int(placebo.get("shuffle_count", 0)) != 200:
              raise SystemExit("CFB_SDV_NULL_POLICY_SHUFFLE_COUNT_MISMATCH")
          if policy.get("candidate_attempt_budget") != 4:
              raise SystemExit("CFB_SDV_NULL_POLICY_ATTEMPT_BUDGET_MISMATCH")
          if policy.get("attempts_consumed") != 0:
              raise SystemExit("CFB_SDV_NULL_POLICY_NOT_FRESH")

          observed = json.loads(result_path.read_text())
          baseline = families[0]
          challengers = families[1:]
          null_improvement = {family: [] for family in challengers}

          def seed_for(rep, season):
              raw = f"SportsEdge|CFB_MODEL_SELECTION_POLICY_V1|PLACEBO_V1|{rep}|{season}".encode()
              return int.from_bytes(hashlib.sha256(raw).digest()[:8], "big")

          for rep in range(200):
              shuffled = copy.deepcopy(rows)
              by_season = {}
              for idx, row in enumerate(shuffled):
                  by_season.setdefault(int(row["season"]), []).append(idx)
              for season, indices in sorted(by_season.items()):
                  pairs = [(shuffled[i]["home_points"], shuffled[i]["away_points"]) for i in indices]
                  random.Random(seed_for(rep, season)).shuffle(pairs)
                  for i, pair in zip(indices, pairs):
                      shuffled[i]["home_points"], shuffled[i]["away_points"] = pair
              null_result = evaluate_native_candidates(shuffled, prereg)
              base_rmse = float(null_result["observed"][baseline]["selection_metric"])
              for family in challengers:
                  null_improvement[family].append(
                      base_rmse - float(null_result["observed"][family]["selection_metric"])
                  )

          def quantile95(values):
              xs = sorted(float(x) for x in values)
              pos = (len(xs) - 1) * 0.95
              lo = int(pos)
              hi = min(lo + 1, len(xs) - 1)
              frac = pos - lo
              return xs[lo] * (1.0 - frac) + xs[hi] * frac

          observed_base = float(observed["observed"][baseline]["selection_metric"])
          gates = {}
          passing = []
          for family in challengers:
              improvement = observed_base - float(observed["observed"][family]["selection_metric"])
              threshold = quantile95(null_improvement[family])
              passed = improvement > threshold
              gates[family] = {
                  "observed_improvement_vs_equal_weight": improvement,
                  "null_q95": threshold,
                  "passes": passed,
              }
              if passed:
                  passing.append(family)

          winner = None
          if passing:
              winner = min(
                  passing,
                  key=lambda family: (
                      float(observed["observed"][family]["selection_metric"]),
                      families.index(family),
                  ),
              )
          observed["pre_null_selected_family"] = observed.get("selected_family")
          observed["selected_family"] = winner
          observed["selection_status"] = (
              "WINNER_SELECTED"
              if winner is not None
              else "NO_CANDIDATE_DEMONSTRATED_SIGNAL_AT_THIS_SAMPLE"
          )
          observed["null_control"] = {
              "policy_schema": policy.get("schema"),
              "policy_sha256": hashlib.sha256(policy_path.read_bytes()).hexdigest(),
              "shuffle_count": 200,
              "seed_policy": "SHA256_FIRST8_BIG_ENDIAN_PER_REP_SEASON_V1",
              "baseline_family": baseline,
              "candidate_gates": gates,
          }
          observed["governance"]["attempts_consumed"] = 4
          observed["governance"]["null_control_enforced"] = True
          result_path.write_text(json.dumps(observed, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "selection_status": observed["selection_status"],
              "selected_family": winner,
              "candidate_gates": gates,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload immutable result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-sdv-bakeoff-${{ github.sha }}
          path: artifacts/cfb/sportsdataverse_bakeoff_result.json
          if-no-files-found: warn
          retention-days: 30
