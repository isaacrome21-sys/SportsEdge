name: nfl-draftkings-prop-provider-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/draftkings_prop_source.py'
      - 'tests/test_nfl_draftkings_prop_source.py'
      - '.github/workflows/nfl-draftkings-prop-provider-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test NFL DraftKings prop parser
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest tests/test_nfl_draftkings_prop_source.py -q
      - name: Probe DraftKings NFL prop surface
        id: probe
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os
          from pathlib import Path
          from sportsedge.sports.nfl.draftkings_prop_source import fetch_nfl_prop_quotes

          now = datetime.now(timezone.utc)
          out = Path('artifacts/provider-probe') / now.date().isoformat()
          out.mkdir(parents=True, exist_ok=True)
          path = out / f"draftkings_nfl_props_{now.strftime('%Y%m%dT%H%M%S.%fZ')}.json"
          try:
              snap = fetch_nfl_prop_quotes()
              markets = {}
              for q in snap.quotes:
                  markets[q['market']] = markets.get(q['market'], 0) + 1
              quote_payload = [dict(q) for q in snap.quotes]
              quote_sha = hashlib.sha256(json.dumps(quote_payload, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              row = {
                  'run_at_utc': now.isoformat(),
                  'code_git_sha': os.environ['EVIDENCE_GIT_SHA'].lower(),
                  'provider': 'DRAFTKINGS_WEB_RESEARCH',
                  'sport': 'NFL',
                  'status': 'PASS' if snap.quotes else 'BLOCKED_NO_PROP_QUOTES',
                  'league_id': snap.league_id,
                  'base_url_present': bool(snap.base_url),
                  'quotes_returned': len(snap.quotes),
                  'market_counts': markets,
                  'quote_payload_sha256': quote_sha,
                  'failure_count': len(snap.failures),
                  'failure_sample': list(snap.failures[:20]),
                  'promotion_authority': False,
                  'model_p_created': False,
              }
          except Exception as exc:
              row = {
                  'run_at_utc': now.isoformat(),
                  'code_git_sha': os.environ['EVIDENCE_GIT_SHA'].lower(),
                  'provider': 'DRAFTKINGS_WEB_RESEARCH',
                  'sport': 'NFL',
                  'status': 'ERROR',
                  'reason': f'{type(exc).__name__}:{exc}',
                  'promotion_authority': False,
                  'model_p_created': False,
              }
          path.write_text(json.dumps(row, indent=2, sort_keys=True) + '\n')
          print(json.dumps(row, indent=2, sort_keys=True))
          raise SystemExit(0 if row['status'] == 'PASS' else 3)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist provider evidence on manual dispatch only
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
          mkdir -p .data-branch/runtime/provider-acceptance/nfl-props
          cp -R artifacts/provider-probe/. .data-branch/runtime/provider-acceptance/nfl-props/ 2>/dev/null || true
          cd .data-branch
          git config user.name sportsedge-archive-bot
          git config user.email sportsedge-archive-bot@users.noreply.github.com
          git add runtime/provider-acceptance/nfl-props
          if ! git diff --cached --quiet; then
            git commit -m "provider: persist DraftKings NFL prop probe ${{ github.run_id }}"
            git push origin HEAD:data
          fi
      - name: Propagate provider result
        if: always()
        run: exit '${{ steps.probe.outputs.exit_code }}'
