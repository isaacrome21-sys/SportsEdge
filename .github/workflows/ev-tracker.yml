name: ev-tracker

# Freeze-reconciliation hold: direct repository persistence is intentionally
# quiesced. No prospective evidence may be reconstructed or backfilled from
# this interval. Restore collection only through a governed post-hold change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm reconciliation hold
        run: |
          echo "EV_TRACKER_DIRECT_MAIN_WRITER_QUIESCED"
          echo "No ledger or health evidence is written while the repository freeze-reconciliation hold is active."
