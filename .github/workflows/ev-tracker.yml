name: ev-tracker

# Post-hold repair: scheduled CLOSE execution is restored, but new [BET] intake
# remains disabled until a close path can complete without starving the V2
# denominator. Durable runtime state is persisted on the data branch so branch
# protection on main is never bypassed. No backfill or rewrite of sealed rows.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

# Serialize the complete hydrate/run/persist cycle. Ledger records are
# create-only and this prevents two close sweeps from racing on the data branch.
concurrency:
  group: sportsedge-ev-tracker-v2-data
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # repo-standard pin
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Hydrate create-only EV runtime state from data
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/ev-tracker-data"
          git fetch origin data
          git worktree add --detach "$data_dir" origin/data

          runtime_root="$data_dir/runtime/ev-tracker-v2"
          if [ -d "$runtime_root/ledger" ]; then
            while IFS= read -r -d '' src; do
              rel="${src#"$runtime_root/"}"
              if [ -e "$rel" ]; then
                if ! cmp -s "$src" "$rel"; then
                  echo "HYDRATE_CONFLICT: immutable record differs: $rel"
                  exit 1
                fi
              else
                mkdir -p "$(dirname "$rel")"
                cp "$src" "$rel"
              fi
            done < <(find "$runtime_root/ledger" -type f -print0)
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("ledger")
          before = {}
          if root.exists():
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  before[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          out = Path(os.environ["RUNNER_TEMP"]) / "ev-before.json"
          out.write_text(json.dumps(before, sort_keys=True), encoding="utf-8")
          PY

      - name: Run scheduled V2 close sweep
        id: tracker
        env:
          ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/ev_tracker.py close
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove immutability and identify only newly created rows
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          before_path = Path(os.environ["RUNNER_TEMP"]) / "ev-before.json"
          before = json.loads(before_path.read_text(encoding="utf-8"))
          root = Path("ledger")
          after = {}
          if root.exists():
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  after[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()

          drift = []
          for rel, digest in before.items():
              if rel not in after:
                  drift.append(f"deleted:{rel}")
              elif after[rel] != digest:
                  drift.append(f"modified:{rel}")
          if drift:
              print("IMMUTABLE_LEDGER_DRIFT: " + ", ".join(drift), file=sys.stderr)
              raise SystemExit(1)

          new_files = sorted(set(after) - set(before))
          (Path(os.environ["RUNNER_TEMP"]) / "ev-new-files.txt").write_text(
              "".join(f"{p}\n" for p in new_files), encoding="utf-8"
          )
          print(json.dumps({"new_ledger_rows": len(new_files), "paths": new_files}, sort_keys=True))
          PY

      - name: Persist zero-authority runtime state on data branch
        env:
          CODE: ${{ steps.tracker.outputs.code }}
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/ev-tracker-data"
          runtime_root="$data_dir/runtime/ev-tracker-v2"
          mkdir -p "$runtime_root/ledger" "$runtime_root/health"

          persisted=0
          if [ "$CODE" = "0" ] || [ "$CODE" = "3" ]; then
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              target="$runtime_root/$rel"
              if [ -e "$target" ]; then
                if ! cmp -s "$rel" "$target"; then
                  echo "PERSIST_CONFLICT: create-only record differs: $rel"
                  exit 1
                fi
              else
                mkdir -p "$(dirname "$target")"
                cp "$rel" "$target"
                persisted=$((persisted + 1))
              fi
            done < "$RUNNER_TEMP/ev-new-files.txt"
          fi

          python - "$runtime_root/health/latest.json" "$CODE" "$persisted" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path(sys.argv[1])
          payload = {
              "schema_version": "SPORTSEDGE_EV_TRACKER_RUNTIME_HEALTH_V1",
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "source_ref": os.environ.get("GITHUB_REF"),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "engine_exit_code": int(sys.argv[2]),
              "new_ledger_rows_persisted": int(sys.argv[3]),
              "intake_enabled": False,
              "evidence_authority": False,
              "model_p_authority": False,
              "truth_gate_authority": False,
              "promotion_authority": False,
              "official_authority": False,
              "note": "Close runner defect repair only; no backfill and no authority claim."
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          cd "$data_dir"
          git config user.name "sportsedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ev-tracker-v2
          if ! git diff --cached --quiet; then
            git commit -m "ev-tracker: persist close runtime state"
            git pull --rebase origin data
            git push origin HEAD:data
          fi

      - name: Fail visibly when close engine is not healthy
        env:
          CODE: ${{ steps.tracker.outputs.code }}
        run: |
          if [ "$CODE" != "0" ]; then
            echo "EV_TRACKER_CLOSE_NOT_HEALTHY: exit $CODE"
            exit "$CODE"
          fi
