name: manual-mlb-context-final-20261006

on:
  push:
    branches:
      - 'run/mlb-fast-20261006-1500-two-games'
    paths:
      - '.github/workflows/manual-mlb-context-final-20261006.yml'

permissions:
  contents: read

jobs:
  final-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Price supplied board with SportsEdge
        run: >-
          python scripts/run_manual_mlb_snapshot.py
          --input manual_inputs/mlb/2026-10-06_two_games_dk_1500.json
          --history-cache-dir .cache/mlb-history
          --run-date 2026-10-06
          --max-age-minutes 60
          --output artifacts/manual_mlb_context_final.json
      - name: Acquire live pregame context
        run: >-
          python scripts/acquire_mlb_card_context.py
          --engine-output artifacts/manual_mlb_context_final.json
          --out-dir artifacts/mlb_context_final
          --workers 2
      - name: Render context-bound SportsEdge card
        run: >-
          python scripts/render_mlb_myspari_card.py
          --engine-output artifacts/manual_mlb_context_final.json
          --snapshot manual_inputs/mlb/2026-10-06_two_games_dk_1500.json
          --context-dir artifacts/mlb_context_final
          --out-dir artifacts/mlb_myspari_context_final
      - name: Print actionable game bets
        run: |
          python scripts/print_mlb_fast_game_markets.py --card-json artifacts/mlb_myspari_context_final/card.json | tee artifacts/mlb_context_final_game_bets.txt
          echo "FINAL_CARD_BEGIN"
          cat artifacts/mlb_myspari_context_final/card.md
          echo "FINAL_CARD_END"
      - name: Upload context-bound result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-mlb-context-final-${{ github.sha }}
          path: |
            artifacts/manual_mlb_context_final.json
            artifacts/mlb_context_final/
            artifacts/mlb_myspari_context_final/
            artifacts/mlb_context_final_game_bets.txt
          if-no-files-found: error
          retention-days: 14

