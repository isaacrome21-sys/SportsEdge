name: nfl-v2d-diagnostic-contract

on:
  push:
    branches:
      - 'research/nfl-v2d-structured-mean-discrete-support'
    paths:
      - 'sportsedge/sports/nfl/m2_v2d_*.py'
      - 'tests/test_nfl_m2_v2d*.py'
      - '.github/workflows/nfl-v2d-diagnostic-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile V2D candidate and validation
        run: python -m compileall -q sportsedge/sports/nfl/m2_v2d_candidate.py sportsedge/sports/nfl/m2_v2d_validation.py
      - name: Run V2D contract tests
        run: python -m unittest discover -s tests -p 'test_nfl_m2_v2d*.py' -v
