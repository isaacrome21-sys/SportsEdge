name: cfb-spread-anchor-oos-research

on:
  push:
    branches:
      - chatgpt/cfb/spread-anchor-oos-research
    paths:
      - scripts/research_cfb_spread_anchor_oos.py
      - tests/test_cfb_spread_anchor_oos.py
      - .github/workflows/cfb-spread-anchor-oos-research.yml
  pull_request:
    paths:
      - scripts/research_cfb_spread_anchor_oos.py
      - tests/test_cfb_spread_anchor_oos.py
      - .github/workflows/cfb-spread-anchor-oos-research.yml

permissions:
  contents: read
  issues: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install research numeric dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Verify exact chronology and CI calculation contract
        run: python -m unittest tests.test_cfb_spread_anchor_oos -v
      - name: Read immutable SDV selection data (no live CFBD calls)
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin 3958d218b1d838136461474dbeb2eba99bb59bb3
          git show FETCH_HEAD:history/cfb/sportsdataverse-selection/training_rows.json > "$RUNNER_TEMP/cfb_sdv_training_rows.json"
          test -s "$RUNNER_TEMP/cfb_sdv_training_rows.json"
          sha256sum "$RUNNER_TEMP/cfb_sdv_training_rows.json"
      - name: Refit prior-season anchor and evaluate future-season closings only
        run: |
          python scripts/research_cfb_spread_anchor_oos.py \
            --rows "$RUNNER_TEMP/cfb_sdv_training_rows.json" \
            --output artifacts/cfb/spread_anchor_oos_research_20261010.json
      - name: Upload research-only report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-spread-anchor-oos-research
          path: artifacts/cfb/spread_anchor_oos_research_20261010.json
          if-no-files-found: warn
          retention-days: 60
