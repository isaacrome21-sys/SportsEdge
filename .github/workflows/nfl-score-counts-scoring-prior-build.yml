name: nfl-score-counts-scoring-prior-build

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.title == 'BUILD NFL SCORE COUNTS SCORING PRIOR V1' &&
       github.event.issue.body == 'BUILD_NFL_SCORE_COUNTS_SCORING_PRIOR_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Lock scoring-prior build contract
        run: |
          python -m pytest -q             tests/test_nfl_scoring_composition_fit.py             tests/test_nfl_scoring_composition_artifact.py             tests/test_nfl_score_counts_scoring_prior.py
      - name: Build frozen market-blind scoring prior
        run: |
          python scripts/build_nfl_score_counts_scoring_prior.py             --source-root "$RUNNER_TEMP/nfl_score_counts_scoring_prior_sources"             --prior-out artifacts/football/score_counts/scoring_composition_prior_v1.json             --attestation-out artifacts/football/score_counts/scoring_composition_prior_attestation_v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-score-counts-scoring-prior-${{ github.sha }}
          path: |
            artifacts/football/score_counts/scoring_composition_prior_v1.json
            artifacts/football/score_counts/scoring_composition_prior_attestation_v1.json
          if-no-files-found: error
          retention-days: 30
