name: fixture-backed-attestation

on:
  workflow_dispatch:
  push:
    branches: [fixture-attestation-20260812]
    paths:
      - 'fixtures/attestation/**'
      - 'scripts/run_hits_holdout.py'
      - 'scripts/run_total_bases_holdout.py'
      - 'sportsedge/hits_engine.py'
      - 'sportsedge/total_bases_engine.py'
      - 'sportsedge/fixture_io.py'
      - 'config/attestation_requirements.json'
      - '.github/workflows/fixture-backed-attestation.yml'

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact holdout runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify transport and canonical fixture identities before scoring
        env:
          HITS_GZ: fixtures/attestation/bb_hits_data.pkl.gz
          HITS_GZ_SIZE: '4089956'
          HITS_GZ_SHA256: '84bc9bab6f36ff27b91bb23cd13429b677d58db429f3eb4b935f4354c96ca2dc'
          HITS_RAW_SIZE: '19948081'
          HITS_RAW_SHA256: 'aaa006155de8078057fae0bd764a6aebca7e06057d9e83669d816536c5471776'
          TB_GZ: fixtures/attestation/tb_gameeffect_data.pkl.gz
          TB_GZ_SIZE: '7305084'
          TB_GZ_SHA256: '578f2c7e99c8615cb8f312b9b4ecbb3292db8b8a44d2155f6754d86710c23988'
          TB_RAW_SIZE: '24223755'
          TB_RAW_SHA256: '1a816f5f46bf1042c2dcc13078092b6205b359a2ad49dca3fcfdb7b787914859'
        run: |
          python - <<'PY'
          import gzip, hashlib, os, pathlib

          out = pathlib.Path('artifacts/fixture_attestation/canonical')
          out.mkdir(parents=True, exist_ok=True)

          specs = {
              'HITS': (
                  pathlib.Path(os.environ['HITS_GZ']),
                  int(os.environ['HITS_GZ_SIZE']), os.environ['HITS_GZ_SHA256'],
                  int(os.environ['HITS_RAW_SIZE']), os.environ['HITS_RAW_SHA256'],
                  out / 'bb_hits_data.pkl',
              ),
              'TOTAL_BASES': (
                  pathlib.Path(os.environ['TB_GZ']),
                  int(os.environ['TB_GZ_SIZE']), os.environ['TB_GZ_SHA256'],
                  int(os.environ['TB_RAW_SIZE']), os.environ['TB_RAW_SHA256'],
                  out / 'tb_gameeffect_data.pkl',
              ),
          }

          for market, (path, gz_size, gz_sha, raw_size, raw_sha, dest) in specs.items():
              if not path.is_file():
                  raise SystemExit(f'{market}: TRANSPORT_MISSING: {path}')
              transport = path.read_bytes()
              if len(transport) != gz_size:
                  raise SystemExit(f'{market}: TRANSPORT_SIZE_MISMATCH {len(transport)} != {gz_size}')
              got_transport = hashlib.sha256(transport).hexdigest()
              if got_transport != gz_sha:
                  raise SystemExit(f'{market}: TRANSPORT_SHA256_MISMATCH {got_transport} != {gz_sha}')
              try:
                  canonical = gzip.decompress(transport)
              except Exception as exc:
                  raise SystemExit(f'{market}: TRANSPORT_DECOMPRESSION_FAILED: {exc}') from exc
              if len(canonical) != raw_size:
                  raise SystemExit(f'{market}: CANONICAL_SIZE_MISMATCH {len(canonical)} != {raw_size}')
              got_raw = hashlib.sha256(canonical).hexdigest()
              if got_raw != raw_sha:
                  raise SystemExit(f'{market}: CANONICAL_SHA256_MISMATCH {got_raw} != {raw_sha}')
              dest.write_bytes(canonical)
              print(f'{market}: EXACT_FIXTURE_OK transport_sha256={got_transport} canonical_sha256={got_raw}')
          PY

      - name: Run authoritative Hits holdout
        run: |
          set -o pipefail
          mkdir -p artifacts/fixture_attestation/hits
          python scripts/run_hits_holdout.py artifacts/fixture_attestation/canonical/bb_hits_data.pkl | tee artifacts/fixture_attestation/hits/holdout.log
          grep -F 'PASS: full 83,769-row production Hits holdout' artifacts/fixture_attestation/hits/holdout.log
          grep -F 'identity collisions in holdout: 0' artifacts/fixture_attestation/hits/holdout.log

      - name: Run authoritative Total Bases holdout
        run: |
          set -o pipefail
          mkdir -p artifacts/fixture_attestation/total_bases
          python scripts/run_total_bases_holdout.py artifacts/fixture_attestation/canonical/tb_gameeffect_data.pkl | tee artifacts/fixture_attestation/total_bases/holdout.log
          grep -F 'PASS: full 73,036-row production Total Bases holdout' artifacts/fixture_attestation/total_bases/holdout.log
          grep -F 'identity_collisions: 0' artifacts/fixture_attestation/total_bases/holdout.log

      - name: Emit commit-bound attestations
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re

          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit(f'INVALID_GITHUB_SHA: {sha!r}')

          specs = {
              'HITS': {
                  'dir': 'hits', 'engine_version': 'hits_engine_v1.3',
                  'feature_version': 'hits_batter_pitcher_pa_v1',
                  'fixture_sha256': 'aaa006155de8078057fae0bd764a6aebca7e06057d9e83669d816536c5471776',
                  'holdout_rows': 83769, 'pass_marker': 'PASS: full 83,769-row production Hits holdout',
              },
              'TOTAL_BASES': {
                  'dir': 'total_bases', 'engine_version': 'total_bases_engine_v0.2',
                  'feature_version': 'tb_event_rates_pitcher_park_pa_v1',
                  'fixture_sha256': '1a816f5f46bf1042c2dcc13078092b6205b359a2ad49dca3fcfdb7b787914859',
                  'holdout_rows': 73036, 'pass_marker': 'PASS: full 73,036-row production Total Bases holdout',
              },
          }
          root = pathlib.Path('artifacts/fixture_attestation')
          for market, spec in specs.items():
              log_path = root / spec['dir'] / 'holdout.log'
              log = log_path.read_text()
              if spec['pass_marker'] not in log:
                  raise SystemExit(f'{market}: HOLDOUT_PASS_MARKER_MISSING')
              payload = {
                  'schema_version': 1,
                  'market': market,
                  'test_name': 'full_holdout_acceptance',
                  'verdict': 'PASS',
                  'engine_version': spec['engine_version'],
                  'feature_version': spec['feature_version'],
                  'fixture_sha256': spec['fixture_sha256'],
                  'ci_commit': sha,
                  'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                  'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'holdout_rows': spec['holdout_rows'],
                  'identity_collisions': 0,
                  'holdout_log_sha256': hashlib.sha256(log.encode()).hexdigest(),
              }
              out = root / spec['dir'] / 'attestation.json'
              out.write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n')
              print(out.read_text())
          PY

      - name: Verify attestations against checked-in requirements and exact CI commit
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          requirements = json.loads(pathlib.Path('config/attestation_requirements.json').read_text())['markets']
          expected_ci = os.environ['GITHUB_SHA']
          files = {
              'HITS': pathlib.Path('artifacts/fixture_attestation/hits/attestation.json'),
              'TOTAL_BASES': pathlib.Path('artifacts/fixture_attestation/total_bases/attestation.json'),
          }
          for market, path in files.items():
              req = requirements[market]
              att = json.loads(path.read_text())
              expected = {
                  'engine_version': req['engine_version'],
                  'feature_version': req['feature_version'],
                  'fixture_sha256': req['fixture_sha256'],
                  'verdict': req['required_verdict'],
                  'test_name': req['required_test_name'],
              }
              for key, value in expected.items():
                  if att.get(key) != value:
                      raise SystemExit(f'{market}: ATTESTATION_CONTRACT_MISMATCH {key}: {att.get(key)!r} != {value!r}')
              if att.get('ci_commit') != expected_ci or not re.fullmatch(r'[0-9a-f]{40}', att.get('ci_commit','')):
                  raise SystemExit(f'{market}: CI_COMMIT_BINDING_FAILED')
              print(f'{market}: ATTESTATION_CONTRACT_OK ci_commit={expected_ci}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-backed-attestation-${{ github.sha }}
          path: artifacts/fixture_attestation/
          if-no-files-found: warn
          retention-days: 90
