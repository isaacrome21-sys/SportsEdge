name: historical-jsonl-admission-tests

on:
  pull_request:
    paths:
      - "scripts/admit_historical_research_jsonl.py"
      - "tests/test_admit_historical_research_jsonl.py"
      - "sportsedge/research/multi_market_backtest.py"
      - ".github/workflows/historical-jsonl-admission-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned pytest
        run: python -m pip install pytest==9.1.1
      - name: Run historical admission regression tests
        run: python -m pytest -q tests/test_admit_historical_research_jsonl.py
