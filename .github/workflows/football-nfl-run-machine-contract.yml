name: football-nfl-run-machine-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/run_machine.py'
      - 'sportsedge/sports/nfl/m2.py'
      - 'sportsedge/sports/nfl/model_artifact.py'
      - 'tests/test_nfl_run_machine.py'
      - 'scripts/run_nfl_auto.py'
      - 'config/run_it_surface.json'
      - '.github/workflows/football-nfl-run-machine-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/nfl/run_machine.py'
      - 'sportsedge/sports/nfl/m2.py'
      - 'sportsedge/sports/nfl/model_artifact.py'
      - 'tests/test_nfl_run_machine.py'
      - 'scripts/run_nfl_auto.py'
      - 'config/run_it_surface.json'
      - '.github/workflows/football-nfl-run-machine-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile NFL production boundary
        run: >-
          python -m py_compile
          sportsedge/sports/nfl/run_machine.py
          sportsedge/sports/nfl/m2.py
          sportsedge/sports/nfl/model_artifact.py
          tests/test_nfl_run_machine.py
      - name: Run NFL run-machine contract tests
        run: python -m unittest tests.test_nfl_run_machine -v
