name: mlb-development-v3-robustness

# Expanding-season development robustness for the V3 listed-starter hypothesis.
# This lane is hard-capped to 2021-2024 and cannot create promotion evidence.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fit_mlb_baseline.py'
      - 'scripts/fit_mlb_development.py'
      - 'scripts/fit_mlb_development_v3.py'
      - 'scripts/validate_mlb_development_v3_robustness.py'
      - '.github/workflows/mlb-development-v3-robustness.yml'

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install pinned numpy
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile robustness path
        run: |
          python -m py_compile \
            scripts/fit_mlb_baseline.py \
            scripts/fit_mlb_development.py \
            scripts/fit_mlb_development_v3.py \
            scripts/validate_mlb_development_v3_robustness.py
      - name: Run expanding-season V3 robustness
        run: python scripts/validate_mlb_development_v3_robustness.py --out artifacts/mlb_development_v3_robustness.json
      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/mlb_development_v3_robustness.json').read_text())
          if report.get('status') != 'RESEARCH_ONLY_NOT_MODEL_P':
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_STATUS_INVALID')
          if report.get('validation_design') != 'EXPANDING_SEASON_FORWARD_2022_2024':
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_DESIGN_INVALID')
          if report.get('sacred_2025_accessed') is not False:
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_2025_FORBIDDEN')
          if report.get('promotion_changed') is not False:
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_PROMOTION_CHANGE_FORBIDDEN')
          if report.get('truth_gate_evidence') is not False or report.get('official_evidence') is not False:
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_PROMOTION_EVIDENCE_FORBIDDEN')
          years = sorted(int(year) for year in report['targets']['margin']['validation_seasons'])
          if years != [2022, 2023, 2024]:
              raise SystemExit('MLB_DEV_V3_ROBUSTNESS_YEARS_INVALID')
          PY
      - name: Upload robustness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-development-v3-robustness-${{ github.run_id }}
          path: artifacts/mlb_development_v3_robustness.json
          if-no-files-found: error
          retention-days: 30
