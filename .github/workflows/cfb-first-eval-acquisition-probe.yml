name: cfb-first-eval-acquisition-probe

on:
  push:
    branches:
      - diag/cfb-first-eval-acquisition-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - name: Probe CFBD account metadata without replay calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get("CFBD_API_KEY", "").strip()
          if not key:
              print(json.dumps({
                  "status": "BLOCKED",
                  "blocker": "CFBD_API_KEY_SECRET_MISSING",
                  "replay_call_performed": False,
                  "attempt_consumed": False,
              }, sort_keys=True))
              raise SystemExit(2)

          req = Request(
              "https://api.collegefootballdata.com/info",
              headers={
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json",
                  "User-Agent": "SportsEdge-CFB-Acquisition-Probe/1",
              },
          )
          try:
              with urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except HTTPError as exc:
              print(json.dumps({
                  "status": "BLOCKED",
                  "blocker": f"CFBD_INFO_HTTP_{exc.code}",
                  "replay_call_performed": False,
                  "attempt_consumed": False,
              }, sort_keys=True))
              raise SystemExit(2)
          except (URLError, TimeoutError, json.JSONDecodeError) as exc:
              print(json.dumps({
                  "status": "BLOCKED",
                  "blocker": f"CFBD_INFO_PROBE_FAILED:{type(exc).__name__}",
                  "replay_call_performed": False,
                  "attempt_consumed": False,
              }, sort_keys=True))
              raise SystemExit(2)

          if not isinstance(payload, dict):
              print(json.dumps({
                  "status": "BLOCKED",
                  "blocker": "CFBD_INFO_RESPONSE_NOT_OBJECT",
                  "replay_call_performed": False,
                  "attempt_consumed": False,
              }, sort_keys=True))
              raise SystemExit(2)

          safe = {
              "status": "CFBD_ACCOUNT_VERIFIED",
              "tier_name": payload.get("tierName"),
              "patron_level": payload.get("patronLevel"),
              "monthly_limit": payload.get("monthlyLimit"),
              "remaining_calls": payload.get("remainingCalls"),
              "used_calls": payload.get("usedCalls"),
              "reset_at": payload.get("resetAt"),
              "shared_pool": payload.get("sharedPool"),
              "replay_call_performed": False,
              "attempt_consumed": False,
              "model_fit_performed": False,
              "model_p_created": False,
              "promotion_authority": False,
              "official_authority": False,
          }
          print(json.dumps(safe, sort_keys=True))
          PY
