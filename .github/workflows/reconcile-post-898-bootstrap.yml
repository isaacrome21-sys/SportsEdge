name: reconcile-post-898-bootstrap

on:
  push:
    branches:
      - governance/reconcile-post-898-20260921
    paths:
      - '.github/workflows/reconcile-post-898-bootstrap.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-post-898-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Fetch and pin exact protected main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          expected="ed628eaa978dd11a2097da91fa006067fb55e717"
          test "$actual" = "$expected" || { echo "MAIN_MOVED:$actual:expected=$expected"; exit 1; }

      - name: Register every unclassified first-parent main commit and fail-close PR 898 drift
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          anchor = str(registry['reconciled_through_sha'])
          target = 'ed628eaa978dd11a2097da91fa006067fb55e717'

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          subprocess.check_call(['git', 'merge-base', '--is-ancestor', anchor, target])
          commits = [x for x in git('rev-list', '--first-parent', '--reverse', f'{anchor}..{target}').splitlines() if x]
          existing = {str(row.get('merge_sha') or '') for row in registry.get('deltas') or [] if isinstance(row, dict)}
          added = []
          for sha in commits:
              if sha in existing:
                  continue
              subject = git('show', '-s', '--format=%s', sha)
              body = git('show', '-s', '--format=%B', sha)
              match = re.search(r'(?:pull request |PR\s*#?)#?(\d+)', body, flags=re.I)
              pr = int(match.group(1)) if match else 0
              row = {
                  'delta_id': f'MAIN_CATCHUP_{sha[:12].upper()}',
                  'merge_sha': sha,
                  'note': 'Protected-main first-parent catch-up classification; machine matrix determines bundle impact. Subject: ' + subject,
                  'pr': pr,
              }
              registry.setdefault('deltas', []).append(row)
              existing.add(sha)
              added.append(row)

          prop_bundle = next(
              (row for row in registry.get('bundles') or [] if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1'),
              None,
          )
          if prop_bundle is None:
              raise SystemExit('NFL_PROP_MODEL_FREEZE_V1_MISSING')
          prop_bundle['disposition'] = {
              'prior_forward_clock_invalidated': True,
              'reason': 'PR_898_CHANGED_COVERED_NFL_PROP_TEST_SURFACE; RESEARCH_CHALLENGER_MERGED_WITHOUT_FULL_REFREEZE; REVOKED_FAIL_CLOSED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'state': 'REVOKED',
          }

          registry['reconciled_through_sha'] = target
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps({'anchor': anchor, 'target': target, 'first_parent_commits': len(commits), 'added': len(added), 'nfl_prop_disposition': 'REVOKED'}, sort_keys=True))
          PY

      - name: Machine-classify the updated registry
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/reconciliation_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/reconciliation_report.json').read_text())
          allowed = {'ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE'}
          blocks = set(report.get('release_blocks') or [])
          unexpected = sorted(blocks - allowed)
          print('outcome_counts=' + json.dumps(report.get('outcome_counts') or {}, sort_keys=True))
          print('release_blocks=' + json.dumps(sorted(blocks)))
          if unexpected:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:' + ','.join(unexpected))
          if any((report.get('authority') or {}).values()):
              raise SystemExit('RECONCILIATION_AUTHORITY_ESCALATION')
          PY

      - name: Run focused reconciliation contracts
        run: >-
          python -m pytest -q
          tests/test_freeze_reconciliation.py
          tests/test_reconcile_freeze_deltas_cli.py
          tests/test_reconciliation_catchup_pr791.py
          tests/test_reconciliation_catchup_pr815.py

      - name: Persist only the durable registry catch-up
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-post-898-bootstrap.yml
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/reconcile-post-898-bootstrap.yml
          git diff --cached --quiet && { echo 'NO_RECONCILIATION_CHANGE'; exit 1; }
          git commit -m 'Governance: reconcile protected main through PR 898'
          git push origin HEAD:governance/reconcile-post-898-20260921
