name: nfl-prop-engines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/prop_engines.py'
      - 'sportsedge/sports/nfl/prop_validation.py'
      - 'sportsedge/sports/nfl/prop_engine_validation.py'
      - 'sportsedge/sports/nfl/prop_market_history.py'
      - 'tests/test_nfl_prop_engines.py'
      - 'tests/test_nfl_prop_validation.py'
      - 'tests/test_nfl_prop_engine_validation.py'
      - 'tests/test_nfl_prop_market_history.py'
      - '.github/workflows/nfl-prop-engines.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile governed prop engines and validation
        run: >-
          python -m py_compile
          sportsedge/sports/nfl/prop_engines.py
          sportsedge/sports/nfl/prop_validation.py
          sportsedge/sports/nfl/prop_engine_validation.py
          sportsedge/sports/nfl/prop_market_history.py
      - name: Run prop engine and validation contracts
        run: >-
          python -m pytest
          tests/test_nfl_prop_engines.py
          tests/test_nfl_prop_validation.py
          tests/test_nfl_prop_engine_validation.py
          tests/test_nfl_prop_market_history.py -q
      - name: Assert engines and diagnostics remain non-promoting
        run: |
          python - <<'PY'
          from sportsedge.sports.nfl.prop_engines import fit_nfl_prop_engine
          from sportsedge.sports.nfl.prop_validation import build_prop_walkforward_evidence
          rows=[]
          for i in range(8):
              rows.append({
                  'player_id':'p','game_id':f'g{i}',
                  'kickoff_ts':f'2025-09-{i+1:02d}T18:00:00+00:00',
                  'receptions':i+1,'rushing_tds':0,'receiving_tds':0,
              })
          model=fit_nfl_prop_engine(
              rows, player_id='p', market_id='RECEPTIONS',
              as_of='2026-01-01T00:00:00+00:00', source_manifest_sha256='a'*64,
          )
          if model.promotion_eligible is not False or model.truth_gate_eligible is not False:
              raise SystemExit('NFL_PROP_ENGINE_MUST_REMAIN_NON_PROMOTING')
          if model.model_p_status != 'EXPERIMENTAL_MODEL_P':
              raise SystemExit('NFL_PROP_ENGINE_STATUS_INVALID')
          evidence=build_prop_walkforward_evidence(
              rows, player_id='p', market_id='RECEPTIONS',
              source_manifest_sha256='a'*64, min_games=6,
          )
          if evidence.get('promotion_eligible') is not False or evidence.get('promotion_authority') is not False:
              raise SystemExit('NFL_PROP_VALIDATION_MUST_REMAIN_NON_PROMOTING')
          if evidence.get('market_price_evidence_present') is not False:
              raise SystemExit('NFL_PROP_MARKET_EVIDENCE_MUST_NOT_BE_INFERRED')
          PY
