name: mlb-prop-negative-contract-branch

on:
  push:
    branches:
      - test/mlb-prop-evidence-negative-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run prop evidence contract
        run: python -m unittest tests.test_prop_evidence -v
      - name: Assert production freeze remains unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/mlb-prop-evidence-contract.yml').read_text()
          assert 'checked-in prop evidence unexpectedly passed' in text
          assert 'eligible markets unexpectedly present' in text
          print('PRODUCTION_PROP_FREEZE_UNCHANGED')
          PY

# Branch-only harness. Remove before any merge; production freeze remains untouched.
