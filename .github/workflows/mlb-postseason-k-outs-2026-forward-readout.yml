name: mlb-postseason-k-outs-2026-forward-readout

on:
  pull_request:
    paths:
      - 'sportsedge/mlb_postseason_k_outs_forward_readout.py'
      - 'scripts/read_mlb_postseason_k_outs_forward_shadow.py'
      - 'tests/test_mlb_postseason_k_outs_forward_readout.py'
      - '.github/workflows/mlb-postseason-k-outs-2026-forward-readout.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - mlb-postseason-k-outs-2026-shadow-forward
    types:
      - completed

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check chronological game-grouped forward readout
        run: >-
          PYTHONPATH=. python -m unittest
          tests.test_mlb_postseason_k_outs_forward_readout -v

  read-only-evaluate:
    needs: contract
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize existing immutable forward evidence from data branch
        run: |
          set -euo pipefail
          git fetch origin data
          if git cat-file -e origin/data:data/mlb_postseason_k_outs_forward_2026 2>/dev/null; then
            git archive origin/data data/mlb_postseason_k_outs_forward_2026 | tar -x
          fi
      - name: Score only complete prospective pitcher-game grids
        run: >-
          PYTHONPATH=. python scripts/read_mlb_postseason_k_outs_forward_shadow.py
          --root data/mlb_postseason_k_outs_forward_2026
          --output artifacts/mlb_postseason_k_outs_2026_forward_readout.json
      - name: Upload non-actionable forward readout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-postseason-k-outs-2026-forward-readout-${{ github.run_id }}
          path: artifacts/mlb_postseason_k_outs_2026_forward_readout.json
          if-no-files-found: warn
          retention-days: 90
