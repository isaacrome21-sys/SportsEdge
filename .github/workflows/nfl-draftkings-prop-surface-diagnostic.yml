name: nfl-draftkings-prop-surface-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/nfl-draftkings-prop-surface-diagnostic.yml'
      - 'sportsedge/sports/nfl/draftkings_prop_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Inspect live NFL category and market labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from sportsedge.sports.nfl.draftkings_prop_source import DK_HOME, _request, _discover, _json

          home=_request(DK_HOME).decode('utf-8', errors='replace')
          base, league_id=_discover(home)
          league=_json(f'{base}v1/leagues/{league_id}')
          events=league.get('events') if isinstance(league,dict) else None
          if not isinstance(events,list):
              raise SystemExit('DK_NFL_DIAGNOSTIC_EVENTS_MISSING')
          report={'league_id':league_id,'event_count':len(events),'events':[]}
          for event in events[:8]:
              if not isinstance(event,dict) or event.get('id') is None:
                  continue
              event_id=int(event['id'])
              cats=_json(f'{base}v1/events/{event_id}/categories')
              event_rows=cats.get('events') if isinstance(cats,dict) else None
              categories=((event_rows or [{}])[0].get('categories') or []) if isinstance(event_rows,list) and event_rows else []
              event_report={'event_id':str(event_id),'event_name':event.get('name') or event.get('eventName'),'category_count':len(categories),'categories':[]}
              for category in categories[:40]:
                  if not isinstance(category,dict):
                      continue
                  item={'id':category.get('id'),'name':category.get('name'),'componentId':category.get('componentId')}
                  cid=category.get('id')
                  if cid is not None:
                      try:
                          payload=_json(f'{base}v1/events/{event_id}/categories/{cid}')
                          markets=payload.get('markets') if isinstance(payload,dict) else None
                          if isinstance(markets,list):
                              item['market_names']=[str(m.get('name') or ((m.get('marketType') or {}).get('name') if isinstance(m.get('marketType'),dict) else '') or '') for m in markets[:30] if isinstance(m,dict)]
                          selections=payload.get('selections') if isinstance(payload,dict) else None
                          item['selection_count']=len(selections) if isinstance(selections,list) else None
                      except Exception as exc:
                          item['fetch_error']=f'{type(exc).__name__}:{exc}'
                  event_report['categories'].append(item)
              report['events'].append(event_report)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
