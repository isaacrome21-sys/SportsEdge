name: reconcile-post-898-active-only-bootstrap

on:
  push:
    branches:
      - governance/reconcile-post-898-active-only-20260921
    paths:
      - .github/workflows/reconcile-post-898-active-only-bootstrap.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-post-898-active-only-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Pin exact protected main
        env:
          EXPECTED_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN" || { echo "MAIN_MOVED:$actual expected=$EXPECTED_MAIN"; exit 1; }

      - name: Register main advances and revoke changed NFL prop freeze
        env:
          TARGET_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          python - <<'PY'
          from __future__ import annotations
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import subprocess

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          anchor = str(registry['reconciled_through_sha'])
          target = str(__import__('os').environ['TARGET_MAIN'])

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          subprocess.check_call(['git', 'merge-base', '--is-ancestor', anchor, target])
          represented = {str(row.get('merge_sha') or '') for row in registry['deltas']}
          commits = [x for x in git('rev-list', '--first-parent', '--reverse', f'{anchor}..{target}').splitlines() if x]
          for sha in commits:
              if sha in represented:
                  continue
              subject = git('show', '-s', '--format=%s', sha)
              body = git('show', '-s', '--format=%B', sha)
              match = re.search(r'(?:pull request |PR #)(\d+)', body, flags=re.I)
              pr = int(match.group(1)) if match else 0
              registry['deltas'].append({
                  'delta_id': f'MAIN_CATCHUP_{sha[:12]}',
                  'merge_sha': sha,
                  'note': subject,
                  'pr': pr,
              })

          bundle = next(
              row for row in registry['bundles']
              if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1'
          )
          prior = bundle.get('disposition')
          if prior not in (None, {}) and (prior or {}).get('state') != 'REVOKED':
              raise SystemExit('NFL_PROP_FREEZE_HAS_UNEXPECTED_DISPOSITION')
          bundle['disposition'] = {
              'state': 'REVOKED',
              'revoked_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'prior_forward_clock_invalidated': True,
              'reason': (
                  'PR_898_ADDED_COVERED_TEST_NFL_PROP_SURFACES_AFTER_THE_ACTIVE_FREEZE; '
                  'FREEZE_BYTES_INVENTORY_DRIFT_CONFIRMED; REVOKED_FAIL_CLOSED. '
                  'THE ROLE_BASED CHALLENGER REMAINS RESEARCH_ONLY AND REQUIRES A SEPARATE '
                  'MACHINE_VERIFIED REFREEZE BEFORE ANY MODEL_P_TRUTH_GATE_PROMOTION_STAKING_OR_OFFICIAL_AUTHORITY.'
              ),
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'eligibility': False,
                  'staking': False,
                  'official': False,
              },
          }
          registry['reconciled_through_sha'] = target
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          print(f'anchor={anchor}')
          print(f'target={target}')
          print(f'new_first_parent_rows={len([c for c in commits if c not in represented])}')
          PY

      - name: Machine-classify updated registry
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/reconciliation_report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/reconciliation_report.json'))
          blocks = list(report.get('release_blocks') or [])
          allowed = {'ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE'}
          unexpected = [b for b in blocks if b not in allowed]
          if unexpected:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:' + '|'.join(unexpected))
          rows = report.get('matrix') or report.get('rows') or []
          nfl_prop = [
              row for row in rows
              if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1'
              and row.get('outcome') == 'DRIFT_CONFIRMED'
          ]
          if not nfl_prop:
              raise SystemExit('EXPECTED_NFL_PROP_DRIFT_NOT_MACHINE_CONFIRMED')
          print('release_blocks=' + json.dumps(blocks, sort_keys=True))
          print('nfl_prop_drift_rows=' + str(len(nfl_prop)))
          PY

      - name: Focused governance contracts
        run: |
          python -m pytest -q \
            tests/test_reconciliation_active_bundle_identity.py \
            tests/test_freeze_reconciliation.py \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_freeze_inventory.py

      - name: Persist durable reconciliation only after proof
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-post-898-active-only-bootstrap.yml
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json \
            .github/workflows/reconcile-post-898-active-only-bootstrap.yml
          git diff --cached --quiet && { echo 'NOTHING_TO_PERSIST'; exit 1; }
          git commit -m 'Governance: reconcile through PR 898 and revoke stale NFL prop freeze'
          git push origin HEAD:governance/reconcile-post-898-active-only-20260921
