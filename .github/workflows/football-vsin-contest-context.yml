name: football-vsin-contest-context

on:
  workflow_dispatch:
  schedule:
    # Context-only VSiN/Circa archive. Never Model_P. Never official.
    - cron: "10 16 * * *"
  pull_request:
    paths:
      - "config/football_external_context_v1.json"
      - "scripts/capture_vsin_circa_contest_context.py"
      - "tests/test_vsin_circa_contest_context.py"
      - ".github/workflows/football-vsin-contest-context.yml"

permissions:
  contents: write

concurrency:
  group: football-vsin-contest-context
  cancel-in-progress: false

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Lock contest-context semantics
        run: python -m unittest tests.test_vsin_circa_contest_context -v

      - name: Attach append-only data branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data

      - name: Capture public VSiN contest context
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_vsin_circa_contest_context.py \
            --out-dir .data-branch | tee /tmp/vsin-contest-context.json

      - name: Verify captured manifest cannot promote
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find .data-branch/archive/external-context/vsin-circa-ffi-2026 -name '*.json' -type f | sort | tail -1)
          python - "$manifest" <<'PY'
          import json, sys
          row=json.load(open(sys.argv[1]))
          assert row['context_only'] is True
          for key in (
              'model_p_authority','predictive_model_input','truth_gate_input',
              'promotion_authority','eligibility_authority','edge_floor_authority',
              'staking_authority','official_authority','confidence_vote'):
              assert row[key] is False, key
          assert row['raw_sha256'] and row['raw_bytes'] > 0
          print('VSIN_CONTEST_CONTEXT_FAIL_CLOSED_OK', row['contest_week'], row['updated_at_source'])
          PY

      - name: Persist snapshot append-only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd .data-branch
          git config user.name 'sportsedge-context[bot]'
          git config user.email 'sportsedge-context@users.noreply.github.com'
          git add archive/external-context/vsin-circa-ffi-2026
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "context: archive VSiN Circa Invitational splits [NO_AUTHORITY]"
          for attempt in 1 2 3; do
            git fetch origin data || true
            git rebase origin/data || { git rebase --abort || true; }
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo 'VSIN_CONTEXT_PUSH_FAILED' >&2
          exit 1
