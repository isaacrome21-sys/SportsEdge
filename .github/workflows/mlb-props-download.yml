name: MLB Props Download

on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Maximum matching MLB prop rows to save in this run"
        required: true
        default: "200000"
        type: string
      month:
        description: "Optional settled archive partition: 2026-03, 2026-04, 2026-05, or 2026-06 (blank scans entire dataset)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install free data dependencies
        run: python -m pip install datasets pandas pyarrow
      - name: Stream MLB prop lines
        env:
          MAX_ROWS: ${{ inputs.max_rows }}
          MLB_MONTH: ${{ inputs.month }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts/mlb-props
          python scripts/download_mlb_props.py \
            --max-rows "$MAX_ROWS" \
            --month "$MLB_MONTH" \
            --out artifacts/mlb-props
      - name: Upload filtered MLB prop lines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-props-filtered
          path: artifacts/mlb-props/*.csv.gz
          if-no-files-found: warn
          retention-days: 14
