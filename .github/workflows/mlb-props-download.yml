name: MLB Props Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install datasets pandas pyarrow
      - name: Run download script
        run: python scripts/download_mlb_props.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-props-filtered
          path: mlb_props_filtered.parquet
          if-no-files-found: warn
