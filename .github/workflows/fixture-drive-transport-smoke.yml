name: fixture-drive-transport-smoke

on:
  push:
    branches: [statcast-required-v5-20260812]
    paths:
      - '.github/workflows/fixture-drive-transport-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive transport client
        run: python -m pip install --disable-pip-version-check gdown
      - name: Download transport-only fixture copies
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixtures
          gdown --id '1oX54qdZMlZlPjD0ybJqcRPNX7vz07Ir7' -O /tmp/fixtures/hits.pkl.gz
          gdown --id '1ht4fJHzFeD7od5AqmuTTjDM2dCT1AVim' -O /tmp/fixtures/tb.pkl.gz
          file /tmp/fixtures/hits.pkl.gz /tmp/fixtures/tb.pkl.gz
          test "$(stat -c%s /tmp/fixtures/hits.pkl.gz)" = '4089956'
          test "$(stat -c%s /tmp/fixtures/tb.pkl.gz)" = '7305084'
      - name: Verify canonical decompressed bytes
        run: |
          set -euo pipefail
          gzip -dc /tmp/fixtures/hits.pkl.gz > /tmp/fixtures/hits.pkl
          gzip -dc /tmp/fixtures/tb.pkl.gz > /tmp/fixtures/tb.pkl
          test "$(stat -c%s /tmp/fixtures/hits.pkl)" = '19948081'
          test "$(stat -c%s /tmp/fixtures/tb.pkl)" = '24223755'
          echo 'aaa006155de8078057fae0bd764a6aebca7e06057d9e83669d816536c5471776  /tmp/fixtures/hits.pkl' | sha256sum -c -
          echo '1a816f5f46bf1042c2dcc13078092b6205b359a2ad49dca3fcfdb7b787914859  /tmp/fixtures/tb.pkl' | sha256sum -c -
          echo EXACT_FIXTURE_TRANSPORT_PASS
