name: audit-mlb-game-engine-dispersion

on:
  push:
    branches: [research/mlb-dispersion-precontext-20260929]
    paths:
      - scripts/audit_mlb_game_engine_dispersion.py
      - scripts/verify_mlb_full_game_dispersion_production.py
      - sportsedge/v7_distribution.py
      - sportsedge/shared_game_engine.py
      - .github/workflows/audit-mlb-game-engine-dispersion.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile audit and production verifier
        run: python -m py_compile scripts/audit_mlb_game_engine_dispersion.py scripts/verify_mlb_full_game_dispersion_production.py sportsedge/v7_distribution.py sportsedge/shared_game_engine.py
      - name: Verify frozen dispersion with exact production simulator
        run: >-
          python scripts/verify_mlb_full_game_dispersion_production.py
          --start 2026-09-01
          --end 2026-09-27
          --validation-start 2026-09-15
          --max-games 250
          --simulations 100000
          --output artifacts/mlb_full_game_dispersion_production_verify.json
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-full-game-dispersion-production-verify
          path: artifacts/mlb_full_game_dispersion_production_verify.json
          if-no-files-found: error
