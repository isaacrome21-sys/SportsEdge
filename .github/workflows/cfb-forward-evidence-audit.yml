name: cfb-forward-evidence-audit

on:
  workflow_dispatch:
    inputs:
      require_ready:
        description: 'Fail if no fully joined market+weather candidate exists'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ['closing-line-archive', 'cfb-forward-weather-evidence']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cfb-forward-evidence-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify admission contract
        run: |
          python -m py_compile sportsedge/sports/cfb/forward_evidence.py scripts/audit_cfb_forward_evidence.py
          python -m unittest tests.test_cfb_forward_evidence -v
          python -m scripts.audit_cfb_forward_evidence --help >/dev/null

      - name: Fetch immutable data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data

      - name: Audit prospective market and weather evidence
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.require_ready || false }}" == "true" ]]; then
            extra="--require-ready"
          fi
          python -m scripts.audit_cfb_forward_evidence \
            --data-root .data-branch \
            --out artifacts/cfb_forward_evidence/report.json \
            $extra

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-forward-evidence-audit-${{ github.run_id }}
          path: artifacts/cfb_forward_evidence/report.json
          if-no-files-found: warn
          retention-days: 30
