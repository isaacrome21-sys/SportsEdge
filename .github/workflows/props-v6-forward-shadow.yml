name: props-v6-forward-shadow

# QUARANTINED: the historical forward-shadow recipe referenced capture scripts
# that are not present in the repository. Keep manual dispatch for audit visibility,
# but do not schedule or execute a partial/stubbed shadow-evidence lane.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed with quarantine status
        shell: bash
        run: |
          echo 'SPORTSEDGE_WORKFLOW_QUARANTINED=props-v6-forward-shadow'
          echo 'BLOCKER=MISSING_FORWARD_SHADOW_CAPTURE_SCRIPTS'
          echo 'Historical missing paths: capture_nrfi_v6_shadow.py, capture_bb_v6_shadow.py'
          exit 1
