name: props-v6-forward-shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/props-v6-forward-shadow.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: props-v6-forward-shadow
  cancel-in-progress: true

jobs:
  nrfi-v6-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_NRFI_V6_SHA256: 0bdf71e272e406611e241e2427904f3c8e3a9405700f440bedacf0b74ed1580e
      SPORTSEDGE_NRFI_V6_ARTIFACT: artifacts/nrfi-v6-shadow/sportsedge_nrfi_v6_shadow.joblib
      SPORTSEDGE_STATCAST_V5_OUT: artifacts/statcast-v5-game
      SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
      SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
    steps:
      - name: Checkout frozen V6 research code
        uses: actions/checkout@v4
        with:
          ref: props-v6-forward-shadow-20260813
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 joblib==1.5.3
      - name: Download exact frozen NRFI V6 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/nrfi-v6-shadow nrfi_candidate
          gh run download 31688818222 -n nrfi-v6-shadow-44f4180e34110f1f9e1bfeb9bb69fdca74faa45b -D nrfi_candidate
          cp nrfi_candidate/artifacts/nrfi-v6-shadow/sportsedge_nrfi_v6_shadow.joblib artifacts/nrfi-v6-shadow/
          echo "$SPORTSEDGE_NRFI_V6_SHA256  artifacts/nrfi-v6-shadow/sportsedge_nrfi_v6_shadow.joblib" | sha256sum -c -
      - name: Download exact live-attested Statcast state and transformer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/statcast-v5-game promotion
          gh run download 31656118369 -n statcast-v5-game-evidence-3b67fcfc30c2ba4c1da958858761711b57cd4780 -D promotion
          cp promotion/statcast-v5-game/* artifacts/statcast-v5-game/
          echo 'bf61487279ac9a506318e9dfa078a866450dd4e363b1d06356e58852954133b2  artifacts/statcast-v5-game/sportsedge_contact_transformer_v1.joblib' | sha256sum -c -
          test -s artifacts/statcast-v5-game/sportsedge_statcast_state_end_2025.joblib
          test -s artifacts/statcast-v5-game/base_state_manifest.json
      - name: Restore prior-only source caches
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/nrfi-v6-shadow
          key: nrfi-v6-shadow-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nrfi-v6-shadow-${{ runner.os }}-
      - name: Capture immutable pregame NRFI/YRFI V6 predictions
        run: python scripts/capture_nrfi_v6_shadow.py
      - name: Verify outcomeless NRFI ledger
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('artifacts/forward-shadow/nrfi_v6_manifest.json')
          if not p.exists(): raise SystemExit('NRFI_V6_SHADOW_MANIFEST_MISSING')
          d=json.loads(p.read_text()); assert d['outcomes_present'] is False; assert d['prediction_count'] > 0
          print('NRFI_V6_SHADOW_LEDGER_PASS', d['prediction_count'], d['ledger_file_sha256'])
          PY
      - name: Upload CI-bound NRFI forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrfi-v6-forward-shadow-${{ github.run_id }}
          path: |
            artifacts/forward-shadow/nrfi_v6_predictions.json
            artifacts/forward-shadow/nrfi_v6_manifest.json
            artifacts/forward-shadow/nrfi_v6_status.json
          if-no-files-found: warn
          retention-days: 90

  pitcher-bb-v6-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_BB_V6_OUT: artifacts/bb-v6-shadow
      SPORTSEDGE_BB_V6_SHA256: fa408d9a086f409e073ce811c93b1d47454a43d93cc08143038def793792a9cf
      SPORTSEDGE_BB_V6_STATE_SHA256: 4867110378bce127f316005a7583eb8d213b213dc98a1145d1d9e2f5d0a6215f
      SPORTSEDGE_BB_V4_SHA256: 67fc9d5c96ab469d888c7e137072d156043eb31fa3576fbe31d97e4436b9e7bc
    steps:
      - name: Checkout frozen V6 research code
        uses: actions/checkout@v4
        with:
          ref: props-v6-forward-shadow-20260813
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.2 scikit-learn==1.9.0 joblib==1.5.3
      - name: Download exact frozen BB V6 candidate and base state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/bb-v6-shadow bb_candidate
          name=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/31689194437/artifacts" --jq '.artifacts[] | select(.name | startswith("pitcher-bb-v6-shadow-")) | .name' | head -1)
          test -n "$name"
          gh run download 31689194437 -n "$name" -D bb_candidate
          cp bb_candidate/artifacts/bb-v6-shadow/* artifacts/bb-v6-shadow/
          echo "$SPORTSEDGE_BB_V6_SHA256  artifacts/bb-v6-shadow/sportsedge_pitcher_bb_v6_shadow.joblib" | sha256sum -c -
          echo "$SPORTSEDGE_BB_V6_STATE_SHA256  artifacts/bb-v6-shadow/bb_v6_base_state.joblib" | sha256sum -c -
      - name: Add frozen V4 comparator provenance to BB capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/capture_bb_v6_shadow.py')
          s=p.read_text()
          old='provenance={"state_cutoff":str(state["cutoff"]),"state_sha256":state_digest,"base_state_sha256":EXPECTED_BASE_STATE_SHA,"sportsbook_data_used":False}'
          new='provenance={"state_cutoff":str(state["cutoff"]),"state_sha256":state_digest,"base_state_sha256":EXPECTED_BASE_STATE_SHA,"sportsbook_data_used":False,"base_v4_over_1_5_p":float(p0[0]),"base_v4_artifact_sha256":str(artifact.get("base_artifact_sha256") or "")}'
          if old not in s:
              raise SystemExit('BB_V6_CAPTURE_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Capture immutable pregame Pitcher BB V6 predictions
        run: python scripts/capture_bb_v6_shadow.py
      - name: Verify outcomeless BB ledger and V4 comparator provenance
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('artifacts/forward-shadow/bb_v6_manifest.json')
          if not p.exists(): raise SystemExit('BB_V6_SHADOW_MANIFEST_MISSING')
          d=json.loads(p.read_text()); assert d['outcomes_present'] is False; assert d['prediction_count'] > 0
          rows=json.loads(Path('artifacts/forward-shadow/bb_v6_predictions.json').read_text())
          over=[r for r in rows if r.get('side')=='OVER']
          assert over and all((r.get('provenance') or {}).get('base_v4_artifact_sha256')==os.environ['SPORTSEDGE_BB_V4_SHA256'] for r in over)
          assert all(0 < float((r.get('provenance') or {})['base_v4_over_1_5_p']) < 1 for r in over)
          print('BB_V6_SHADOW_LEDGER_PASS', d['prediction_count'], d['ledger_file_sha256'], 'V4_COMPARATOR_PRESENT')
          PY
      - name: Upload CI-bound BB forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitcher-bb-v6-forward-shadow-${{ github.run_id }}
          path: |
            artifacts/forward-shadow/bb_v6_predictions.json
            artifacts/forward-shadow/bb_v6_manifest.json
            artifacts/forward-shadow/bb_v6_status.json
          if-no-files-found: warn
          retention-days: 90
