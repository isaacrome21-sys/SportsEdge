name: live-engine-ci

on:
  pull_request:
    paths:
      - 'sportsedge/live_*.py'
      - 'tests/test_live_*.py'
      - 'docs/LIVE_ENGINE_V1.md'
      - '.github/workflows/live-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 numpy==2.5.3
      - name: Run LIVE_ENGINE_V1 tests
        run: >-
          python -m pytest -q
          tests/test_live_engine.py
          tests/test_live_governance.py
          tests/test_live_dispatcher.py
          tests/test_live_runtime.py
