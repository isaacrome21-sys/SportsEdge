name: cfb-sdv-card

on:
  push:
    branches: [main]
    paths:
      - config/cfb_friday_2026_10_09_board.json
      - config/cfb_saturday_2026_10_10_board.json
      - .github/workflows/cfb-sdv-card.yml
  workflow_dispatch:
    inputs:
      board_json:
        description: "DK board JSON transcribed from screenshots (list of {game_id, quotes}). No sportsbook API."
        required: true
        type: string
      season:
        description: "CFB season, e.g. 2026"
        required: true
        type: string
      week:
        description: "CFB week number"
        required: true
        type: string
      asof:
        description: "Optional ISO timestamp; blank = now"
        required: false
        type: string
      reference_books_json:
        description: "Optional independently supplied timestamped 2+ bookmaker pairs for research-only price comparison"
        required: false
        type: string
  pull_request:
    paths:
      - tests/test_cfb_sdv_card_v2.py
      - .github/workflows/cfb-sdv-card.yml

permissions:
  contents: read
  issues: write  # permit trusted live-week CFBD cache issue comments

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test card invariants and independent market-consensus invariants
        run: python -m unittest tests.test_cfb_sdv_card_v2 tests.test_cfb_sdv_push_aware_ev tests.test_cfb_independent_consensus -v
      - name: Capture public SportsDataverse native CFB inputs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/fetch_cfb_sdv_live.py --output-dir "$RUNNER_TEMP/cfb-sdv-live"; then
            echo "CFB_SDV_PUBLIC_INPUTS_CAPTURED"
          else
            echo "CFB_SDV_PUBLIC_INPUTS_FAILED; canonical CFBD fallback remains enabled"
          fi
      - name: Refuse retired CFB model scoring
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          echo 'CFB_INCUMBENT_RETIRED_NO_OOS_WIN — PAPER / 0u' >> "$GITHUB_STEP_SUMMARY"
          echo 'The former SDV card is retired. Public input collection is research only; no probabilities, EV, probation staking, card, or forward count is issued.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload captured public source evidence
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-sdv-live-source-evidence
          path: ${{ runner.temp }}/cfb-sdv-live/
          if-no-files-found: warn
          retention-days: 7
