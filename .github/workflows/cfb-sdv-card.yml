name: cfb-sdv-card

on:
  push:
    branches: [main]
    paths:
      - config/cfb_friday_2026_10_09_board.json
      - .github/workflows/cfb-sdv-card.yml
  workflow_dispatch:
    inputs:
      board_json:
        description: "DK board JSON transcribed from screenshots (list of {game_id, quotes}). No sportsbook API."
        required: true
        type: string
      season:
        description: "CFB season, e.g. 2026"
        required: true
        type: string
      week:
        description: "CFB week number"
        required: true
        type: string
      asof:
        description: "Optional ISO timestamp; blank = now"
        required: false
        type: string
  pull_request:
    paths:
      - scripts/run_cfb_sdv_card_v2.py
      - tests/test_cfb_sdv_card_v2.py
      - .github/workflows/cfb-sdv-card.yml

permissions:
  contents: read
  issues: write  # permit trusted live-week CFBD cache issue comments

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test card invariants
        run: python -m unittest tests.test_cfb_sdv_card_v2 -v
      - name: Capture public SportsDataverse native CFB inputs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/fetch_cfb_sdv_live.py --output-dir "$RUNNER_TEMP/cfb-sdv-live"; then
            echo "CFB_SDV_PUBLIC_INPUTS_CAPTURED"
          else
            echo "CFB_SDV_PUBLIC_INPUTS_FAILED; canonical CFBD fallback remains enabled"
          fi
      - name: Price board
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GH_TOKEN: ${{ github.token }}  # gh api reads/writes CFBD issue cache
          BOARD_JSON: ${{ inputs.board_json }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_ASOF: ${{ inputs.asof }}
          CFB_SDV_MAX_RETRY_SLEEP_SECONDS: "45"
          CFB_SDV_PUBLIC_LIVE_DIR: ${{ runner.temp }}/cfb-sdv-live
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BOARD_JSON="$(cat config/cfb_friday_2026_10_09_board.json)"
            INPUT_SEASON=2026
            INPUT_WEEK=6
            INPUT_ASOF=""
          fi
          args=(--board-json "$BOARD_JSON" --season "$INPUT_SEASON" --week "$INPUT_WEEK")
          [ -z "$INPUT_ASOF" ] || args+=(--asof "$INPUT_ASOF")
          python scripts/run_cfb_sdv_card_v2.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload card
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-sdv-card
          path: artifacts/run_it/cfb_sdv_card.json
          if-no-files-found: warn
          retention-days: 14
