name: closing-line-archive

# CLOSING_LINE_ARCHIVE_V1 policy with V3 transport: model-free two-sided price
# archival for NFL, CFB and MLB. Rows remain NOT_EVIDENCE. V3 additionally
# preserves the exact canonical paid Odds API payload by SHA-256 so future
# sport-specific admission can verify row provenance instead of trusting a hash.
#
# If the paid provider is specifically blocked by HTTP 401, the same scheduler
# may persist zero-authority direct DraftKings observations. The paid-source
# failure remains a hard workflow failure after fallback persistence; fallback
# rows never satisfy the paid/multi-book source contract or promotion evidence.
#
# MLB remains guarded by StatsAPI status/first-play before a paid capture is
# admitted. Overlapping windows use explicit priority: close > t0_prestart >
# decision. No promotion or evidence-clock authority is granted here.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = free event index only; capture = spend credits when a window is open"
        type: choice
        options: [dry-run, capture]
        default: dry-run
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify archive contract before spending any credit
        run: |
          python -m unittest tests.test_closing_line_archive -v
          python -m unittest tests.test_closing_line_archive_v2 -v
          python -m unittest tests.test_closing_line_archive_v3 -v
          python -m unittest tests.test_direct_dk_game_market_source tests.test_capture_direct_dk_closing_lines -v

      - name: Attach the append-only data branch
        id: data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:data
            git worktree add .data-branch data
          else
            git worktree add --detach .data-branch
            (cd .data-branch && git checkout --orphan data && git rm -rf --quiet . || true)
          fi
          echo "attached=true" >> "$GITHUB_OUTPUT"

      - name: Capture paid multi-book archive
        id: capture
        shell: bash
        run: |
          set -uo pipefail
          MODE="${{ github.event.inputs.mode || 'capture' }}"
          EXTRA=""
          if [[ "$MODE" == "dry-run" ]]; then EXTRA="--dry-run"; fi
          mkdir -p artifacts/closing-line-archive
          set +e
          python -m scripts.capture_closing_line_archive_v3 \
            --policy config/closing_line_archive_policy_v1.json \
            --out-dir .data-branch \
            --status-out artifacts/closing-line-archive/status.json \
            $EXTRA
          RC=$?
          set -e
          ROWS="$(jq -r '.total_rows_written // 0' artifacts/closing-line-archive/status.json 2>/dev/null || echo 0)"
          REASON="$(jq -r '.reason // ""' artifacts/closing-line-archive/status.json 2>/dev/null || true)"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -ne 0 && "$REASON" != "CLOSING_LINE_ARCHIVE_HTTP_401" ]]; then
            echo "Paid archive failed outside the admitted 401 fallback boundary: $REASON" >&2
            exit "$RC"
          fi

      - name: Capture direct DraftKings fallback on paid-provider 401
        id: direct_dk
        if: steps.capture.outputs.rc != '0' && steps.capture.outputs.reason == 'CLOSING_LINE_ARCHIVE_HTTP_401'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/direct-dk-closing-line-archive
          python scripts/capture_direct_dk_closing_lines.py \
            --policy config/closing_line_archive_policy_v1.json \
            --out-dir .data-branch \
            --status-out artifacts/direct-dk-closing-line-archive/status.json
          echo "rows=$(jq -r '.total_rows_written // 0' artifacts/direct-dk-closing-line-archive/status.json)" >> "$GITHUB_OUTPUT"

      - name: Commit captured prices and raw payloads append-only
        if: always() && (steps.capture.outputs.rows != '0' || steps.direct_dk.outputs.rows != '0')
        shell: bash
        run: |
          set -euo pipefail
          cd .data-branch
          git config user.name  'sportsedge-archive[bot]'
          git config user.email 'sportsedge-archive@users.noreply.github.com'
          git add -A archive/closing-lines archive/direct-dk 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          PAID_ROWS="${{ steps.capture.outputs.rows || '0' }}"
          DK_ROWS="${{ steps.direct_dk.outputs.rows || '0' }}"
          git commit -m "closing-line-archive: paid=${PAID_ROWS} direct-dk=${DK_ROWS} at $(date -u +%Y-%m-%dT%H:%M:%SZ) [NOT_EVIDENCE]"
          for attempt in 1 2 3; do
            git fetch origin data || true
            git rebase origin/data || git rebase --abort || true
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo 'ARCHIVE_PUSH_FAILED' >&2
          exit 1

      - name: Keep paid-provider 401 fail-closed after fallback persistence
        if: steps.capture.outputs.rc != '0' && steps.capture.outputs.reason == 'CLOSING_LINE_ARCHIVE_HTTP_401'
        shell: bash
        run: |
          echo 'CLOSING_LINE_ARCHIVE_HTTP_401: direct DraftKings fallback may have persisted NOT_EVIDENCE rows, but paid/multi-book source remains blocked.' >&2
          exit 2

      - name: Upload run status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closing-line-archive-status-${{ github.run_id }}
          path: |
            artifacts/closing-line-archive/status.json
            artifacts/direct-dk-closing-line-archive/status.json
          if-no-files-found: warn
