name: cfb-market-anchored-spread-fit

on:
  pull_request:
    paths:
      - 'config/cfb_market_anchored_spread_challenger_v1.json'
      - 'sportsedge/sports/cfb/market_anchored_spread.py'
      - 'scripts/fit_cfb_market_anchored_spread.py'
      - 'tests/test_cfb_market_anchored_spread.py'
      - '.github/workflows/cfb-market-anchored-spread-fit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - run: python -m pytest -q tests/test_cfb_market_anchored_spread.py
      - name: Fit quota-free cached development anchor
        run: python scripts/fit_cfb_market_anchored_spread.py --output artifacts/cfb/market_anchored_spread_fit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-market-anchored-spread-fit-${{ github.sha }}
          path: artifacts/cfb/market_anchored_spread_fit.json
          if-no-files-found: error
          retention-days: 90
