name: mlb-provider-freeze-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/odds_api_frozen.py'
      - 'sportsedge/mlb_frozen_quotes.py'
      - 'scripts/capture_mlb_odds_api_freeze.py'
      - 'scripts/verify_mlb_odds_api_freeze.py'
      - 'tests/test_odds_api_frozen.py'
      - '.github/workflows/mlb-provider-freeze-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/odds_api_frozen.py'
      - 'sportsedge/mlb_frozen_quotes.py'
      - 'scripts/capture_mlb_odds_api_freeze.py'
      - 'scripts/verify_mlb_odds_api_freeze.py'
      - 'tests/test_odds_api_frozen.py'
      - '.github/workflows/mlb-provider-freeze-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile freeze and replay surface
        run: |
          python -m py_compile \
            sportsedge/odds_api_frozen.py \
            sportsedge/mlb_frozen_quotes.py \
            scripts/capture_mlb_odds_api_freeze.py \
            scripts/verify_mlb_odds_api_freeze.py

      - name: Prove raw-byte and no-network replay contract
        run: PYTHONPATH=. python -m unittest tests.test_odds_api_frozen -v

      - name: Reject accidental private-checkout paths in public source tree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(\.private/|_private/|private_fixtures/|paid_provider_raw/)'; then
            echo 'PAID_PROVIDER_PRIVATE_BYTES_PATH_TRACKED_IN_PUBLIC_REPO' >&2
            exit 1
          fi
