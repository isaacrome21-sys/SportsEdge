name: dfs-engine-contract

on:
  pull_request:
    paths:
      - 'sportsedge/dfs/**'
      - 'scripts/run_dk_dfs.py'
      - 'tests/test_dfs_engine.py'
      - 'docs/DK_DFS_ENGINE.md'
      - '.github/workflows/dfs-engine-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/dfs/**'
      - 'scripts/run_dk_dfs.py'
      - 'tests/test_dfs_engine.py'
      - 'docs/DK_DFS_ENGINE.md'
      - '.github/workflows/dfs-engine-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify unified DraftKings DFS contract
        run: python -m pytest -q tests/test_dfs_engine.py
