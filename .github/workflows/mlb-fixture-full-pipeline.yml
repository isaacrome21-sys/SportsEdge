name: mlb-fixture-full-pipeline

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'sportsedge/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/run_auto_mlb*.py'
      - 'scripts/*mlb*odds*freeze*.py'
      - '.github/workflows/mlb-fixture-full-pipeline.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-fixture-full-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-full-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile paid-provider freeze and replay surface
        run: |
          python -m py_compile \
            sportsedge/odds_api_frozen.py \
            sportsedge/mlb_frozen_quotes.py \
            scripts/capture_mlb_odds_api_freeze.py \
            scripts/verify_mlb_odds_api_freeze.py
      - name: Prove frozen MLB pipeline on current SHA
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "fixture_sha=${GITHUB_SHA}"
          python -m unittest \
            tests.test_devig \
            tests.test_mlb_fixture_pipeline \
            tests.test_auto_runner \
            tests.test_unified_card \
            tests.test_generic_market_engine \
            tests.test_truth_gate_contract \
            tests.test_game_distribution_readout \
            tests.test_shared_game_engine \
            tests.test_f5_distribution \
            tests.test_mlb_f5_features \
            tests.test_f5_stage1_routing \
            tests.test_first_hr_order_engine \
            tests.test_pitcher_record_win_game_state \
            tests.test_rebuilt_binary_journal_provenance \
            tests.test_rebuilt_binary_registry \
            tests.test_either_pitcher_settlement \
            tests.test_mlb_finish_line \
            tests.test_stage1_provenance_ledger \
            tests.test_stage1_auto_provenance \
            tests.test_prediction_journal \
            tests.test_team_total_odds_source \
            tests.test_mlb_settlement_evidence \
            tests.test_mlb_prediction_settlement \
            tests.test_mlb_catalog_prediction_settlement \
            tests.test_mlb_catalog_settlement_journal \
            tests.test_mlb_sportsbook_provenance \
            tests.test_game_odds_source_unittest \
            tests.test_mlb_acquisition_quote_attestation \
            tests.test_odds_api_frozen \
            -v
      - name: Assert no provider secrets are required
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SPORTSEDGE_ODDS_API_KEY:-}"
          test -z "${SPORTSEDGE_QUOTES_URL:-}"
          test -z "${SPORTSEDGE_FEATURES_URL:-}"
