name: cfb-reconstructed-selection-provider-preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/cfb_cfbd_reconstructed_selection_budget_v1.json'
      - 'scripts/preflight_cfb_reconstructed_selection.py'
      - 'tests/test_cfb_reconstructed_selection_preflight.py'
      - '.github/workflows/cfb-reconstructed-selection-provider-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: CFB reconstructed-selection provider preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Compile and test preflight contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/preflight_cfb_reconstructed_selection.py
          python -m unittest tests.test_cfb_reconstructed_selection_preflight

      - name: Verify provider account and replay budget without historical acquisition
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          private_file="${RUNNER_TEMP}/cfb_cfbd_private_preflight.json"
          trap 'rm -f "$private_file"' EXIT
          python scripts/preflight_cfb_reconstructed_selection.py \
            --private-out "$private_file" \
            --public-out artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
          test -f artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
          rm -f "$private_file"

      - name: Require verified acquisition readiness with zero authority and zero replay calls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json').read_text())

          if report.get('historical_replay_calls_performed') != 0:
              raise SystemExit('CFB_PREFLIGHT_PERFORMED_HISTORICAL_REPLAY_CALL')

          expected_authority = {
              'attempt_consumed': False,
              'evaluation_performed': False,
              'model_p': False,
              'truth_gate': False,
              'promotion': False,
              'eligibility': False,
              'staking': False,
              'official': False,
              'backfill': False,
          }
          if report.get('authority') != expected_authority:
              raise SystemExit('CFB_PREFLIGHT_AUTHORITY_LEAK_OR_SCHEMA_DRIFT')

          if report.get('status') != 'VERIFIED_BEFORE_FIRST_REPLAY_CALL':
              raise SystemExit(f"CFB_PREFLIGHT_NOT_READY:{report.get('status')}")
          if report.get('account_info_verified') is not True:
              raise SystemExit('CFB_PREFLIGHT_ACCOUNT_NOT_VERIFIED')
          if report.get('standard_tier_mapping_verified') is not True:
              raise SystemExit('CFB_PREFLIGHT_TIER_MAPPING_NOT_VERIFIED')
          if report.get('cfbd_weather_required_for_selection') is not False:
              raise SystemExit('CFB_PREFLIGHT_CFBD_WEATHER_REQUIREMENT_DRIFT')
          if report.get('weather_transport_ready') is not True:
              raise SystemExit('CFB_PREFLIGHT_WEATHER_TRANSPORT_NOT_READY')
          if report.get('call_plan_fits') is not True:
              raise SystemExit('CFB_PREFLIGHT_REPLAY_BUDGET_DOES_NOT_FIT')
          if report.get('blockers') != []:
              raise SystemExit(f"CFB_PREFLIGHT_BLOCKERS_PRESENT:{report.get('blockers')}")

          print(json.dumps({
              'status': report['status'],
              'account_info_verified': True,
              'standard_tier_mapping_verified': True,
              'cfbd_weather_entitled': report.get('cfbd_weather_entitled'),
              'cfbd_weather_required_for_selection': False,
              'weather_transport_ready': True,
              'call_plan_fits': True,
              'historical_replay_calls_performed': 0,
              'authority': expected_authority,
          }, sort_keys=True))
          PY

      - name: Upload redacted preflight attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-reconstructed-selection-provider-preflight-${{ github.sha }}
          path: artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
          if-no-files-found: warn
          retention-days: 30
