name: mlb-paired-window-plan-smoke

on:
  pull_request:
    paths:
      - 'scripts/archive_raw_game_odds_paired.py'
      - '.github/workflows/mlb-paired-window-plan-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Bare-environment paired-window self-test
        run: python -I scripts/archive_raw_game_odds_paired.py --self-test
      - name: Free StatsAPI-only capture readiness plan
        run: |
          set -euo pipefail
          python -I scripts/archive_raw_game_odds_paired.py --plan | tee mlb-paired-window-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('mlb-paired-window-plan.json').read_text())
          assert row['sportsbook_request_attempted'] is False
          assert row['budget_ledger_touched'] is False
          assert row['promotion_authority'] is False
          assert row['model_p'] is None
          assert row['status'] in {'CAPTURE_DUE', 'OUTSIDE_CAPTURE_WINDOW'}
          print(json.dumps({
              'status': row['status'],
              'capture_window': row.get('capture_window'),
              'capture_role': row.get('capture_role'),
              'games_eligible': row.get('games_eligible'),
              'paid_requests': 0,
          }, sort_keys=True))
          PY
      - name: Upload readiness plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-paired-window-plan-${{ github.run_id }}
          path: mlb-paired-window-plan.json
          if-no-files-found: error
          retention-days: 7
