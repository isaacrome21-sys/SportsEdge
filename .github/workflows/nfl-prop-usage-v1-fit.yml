name: nfl-prop-usage-v1-fit

on:
  workflow_dispatch:
  push:
    branches:
      - 'grok/nfl/prop-usage-v1-fit'

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install frozen fit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Compile prop V1 fit surface
        run: |
          python -m py_compile \
            sportsedge/research/nfl_prop_usage_v1_fit.py \
            scripts/fit_nfl_prop_usage_v1.py \
            tests/test_nfl_prop_usage_v1_fit.py

      - name: Run fit contracts before source access
        run: python -m pytest -q tests/test_nfl_prop_usage_v1_fit.py

      - name: Assert 2025 unreachable in fit runner
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          cfg = json.loads(Path("config/research/nfl_prop_usage_v1_fit_freeze.json").read_text())
          assert cfg["development"]["seasons"] == [2021, 2022, 2023, 2024]
          assert cfg["validation"]["season"] == 2025
          assert cfg["validation"]["status"] == "UNTOUCHED"
          text = Path("scripts/fit_nfl_prop_usage_v1.py").read_text()
          forbidden = [
              "player_stats_2025.csv",
              "validate_nfl_prop_usage_v1_2025",
              "props_rows.parquet",
              "roster_weekly_2025",
              "injuries_2025",
              "depth_charts_2025",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"PROP_V1_FIT_2025_TOKEN_FORBIDDEN:{token}")
          print("NFL_PROP_USAGE_V1_2025_UNREACHABLE_OK")
          PY

      - name: Fit V1 on exact 2021-2024 public sources
        run: >-
          python scripts/fit_nfl_prop_usage_v1.py
          --out artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit.json
          --summary-out artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit_summary.json

      - name: Enforce development-only research authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fit = json.loads(Path("artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit.json").read_text())
          summary = json.loads(Path("artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit_summary.json").read_text())
          if fit["status"] != "FITTED_RESEARCH_ONLY_NOT_2025_VALIDATED":
              raise SystemExit("PROP_V1_FIT_STATUS_INVALID")
          if fit["development_seasons"] != [2021, 2022, 2023, 2024]:
              raise SystemExit("PROP_V1_FIT_WINDOW_INVALID")
          if fit["validation_season_accessed"] is not False:
              raise SystemExit("PROP_V1_2025_ACCESSED")
          for key in ("creates_model_p", "truth_gate", "official", "promotion", "staking", "backfill"):
              if fit["authority"].get(key) is not False:
                  raise SystemExit(f"PROP_V1_FORBIDDEN_AUTHORITY:{key}")
          print(json.dumps({
              "artifact_sha256": fit["artifact_sha256"],
              "attempt9_artifact_sha256": fit["attempt9_artifact_sha256"],
              "markets": summary["markets"],
              "validation_season_accessed": False,
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-prop-usage-v1-fit-${{ github.sha }}
          path: |
            artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit.json
            artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_fit_summary.json
          if-no-files-found: error
          retention-days: 60
