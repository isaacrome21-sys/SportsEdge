name: mlb-postseason-outs-holdout-recalibration
on:
  pull_request:
    paths:
      - scripts/eval_mlb_postseason_outs_intercept.py
      - tests/test_mlb_postseason_outs_intercept.py
      - .github/workflows/mlb-postseason-outs-holdout-recalibration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-chronological-postseason:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reproducible runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test prospective chronology and heldout probability fitting
        run: PYTHONPATH=. python -m unittest tests.test_mlb_postseason_outs_intercept -v
      - name: Regenerate official postseason starter PIT evidence
        run: >-
          PYTHONPATH=. python scripts/audit_mlb_postseason_starter_workload.py
          --workers 8
          --output artifacts/mlb_postseason_starter_workload_2023_2025.json
      - name: Fit earlier years and score only later-year postseason outs
        run: >-
          PYTHONPATH=. python scripts/eval_mlb_postseason_outs_intercept.py
          --input artifacts/mlb_postseason_starter_workload_2023_2025.json
          --output artifacts/mlb_postseason_outs_intercept_holdout_2024_2025.json
      - name: Upload fail-closed historical comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-postseason-outs-temporal-holdout
          path: artifacts/mlb_postseason_*.json
          if-no-files-found: warn
          retention-days: 14
