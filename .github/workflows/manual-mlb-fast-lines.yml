name: manual-mlb-fast-lines

on:
  push:
    branches:
      - 'run/mlb-fast-*'
    paths:
      - 'manual_inputs/mlb/**'

permissions:
  contents: read

concurrency:
  group: manual-mlb-fast-lines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  price-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve MLB history-cache key
        id: history-cache-key
        shell: bash
        run: echo "run_date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day MLB history cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/mlb-history
          key: mlb-history-${{ runner.os }}-${{ steps.history-cache-key.outputs.run_date }}-${{ hashFiles('sportsedge/mlb_history_cache.py', 'sportsedge/mlb_all_market_features.py', 'sportsedge/mlb_generic_features.py', 'sportsedge/mlb_f5_features.py', 'sportsedge/mlb_starter_effect.py', 'sportsedge/pitcher_record_win_engine.py') }}-${{ github.run_id }}
          restore-keys: |
            mlb-history-${{ runner.os }}-${{ steps.history-cache-key.outputs.run_date }}-${{ hashFiles('sportsedge/mlb_history_cache.py', 'sportsedge/mlb_all_market_features.py', 'sportsedge/mlb_generic_features.py', 'sportsedge/mlb_f5_features.py', 'sportsedge/mlb_starter_effect.py', 'sportsedge/pitcher_record_win_engine.py') }}-

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Verify live pricing guards
        run: >-
          PYTHONPATH=. python -m unittest
          tests.test_manual_quote_contract
          tests.test_manual_mlb_live_guards
          tests.test_mlb_all_market_state_wiring
          tests.test_manual_mlb_all_market_source

      - name: Resolve exactly one supplied lines file
        id: resolve
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=America/Chicago date +%F)"
          BASE="$PUSH_BEFORE"
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$PUSH_AFTER" -- 'manual_inputs/mlb/*.json')"
          mapfile -t FILES < <(printf '%s\n' "$CHANGED" | sed '/^$/d')
          [[ ${#FILES[@]} -eq 1 ]] || {
            echo "FAST_MLB_REQUIRES_EXACTLY_ONE_CHANGED_INPUT: count=${#FILES[@]} files=${FILES[*]-}" >&2
            exit 1
          }
          INPUT="${FILES[0]}"
          [[ -f "$INPUT" ]] || { echo "FAST_MLB_INPUT_NOT_FOUND: $INPUT" >&2; exit 1; }
          FILE_DATE="$(basename "$INPUT" | cut -c1-10)"
          [[ "$FILE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "FAST_MLB_FILENAME_DATE_REQUIRED: $INPUT" >&2
            exit 1
          }
          [[ ! "$FILE_DATE" < "$RUN_DATE" ]] || {
            echo "FAST_MLB_PAST_SLATE_REFUSED: file_date=$FILE_DATE today=$RUN_DATE" >&2
            exit 1
          }
          echo "path=$INPUT" >> "$GITHUB_OUTPUT"
          echo "run_date=$FILE_DATE" >> "$GITHUB_OUTPUT"
          echo "FAST_MLB_INPUT=$INPUT"

      - name: Price supplied lines with SportsEdge
        run: |
          PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py \
            --input "${{ steps.resolve.outputs.path }}" \
            --history-cache-dir .cache/mlb-history \
            --run-date "${{ steps.resolve.outputs.run_date }}" \
            --max-age-minutes 60 \
            --output artifacts/manual_mlb_fast.json

      - name: Render fast plays-only card
        run: |
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_fast.json \
            --snapshot "${{ steps.resolve.outputs.path }}" \
            --pre-context \
            --out-dir artifacts/mlb_myspari_fast
          echo "FAST_MLB_CARD_BEGIN"
          cat artifacts/mlb_myspari_fast/card.md
          echo "FAST_MLB_CARD_END"
          cat artifacts/mlb_myspari_fast/card.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fast result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-mlb-fast-${{ github.sha }}
          path: |
            artifacts/manual_mlb_fast.json
            artifacts/mlb_myspari_fast/
          if-no-files-found: error
          retention-days: 14
