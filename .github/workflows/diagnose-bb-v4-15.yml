name: diagnose-bb-v4-15

on:
  push:
    branches: [full-slate-market-completion-20260811]
    paths:
      - scripts/diagnose_bb_v4_15.py
      - scripts/rebuild_pitcher_bb_v4.py
      - scripts/rebuild_pitcher_bb_v4_1.py
      - sportsedge/source_range.py
      - .github/workflows/diagnose-bb-v4-15.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib pytest
      - name: Verify chronology and source-bound tests first
        run: python -m pytest -q tests/test_historical_cutoff.py tests/test_bb_cutoff_chronology.py tests/test_source_range.py
      - name: Restore BB historical cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/bb-rebuild
          key: sportsedge-bb-rebuild-v4-${{ runner.os }}
          restore-keys: |
            sportsedge-bb-rebuild-v3-${{ runner.os }}
      - name: Diagnose isolated 1.5-walk miss
        run: python scripts/diagnose_bb_v4_15.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-v4-threshold-15-diagnostics
          path: artifacts/bb_v4_threshold_15_diagnostics.json
          if-no-files-found: error
          retention-days: 14
