name: MLB V7 travel history source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sportsedge/mlb_v7_travel_history.py"
      - "scripts/probe_mlb_v7_travel_history.py"
      - "tests/test_mlb_v7_travel_history.py"
      - ".github/workflows/mlb-v7-travel-history-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact code head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Run focused tests
        run: python -m pytest -q tests/test_mlb_v7_travel_history.py

      - name: Probe official historical MLB source
        run: |
          PYTHONPATH=. python scripts/probe_mlb_v7_travel_history.py \
            --date 2025-04-01 \
            --output artifacts/mlb-v7-travel-history/probe.json

      - name: Enforce diagnostic-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/mlb-v7-travel-history/probe.json").read_text())
          assert report["promotion_authority"] is False
          assert report["candidate_training_allowed"] is False
          assert report["attestation_written"] is False
          assert "FULL_2023_2025_COVERAGE_NOT_COLLECTED" in report["blockers"]
          assert "DECISION_TIME_BINDING_NOT_ATTESTED" in report["blockers"]
          assert report["state"] in {"PASS_SOURCE_PROBE", "BLOCKED_SOURCE_PROBE"}
          if report["state"] == "PASS_SOURCE_PROBE":
              assert report["historical_snapshot_status"] == "Final"
              assert report["team_row_count"] == 2
              assert report["timecode_count"] > 0
              assert report["final_at"]
              assert report["venue"]["latitude"] is not None
              assert report["venue"]["longitude"] is not None
              assert "/" in report["venue"]["timezone"]
          else:
              assert report.get("reason")
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-v7-travel-history-probe-${{ github.sha }}
          path: artifacts/mlb-v7-travel-history/probe.json
          if-no-files-found: error
          retention-days: 30
