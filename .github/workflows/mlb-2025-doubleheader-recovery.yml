name: mlb-2025-doubleheader-recovery

on:
  push:
    branches: ["chatgpt/mlb-2025-sbr-recovery"]
    paths: [".github/workflows/mlb-2025-doubleheader-recovery.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-doubleheaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Recover raw SBR rows and official statuses
        shell: bash
        env:
          UPSTREAM_SCRAPER_COMMIT: 48ad82bb4ae21fe7af622762aa8ed2e81d64c0b7
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          dates = ['2025-08-18', '2025-08-19', '2025-09-16', '2025-09-20']
          targets = {
              '2025-08-18': ('Milwaukee Brewers', 'Chicago Cubs'),
              '2025-08-19': ('Milwaukee Brewers', 'Chicago Cubs'),
              '2025-09-16': ('Atlanta Braves', 'Washington Nationals'),
              '2025-09-20': ('Cleveland Guardians', 'Minnesota Twins'),
          }
          next_data_re = re.compile(rb'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', re.DOTALL)
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          outdir = Path('mlb_2025_doubleheader_raw')
          outdir.mkdir(exist_ok=True)
          summary = {
              'schema_version': 1,
              'source': 'SportsBookReview raw __NEXT_DATA__ plus MLB StatsAPI schedule/status',
              'upstream_reference_commit': '48ad82bb4ae21fe7af622762aa8ed2e81d64c0b7',
              'confirmatory_test_executed': False,
              'promotion_claimed': False,
              'eligible_changed': False,
              'dates': {},
          }

          for date in dates:
              away_target, home_target = targets[date]

              # Independent official schedule/status, preserving gamePk duplicates/status.
              q = urllib.parse.urlencode({'sportId':1, 'date':date, 'hydrate':'status'})
              sched_url = 'https://statsapi.mlb.com/api/v1/schedule?' + q
              req = urllib.request.Request(sched_url, headers={'User-Agent': ua})
              with urllib.request.urlopen(req, timeout=30) as r:
                  sched_raw = r.read()
              (outdir / f'mlb_schedule_{date}.json').write_bytes(sched_raw)
              sched = json.loads(sched_raw)
              official = []
              for db in sched.get('dates', []):
                  for g in db.get('games', []):
                      away = g['teams']['away']['team']['name']
                      home = g['teams']['home']['team']['name']
                      if (away, home) == (away_target, home_target):
                          official.append({
                              'gamePk': g.get('gamePk'),
                              'gameDate': g.get('gameDate'),
                              'gameType': g.get('gameType'),
                              'status': g.get('status'),
                          })

              # Raw SBR moneyline page. Preserve exact __NEXT_DATA__ bytes.
              url = f'https://www.sportsbookreview.com/betting-odds/mlb-baseball/?date={date}'
              page = None
              last_error = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Language':'en-US,en;q=0.9'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          page = r.read()
                      if page:
                          break
                  except Exception as e:
                      last_error = repr(e)
                      time.sleep(1.5 * (attempt + 1))
              if not page:
                  raise SystemExit(f'SBR_FETCH_FAILED:{date}:{last_error}')
              m = next_data_re.search(page)
              if not m:
                  raise SystemExit(f'SBR_NEXT_DATA_MISSING:{date}')
              next_bytes = m.group(1)
              (outdir / f'sbr_next_data_{date}.json').write_bytes(next_bytes)
              payload = json.loads(next_bytes)
              tables = payload.get('props',{}).get('pageProps',{}).get('oddsTables',[])
              rows = tables[0].get('oddsTableModel',{}).get('gameRows',[]) if tables else []

              matching = []
              for row in rows:
                  gv = row.get('gameView') or {}
                  away = (gv.get('awayTeam') or {}).get('fullName')
                  home = (gv.get('homeTeam') or {}).get('fullName')
                  if (away, home) != (away_target, home_target):
                      continue
                  dk = []
                  for ov in row.get('oddsViews') or []:
                      if ov and str(ov.get('sportsbook','')).lower() == 'draftkings':
                          dk.append({
                              'openingLine': ov.get('openingLine'),
                              'currentLine': ov.get('currentLine'),
                          })
                  matching.append({
                      'startDate': gv.get('startDate'),
                      'awayTeamScore': gv.get('awayTeamScore'),
                      'homeTeamScore': gv.get('homeTeamScore'),
                      'gameStatusText': gv.get('gameStatusText'),
                      'venueName': gv.get('venueName'),
                      'draftkings': dk,
                  })

              summary['dates'][date] = {
                  'official_matching_rows': official,
                  'official_matching_count': len(official),
                  'sbr_matching_rows': matching,
                  'sbr_matching_count': len(matching),
                  'sbr_next_data_sha256': hashlib.sha256(next_bytes).hexdigest(),
                  'sbr_next_data_bytes': len(next_bytes),
                  'mlb_schedule_sha256': hashlib.sha256(sched_raw).hexdigest(),
              }

          Path('mlb_2025_doubleheader_recovery_summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))

          # This is an acquisition audit only. Fail if SBR has no row for a target date.
          for date, item in summary['dates'].items():
              if item['sbr_matching_count'] < 1:
                  raise SystemExit(f'SBR_TARGET_ROW_MISSING:{date}')
          PY

      - name: Upload doubleheader raw evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-2025-doubleheader-recovery
          path: |
            mlb_2025_doubleheader_raw/
            mlb_2025_doubleheader_recovery_summary.json
          if-no-files-found: error
          retention-days: 30
