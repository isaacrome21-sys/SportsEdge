name: mlb-moneyline-rolling-v3-freeze

on:
  workflow_dispatch:
  push:
    branches: [mlb-moneyline-governance-completion]
    paths:
      - '.github/workflows/mlb-moneyline-rolling-v3-freeze.yml'
      - 'scripts/freeze_mlb_moneyline_rolling_v3.py'
      - 'tests/test_freeze_mlb_moneyline_rolling_v3.py'
      - 'artifacts/mlb_moneyline_rolling_v2/**'
      - 'requirements-test.txt'

permissions:
  contents: write

concurrency:
  group: mlb-moneyline-rolling-v3-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mlb-moneyline-governance-completion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test temporal recalibration
        run: PYTHONPATH=. python -m pytest -q tests/test_freeze_mlb_moneyline_rolling_v3.py
      - name: Evaluate temporal validation and freeze candidate artifact
        run: PYTHONPATH=. python scripts/freeze_mlb_moneyline_rolling_v3.py
      - name: Persist v3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sportsedge-evidence-bot'
          git config user.email 'sportsedge-evidence-bot@users.noreply.github.com'
          git add artifacts/mlb_moneyline_rolling_v3
          if git diff --cached --quiet; then
            echo 'No v3 artifact changes.'
            exit 0
          fi
          git commit -m 'MLB: store rolling v3 frozen development artifact'
          git push origin HEAD:mlb-moneyline-governance-completion
