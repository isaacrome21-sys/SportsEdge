name: tmp-reconcile-pr791
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/reconcile-pr791-cfb-candidate-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch registry conservatively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/freeze_reconciliation_registry_v1.json')
          r = json.loads(p.read_text())
          deltas = r['deltas']
          ids = {d['delta_id'] for d in deltas}
          additions = [
            {
              'delta_id': 'PR_799_RECONCILIATION_CFB_REFREEZE',
              'pr': 799,
              'merge_sha': '6aa3edfa33e13e0b81d57586e1600ec5b5d17ccb',
              'note': 'Reconciliation-control-plane merge following PR_797; registered for complete first-parent provenance. Machine matrix determines bundle impact.'
            },
            {
              'delta_id': 'PR_791_CFB_CANDIDATE_SELECTION_SCOPE_ALIGNMENT',
              'pr': 791,
              'merge_sha': '9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170',
              'note': 'Changes the covered CFB candidate first-evaluation readiness workflow to implement the preregistered selection-scope amendment. CFB_CANDIDATE_PREREG_FREEZE_V1 is conservatively REFROZEN; no Model_P, Truth Gate, promotion, staking, eligibility, or OFFICIAL authority is granted.'
            }
          ]
          for d in additions:
              if d['delta_id'] not in ids:
                  deltas.append(d)
          r['reconciled_through_sha'] = '9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170'
          for b in r['bundles']:
              if b['bundle_id'] == 'CFB_CANDIDATE_PREREG_FREEZE_V1':
                  b['disposition'] = {
                    'state': 'REFROZEN',
                    'new_bundle_id': 'CFB_CANDIDATE_PREREG_FREEZE_V2',
                    'new_freeze_sha': '9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170',
                    'forward_clock_restart_at': '2026-09-17T00:24:26Z',
                    'reason': 'PR_791_CHANGED_COVERED_CANDIDATE_FIRST_EVALUATION_READINESS_WORKFLOW_TO_ALIGN_SELECTION_SCOPE_WITH_FROZEN_AMENDMENT; REFROZEN_CONSERVATIVELY_UNDER_RECONCILIATION_POLICY'
                  }
                  break
          else:
              raise SystemExit('CFB_CANDIDATE_PREREG_FREEZE_V1_NOT_FOUND')
          p.write_text(json.dumps(r, sort_keys=True, separators=(',', ':')) + '\n')
          PY
          rm .github/workflows/tmp-reconcile-pr791.yml
          python -m pytest -q tests/test_freeze_reconciliation.py tests/test_freeze_inventory.py tests/test_reconcile_freeze_deltas_cli.py
      - name: Commit final registry-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/tmp-reconcile-pr791.yml
          git diff --cached --check
          git commit -m 'Governance: reconcile PR799 and PR791 CFB candidate drift'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
