name: nfl-v2g-research-artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2g_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2g_artifact.py'
      - 'sportsedge/sports/nfl/source_manifest.py'
      - 'scripts/build_nfl_v2g_source_bound_artifact.py'
      - 'config/research/nfl_v2g_implementation_freeze_2026-09-12.json'
      - 'config/research/nfl_v2g_artifact_contract_2026-09-12.json'
      - 'tests/test_nfl_v2g*.py'
      - '.github/workflows/nfl-v2g-research-artifact.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/nfl/m2_v2g_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2g_artifact.py'
      - 'sportsedge/sports/nfl/source_manifest.py'
      - 'scripts/build_nfl_v2g_source_bound_artifact.py'
      - 'config/research/nfl_v2g_implementation_freeze_2026-09-12.json'
      - 'config/research/nfl_v2g_artifact_contract_2026-09-12.json'
      - 'tests/test_nfl_v2g*.py'
      - '.github/workflows/nfl-v2g-research-artifact.yml'

jobs:
  build-research-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install V2G test/runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest numpy

      - name: Compile V2G research surface
        run: |
          python -m py_compile \
            sportsedge/sports/nfl/m2_v2g_candidate.py \
            sportsedge/sports/nfl/m2_v2g_artifact.py \
            sportsedge/sports/nfl/source_manifest.py \
            scripts/build_nfl_v2g_source_bound_artifact.py

      - name: Run V2G contract tests
        run: python -m pytest -q tests/test_nfl_v2g_candidate.py tests/test_nfl_v2g_artifact.py tests/test_build_nfl_v2g_source_bound_artifact.py

      - name: Fetch immutable public research sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2g/sources/pbp
          fetch_source() {
            local url="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 "$url" -o "$output"
          }
          fetch_source \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            artifacts/football/v2g/sources/games.csv
          for season in $(seq 2016 2025); do
            fetch_source \
              "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" \
              "artifacts/football/v2g/sources/pbp/play_by_play_${season}.csv.gz"
          done

      - name: Build exact source manifest for V2G inputs
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          from sportsedge.sports.nfl.source_manifest import build_nfl_source_manifest, manifest_sha256

          root = Path('artifacts/football/v2g/sources')
          def digest(path):
              h = sha256()
              with Path(path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          schedule = root / 'games.csv'
          rows = [{
              'name': 'schedule',
              'uri': 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv',
              'sha256': digest(schedule),
          }]
          for season in range(2016, 2026):
              path = root / 'pbp' / f'play_by_play_{season}.csv.gz'
              rows.append({
                  'name': f'pbp_{season}',
                  'uri': f'https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{season}.csv.gz',
                  'sha256': digest(path),
              })
          manifest = build_nfl_source_manifest(rows, schedule_anchor_sha256=digest(schedule))
          manifest['manifest_sha256'] = manifest_sha256(manifest)
          out = Path('artifacts/football/v2g/nfl_v2g_source_manifest.json')
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(manifest['manifest_sha256'])
          PY

      - name: Build deterministic source-bound V2G research artifact
        run: >-
          python scripts/build_nfl_v2g_source_bound_artifact.py
          --schedule-file artifacts/football/v2g/sources/games.csv
          --pbp-dir artifacts/football/v2g/sources/pbp
          --source-manifest artifacts/football/v2g/nfl_v2g_source_manifest.json
          --start-season 2016 --end-season 2025
          --artifact-out artifacts/football/v2g/nfl_m2_v2g_research_artifact.json
          --report-out artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report.json

      - name: Enforce research-only authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report.json').read_text())
          required = {
              'status': 'RESEARCH_ARTIFACT_BUILT_DETERMINISTICALLY',
              'byte_determinism': 'PASS',
              'historical_data_role': 'REUSED_RESEARCH_HISTORY_NOT_FINAL_HOLDOUT',
              'promotion_authority': False,
              'production_model_changed': False,
              'market_eligibility_changed': False,
              'may_create_model_p': False,
              'official_status_granted': False,
          }
          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(f'NFL_V2G_RESEARCH_AUTHORITY_BOUNDARY_FAILED:{key}:{report.get(key)!r}')
          PY

      - name: Upload source-bound V2G research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2g-research-artifact-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/football/v2g/nfl_v2g_source_manifest.json
            artifacts/football/v2g/nfl_m2_v2g_research_artifact.json
            artifacts/football/v2g/nfl_m2_v2g_source_bound_build_report.json
          if-no-files-found: error
          retention-days: 30
