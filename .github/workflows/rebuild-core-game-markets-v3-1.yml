name: rebuild-core-game-markets-v3-1

on:
  push:
    branches: [full-slate-market-completion-20260811]
    paths:
      - sportsedge/source_range.py
      - scripts/rebuild_game_nrfi_models_v3_1.py
      - tests/test_source_range.py
      - .github/workflows/rebuild-core-game-markets-v3-1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-build dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib pytest
      - name: Verify chronology and source-bound tests
        run: python -m pytest -q tests/test_historical_cutoff.py tests/test_rebuild_cutoff_chronology.py tests/test_source_range.py
      - name: Restore historical schedule cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/game-rebuild-v3
          key: sportsedge-game-rebuild-v3-${{ runner.os }}
      - name: Rebuild source-bounded cutoff-correct holdout
        run: python scripts/rebuild_game_nrfi_models_v3_1.py
      - name: Upload source-bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-game-market-rebuild-v3-1-source-bounded
          path: |
            artifacts/core_game_markets_validation_v3.json
            artifacts/sportsedge_game_score_v4.joblib
            artifacts/sportsedge_nrfi_v4.joblib
          if-no-files-found: warn
          retention-days: 14
