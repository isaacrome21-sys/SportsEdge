name: probe-dk-nrfi
on:
  push:
    branches: [probe-dk-nrfi-20260812]
    paths: ['.github/workflows/probe-dk-nrfi.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe DraftKings Kambi MLB offering routes
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, urllib.request, urllib.error, pathlib, re
          roots=['https://eu-offering.kambicdn.org/offering/v2018/dkusaz','https://eu-offering-api.kambicdn.org/offering/v2018/dkusaz']
          paths=[
            '/listView/baseball.json?lang=en_US&market=US',
            '/listView/baseball/mlb.json?lang=en_US&market=US',
            '/listView/baseball/mlb/all/all/matches.json?lang=en_US&market=US',
            '/listView/baseball/usa/mlb/all/matches.json?lang=en_US&market=US',
            '/listView/baseball/usa/mlb.json?lang=en_US&market=US',
            '/listView/baseball/all/all/all/matches.json?lang=en_US&market=US',
          ]
          out=[]
          for root in roots:
            for p in paths:
              url=root+p; row={'url':url}
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Origin':'https://sportsbook.draftkings.com','Referer':'https://sportsbook.draftkings.com/'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read(); text=b.decode('utf-8','replace')
                  row.update(status=r.status,final_url=r.geturl(),content_type=r.headers.get('content-type'),bytes=len(b),prefix=text[:500])
                  if 'json' in (r.headers.get('content-type') or '').lower() or text[:1] in '[{':
                    try:
                      d=json.loads(text); row['json_ok']=True
                      raw=json.dumps(d,separators=(',',':'))
                      terms=['1st inning','first inning','no run','yes run','total runs','inning']
                      row['term_counts']={t:raw.lower().count(t) for t in terms}
                      row['top_keys']=list(d)[:30] if isinstance(d,dict) else None
                      # Collect offer-like strings mentioning inning from full JSON, capped.
                      hits=[]
                      def walk(x,path='root'):
                        if len(hits)>=80:return
                        if isinstance(x,dict):
                          joined=' '.join(str(v) for v in x.values() if isinstance(v,(str,int,float,bool)))
                          if 'inning' in joined.lower(): hits.append({'path':path,'value':joined[:1200]})
                          for k,v in x.items(): walk(v,f'{path}.{k}')
                        elif isinstance(x,list):
                          for i,v in enumerate(x): walk(v,f'{path}[{i}]')
                      walk(d); row['inning_nodes']=hits
                    except Exception as e: row['json_error']=str(e)
              except urllib.error.HTTPError as e:
                body=e.read(500).decode('utf-8','replace'); row.update(status=e.code,error='HTTPError',prefix=body)
              except Exception as e: row.update(error=type(e).__name__,message=str(e))
              out.append(row)
          pathlib.Path('artifacts/kambi_probe.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for r in out:
            print(r.get('status'),r['url'],'bytes',r.get('bytes'),'terms',r.get('term_counts'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dk-kambi-nrfi-probe
          path: artifacts/kambi_probe.json
          if-no-files-found: error
          retention-days: 3
