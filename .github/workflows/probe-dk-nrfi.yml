name: probe-dk-nrfi
on:
  push:
    branches: [probe-dk-nrfi-20260812]
    paths: ['.github/workflows/probe-dk-nrfi.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe DraftKings MLB first-inning sportsbook page
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://sportsbook.draftkings.com/leagues/baseball/mlb?category=1st-inning&subcategory=1st-inning-runs'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read()
                  print('status',r.status)
                  print('final_url',r.geturl())
                  print('bytes',len(body))
                  text=body.decode('utf-8','replace')
                  terms=['1st Inning','1st-inning','No Run','Yes','No','NRFI','YRFI','sportsbook','__NEXT_DATA__','application/ld+json']
                  for t in terms:
                      print('term',repr(t),text.lower().count(t.lower()))
                  scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)
                  print('script_count',len(scripts))
                  for i,s in enumerate(scripts):
                      low=s.lower()
                      if any(x in low for x in ['1st inning','first inning','no run','nrfi','yrfi']):
                          compact=re.sub(r'\s+',' ',s)
                          print('MATCH_SCRIPT',i,'len',len(s),compact[:1200])
                          break
          except Exception as e:
              print('ERROR',type(e).__name__,str(e))
              raise
          PY
