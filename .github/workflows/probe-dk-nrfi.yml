name: probe-dk-nrfi
on:
  push:
    branches: [probe-dk-nrfi-20260812]
    paths: ['.github/workflows/probe-dk-nrfi.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract DraftKings sportsbook endpoints
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,re,urllib.request,pathlib,urllib.parse
          url='https://sportsbook.draftkings.com/leagues/baseball/mlb?category=1st-inning&subcategory=1st-inning-runs'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
          out={'requested_url':url}
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read(); text=body.decode('utf-8','replace')
              out.update(status=r.status,final_url=r.geturl(),bytes=len(body))
              urls=sorted(set(re.findall(r'https?://[^\"\'<>\\ ]+',text)))
              out['candidate_urls']=[u for u in urls if any(k in u.lower() for k in ['draftkings','sportsbook','api','offer','eventgroup'])][:250]
              out['script_srcs']=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)[:100]
              marker='window.__INITIAL_STATE__ = '
              pos=text.find(marker)
              if pos>=0:
                  state,consumed=json.JSONDecoder().raw_decode(text[pos+len(marker):])
                  flat=[]
                  def walk(x,path='root'):
                      if isinstance(x,dict):
                          for k,v in x.items():
                              if isinstance(v,str) and any(t in (k+' '+v).lower() for t in ['api','offer','eventgroup','sportsbook','url']):
                                  if len(flat)<300: flat.append({'path':f'{path}.{k}','value':v[:500]})
                              walk(v,f'{path}.{k}')
                      elif isinstance(x,list):
                          for i,v in enumerate(x): walk(v,f'{path}[{i}]')
                  walk(state)
                  out['state_endpoint_like']=flat
          pathlib.Path('artifacts/dk_endpoint_probe.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print('status',out['status'],'final',out['final_url'],'candidate_urls',len(out['candidate_urls']),'state_endpoint_like',len(out.get('state_endpoint_like',[])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dk-endpoint-probe
          path: artifacts/dk_endpoint_probe.json
          if-no-files-found: error
          retention-days: 3
