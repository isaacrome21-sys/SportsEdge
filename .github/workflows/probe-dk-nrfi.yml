name: probe-dk-nrfi
on:
  push:
    branches: [probe-dk-nrfi-20260812]
    paths: ['.github/workflows/probe-dk-nrfi.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe DraftKings MLB first-inning sportsbook page
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,re,urllib.request,pathlib
          url='https://sportsbook.draftkings.com/leagues/baseball/mlb?category=1st-inning&subcategory=1st-inning-runs'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
          out={'requested_url':url}
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(); text=body.decode('utf-8','replace')
                  out.update(status=r.status,final_url=r.geturl(),bytes=len(body))
                  terms=['1st Inning','1st-inning','No Run','Yes','No','NRFI','YRFI','sportsbook','__NEXT_DATA__','application/ld+json']
                  out['term_counts']={t:text.lower().count(t.lower()) for t in terms}
                  scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)
                  out['script_count']=len(scripts)
                  matches=[]
                  for i,s in enumerate(scripts):
                      low=s.lower()
                      if any(x in low for x in ['1st inning','first inning','no run','nrfi','yrfi']):
                          compact=re.sub(r'\s+',' ',s)
                          matches.append({'index':i,'length':len(s),'preview':compact[:2000]})
                          if len(matches)>=3: break
                  out['matching_scripts']=matches
          except Exception as e:
              out['error']=f'{type(e).__name__}: {e}'
          pathlib.Path('artifacts/dk_nrfi_probe.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          if 'error' in out: raise SystemExit(out['error'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dk-nrfi-probe
          path: artifacts/dk_nrfi_probe.json
          if-no-files-found: error
          retention-days: 3
