name: pr899-reconcile-bootstrap

on:
  push:
    branches:
      - research/nfl-role-prop-challenger-20260921
    paths:
      - .github/workflows/pr899-reconcile-bootstrap.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/nfl-role-prop-challenger-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Pin protected main
        run: |
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          expected="ed628eaa978dd11a2097da91fa006067fb55e717"
          test "$actual" = "$expected" || { echo "MAIN_MOVED:$actual"; exit 1; }
      - name: Register post-boundary deltas and revoke drifted NFL prop freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/freeze_reconciliation_registry_v1.json')
          r = json.loads(p.read_text())
          additions = [
              {
                  'delta_id': 'PR_895_MATCHUP_ROLE_RESEARCH_AND_RECONCILIATION',
                  'merge_sha': '1e846593bb18929ad295d895ba7c8e4214b76766',
                  'pr': 895,
                  'note': 'Research NRFI/TD/scored-board merge plus reconciliation catch-up. Machine matrix determines bundle impact; zero betting authority.'
              },
              {
                  'delta_id': 'PR_896_NFL_RUN_IT_GAME_CARD',
                  'merge_sha': '49e3b866eea899f6f29f19911337c27aed443eb8',
                  'pr': 896,
                  'note': 'Research-only NFL sides/totals RUN IT card. No prop-surface or betting-authority grant; machine matrix determines bundle impact.'
              },
              {
                  'delta_id': 'PR_898_NFL_PROP_ROLE_CHALLENGER',
                  'merge_sha': 'ed628eaa978dd11a2097da91fa006067fb55e717',
                  'pr': 898,
                  'note': 'Research-only NFL prop challenger. A research test landed under the frozen tests/test_nfl_prop prefix, so covered bundle inventory changed and the prior NFL prop freeze is revoked fail-closed.'
              },
          ]
          seen = {str(x.get('merge_sha')) for x in r.get('deltas', [])}
          for row in additions:
              if row['merge_sha'] not in seen:
                  r['deltas'].append(row)
          bundle = next(b for b in r['bundles'] if b['bundle_id'] == 'NFL_PROP_MODEL_FREEZE_V1')
          bundle['disposition'] = {
              'state': 'REVOKED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'prior_forward_clock_invalidated': True,
              'reason': 'PR_898_ADDED_RESEARCH_TEST_UNDER_FROZEN_TESTS_TEST_NFL_PROP_PREFIX; COVERED_BUNDLE_INVENTORY_CHANGED; PRIOR_FREEZE_REVOKED_FAIL_CLOSED; NO_MODEL_P_TRUTH_GATE_PROMOTION_STAKING_OR_OFFICIAL_AUTHORITY'
          }
          r['reconciled_through_sha'] = 'ed628eaa978dd11a2097da91fa006067fb55e717'
          p.write_text(json.dumps(r, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Keep PR899 research test outside frozen production prefix
        run: |
          if [ -f tests/test_nfl_prop_challenger_contract.py ]; then
            git mv tests/test_nfl_prop_challenger_contract.py tests/test_research_nfl_prop_challenger_contract.py
          else
            test -f tests/test_research_nfl_prop_challenger_contract.py
          fi
      - name: Machine classify reconciliation
        run: |
          rm -f docs/research/pr899_reconciliation_diagnostic.txt docs/research/pr899_reconciliation_diagnostic.json
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py --repo . --current-main-ref origin/main --output /tmp/reconciliation.json > /tmp/reconciliation.log
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/reconciliation.json').read_text())
          registry=json.loads(Path('config/freeze_reconciliation_registry_v1.json').read_text())
          if int((report.get('outcome_counts') or {}).get('PROVISIONAL_DRIFT_BLOCKED', 0)) != 0:
              raise SystemExit('PROVISIONAL_RECONCILIATION_DRIFT_REMAINS')
          if any(bool(v) for v in (report.get('authority') or {}).values()):
              raise SystemExit('RECONCILIATION_AUTHORITY_ESCALATION')
          if 'DRIFT_DISPOSITION_REQUIRED:NFL_PROP_MODEL_FREEZE_V1' in (report.get('release_blocks') or []):
              raise SystemExit('NFL_PROP_DRIFT_NOT_TERMINALLY_DISPOSED')
          bundle=next(b for b in registry['bundles'] if b['bundle_id']=='NFL_PROP_MODEL_FREEZE_V1')
          disposition=bundle.get('disposition') or {}
          if disposition.get('state') != 'REVOKED' or disposition.get('prior_forward_clock_invalidated') is not True:
              raise SystemExit('NFL_PROP_REVOKED_DISPOSITION_INVALID')
          rows=[r for r in report.get('rows',[]) if r.get('bundle_id')=='NFL_PROP_MODEL_FREEZE_V1' and r.get('delta_id')=='PR_898_NFL_PROP_ROLE_CHALLENGER']
          if len(rows) != 1 or rows[0].get('outcome') != 'DRIFT_CONFIRMED':
              raise SystemExit('PR898_NFL_PROP_DRIFT_ROW_NOT_CONFIRMED')
          print('outcome_counts=', report.get('outcome_counts'))
          print('release_blocks=', report.get('release_blocks'))
          print('nfl_prop_disposition=REVOKED')
          PY
      - name: Focused contracts
        run: |
          python -m pytest -q \
            tests/test_freeze_reconciliation.py \
            tests/test_nfl_prop_role_challenger.py \
            tests/test_research_nfl_prop_challenger_contract.py
      - name: Persist durable repair and remove bootstrap
        run: |
          rm .github/workflows/pr899-reconcile-bootstrap.yml
          rm -f docs/research/pr899_reconciliation_diagnostic.txt docs/research/pr899_reconciliation_diagnostic.json
          git config user.name "sportsedge-reconciliation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile PR898 prop drift and isolate PR899 research tests"
          git push origin HEAD:research/nfl-role-prop-challenger-20260921
