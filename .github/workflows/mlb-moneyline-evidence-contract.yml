name: mlb-moneyline-evidence-contract
on:
  pull_request:
    paths:
      - 'sportsedge/mlb_moneyline_pit.py'
      - 'sportsedge/mlb_moneyline_evidence.py'
      - 'sportsedge/mlb_moneyline_clv.py'
      - 'tests/test_mlb_moneyline_pit.py'
      - 'tests/test_mlb_moneyline_evidence.py'
      - 'tests/test_mlb_moneyline_clv.py'
      - '.github/workflows/mlb-moneyline-evidence-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest==9.1.1'
      - name: Compile governed lane
        run: python -m py_compile sportsedge/mlb_moneyline_pit.py sportsedge/mlb_moneyline_evidence.py sportsedge/mlb_moneyline_clv.py
      - name: Run governed lane tests
        run: python -m pytest -q tests/test_mlb_moneyline_pit.py tests/test_mlb_moneyline_evidence.py tests/test_mlb_moneyline_clv.py
