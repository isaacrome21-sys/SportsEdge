name: mlb-sportsdataio-acceptance-dispatch-once

on:
  push:
    paths:
      - '.github/trigger-mlb-sportsdataio-acceptance-once'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch SportsDataIO Tier-B acceptance probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run archive-provider-acceptance-probe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f provider='sportsdataio' \
            -f target='all' \
            -f collect_network_sample='true'
