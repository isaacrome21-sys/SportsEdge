name: NBA official injury report archive (research)

on:
  schedule:
    - cron: '17 14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated PDF parser
        run: python -m pip install 'pdfplumber==0.11.7' pytest
      - name: Test fail-closed archive parser
        run: python -m pytest -q tests/test_nba_injury_archive_parser.py tests/test_free_sources_nba_injury_openmeteo.py
      - name: Select already-published Eastern slots (max 90-minute window)
        id: slot
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from os import environ
          now = datetime.now(ZoneInfo('America/New_York'))
          end = now.replace(minute=(now.minute//15)*15, second=0, microsecond=0)
          begin = max(end-timedelta(minutes=90), end.replace(hour=0, minute=0))
          with open(environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'day={end.date().isoformat()}\nstart={begin:%H:%M}\nend={end:%H:%M}\n')
          PY
      - name: Capture official published PDFs and immutable receipts
        run: |
          python scripts/archive_nba_injury_reports.py \
            --day '${{ steps.slot.outputs.day }}' \
            --start '${{ steps.slot.outputs.start }}' \
            --end '${{ steps.slot.outputs.end }}'
      - name: Parse only verifiable official player statuses
        run: |
          python scripts/parse_nba_injury_archive.py \
            --day '${{ steps.slot.outputs.day }}' \
            --archive-root artifacts/nba_injury_reports
      - name: Preserve receipts, PDFs and extracted rows for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nba-official-injury-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nba_injury_reports/
          retention-days: 90
          if-no-files-found: warn
