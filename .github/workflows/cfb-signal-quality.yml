name: cfb-signal-quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_cfb_signal_input.py'
      - 'scripts/cfb_signal_quality.py'
      - 'scripts/run_cfb_signal_quality.py'
      - 'config/cfb_signal_quality_policy_v1.json'
      - 'tests/test_cfb_signal_input.py'
      - 'tests/test_cfb_signal_quality.py'
      - '.github/workflows/cfb-signal-quality.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile signal-quality surface
        run: >-
          python -m py_compile
          scripts/build_cfb_signal_input.py
          scripts/cfb_signal_quality.py
          scripts/run_cfb_signal_quality.py
      - name: Run signal-quality tests
        run: >-
          python -m pytest -q
          tests/test_cfb_signal_input.py
          tests/test_cfb_signal_quality.py
