name: nfl-v2e-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2e_candidate.py'
      - 'sportsedge/sports/nfl/m2_v2e_drives.py'
      - 'sportsedge/sports/nfl/m2_v2e_validation.py'
      - 'scripts/run_nfl_v2e_candidate_validation.py'
      - 'scripts/validate_nfl_v2e_candidate.py'
      - 'tests/test_nfl_m2_v2e_candidate.py'
      - 'tests/test_nfl_m2_v2e_drives.py'
      - '.github/workflows/nfl-v2e-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Compile V2E diagnostic surface
        run: |
          python -m py_compile \
            sportsedge/sports/nfl/m2_v2e_candidate.py \
            sportsedge/sports/nfl/m2_v2e_drives.py \
            sportsedge/sports/nfl/m2_v2e_validation.py \
            scripts/run_nfl_v2e_candidate_validation.py \
            scripts/validate_nfl_v2e_candidate.py

      - name: Run V2E contract tests
        run: python -m pytest tests/test_nfl_m2_v2e_candidate.py tests/test_nfl_m2_v2e_drives.py -q

      - name: Freeze exact public NFL sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/sources/{pbp,participation,depth}
          fetch_source() {
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
              "$1" -o "$2"
          }
          fetch_source 'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' artifacts/football/sources/games.csv
          fetch_source 'https://raw.githubusercontent.com/greerreNFL/Stadiums/efa9543af50b01424754219fa0e4f3c7044ff198/data/team_stadiums.csv' artifacts/football/sources/team_stadiums.csv
          for season in $(seq 2016 2025); do
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.csv.gz" "artifacts/football/sources/pbp/play_by_play_${season}.csv.gz"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/pbp_participation/pbp_participation_${season}.csv" "artifacts/football/sources/participation/pbp_participation_${season}.csv"
            fetch_source "https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_${season}.csv" "artifacts/football/sources/depth/depth_charts_${season}.csv"
          done

      - name: Build exact source manifest from production runner
        env:
          TZ: UTC
        run: >-
          python scripts/run_nfl_production_validation.py
          --schedule-file artifacts/football/sources/games.csv
          --pbp-dir artifacts/football/sources/pbp
          --participation-dir artifacts/football/sources/participation
          --depth-dir artifacts/football/sources/depth
          --stadium-file artifacts/football/sources/team_stadiums.csv
          --git-sha "$EVIDENCE_GIT_SHA"
          --start-season 2016 --end-season 2025
          --neutral-site-policy exclude_from_evaluation
          --out artifacts/football/nfl_production_validation.json
          --manifest-out artifacts/football/nfl_source_manifest.json
          --model-out artifacts/football/nfl_m2_model.json

      - name: Build isolated V2E historical diagnostic
        run: >-
          python scripts/run_nfl_v2e_candidate_validation.py
          --schedule-file artifacts/football/sources/games.csv
          --pbp-dir artifacts/football/sources/pbp
          --participation-dir artifacts/football/sources/participation
          --depth-dir artifacts/football/sources/depth
          --stadium-file artifacts/football/sources/team_stadiums.csv
          --source-manifest artifacts/football/nfl_source_manifest.json
          --git-sha "$EVIDENCE_GIT_SHA"
          --start-season 2016 --end-season 2025
          --neutral-site-policy exclude_from_evaluation
          --out artifacts/football/nfl_m2_v2e_candidate_validation.json

      - name: Build frozen historical key target
        run: >-
          python scripts/audit_nfl_real_history.py
          --source-file artifacts/football/sources/games.csv
          --min-season 1999 --max-season 2025
          --output artifacts/football/nfl_real_history_audit.json

      - name: Compare V2E to frozen signed key tolerance
        run: >-
          python scripts/validate_nfl_v2e_candidate.py
          artifacts/football/nfl_real_history_audit.json
          artifacts/football/nfl_m2_v2e_candidate_validation.json
          --max-abs-error 0.005
          --out artifacts/football/nfl_m2_v2e_candidate_key_math.json

      - name: Assert diagnostic remains non-promoting
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sportsedge.sports.nfl.m2_v2e_candidate import NFL_M2_V2E_PIT_STATE_FIELDS
          evidence = json.loads(Path('artifacts/football/nfl_m2_v2e_candidate_validation.json').read_text())
          math = json.loads(Path('artifacts/football/nfl_m2_v2e_candidate_key_math.json').read_text())
          expected = os.environ['EVIDENCE_GIT_SHA'].lower()
          if evidence.get('code_git_sha') != expected:
              raise SystemExit('NFL_M2_V2E_GIT_SHA_BINDING_MISMATCH')
          if evidence.get('pit_state_conditions_drive_volume') is not True:
              raise SystemExit('NFL_M2_V2E_DRIVE_STATE_CONDITIONING_REQUIRED')
          if evidence.get('pit_state_conditions_scoring_event_mix') is not True:
              raise SystemExit('NFL_M2_V2E_SCORING_STATE_CONDITIONING_REQUIRED')
          expected_state_fields = sorted(NFL_M2_V2E_PIT_STATE_FIELDS)
          observed_state_fields = sorted(evidence.get('state_feature_names') or [])
          if observed_state_fields != expected_state_fields:
              raise SystemExit('NFL_M2_V2E_FROZEN_STATE_SCHEMA_MISMATCH')
          if len(observed_state_fields) != 11:
              raise SystemExit('NFL_M2_V2E_FROZEN_STATE_FIELD_COUNT_MISMATCH')
          if evidence.get('outer_history_status') != 'DEVELOPMENT_FALSIFICATION_ONLY_ALREADY_OBSERVED_FOLDS':
              raise SystemExit('NFL_M2_V2E_HISTORY_STATUS_INVALID')
          if evidence.get('prospective_confirmation_required_for_promotion') is not True:
              raise SystemExit('NFL_M2_V2E_FORWARD_CONFIRMATION_REQUIRED')
          for payload in (evidence, math):
              if payload.get('promotion_eligible') is not False:
                  raise SystemExit('NFL_M2_V2E_PROMOTION_MUST_REMAIN_FALSE')
              if payload.get('production_registry_consumes_this_artifact') is not False:
                  raise SystemExit('NFL_M2_V2E_PRODUCTION_REGISTRY_ISOLATION_FAILED')
          PY

      - name: Upload V2E diagnostic artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2e-diagnostic-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/football/nfl_m2_v2e_candidate_validation.json
            artifacts/football/nfl_m2_v2e_candidate_key_math.json
            artifacts/football/nfl_real_history_audit.json
            artifacts/football/nfl_source_manifest.json
          if-no-files-found: error
          retention-days: 30
