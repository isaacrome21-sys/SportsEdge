name: statcast-v5-game-promotion

on:
  push:
    branches: [statcast-required-v5-20260812]
    paths:
      - 'sportsedge/statcast_contract.py'
      - 'sportsedge/statcast_contact_transformer.py'
      - 'sportsedge/statcast_v5_data.py'
      - 'sportsedge/statcast_v5_live.py'
      - 'sportsedge/statcast_v5_live_source.py'
      - 'sportsedge/game_score_live.py'
      - 'sportsedge/espn_game_odds_source.py'
      - 'scripts/rebuild_statcast_v5_split.py'
      - 'scripts/rebuild_statcast_v5_split_v2.py'
      - 'scripts/build_statcast_v5_base_state.py'
      - 'scripts/attest_live_statcast_v5_game.py'
      - 'tests/test_statcast_contract.py'
      - 'tests/test_statcast_v5_data.py'
      - 'tests/test_statcast_v5_artifacts.py'
      - 'tests/test_statcast_v5_live.py'
      - 'audit/STATCAST_V5_PREDECLARED_PROTOCOL_2026-08-12.md'
      - 'audit/STATCAST_V5_HOLDOUT_RESULT_2026-08-12.md'
      - 'config/statcast_v5_deployments.json'
      - '.github/workflows/statcast-v5-game-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: statcast-v5-game-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_STATCAST_V5_CACHE: .cache/sportsedge/statcast-v5-split
      SPORTSEDGE_STATCAST_V5_OUT: artifacts/statcast-v5-game
      SPORTSEDGE_V5_LIVE_SIMS: '250000'
      SPORTSEDGE_EXPECTED_V5_GAME_SHA256: d467b1221898fdb84562ea2b72a06287bfae3e58603e3b15a28fba40c9cc668e
      SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256: bf61487279ac9a506318e9dfa078a866450dd4e363b1d06356e58852954133b2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V5 runtime
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib pytest
      - name: Run Statcast contract, state, artifact, and live-parity tests
        run: python -m pytest -q tests/test_statcast_contract.py tests/test_statcast_v5_data.py tests/test_statcast_v5_artifacts.py tests/test_statcast_v5_live.py
      - name: Compile state-only and live attestation paths
        run: python -m py_compile sportsedge/statcast_contract.py sportsedge/statcast_contact_transformer.py sportsedge/statcast_v5_data.py sportsedge/statcast_v5_live.py sportsedge/statcast_v5_live_source.py sportsedge/game_score_live.py sportsedge/espn_game_odds_source.py scripts/rebuild_statcast_v5_split.py scripts/rebuild_statcast_v5_split_v2.py scripts/build_statcast_v5_base_state.py scripts/attest_live_statcast_v5_game.py
      - name: Download exact strict holdout artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/statcast-v5-game
          gh run download 31627930135 \
            -n statcast-v5-strict-evidence-0571a3b0d0d063279840735f88230e9112bed07a \
            -D artifacts/statcast-v5-game
          echo "$SPORTSEDGE_EXPECTED_V5_GAME_SHA256  artifacts/statcast-v5-game/sportsedge_game_score_v5_statcast.joblib" | sha256sum -c -
          echo "$SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256  artifacts/statcast-v5-game/sportsedge_contact_transformer_v1.joblib" | sha256sum -c -
      - name: Verify untouched holdout record from frozen artifact
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads(Path('artifacts/statcast-v5-game/validation.json').read_text())
          assert v['game_artifact_sha256']==os.environ['SPORTSEDGE_EXPECTED_V5_GAME_SHA256']
          assert v['contact_transformer_sha256']==os.environ['SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256']
          for m in ('MONEYLINE','RUN_LINE','TOTALS'): assert v['passes'][m] is True, m
          assert v['passes']['NRFI'] is False and v['passes']['YRFI'] is False
          assert int(v['valid_2025_games'])>=1000
          print('STATCAST_V5_FROZEN_HOLDOUT_RECORD_PASS')
          PY
      - name: Restore official contact-state cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/statcast-v5-split
          key: statcast-v5-state-2021-2025-local-contact-v1
          restore-keys: |
            statcast-v5-split-2018-2025-v2-local-contact-filter
      - name: Build end-2025 rolling state only
        run: python scripts/build_statcast_v5_base_state.py
      - name: Restore prior-only 2026 live caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/sportsedge/statcast-v5-live
            .cache/sportsedge/mlb-history/game-v5
          key: statcast-v5-live-prior-2026-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            statcast-v5-live-prior-2026-${{ runner.os }}-
      - name: Attest current live Statcast parity, Model_P, 250k Monte Carlo, and DK join
        run: python scripts/attest_live_statcast_v5_game.py
      - name: Verify live attestation against frozen model
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=json.loads(Path('artifacts/live_statcast_v5_game_attestation.json').read_text())
          g=Path('artifacts/statcast-v5-game/sportsedge_game_score_v5_statcast.joblib')
          got=hashlib.sha256(g.read_bytes()).hexdigest()
          assert got==os.environ['SPORTSEDGE_EXPECTED_V5_GAME_SHA256']=='d467b1221898fdb84562ea2b72a06287bfae3e58603e3b15a28fba40c9cc668e'
          assert got==a['game_artifact_sha256']
          assert a['contact_transformer_sha256']==os.environ['SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256']
          assert a['model_p_sportsbook_independent'] is True
          assert a['price_source']=='ESPN_WEB_HEADER_DRAFTKINGS'
          assert int(a['n_sims'])==250000
          assert int(a['scored_pregame_games'])>=1
          print('STATCAST_V5_LIVE_RUNTIME_ATTESTATION_PASS')
          PY
      - name: Upload V5 GAME promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statcast-v5-game-evidence-${{ github.sha }}
          path: |
            artifacts/statcast-v5-game/
            artifacts/live_statcast_v5_game_attestation.json
          if-no-files-found: error
          retention-days: 30
