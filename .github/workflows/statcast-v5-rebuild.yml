name: statcast-v5-rebuild

on:
  push:
    branches: [statcast-required-v5-20260812]
    paths:
      - 'sportsedge/statcast_v5_pipeline.py'
      - 'scripts/rebuild_statcast_v5.py'
      - 'tests/test_statcast_v5_pipeline.py'
      - 'audit/STATCAST_V5_PREDECLARED_PROTOCOL_2026-08-12.md'
      - '.github/workflows/statcast-v5-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statcast-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_STATCAST_V5_CACHE: .cache/sportsedge/statcast-v5
      SPORTSEDGE_STATCAST_V5_OUT: artifacts/statcast-v5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install V5 runtime
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib pytest

      - name: Run deterministic Statcast V5 unit tests
        run: python -m pytest -q tests/test_statcast_contract.py tests/test_statcast_v5_pipeline.py

      - name: Compile V5 rebuild path
        run: python -m py_compile sportsedge/statcast_v5_pipeline.py scripts/rebuild_statcast_v5.py

      - name: Restore bounded Savant/StatsAPI cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/statcast-v5
          key: statcast-v5-raw-2021-2025-v1

      - name: Rebuild frozen contact transformer and V5 models
        run: python scripts/rebuild_statcast_v5.py

      - name: Verify emitted manifest hashes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          p=Path('artifacts/statcast-v5/manifest.json')
          if not p.exists():
              print('NO_V5_MANIFEST')
              sys.exit(0)
          m=json.loads(p.read_text())
          for row in m['files']:
              q=Path(row['path'])
              if not q.exists(): raise SystemExit('MANIFEST_FILE_MISSING:'+str(q))
              got=hashlib.sha256(q.read_bytes()).hexdigest()
              if got != row['sha256']: raise SystemExit('MANIFEST_SHA_MISMATCH:'+str(q))
              print('VERIFIED',q,row['bytes'],got)
          PY

      - name: Upload V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statcast-v5-evidence-${{ github.sha }}
          path: artifacts/statcast-v5/
          if-no-files-found: warn
          retention-days: 30
