name: cfb-forward-market-snapshot

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Snapshot label only; does not create a validated pair'
        required: true
        type: choice
        options:
          - decision
          - close
      event_id:
        description: 'Optional exact The Odds API provider event id; blank captures the CFB slate'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      SNAPSHOT_PHASE: ${{ inputs.phase }}
      EVENT_ID: ${{ inputs.event_id }}
      CAPTURE_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Capture exact raw DraftKings CFB bytes
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-forward-market
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          from sportsedge.sports.cfb.odds_source import fetch_cfb_odds

          keys = [os.environ.get('SPORTSEDGE_ODDS_API_KEY', ''), os.environ.get('SPORTSEDGE_ODDS_API_KEY_2', ''), os.environ.get('SPORTSEDGE_ODDS_API_KEY_3', ''), os.environ.get('SPORTSEDGE_ODDS_API_KEY_4', '')]
          event_id = os.environ.get('EVENT_ID', '').strip() or None
          phase = os.environ['SNAPSHOT_PHASE']
          snapshot = fetch_cfb_odds(keys, event_id=event_id)
          captured = datetime.now(timezone.utc).isoformat(timespec='microseconds').replace('+00:00', 'Z')
          root = Path('artifacts/cfb-forward-market')
          raw_path = root / 'snapshot.json'
          raw_path.write_bytes(snapshot.raw)
          meta = {
              'schema': 'SPORTSEDGE_CFB_FORWARD_MARKET_RAW_SNAPSHOT_V1',
              'sport': 'CFB',
              'provider': 'THE_ODDS_API',
              'book': 'DraftKings',
              'phase_label': phase,
              'provider_event_id': event_id,
              'captured_at_utc': captured,
              'raw_sha256': sha256(snapshot.raw).hexdigest(),
              'key_slot': snapshot.key_slot,
              'prior_key_failures': snapshot.prior_key_failures,
              'capture_git_sha': os.environ['CAPTURE_GIT_SHA'].lower(),
              'synthetic': False,
              'reconstructed': False,
              'backfilled': False,
              'inferred': False,
              'derived_from_result': False,
              'paired_market_evidence_present': False,
              'promotion_authority': False,
              'may_create_model_p': False,
              'eligibility_changed': False,
              'official_status_granted': False,
          }
          (root / 'snapshot.meta.json').write_text(json.dumps(meta, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'capture-id.txt').write_text(captured.replace(':', '').replace('-', '').replace('.', '_') + '-' + phase + '\n', encoding='utf-8')
          print(json.dumps({'status': 'RAW_SNAPSHOT_CAPTURED_NOT_PAIRED', 'phase': phase, 'event_scoped': event_id is not None, 'raw_sha256': meta['raw_sha256']}, sort_keys=True))
          PY
      - name: Persist immutable raw snapshot to data branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin data:data
          worktree_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true; rm -rf "$worktree_dir"' EXIT
          git worktree add "$worktree_dir" data
          capture_id="$(tr -d '\n' < artifacts/cfb-forward-market/capture-id.txt)"
          dest="$worktree_dir/evidence/cfb/forward-market/snapshots/$capture_id"
          test ! -e "$dest" || { echo "CFB_FORWARD_MARKET_SNAPSHOT_COLLISION:$capture_id" >&2; exit 1; }
          mkdir -p "$dest"
          cp artifacts/cfb-forward-market/snapshot.json "$dest/snapshot.json"
          cp artifacts/cfb-forward-market/snapshot.meta.json "$dest/snapshot.meta.json"
          cd "$worktree_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/cfb/forward-market/snapshots/$capture_id"
          git commit -m "data(cfb): persist forward market snapshot $capture_id"
          git push origin HEAD:data
      - name: Upload raw snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-forward-market-${{ inputs.phase }}-${{ github.run_id }}
          path: artifacts/cfb-forward-market/**
          if-no-files-found: error
          retention-days: 30
