name: evidence-receipt-contract

on:
  pull_request:
    paths:
      - "sportsedge/core/validation/evidence_receipt.py"
      - "sportsedge/sports/cfb/forward_evidence.py"
      - "scripts/build_evidence_receipt.py"
      - "scripts/build_mlb_v8_replay_receipt.py"
      - "tests/test_evidence_receipt.py"
      - "tests/test_cfb_forward_evidence_selection.py"
      - ".github/workflows/evidence-receipt-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run receipt and CFB selection regressions
        run: >-
          python -m pytest -q
          tests/test_evidence_receipt.py
          tests/test_cfb_forward_evidence_selection.py
