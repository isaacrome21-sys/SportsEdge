name: evidence-receipt-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/core/validation/evidence_receipt.py'
      - 'sportsedge/sports/cfb/forward_evidence.py'
      - 'scripts/audit_cfb_forward_evidence.py'
      - 'scripts/build_mlb_v8_replay_receipt.py'
      - 'scripts/build_nfl_2026_capture_receipt.py'
      - 'tests/test_evidence_receipt.py'
      - 'tests/test_cfb_forward_target_direction.py'
      - 'tests/test_mlb_v8_replay_receipt.py'
      - 'tests/test_nfl_2026_capture_receipt.py'
      - '.github/workflows/evidence-receipt-contract.yml'
      - '.github/workflows/mlb-v8-replay-backfill.yml'
      - '.github/workflows/nfl-2026-evidence-receipt.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile changed evidence tooling
        run: >-
          python3 -m py_compile
          sportsedge/core/validation/evidence_receipt.py
          sportsedge/sports/cfb/forward_evidence.py
          scripts/audit_cfb_forward_evidence.py
          scripts/build_mlb_v8_replay_receipt.py
          scripts/build_nfl_2026_capture_receipt.py
      - name: Run receipt and temporal-admission regressions
        run: >-
          python3 -m unittest -v
          tests.test_evidence_receipt
          tests.test_cfb_forward_target_direction
          tests.test_mlb_v8_replay_receipt
          tests.test_nfl_2026_capture_receipt
      - name: Re-run existing MLB replay archive self-test
        run: python3 scripts/build_mlb_v8_replay_archive.py --self-test
      - name: Assert live NFL capture controls were not changed by this PR
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          for path in scripts/nfl_2026_line_capture.py .github/workflows/nfl-2026-line-capture.yml config/nfl_2026_capture.json; do
            test "$(git rev-parse FETCH_HEAD:"$path")" = "$(git rev-parse HEAD:"$path")" || {
              echo "LIVE_NFL_CAPTURE_CONTROL_CHANGED:$path"
              exit 2
            }
          done
          echo NFL_LIVE_CAPTURE_CONTROLS_UNCHANGED
