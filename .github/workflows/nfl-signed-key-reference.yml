name: nfl-signed-key-reference

on:
  pull_request:
    paths:
      - 'scripts/build_nfl_signed_key_reference.py'
      - 'tests/test_nfl_signed_key_reference.py'
      - '.github/workflows/nfl-signed-key-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Run deterministic contract tests
        run: python -m unittest tests.test_nfl_signed_key_reference -v
      - name: Build exact pinned final-score reference
        run: python scripts/build_nfl_signed_key_reference.py --out artifacts/nfl/nfl_signed_key_reference_v1.json
      - name: Enforce zero authority and explicit conventions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/nfl/nfl_signed_key_reference_v1.json').read_text())
          if p['status']!='FROZEN_STRUCTURAL_REFERENCE': raise SystemExit('NFL_KEY_REFERENCE_STATUS_INVALID')
          if p['population']['sign_convention']!='HOME_SCORE_MINUS_AWAY_SCORE': raise SystemExit('NFL_KEY_REFERENCE_SIGN_INVALID')
          if p['population']['overtime_rule']!='FINAL_SCORE_INCLUDES_OVERTIME': raise SystemExit('NFL_KEY_REFERENCE_OT_INVALID')
          if p['population']['neutral_sites']!='INCLUDED_USING_SOURCE_DESIGNATED_HOME': raise SystemExit('NFL_KEY_REFERENCE_NEUTRAL_INVALID')
          if p['population']['season_min']!=2002 or p['population']['season_max']!=2025: raise SystemExit('NFL_KEY_REFERENCE_WINDOW_INVALID')
          if p['population']['game_type']!='REG': raise SystemExit('NFL_KEY_REFERENCE_GAME_TYPE_INVALID')
          if p['population']['n']<1000: raise SystemExit('NFL_KEY_REFERENCE_N_INVALID')
          for v in p['authority'].values():
              if v is not False: raise SystemExit('NFL_KEY_REFERENCE_AUTHORITY_FORBIDDEN')
          for key in ('-7','-3','3','7'):
              row=p['signed_keys'][key]
              if not (0<=row['probability']<=1 and len(row['wilson95'])==2): raise SystemExit('NFL_KEY_REFERENCE_KEY_INVALID:'+key)
          print(json.dumps(p,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-signed-key-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nfl/nfl_signed_key_reference_v1.json
          if-no-files-found: error
          retention-days: 30
