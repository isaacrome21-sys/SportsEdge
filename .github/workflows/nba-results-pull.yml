name: NBA Results Pull

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install nba_api pandas pyarrow
      - name: Run pull script
        run: python scripts/pull_nba_results.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-logs
          path: nba_player_logs.parquet
          if-no-files-found: warn
