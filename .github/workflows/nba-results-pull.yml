name: NBA Results Pull

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated NBA season(s); use one season for the first smoke test"
        required: true
        default: "2025-26"
        type: string

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free NBA data dependencies
        run: python -m pip install nba_api pandas pyarrow
      - name: Pull actual player points rebounds and assists
        env:
          NBA_SEASONS: ${{ inputs.seasons }}
        run: |
          mkdir -p artifacts/nba-results
          python scripts/pull_nba_results.py \
            --seasons "$NBA_SEASONS" \
            --out artifacts/nba-results
      - name: Upload NBA player game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-game-logs
          path: artifacts/nba-results/nba_player_games_*.csv
          if-no-files-found: warn
          retention-days: 14
