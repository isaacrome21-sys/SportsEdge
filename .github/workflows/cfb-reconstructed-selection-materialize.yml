name: cfb-reconstructed-selection-materialize

on:
  # A repository_dispatch hook lets connected automation clients start the safe
  # materialize-only lane even when they do not expose Actions workflow_dispatch.
  repository_dispatch:
    types: [cfb_reconstructed_materialize]
  workflow_dispatch:
    inputs:
      evaluation_mode:
        description: "Materialize only, or consume the frozen all-four CFB bakeoff"
        required: true
        default: "MATERIALIZE_ONLY"
        type: choice
        options:
          - MATERIALIZE_ONLY
          - CONSUME_ALL_FOUR_CFB_ATTEMPTS
  pull_request:
    paths:
      - 'config/cfb_cfbd_reconstructed_selection_budget_v1.json'
      - 'config/cfb_selected_candidate_final_fit_policy_v1.json'
      - 'scripts/preflight_cfb_reconstructed_selection.py'
      - 'scripts/acquire_cfb_reconstructed_selection.py'
      - 'scripts/materialize_cfb_reconstructed_selection.py'
      - 'scripts/build_cfb_selected_candidate_artifact.py'
      - 'sportsedge/sports/cfb/reconstructed_selection.py'
      - 'sportsedge/sports/cfb/candidate_bakeoff_v2.py'
      - 'sportsedge/sports/cfb/selected_candidate_model.py'
      - 'sportsedge/sports/cfb/selected_candidate_artifact.py'
      - 'scripts/run_cfb_candidate_bakeoff.py'
      - 'config/cfb_candidate_bakeoff_evaluator_v2.json'
      - 'tests/test_cfb_candidate_bakeoff_v2.py'
      - 'tests/test_cfb_reconstructed_selection_preflight.py'
      - 'tests/test_cfb_reconstructed_selection_acquisition.py'
      - 'tests/test_cfb_reconstructed_selection_materializer.py'
      - 'tests/test_cfb_selected_candidate_artifact_builder.py'
      - '.github/workflows/cfb-reconstructed-selection-materialize.yml'

permissions:
  contents: read

jobs:
  contract:
    name: CFB reconstructed-selection materialization contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install evaluator runtime dependency
        run: python -m pip install numpy

      - name: Compile acquisition, evaluation, and final-fit contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_cfb_reconstructed_selection.py \
            scripts/acquire_cfb_reconstructed_selection.py \
            scripts/materialize_cfb_reconstructed_selection.py \
            sportsedge/sports/cfb/reconstructed_selection.py \
            sportsedge/sports/cfb/candidate_bakeoff_v2.py \
            scripts/run_cfb_candidate_bakeoff.py \
            sportsedge/sports/cfb/selected_candidate_model.py \
            sportsedge/sports/cfb/selected_candidate_artifact.py \
            scripts/build_cfb_selected_candidate_artifact.py

      - name: Run reconstructed-selection contract tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cfb_reconstructed_selection_preflight \
            tests.test_cfb_reconstructed_selection_acquisition \
            tests.test_cfb_reconstructed_selection_materializer \
            tests.test_cfb_candidate_bakeoff_v2 \
            tests.test_cfb_selected_candidate_artifact_builder

      - name: Prove final-fit policy is frozen before first evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('config/cfb_selected_candidate_final_fit_policy_v1.json').read_text())
          assert policy['status']=='FROZEN_BEFORE_FIRST_EVALUATION'
          assert policy['ridge_alpha_rule']=='USE_SELECTED_FAMILY_ALPHA_FROM_LATEST_OUTER_FOLD'
          assert policy['post_result_retuning_allowed'] is False
          assert policy['alternate_alpha_selection_after_bakeoff_allowed'] is False
          assert policy['artifact_output_is_proposal_only'] is True
          assert policy['authority'] and not any(policy['authority'].values())
          print('CFB_SELECTED_FINAL_FIT_POLICY_FROZEN_ZERO_AUTHORITY')
          PY

  materialize:
    name: CFB reconstructed-selection guarded materialization
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install evaluator runtime dependency
        run: python -m pip install numpy

      - name: Verify provider before first historical call
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb
          python scripts/preflight_cfb_reconstructed_selection.py \
            --private-out "$RUNNER_TEMP/cfb_cfbd_private_preflight.json" \
            --public-out artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json

      - name: Record fail-closed blocked acquisition state
        if: steps.preflight.outputs.state != 'VERIFIED_BEFORE_FIRST_REPLAY_CALL'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          preflight = json.loads(Path('artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json').read_text())
          report = {
              'schema': 'CFB_RECONSTRUCTED_ACQUISITION_PUBLIC_V1',
              'status': 'BLOCKED_BEFORE_HISTORICAL_ACQUISITION',
              'preflight_status': preflight.get('status'),
              'blockers': preflight.get('blockers') or ['PROVIDER_PREFLIGHT_NOT_VERIFIED'],
              'historical_replay_calls_performed': 0,
              'attempt_consumed': False,
              'evaluation_performed': False,
              'historical_pit_created': False,
              'model_p_created': False,
              'truth_gate_authority': False,
              'promotion_authority': False,
              'staking_authority': False,
              'eligibility_changed': False,
              'official_authority': False,
              'backfill': False,
          }
          Path('artifacts/cfb/cfb_reconstructed_acquisition_public.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Acquire reconstructed inputs into runner-private cache
        if: steps.preflight.outputs.state == 'VERIFIED_BEFORE_FIRST_REPLAY_CALL'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_cfb_reconstructed_selection.py \
            --private-preflight "$RUNNER_TEMP/cfb_cfbd_private_preflight.json" \
            --private-cache-root "$RUNNER_TEMP/cfb_reconstructed_cache" \
            --private-payload-out "$RUNNER_TEMP/cfb_reconstructed_acquisition_payload.json" \
            --public-attestation-out artifacts/cfb/cfb_reconstructed_acquisition_public.json

      - name: Materialize hash-bound selection bundle without evaluation
        if: steps.preflight.outputs.state == 'VERIFIED_BEFORE_FIRST_REPLAY_CALL'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_cfb_reconstructed_selection.py \
            --private-input "$RUNNER_TEMP/cfb_reconstructed_acquisition_payload.json" \
            --bundle-out artifacts/cfb/selection_bundle_manifest.json \
            --source-manifest-out artifacts/cfb/reconstructed_source_manifest.json \
            --private-rows-out "$RUNNER_TEMP/cfb_reconstructed_selection_rows.json"

      - name: Run frozen all-four candidate bakeoff exactly once when explicitly confirmed
        if: github.event_name == 'workflow_dispatch' && steps.preflight.outputs.state == 'VERIFIED_BEFORE_FIRST_REPLAY_CALL' && inputs.evaluation_mode == 'CONSUME_ALL_FOUR_CFB_ATTEMPTS'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/cfb_reconstructed_selection_rows.json"
          test -f artifacts/cfb/selection_bundle_manifest.json
          python scripts/run_cfb_candidate_bakeoff.py \
            --private-rows "$RUNNER_TEMP/cfb_reconstructed_selection_rows.json" \
            --selection-bundle artifacts/cfb/selection_bundle_manifest.json \
            --out artifacts/cfb/candidate_bakeoff_result.json \
            --confirm CONSUME_ALL_FOUR_CFB_ATTEMPTS
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/cfb/candidate_bakeoff_result.json').read_text())
          if r.get('schema')!='CFB_CANDIDATE_BAKEOFF_RESULT_V2':
              raise SystemExit('CFB_BAKEOFF_RESULT_SCHEMA_INVALID')
          if r.get('status') not in {'WINNER_SELECTED_FOR_FREEZE','NO_CANDIDATE_DEMONSTRATED_SIGNAL_AT_THIS_SAMPLE'}:
              raise SystemExit('CFB_BAKEOFF_RESULT_STATUS_INVALID')
          if any((r.get('authority') or {}).values()):
              raise SystemExit('CFB_BAKEOFF_AUTHORITY_LEAK')
          print('CFB_BAKEOFF_RESULT_FROZEN_IN_RUN_ARTIFACT sha256='+str(r.get('result_sha256')))
          PY

      - name: Build selected-candidate model proposal under preregistered final-fit rule
        if: github.event_name == 'workflow_dispatch' && steps.preflight.outputs.state == 'VERIFIED_BEFORE_FIRST_REPLAY_CALL' && inputs.evaluation_mode == 'CONSUME_ALL_FOUR_CFB_ATTEMPTS'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          print(json.load(open('artifacts/cfb/candidate_bakeoff_result.json'))['status'])
          PY
          )"
          if [[ "$status" == "NO_CANDIDATE_DEMONSTRATED_SIGNAL_AT_THIS_SAMPLE" ]]; then
            echo 'CFB_SELECTED_MODEL_NOT_BUILT reason=NO_CANDIDATE_DEMONSTRATED_SIGNAL_AT_THIS_SAMPLE'
            exit 0
          fi
          test "$status" = "WINNER_SELECTED_FOR_FREEZE"
          python scripts/build_cfb_selected_candidate_artifact.py \
            --private-rows "$RUNNER_TEMP/cfb_reconstructed_selection_rows.json" \
            --selection-bundle artifacts/cfb/selection_bundle_manifest.json \
            --bakeoff-result artifacts/cfb/candidate_bakeoff_result.json \
            --out artifacts/cfb/cfb_selected_candidate_model_proposal.json \
            --attestation-out artifacts/cfb/cfb_selected_candidate_model_build_attestation.json

      - name: Assert public outputs contain zero authority and no raw provider rows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json'),
              Path('artifacts/cfb/cfb_reconstructed_acquisition_public.json'),
              Path('artifacts/cfb/selection_bundle_manifest.json'),
              Path('artifacts/cfb/candidate_bakeoff_result.json'),
              Path('artifacts/cfb/cfb_selected_candidate_model_proposal.json'),
              Path('artifacts/cfb/cfb_selected_candidate_model_build_attestation.json'),
          ]
          for path in paths:
              if not path.is_file():
                  continue
              payload = json.loads(path.read_text())
              for key in (
                  'attempt_consumed', 'evaluation_performed', 'historical_pit_created',
                  'model_p_created', 'truth_gate_authority', 'promotion_authority',
                  'staking_authority', 'eligibility_changed', 'official_authority', 'backfill',
              ):
                  if key in payload and payload[key] is not False:
                      raise SystemExit(f'CFB_RECONSTRUCTED_AUTHORITY_LEAK:{path}:{key}')
              authority = payload.get('authority')
              if isinstance(authority, dict) and any(value is not False for value in authority.values()):
                  raise SystemExit(f'CFB_RECONSTRUCTED_AUTHORITY_MAP_LEAK:{path}')
          if Path('artifacts/cfb/cfb_reconstructed_selection_rows.json').exists():
              raise SystemExit('CFB_RECONSTRUCTED_RAW_ROWS_PUBLIC_PATH_FORBIDDEN')
          print(json.dumps({'status': 'ZERO_AUTHORITY_PUBLIC_OUTPUTS_OK'}, sort_keys=True))
          PY

      - name: Upload public reconstructed-selection attestations and model proposal only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-reconstructed-selection-materialization-${{ github.sha }}
          path: |
            artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
            artifacts/cfb/cfb_reconstructed_acquisition_public.json
            artifacts/cfb/selection_bundle_manifest.json
            artifacts/cfb/reconstructed_source_manifest.json
            artifacts/cfb/candidate_bakeoff_result.json
            artifacts/cfb/cfb_selected_candidate_model_proposal.json
            artifacts/cfb/cfb_selected_candidate_model_build_attestation.json
          if-no-files-found: warn
          retention-days: 30
