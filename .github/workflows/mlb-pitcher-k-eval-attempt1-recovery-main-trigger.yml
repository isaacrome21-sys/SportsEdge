name: mlb-pitcher-k-eval-attempt1-recovery-main-trigger

on:
  push:
    branches:
      - main
    paths:
      - 'config/research/mlb_pitcher_k_eval_attempt1_recovery_v1.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-pitcher-k-eval-attempt-1-recovery-v1
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate frozen Attempt-1 recovery marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("config/research/mlb_pitcher_k_eval_attempt1_recovery_v1.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["schema"] == "SPORTSEDGE_MLB_PITCHER_K_EVAL_ATTEMPT1_RECOVERY_V1"
          assert x["status"] == "ARMED_SINGLE_RECOVERY_MAIN_PUSH"
          assert x["candidate_family"] == "RIDGE_LOGIT_K_RATE_BETA_BINOMIAL_V1"
          assert x["attempt_number"] == 1
          assert x["recovery_number"] == 1
          assert x["confirmation"] == "RECOVER_MLB_PITCHER_K_EVAL_ATTEMPT_1_AFTER_PRE_EVALUATION_DUPLICATE_FAILURE"

          prior = x["prior_run"]
          assert prior["workflow_run_id"] == 37510907585
          assert prior["code_head_sha"] == "da832d1284dbc791bbe3d169ed93b4fda1d03f54"
          assert prior["conclusion"] == "failure"
          assert prior["failure_stage"] == "PRE_EVALUATION_ROW_VALIDATION"
          assert prior["failure_reason"] == "DUPLICATE_SEASON_GAME_PITCHER_ROW"
          assert prior["candidate_scored"] is False
          assert prior["evaluation_runner_entered"] is True
          assert prior["candidate_probability_evaluator_called"] is False
          assert prior["materialized_rows"] == 7269
          assert prior["eligible_rows_by_season"] == {"2023": 2321, "2024": 2426, "2025": 2522}
          assert prior["duplicate_identities"] == 37
          assert prior["extra_duplicate_rows"] == 38
          assert prior["uploaded_artifact_id"] == 11434899435
          assert prior["uploaded_artifact_zip_sha256"] == "f4abbd39949717b0c9f5d4c224e4a389edce0d80284110d708591ff99de2ac2d"

          repair = x["repair_contract"]
          assert repair["duplicate_identity_normalization_only"] is True
          assert repair["conflicting_duplicates_fail_closed"] is True
          assert repair["ordered_prior_start_identity_alignment_required"] is True
          for key in (
              "model_formula_changed", "hyperparameter_grid_changed",
              "season_split_changed", "evaluation_thresholds_changed",
              "sportsbook_inputs_changed",
          ):
              assert repair[key] is False
          assert repair["no_post_readout_tuning"] is True

          rules = x["rules"]
          assert rules["trigger_only_when_this_marker_lands_on_main"] is True
          assert rules["attempt_1_recovery_only"] is True
          assert rules["candidate_specific_historical_test"] is True
          assert rules["historical_backfill_is_not_forward_evidence"] is True
          assert rules["require_no_existing_attempt1_data_receipt"] is True
          assert rules["forward_evidence"] is False
          assert rules["model_p"] is False
          assert rules["promotion"] is False
          assert rules["staking"] is False
          assert rules["official"] is False
          assert rules["no_sportsbook_price_as_model_feature"] is True
          assert not any(v for k, v in x["authority"].items() if k != "research_only")
          print("mlb_pitcher_k_attempt1_recovery_marker=PASS")
          PY

      - name: Verify prior Attempt-1 run failed before candidate scoring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37510907585")"
          PRIOR_JSON="$prior_json" python - <<'PY'
          import json, os
          x = json.loads(os.environ["PRIOR_JSON"])
          assert x["head_sha"] == "da832d1284dbc791bbe3d169ed93b4fda1d03f54"
          assert x["status"] == "completed"
          assert x["conclusion"] == "failure"
          PY
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37510907585/jobs?per_page=100")"
          JOBS_JSON="$jobs_json" python - <<'PY'
          import json, os
          x = json.loads(os.environ["JOBS_JSON"])
          steps = {
              s["name"]: s.get("conclusion")
              for job in x.get("jobs", [])
              for s in job.get("steps", [])
          }
          assert steps.get("Materialize frozen 2023-2025 historical rows") == "success"
          assert steps.get("Evaluate frozen candidate exactly once") == "failure"
          assert steps.get("Persist completed evaluation to data branch") == "skipped"
          assert steps.get("Commit immutable Attempt-1 readout") == "skipped"
          print("prior_attempt1_pre_evaluation_failure=PASS")
          PY

      - name: Verify integrity repair tests before recovery
        run: |
          python -m pytest -q             tests/test_mlb_pitcher_k_historical_materializer.py             tests/test_mlb_pitcher_k_evaluation_runner.py

      - name: Prove Attempt-1 readout does not already exist
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: data
          path: data-branch
          persist-credentials: true

      - name: Fail closed on an existing Attempt-1 evidence directory
        run: |
          set -euo pipefail
          if git -C data-branch ls-tree -r --name-only HEAD evidence/mlb_pitcher_k/attempt_1 | grep -q .; then
            echo "ATTEMPT_1_EVIDENCE_ALREADY_EXISTS"
            exit 3
          fi

      - name: Restore immutable historical StatsAPI cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/mlb-pitcher-k-history
          key: mlb-pitcher-k-attempt1-recovery-v1-${{ runner.os }}
          restore-keys: |
            mlb-pitcher-k-full-season-history-v1-${{ runner.os }}-
            mlb-pitcher-k-historical-eval-v1-${{ runner.os }}-

      - name: Materialize repaired frozen 2023-2025 historical rows
        run: |
          mkdir -p artifacts/mlb/pitcher_k/attempt_1_recovery
          PYTHONPATH=. python scripts/materialize_mlb_pitcher_k_evaluation_rows.py             --output artifacts/mlb/pitcher_k/attempt_1_recovery/rows.json             --cache-dir .cache/mlb-pitcher-k-history             --statcast-chunk-days 45

      - name: Verify recovered row artifact is unique and zero-authority
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          p = Path("artifacts/mlb/pitcher_k/attempt_1_recovery/rows.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["schema"] == "MLB_PITCHER_K_HISTORICAL_EVALUATION_ROWS_V1"
          assert x["seasons"] == [2023, 2024, 2025]
          assert x["historical_reconstruction"] is True
          assert x["backfill"] is True
          assert x["forward_evidence_eligible"] is False
          assert x["promotion_authority"] is False
          assert x["evaluation_consumed"] is False
          assert not any(x["authority"].values())
          rows = x["rows"]
          assert x["row_count"] == len(rows)
          identities = [
              (int(r["season"]), int(r["game_id"]), str(r["pitcher_id"]))
              for r in rows
          ]
          assert len(identities) == len(set(identities))
          counts = Counter(int(r["season"]) for r in rows)
          assert set(counts) == {2023, 2024, 2025}
          assert counts[2025] >= 500
          print(json.dumps({
              "recovery_row_count": len(rows),
              "rows_by_season": dict(sorted(counts.items())),
              "duplicate_rows_collapsed": int(x.get("duplicate_rows_collapsed") or 0),
              "materialization_sha256": x["materialization_sha256"],
          }, sort_keys=True))
          PY

      - name: Evaluate frozen candidate for Attempt-1 recovery
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.mlb_pitcher_k_evaluation_runner import run_file

          root = Path("artifacts/mlb/pitcher_k/attempt_1_recovery")
          out = run_file(root / "rows.json", root / "evaluation.json")
          summary = {
              "attempt_number": 1,
              "recovery_number": 1,
              "prior_failed_run_id": 37510907585,
              "row_count": out["row_count"],
              "rows_sha256": out["rows_sha256"],
              "artifact_sha256": out["artifact_sha256"],
              "passes_development_gate": out["evaluation"]["passes_development_gate"],
              "blockers": out["evaluation"]["blockers"],
              "split": out["evaluation"]["split"],
              "selection": out["evaluation"]["selection"],
              "metrics": out["evaluation"]["metrics"],
              "authority": out["authority"],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload immutable Attempt-1 recovery artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-pitcher-k-eval-attempt-1-recovery-${{ github.sha }}
          path: artifacts/mlb/pitcher_k/attempt_1_recovery/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist recovered Attempt-1 readout exactly once
        if: success()
        env:
          CODE_HEAD_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEST="data-branch/evidence/mlb_pitcher_k/attempt_1"
          if git -C data-branch ls-tree -r --name-only HEAD evidence/mlb_pitcher_k/attempt_1 | grep -q .; then
            echo "ATTEMPT_1_EVIDENCE_ALREADY_EXISTS"
            exit 3
          fi
          mkdir -p "$DEST"
          cp artifacts/mlb/pitcher_k/attempt_1_recovery/rows.json "$DEST/rows.json"
          cp artifacts/mlb/pitcher_k/attempt_1_recovery/evaluation.json "$DEST/evaluation.json"
          cp artifacts/mlb/pitcher_k/attempt_1_recovery/summary.json "$DEST/summary.json"
          CODE_HEAD_SHA="$CODE_HEAD_SHA" WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" DEST="$DEST" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["DEST"])
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          receipt = {
              "schema": "SPORTSEDGE_MLB_PITCHER_K_EVAL_ATTEMPT1_RECOVERY_RECEIPT_V1",
              "attempt_number": 1,
              "recovery_number": 1,
              "prior_failed_workflow_run_id": 37510907585,
              "prior_failure_stage": "PRE_EVALUATION_ROW_VALIDATION",
              "prior_candidate_scored": False,
              "code_head_sha": os.environ["CODE_HEAD_SHA"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "rows_sha256": hashlib.sha256((root / "rows.json").read_bytes()).hexdigest(),
              "evaluation_sha256": hashlib.sha256((root / "evaluation.json").read_bytes()).hexdigest(),
              "summary_sha256": hashlib.sha256((root / "summary.json").read_bytes()).hexdigest(),
              "passes_development_gate": bool(summary["passes_development_gate"]),
              "historical_reconstruction": True,
              "forward_evidence_eligible": False,
              "promotion_authority": False,
              "model_p_authority": False,
              "official_authority": False,
          }
          (root / "receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          cd data-branch
          git config user.name "sportsedge-data-bot"
          git config user.email "sportsedge-data-bot@users.noreply.github.com"
          git add evidence/mlb_pitcher_k/attempt_1
          git commit -m "evidence: persist recovered MLB pitcher-K evaluation Attempt 1"
          git push origin HEAD:data
