name: cfb today all-market research card

on:
  workflow_dispatch:
    inputs:
      usage_json:
        description: Optional CFB_PROP_USAGE_INPUT_V1 JSON. Required for player-prop LEANs.
        required: false
        type: string
      game_board_json:
        description: Optional manual cross-book game board JSON. Blank uses configured Odds API.
        required: false
        type: string
      game_model_artifact_json:
        description: Optional hash-valid CFB joint-model artifact JSON for model-based game LEANs.
        required: false
        type: string

permissions:
  contents: read

jobs:
  research-card:
    concurrency:
      group: sportsedge-paid-odds-api
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      CFB_PAPER_BOARD_JSON: ${{ inputs.game_board_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test/runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Build game-market PAPER board
        run: python scripts/run_cfb_paper_market.py --output artifacts/cfb/cfb_paper_market_card.json

      - name: Materialize optional research game-model artifact
        env:
          GAME_MODEL_ARTIFACT_JSON: ${{ inputs.game_model_artifact_json }}
        run: |
          if [ -n "$GAME_MODEL_ARTIFACT_JSON" ]; then
            mkdir -p artifacts/cfb
            printf '%s' "$GAME_MODEL_ARTIFACT_JSON" > artifacts/cfb/cfb_game_model_candidate.json
            python scripts/run_cfb_game_model_candidate.py \
              --model-artifact artifacts/cfb/cfb_game_model_candidate.json \
              --output artifacts/run_it/cfb_game_model_candidate.json || true
          else
            echo "No research game-model artifact supplied; game lane will use PAPER consensus."
          fi

      - name: Materialize optional PIT usage input
        env:
          USAGE_JSON: ${{ inputs.usage_json }}
        run: |
          if [ -n "$USAGE_JSON" ]; then
            mkdir -p artifacts/cfb
            printf '%s' "$USAGE_JSON" > artifacts/cfb/cfb_prop_usage_input.json
            python scripts/build_cfb_prop_live_features.py               --usage-input artifacts/cfb/cfb_prop_usage_input.json               --output artifacts/football/cfb_prop_live_features.json
          else
            echo "No PIT usage JSON supplied; player-prop lane remains unavailable."
          fi

      - name: Run frozen CFB prop research candidate
        if: ${{ inputs.usage_json != '' }}
        run: |
          python scripts/run_cfb_prop_model_candidate.py             --live-features artifacts/football/cfb_prop_live_features.json             --output artifacts/run_it/cfb_prop_model_candidate.json || true

      - name: Build unified fail-closed research board
        run: |
          ARGS="--paper-market-card artifacts/cfb/cfb_paper_market_card.json"
          if [ -f artifacts/run_it/cfb_game_model_candidate.json ]; then
            ARGS="$ARGS --game-model-report artifacts/run_it/cfb_game_model_candidate.json"
          fi
          if [ -f artifacts/run_it/cfb_prop_model_candidate.json ]; then
            ARGS="$ARGS --prop-candidate-report artifacts/run_it/cfb_prop_model_candidate.json"
          fi
          python scripts/run_cfb_all_market_research.py $ARGS             --output artifacts/run_it/cfb_all_market_research.json

      - name: Assert zero production authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/run_it/cfb_all_market_research.json").read_text())
          assert p["status"] == "RESEARCH_ONLY"
          assert p["summary"]["official_bets"] == 0
          assert not any(p["authority"].values())
          for row in p["rows"]:
              assert row["bet_status"] == "BLOCKED"
              assert row["official"] is False
              if row["lane"] == "MARKET_CONSENSUS":
                  assert row["model_p"] is None
          print("CFB_ALL_MARKET_RESEARCH_ZERO_AUTHORITY rows="+str(p["summary"]["rows"]))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-all-market-research-card
          path: |
            artifacts/cfb/cfb_paper_market_card.json
            artifacts/cfb/cfb_game_model_candidate.json
            artifacts/football/cfb_prop_live_features.json
            artifacts/run_it/cfb_game_model_candidate.json
            artifacts/run_it/cfb_prop_model_candidate.json
            artifacts/run_it/cfb_all_market_research.json
          if-no-files-found: warn
          retention-days: 14
