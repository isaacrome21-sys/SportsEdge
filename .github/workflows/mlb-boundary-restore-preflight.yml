name: mlb-boundary-restore-preflight
on:
  pull_request:
    paths:
      - config/freeze_reconciliation_registry_v1.json
      - .github/workflows/mlb-boundary-restore-preflight.yml
permissions:
  contents: read
jobs:
  candidate-repaired-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently verify proposed corrective merge restores original registered boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.governance.reconciliation_content_identity import boundary_matches
          repo = Path.cwd()
          registry = json.loads((repo / "config/freeze_reconciliation_registry_v1.json").read_text())
          anchor = registry["reconciled_through_sha"]
          ok, proof = boundary_matches(
              repo, registry=registry, registered_ref=anchor, current_ref="HEAD"
          )
          print(json.dumps(proof, sort_keys=True))
          if not ok:
              raise SystemExit("CORRECTIVE_PR_TREE_STILL_DIVERGED_FROM_LOCKED_BOUNDARY")
          print("CORRECTIVE_TREE_RESTORES_LOCKED_GOVERNED_SURFACE_IDENTITY")
          PY
