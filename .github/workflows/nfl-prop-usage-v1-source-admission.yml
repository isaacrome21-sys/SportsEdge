name: nfl-prop-usage-v1-source-admission

on:
  push:
    branches:
      - 'grok/nfl/prop-usage-v1-source-admission'

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-probe dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.2 pandas==2.3.3 pyarrow==21.0.0 pytest==9.1.1
      - name: Compile and test before network access
        run: |
          python -m py_compile scripts/probe_nfl_prop_usage_v1_sources.py tests/test_nfl_prop_usage_v1_source_admission.py
          python -m pytest -q tests/test_nfl_prop_usage_v1_source_admission.py
      - name: Probe exact free 2025 line and inactive sources without scoring
        run: |
          mkdir -p artifacts/nfl_prop_usage_v1
          python scripts/probe_nfl_prop_usage_v1_sources.py --out artifacts/nfl_prop_usage_v1/source_probe.json
      - name: Enforce no model scoring and source admission result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/nfl_prop_usage_v1/source_probe.json")
          x=json.loads(p.read_text())
          assert x["model_scoring_performed"] is False
          assert x["validation_outcomes_read"] is False
          print(json.dumps({
              "status":x["status"],
              "line_gate_passed":x["line_gate_passed"],
              "inactive_gate_passed":x["inactive_gate_passed"],
              "inactive_coverage":x["inactive_source"]["coverage"],
              "missing_team_weeks":len(x["inactive_source"]["missing_team_weeks"])
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-prop-usage-v1-source-probe-${{ github.sha }}
          path: artifacts/nfl_prop_usage_v1/source_probe.json
          retention-days: 30
