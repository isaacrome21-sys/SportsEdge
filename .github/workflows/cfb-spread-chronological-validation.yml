name: cfb-spread-chronological-validation

on:
  pull_request:
    paths:
      - 'scripts/research_cfb_spread_chronological.py'
      - 'tests/test_cfb_spread_chronological.py'
      - '.github/workflows/cfb-spread-chronological-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/research_cfb_spread_chronological.py'
      - 'tests/test_cfb_spread_chronological.py'
      - '.github/workflows/cfb-spread-chronological-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  spread-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen research requirements
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test temporal settlement contract
        run: python -m unittest tests.test_cfb_spread_chronological -v
      - name: Grade chronological historical spread residuals
        run: |
          python scripts/research_cfb_spread_chronological.py \
            --output artifacts/cfb/cfb_spread_chronological_study.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cfb-spread-chronological-${{ github.sha }}
          path: artifacts/cfb/cfb_spread_chronological_study.json
          if-no-files-found: warn
          retention-days: 60
