name: nfl-attempt9-numeric-compat

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/public_training_sources_v1.json'
      - 'scripts/build_nfl_attempt9_runtime_artifact.py'
      - 'scripts/diagnose_nfl_attempt9_numerics.py'
      - '.github/workflows/nfl-attempt9-numeric-compat.yml'

permissions:
  contents: read

jobs:
  compatibility-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact historical NumPy version
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.3'
      - name: Record runner CPU surface
        run: |
          set -euo pipefail
          mkdir -p artifacts/nfl-attempt9-numeric
          {
            echo '=== lscpu ==='
            lscpu
            echo '=== cpuinfo model ==='
            grep -m1 '^model name' /proc/cpuinfo || true
          } | tee artifacts/nfl-attempt9-numeric/runner_cpu.txt
      - name: Sweep plausible BLAS thread counts in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          for threads in 1 2 4 8 16 32 64; do
            echo "=== NFL_ATTEMPT9_THREADS=${threads} ==="
            OPENBLAS_NUM_THREADS="$threads" \
            OMP_NUM_THREADS="$threads" \
            MKL_NUM_THREADS="$threads" \
              python -m scripts.diagnose_nfl_attempt9_numerics \
                --output "artifacts/nfl-attempt9-numeric/threads_${threads}.json"
          done
      - name: Summarize exact compatibility without selecting a winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/nfl-attempt9-numeric')
          rows=[]
          for path in sorted(root.glob('threads_*.json')):
              payload=json.loads(path.read_text())
              rows.append({
                  'file':path.name,
                  'threads':payload['thread_environment']['OPENBLAS_NUM_THREADS'],
                  'cpu_model':payload['cpu_model'],
                  'coefficients_exact':payload['all_coefficients_text_exact'],
                  'predictions_exact':payload['all_predictions_exact'],
                  'full_exact':payload['exact_full_compatibility'],
                  'margin_coefficient_json':payload['targets']['margin']['coefficient_json'],
                  'margin_prediction_sha256':payload['targets']['margin']['holdout_prediction_sha256'],
                  'total_coefficient_json':payload['targets']['total']['coefficient_json'],
                  'total_prediction_sha256':payload['targets']['total']['holdout_prediction_sha256'],
              })
          summary={
              'schema_version':'SPORTSEDGE_NFL_ATTEMPT9_COMPATIBILITY_SWEEP_V1',
              'status':'DIAGNOSTIC_ONLY_NO_AUTHORITY',
              'historical_thread_count_known':False,
              'compatible_thread_counts':[r['threads'] for r in rows if r['full_exact']],
              'rows':rows,
              'authority':{
                  'changes_expected_hash':False,
                  'changes_candidate':False,
                  'creates_model_p':False,
                  'promotion_authority':False,
              },
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload numeric compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-attempt9-numeric-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nfl-attempt9-numeric
          if-no-files-found: error
          retention-days: 30
