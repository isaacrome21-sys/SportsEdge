name: live-full-model-expansion

on:
  push:
    branches:
      - sportsedge/market-engine-expansion-v1
    paths:
      - '.github/workflows/live-full-model-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  live-card:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Prepare output
        run: mkdir -p artifacts .cache/mlb-history
      - name: Diagnose Odds API key slots
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          keys = [os.environ.get('SPORTSEDGE_ODDS_API_KEY', '').strip(),
                  os.environ.get('SPORTSEDGE_ODDS_API_KEY_2', '').strip(),
                  os.environ.get('SPORTSEDGE_ODDS_API_KEY_3', '').strip(),
                  os.environ.get('SPORTSEDGE_ODDS_API_KEY_4', '').strip()]
          out = []
          def test(slot, key):
              if not key:
                  return {'slot': slot, 'ok': False, 'error_code': 'KEY_MISSING'}
              url = 'https://api.the-odds-api.com/v4/sports/baseball_mlb/odds?' + urlencode({
                  'apiKey': key, 'bookmakers': 'draftkings', 'markets': 'h2h',
                  'oddsFormat': 'american', 'dateFormat': 'iso'})
              try:
                  with urlopen(Request(url, headers={'Accept':'application/json'}), timeout=15) as r:
                      data = json.loads(r.read().decode('utf-8'))
                      return {'slot': slot, 'ok': True, 'http_status': getattr(r,'status',200),
                              'quota_remaining': r.headers.get('x-requests-remaining'),
                              'quota_used': r.headers.get('x-requests-used'),
                              'result_count': len(data) if isinstance(data,list) else None}
              except HTTPError as e:
                  body = e.read().decode('utf-8','replace')
                  try: parsed = json.loads(body)
                  except Exception: parsed = {}
                  return {'slot': slot, 'ok': False, 'http_status': e.code,
                          'error_code': parsed.get('error_code'), 'message': parsed.get('message'),
                          'quota_remaining': e.headers.get('x-requests-remaining') if e.headers else None,
                          'quota_used': e.headers.get('x-requests-used') if e.headers else None}
              except URLError as e:
                  return {'slot': slot, 'ok': False, 'error_code':'URL_ERROR', 'message':str(e.reason)}
              except Exception as e:
                  return {'slot': slot, 'ok': False, 'error_code':type(e).__name__, 'message':str(e)}
          for i, key in enumerate(keys, 1): out.append(test(i, key))
          with open('artifacts/odds_diagnostic.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Run live MLB full model
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/mlb-history
        shell: bash
        run: |
          set +e
          python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json 2>&1 | tee artifacts/live_run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/exit_code.txt
          exit 0
      - name: Upload live card
        uses: actions/upload-artifact@v4
        with:
          name: live-full-model-expansion
          path: artifacts/
          if-no-files-found: error
