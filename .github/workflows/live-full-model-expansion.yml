name: live-full-model-expansion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  live-card:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Prepare output
        run: mkdir -p artifacts .cache/mlb-history

      - name: Run unified automatic LIVE RUN IT acquisition
        id: acquisition
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
        shell: bash
        run: |
          set +e
          python scripts/run_live_run_it.py --sports MLB,NFL,CFB --output artifacts/live_run_it.json 2>&1 | tee artifacts/live_acquisition.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/live_acquisition_exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose first configured Odds API key only
        id: diagnostic
        if: steps.acquisition.outputs.exit_code == '0'
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          configured = []
          for name in ('SPORTSEDGE_ODDS_API_KEY','SPORTSEDGE_ODDS_API_KEY_2','SPORTSEDGE_ODDS_API_KEY_3','SPORTSEDGE_ODDS_API_KEY_4'):
              key = os.environ.get(name, '').strip()
              if key and key not in [v for _, v in configured]:
                  configured.append((name, key))
          if not configured:
              out = {'ok': False, 'error_code': 'KEY_MISSING', 'rotation_attempted': False}
          else:
              name, key = configured[0]
              slot = ('SPORTSEDGE_ODDS_API_KEY','SPORTSEDGE_ODDS_API_KEY_2','SPORTSEDGE_ODDS_API_KEY_3','SPORTSEDGE_ODDS_API_KEY_4').index(name) + 1
              url = 'https://api.the-odds-api.com/v4/sports/baseball_mlb/odds?' + urlencode({
                  'apiKey': key, 'bookmakers': 'draftkings', 'markets': 'h2h',
                  'oddsFormat': 'american', 'dateFormat': 'iso'})
              try:
                  with urlopen(Request(url, headers={'Accept':'application/json'}), timeout=15) as r:
                      data = json.loads(r.read().decode('utf-8'))
                      out = {'slot': slot, 'ok': True, 'http_status': getattr(r,'status',200),
                             'quota_remaining': r.headers.get('x-requests-remaining'),
                             'quota_used': r.headers.get('x-requests-used'),
                             'result_count': len(data) if isinstance(data,list) else None,
                             'rotation_attempted': False}
              except HTTPError as e:
                  body = e.read().decode('utf-8','replace')
                  try: parsed = json.loads(body)
                  except Exception: parsed = {}
                  out = {'slot': slot, 'ok': False, 'http_status': e.code,
                         'error_code': parsed.get('error_code'), 'message': parsed.get('message'),
                         'quota_remaining': e.headers.get('x-requests-remaining') if e.headers else None,
                         'quota_used': e.headers.get('x-requests-used') if e.headers else None,
                         'rotation_attempted': False}
              except URLError as e:
                  out = {'slot': slot, 'ok': False, 'error_code':'URL_ERROR', 'message':str(e.reason),
                         'rotation_attempted': False}
              except Exception as e:
                  out = {'slot': slot, 'ok': False, 'error_code':type(e).__name__, 'message':str(e),
                         'rotation_attempted': False}
          with open('artifacts/odds_diagnostic.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          raise SystemExit(0 if out.get('ok') else 3)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run existing live MLB full model path
        if: steps.acquisition.outputs.exit_code == '0' && steps.diagnostic.outputs.exit_code == '0'
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/mlb-history
        shell: bash
        run: |
          set +e
          python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json 2>&1 | tee artifacts/live_mlb_model.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/live_mlb_exit_code.txt
          exit 0

      - name: Upload live card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-full-model-expansion
          path: artifacts/
          if-no-files-found: error
