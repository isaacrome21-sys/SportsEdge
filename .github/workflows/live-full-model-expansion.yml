name: live-full-model-expansion

on:
  push:
    branches: [sportsedge/live-mlb-20260929-full-model]
    paths:
      - .github/workflows/live-full-model-expansion.yml
      - manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  live-card:
    concurrency:
      group: sportsedge-paid-odds-api
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Prepare output
        run: mkdir -p artifacts .cache/mlb-history

      - name: Verify fresh manual MLB path
        run: PYTHONPATH=. python -m unittest tests.test_manual_quote_contract tests.test_manual_mlb_live_guards tests.test_mlb_myspari_own_model tests.test_mlb_empirical_support

      - name: Run SportsEdge on fresh supplied DK playoff board
        run: >-
          PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py
          --input manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
          --run-date 2026-09-29
          --max-age-minutes 60
          --output artifacts/fresh_manual_mlb_card.json

      - name: Retrieve current MLB context
        if: always() && hashFiles('artifacts/fresh_manual_mlb_card.json') != ''
        continue-on-error: true
        run: PYTHONPATH=. python scripts/acquire_mlb_card_context.py --engine-output artifacts/fresh_manual_mlb_card.json --out-dir artifacts/mlb_context

      - name: Render SportsEdge fresh card
        if: always() && hashFiles('artifacts/fresh_manual_mlb_card.json') != ''
        continue-on-error: true
        run: >-
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py
          --engine-output artifacts/fresh_manual_mlb_card.json
          --snapshot manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
          --context-dir artifacts/mlb_context
          --out-dir artifacts/mlb_myspari

      - name: Run unified automatic LIVE RUN IT acquisition
        id: unified
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
        shell: bash
        run: |
          set +e
          python scripts/run_live_run_it.py --sports MLB,NFL,CFB --output artifacts/live_run_it.json 2>&1 | tee artifacts/live_acquisition.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/live_acquisition_exit_code.txt
          if grep -q 'OUT_OF_USAGE_CREDITS' artifacts/live_acquisition.log artifacts/live_run_it.json 2>/dev/null; then
            echo 'terminal_exhaustion=true' >> "$GITHUB_OUTPUT"
          else
            echo 'terminal_exhaustion=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Diagnose Odds API key slots
        id: diagnostic
        if: steps.unified.outputs.terminal_exhaustion != 'true'
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          keys = [os.environ.get('SPORTSEDGE_ODDS_API_KEY', '').strip(), os.environ.get('SPORTSEDGE_ODDS_API_KEY_2', '').strip(), os.environ.get('SPORTSEDGE_ODDS_API_KEY_3', '').strip(), os.environ.get('SPORTSEDGE_ODDS_API_KEY_4', '').strip()]
          out=[]
          for i,key in enumerate(keys,1):
              if not key:
                  out.append({'slot':i,'ok':False,'error_code':'KEY_MISSING'}); continue
              url='https://api.the-odds-api.com/v4/sports/baseball_mlb/odds?'+urlencode({'apiKey':key,'bookmakers':'draftkings','markets':'h2h','oddsFormat':'american','dateFormat':'iso'})
              try:
                  with urlopen(Request(url,headers={'Accept':'application/json'}),timeout=15) as r:
                      data=json.loads(r.read().decode()); out.append({'slot':i,'ok':True,'quota_remaining':r.headers.get('x-requests-remaining'),'result_count':len(data) if isinstance(data,list) else None})
              except HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: parsed=json.loads(body)
                  except Exception: parsed={}
                  out.append({'slot':i,'ok':False,'http_status':e.code,'error_code':parsed.get('error_code'),'message':parsed.get('message')})
                  if parsed.get('error_code')=='OUT_OF_USAGE_CREDITS': break
              except Exception as e: out.append({'slot':i,'ok':False,'error_code':type(e).__name__,'message':str(e)})
          with open('artifacts/odds_diagnostic.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Upload live card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-full-model-expansion
          path: artifacts/
          if-no-files-found: error
