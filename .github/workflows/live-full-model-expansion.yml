name: live-full-model-expansion

on:
  push:
    branches: [sportsedge/live-mlb-20260929-full-model]
    paths:
      - .github/workflows/live-full-model-expansion.yml
      - manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
      - manual_inputs/mlb/2026-09-29_full_market_chunks/**
      - scripts/expand_mlb_full_market_chunks.py
      - scripts/run_manual_mlb_full_all_markets.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  live-card:
    concurrency:
      group: sportsedge-paid-odds-api
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Prepare output
        run: mkdir -p artifacts .cache/mlb-history

      - name: Verify fresh manual MLB path
        run: PYTHONPATH=. python -m unittest tests.test_manual_quote_contract tests.test_manual_mlb_live_guards tests.test_mlb_myspari_own_model tests.test_mlb_empirical_support

      - name: Expand complete supplied screenshot market board
        run: >-
          PYTHONPATH=. python scripts/expand_mlb_full_market_chunks.py
          --input-dir manual_inputs/mlb/2026-09-29_full_market_chunks
          --output artifacts/2026-09-29_dk_full_all_markets_1040.json

      - name: Run SportsEdge full board — sides totals batter pitcher props
        run: >-
          PYTHONPATH=. python scripts/run_manual_mlb_full_all_markets.py
          --input artifacts/2026-09-29_dk_full_all_markets_1040.json
          --output artifacts/full_all_markets_card.json
          --history-cache-dir .cache/mlb-history

      - name: Run baseline paired board regression
        run: >-
          PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py
          --input manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
          --run-date 2026-09-29
          --max-age-minutes 60
          --output artifacts/fresh_manual_mlb_card.json

      - name: Retrieve current MLB context
        if: always() && hashFiles('artifacts/fresh_manual_mlb_card.json') != ''
        continue-on-error: true
        run: PYTHONPATH=. python scripts/acquire_mlb_card_context.py --engine-output artifacts/fresh_manual_mlb_card.json --out-dir artifacts/mlb_context

      - name: Render baseline SportsEdge card
        if: always() && hashFiles('artifacts/fresh_manual_mlb_card.json') != ''
        continue-on-error: true
        run: >-
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py
          --engine-output artifacts/fresh_manual_mlb_card.json
          --snapshot manual_inputs/mlb/2026-09-29_dk_fresh_1040.json
          --context-dir artifacts/mlb_context
          --out-dir artifacts/mlb_myspari

      - name: Summarize full all-market run
        if: always() && hashFiles('artifacts/full_all_markets_card.json') != ''
        run: |
          python - <<'PY'
          import json, collections
          p=json.load(open('artifacts/full_all_markets_card.json'))
          rows=p.get('scored_rows') or []
          action=[r for r in rows if r.get('status')=='ACTIONABLE']
          out={
            'input_counts':p.get('input_counts'),
            'results':len(p.get('results') or []),
            'scored_rows':len(rows),
            'actionable':len(action),
            'actionable_by_market':dict(collections.Counter(r.get('market') for r in action)),
            'actionable_rows':action,
          }
          json.dump(out,open('artifacts/full_all_markets_summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps({k:v for k,v in out.items() if k!='actionable_rows'},indent=2))
          PY

      - name: Upload live card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-full-model-expansion
          path: artifacts/
          if-no-files-found: error
