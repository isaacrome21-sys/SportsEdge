name: auto-mlb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sportsedge/**'
      - 'scripts/run_auto_mlb*.py'
      - 'scripts/probe_game_odds.py'
      - 'scripts/probe_odds_http.py'
      - 'scripts/archive_raw_game_odds.py'
      - 'scripts/run_mlb_archive_lane.py'
      - 'tests/test_mlb_archive_lane.py'
      - 'config/**'
      - 'tests/test_auto_native_odds.py'
      - 'tests/test_mlb_run_machine.py'
      - '.github/workflows/auto-mlb.yml'
  schedule:
    # Three runs/hour are sufficient for MLB's five-minute first-pitch grid:
    # :02/:22/:42 is always within the archive's +/-8 minute window for any
    # scheduled minute ending in 0 or 5, and T-180/T-90 preserve that minute.
    # Limit the automatic lane to the MLB-season game window instead of burning
    # private-repo Actions minutes 24/7. 13-03 UTC covers 08:00-22:59 CDT and
    # 07:00-21:59 CST; March-November covers the MLB season/postseason.
    # Upper bound: 45 scheduled jobs/day, 1,395 in a 31-day active month.
    - cron: '2,22,42 13-23,0-3 * 3-11 *'

permissions:
  contents: write

concurrency:
  # The archive writes irreplaceable forward evidence to the data branch. Never
  # cancel an in-flight archive/persistence operation just because a newer
  # scheduled AUTO run arrived. The shared group serializes manual failover and
  # AUTO archive writes; the wrapper's 5-minute dedupe prevents double capture.
  group: auto-mlb
  cancel-in-progress: false

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run durable MLB odds archive lane
        id: archive_lane
        shell: bash
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_ODDS_DAILY_BUDGET_CREDITS: '12'
          SPORTSEDGE_ODDS_BUDGET_LEDGER: .cache/sportsedge/odds-budget/ledger.json
          SPORTSEDGE_ARCHIVE_SOURCE: auto-mlb
        run: |
          set +e
          python -I scripts/run_mlb_archive_lane.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Resolve Chicago slate date
        id: slate
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore MLB history cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/mlb-history
          key: sportsedge-mlb-history-v1-${{ runner.os }}-${{ steps.slate.outputs.date }}
          restore-keys: |
            sportsedge-mlb-history-v1-${{ runner.os }}-
      - name: Verify canonical MLB machine safety tests
        run: >-
          python -m unittest
          tests.test_auto_runner
          tests.test_odds_api_source
          tests.test_auto_native_odds
          tests.test_mlb_hits_features
          tests.test_mlb_total_bases_features
          tests.test_mlb_history_cache
          tests.test_odds_keyring
          tests.test_live_odds_failover
          tests.test_game_odds_source_unittest
          tests.test_additional_mlb_odds_source
          tests.test_additional_binary_quote_provenance
          tests.test_mlb_quote_source_coverage
          tests.test_mlb_run_machine
          tests.test_run_auto_mlb_resilient_machine
          -v
      - name: Diagnose Odds API credentials safely
        if: always()
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        run: python scripts/probe_odds_http.py
      - name: Acquire featured MLB game lines
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
        run: python scripts/probe_game_odds.py
      - name: Run canonical automated MLB machine
        env:
          SPORTSEDGE_QUOTES_URL: ${{ secrets.SPORTSEDGE_QUOTES_URL }}
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_FEATURES_URL: ${{ secrets.SPORTSEDGE_FEATURES_URL }}
          SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
          SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
        run: python scripts/run_auto_mlb_resilient.py --output artifacts/live_mlb_card.json
      - name: Upload durable MLB archive lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-raw-game-odds-auto-${{ github.run_id }}
          path: |
            artifacts/raw_odds/**
            .cache/sportsedge/odds-budget/ledger.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload automated card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mlb-card
          path: |
            artifacts/live_mlb_card.json
            artifacts/live_game_odds.json
            artifacts/odds_http_diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: Propagate archive lane failure after card evidence
        if: always()
        shell: bash
        run: |
          code='${{ steps.archive_lane.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Archive lane did not emit an exit code.' >&2
            exit 99
          fi
          exit "$code"
