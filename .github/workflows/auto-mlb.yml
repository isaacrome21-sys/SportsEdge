name: auto-mlb

on:
  push:
    branches: [full-model-completion-20260812]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-mlb
  cancel-in-progress: true

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy 'scikit-learn==1.9.0' joblib pytest
      - name: Resolve Chicago slate date
        id: slate
        run: echo "date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore MLB history cache
        uses: actions/cache@v4
        with:
          path: .cache/sportsedge/mlb-history
          key: sportsedge-mlb-history-v2-${{ runner.os }}-${{ steps.slate.outputs.date }}
          restore-keys: |
            sportsedge-mlb-history-v2-${{ runner.os }}-
      - name: Restore full-slate pregame archive
        uses: actions/cache/restore@v4
        with:
          path: .cache/sportsedge/pregame-archive
          key: sportsedge-pregame-v1-${{ runner.os }}-${{ steps.slate.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sportsedge-pregame-v1-${{ runner.os }}-${{ steps.slate.outputs.date }}-
      - name: Download exact frozen v4 game artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/sportsedge/game-v4
          gh run download 31558918467 -n core-game-market-rebuild-v3-1-source-bounded -D .cache/sportsedge/game-v4
          echo '49870123d7db6fca2f3b2985453c6aa3c685fb05da146c6c63601efd8623c272  .cache/sportsedge/game-v4/sportsedge_game_score_v4.joblib' | sha256sum -c -
          echo '38c5ca528ffc0f6966e0b1d4be96f26a748467707b36865670cba421a20fe565  .cache/sportsedge/game-v4/sportsedge_nrfi_v4.joblib' | sha256sum -c -
      - name: Verify automation safety tests
        run: python -m pytest -q tests/test_auto_runner.py tests/test_odds_api_source.py tests/test_auto_native_odds.py tests/test_mlb_hits_features.py tests/test_mlb_total_bases_features.py tests/test_mlb_history_cache.py tests/test_odds_keyring.py tests/test_game_odds_source.py tests/test_game_market_contract.py tests/test_full_slate_accounting.py tests/test_pregame_archive.py tests/test_game_card_pipeline.py tests/test_game_history_live.py tests/test_bettor_card.py tests/test_deployment_audit.py
      - name: Acquire fresh DraftKings game-market probe
        continue-on-error: true
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
        run: python scripts/probe_game_odds.py
      - name: Run automated MLB Full Model
        env:
          SPORTSEDGE_QUOTES_URL: ${{ secrets.SPORTSEDGE_QUOTES_URL }}
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
          SPORTSEDGE_FEATURES_URL: ${{ secrets.SPORTSEDGE_FEATURES_URL }}
          SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
          SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
          SPORTSEDGE_HISTORY_CACHE_DIR: .cache/sportsedge/mlb-history
          SPORTSEDGE_GAME_SCORE_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_game_score_v4.joblib
          SPORTSEDGE_NRFI_ARTIFACT: .cache/sportsedge/game-v4/sportsedge_nrfi_v4.joblib
        run: python scripts/run_auto_mlb.py --output artifacts/live_mlb_card.json
      - name: Update immutable pregame archive
        if: always()
        run: python scripts/update_pregame_archive.py
      - name: Build full-slate market accounting
        if: always()
        run: python scripts/build_full_slate_accounting.py
      - name: Save full-slate pregame archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/sportsedge/pregame-archive
          key: sportsedge-pregame-v1-${{ runner.os }}-${{ steps.slate.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload automated card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mlb-card
          path: |
            artifacts/live_mlb_card.json
            artifacts/live_game_odds.json
            artifacts/full_slate_accounting.json
            .cache/sportsedge/pregame-archive/${{ steps.slate.outputs.date }}.json
          if-no-files-found: error
          retention-days: 14
