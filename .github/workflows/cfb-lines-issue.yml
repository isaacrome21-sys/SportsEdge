name: cfb-lines-issue

# The former CFB SDV card is retired after failing market-close validation.
# Keep this phone issue entry point fail-closed: acknowledge the submission,
# but never invoke the retired pricer or publish its 0.25u probation output.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: cfb-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  retired-card-refusal:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[CFB LINES]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      # Preserve the existing secret-fallback contract; no provider call is made.
      CFBD_API_KEY: ${{ secrets.SPORTSEDGE_CFBD_API_KEY || secrets.CFBD_API_KEY }}
    steps:
      - name: Publish fail-closed retired-model status
        run: |
          gh issue comment "$ISSUE" --body '**CFB_INCUMBENT_RETIRED_NO_OOS_WIN**

          This CFB SDV construction failed out-of-sample market testing and is retired. Its prior BET/LEAN/probation outputs have no betting authority. No card was priced, no 0.25u probation play was issued, and no historical entry is counted.

          **PAPER / 0u**. A successor needs a passing design-data viability screen, an independently reviewed preregistration, an owner freeze, and forward timestamped DraftKings entry/close evidence before any verdict.'
