name: NFL and CFB baseline fits
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fit_football_baselines.py'
      - '.github/workflows/football-baselines.yml'
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade numpy
      - name: Fit both sports
        run: python scripts/fit_football_baselines.py --seasons 2010,2011,2012,2013,2014,2015,2016,2017,2018,2019 --holdout 2019 --feature-set opponent_strength
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-baseline-report
          path: artifacts/football_baselines.json
