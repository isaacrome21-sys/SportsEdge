name: NFL and CFB baseline fits
on:
  workflow_dispatch:
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade numpy
      - name: Fit both sports
        run: python scripts/fit_football_baselines.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-baseline-report
          path: artifacts/football_baselines.json

