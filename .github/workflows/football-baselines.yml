name: NFL Attempt 2 quarterback fit with CFB control
on:
  workflow_dispatch:
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade numpy
      - name: Fit NFL quarterback candidate and CFB matched control
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -u scripts/fit_football_baselines.py --seasons 2010,2011,2012,2013,2014,2015,2016,2017,2018,2019 --policy config/nfl_research_search_policy_v1.json --feature-set quarterback --out artifacts/football_baselines_attempt2.json 2>&1 | tee artifacts/fit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: football-baseline-attempt2-diagnostics
          path: artifacts/fit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-baseline-attempt2
          path: artifacts/football_baselines_attempt2.json
