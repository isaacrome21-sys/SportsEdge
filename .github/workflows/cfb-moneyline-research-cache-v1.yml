name: cfb-moneyline-research-cache-v1

on:
  pull_request:
    paths:
      - 'sportsedge/sports/cfb/cfbd_moneyline_research_v1.py'
      - 'sportsedge/sports/cfb/cfbd_issue_cache.py'
      - 'tests/test_cfb_moneyline_research_cache_v1.py'
      - '.github/workflows/cfb-moneyline-research-cache-v1.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/cfb/cfbd_moneyline_research_v1.py'
      - 'sportsedge/sports/cfb/cfbd_issue_cache.py'
      - 'tests/test_cfb_moneyline_research_cache_v1.py'
      - '.github/workflows/cfb-moneyline-research-cache-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-collector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed CFB moneyline cache tests
        run: python -m unittest tests.test_cfb_moneyline_research_cache_v1 -v
      - name: Existing CFB issue-cache regression
        run: python -m pytest tests/test_cfb_cfbd_issue_cache.py -q
