name: daily-operations-digest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily_digest.py'
      - 'tests/test_daily_digest.py'
      - '.github/workflows/daily-operations-digest.yml'
  schedule:
    # 08:17 America/Chicago during daylight time; avoid minute 0 scheduler load.
    - cron: '17 13 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-operations-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore durable data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
      - name: Build one phone-readable digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_daily_digest.py
          --repo-root .
          --data-root .data-branch
          --out artifacts/daily/sportsedge-daily-digest.md
      - name: Upload daily digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sportsedge-daily-digest-${{ github.run_id }}
          path: artifacts/daily/sportsedge-daily-digest.md
          if-no-files-found: error
          retention-days: 30
