name: nfl-prop-reconciliation-bootstrap-899

on:
  push:
    branches:
      - research/nfl-role-prop-challenger-20260921
    paths:
      - .github/workflows/nfl-prop-reconciliation-bootstrap-899.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/nfl-role-prop-challenger-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Fetch and pin protected main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "ed628eaa978dd11a2097da91fa006067fb55e717" || { echo MAIN_MOVED; exit 1; }
      - name: Register post-boundary main commits and revoke drifted NFL prop freeze
        run: |
          python - <<'PY'
          import json, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          reg = json.loads(path.read_text())
          anchor = reg['reconciled_through_sha']
          target = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',anchor,target], check=True)
          existing = {str(r.get('merge_sha')) for r in reg.get('deltas', [])}
          commits = subprocess.check_output(
              ['git','rev-list','--first-parent','--reverse',f'{anchor}..{target}'], text=True
          ).splitlines()
          for sha in commits:
              if sha in existing:
                  continue
              subject = subprocess.check_output(['git','show','-s','--format=%s',sha], text=True).strip()
              body = subprocess.check_output(['git','show','-s','--format=%B',sha], text=True)
              match = re.search(r'(?:pull request|PR)\s*#(\d+)', body, re.I)
              pr = int(match.group(1)) if match else 0
              reg['deltas'].append({
                  'delta_id': f'MAIN_ADVANCE_{sha[:12]}',
                  'merge_sha': sha,
                  'note': subject,
                  'pr': pr,
              })
          nfl = next(b for b in reg['bundles'] if b['bundle_id'] == 'NFL_PROP_MODEL_FREEZE_V1')
          nfl['disposition'] = {
              'state': 'REVOKED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'prior_forward_clock_invalidated': True,
              'trigger_delta_sha': 'ed628eaa978dd11a2097da91fa006067fb55e717',
              'reason': 'PR_898_ADDED_COVERED_NFL_PROP_TEST_SURFACE; PRIOR_PROP_FREEZE_DOES_NOT_TRANSFER_TO_RESEARCH_CHALLENGER; FAIL_CLOSED_PENDING_NEW_MACHINE_VERIFIED_FREEZE',
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'eligibility': False,
                  'staking': False,
                  'official': False,
              },
          }
          reg['reconciled_through_sha'] = target
          path.write_text(json.dumps(reg, sort_keys=True, separators=(',', ':')) + '\n')
          print(f'anchor={anchor} target={target} added={len(commits)}')
          PY
      - name: Machine-classify reconciliation
        run: |
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py --repo . --current-main-ref origin/main --output /tmp/reconciliation_report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/reconciliation_report.json'))
          provisional=[x for x in r.get('matrix',[]) if x.get('outcome')=='PROVISIONAL_DRIFT_BLOCKED']
          if provisional:
              raise SystemExit('PROVISIONAL_RECONCILIATION_ROWS:' + ','.join(x.get('delta_id','?')+':'+x.get('bundle_id','?') for x in provisional))
          bad=[b for b in r.get('release_blocks',[]) if b != 'ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE']
          if bad:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:' + ','.join(bad))
          print('release_blocks=', r.get('release_blocks',[]))
          PY
      - name: Focused governance and prop tests
        run: |
          python -m pytest -q \
            tests/test_freeze_reconciliation.py \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_nfl_prop_role_challenger.py \
            tests/test_nfl_prop_challenger_contract.py
      - name: Persist registry only and remove bootstrap
        run: |
          rm .github/workflows/nfl-prop-reconciliation-bootstrap-899.yml
          git config user.name "sportsedge-reconciliation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/nfl-prop-reconciliation-bootstrap-899.yml
          git commit -m "Reconcile PR 898 NFL prop freeze drift fail-closed"
          git push origin HEAD:research/nfl-role-prop-challenger-20260921
