name: mlb-run-machine-contract

on:
  pull_request:
    paths:
      - 'sportsedge/mlb_run_machine.py'
      - 'sportsedge/auto_joint_runner.py'
      - 'sportsedge/manual_hybrid_joint_runner.py'
      - 'sportsedge/mlb_joint_mode_bridge.py'
      - 'sportsedge/unified_card.py'
      - 'tests/test_mlb_run_machine.py'
      - 'tests/test_mlb_mode_parity.py'
      - '.github/workflows/mlb-run-machine-contract.yml'
  push:
    paths:
      - 'sportsedge/mlb_run_machine.py'
      - 'sportsedge/auto_joint_runner.py'
      - 'sportsedge/manual_hybrid_joint_runner.py'
      - 'sportsedge/mlb_joint_mode_bridge.py'
      - 'sportsedge/unified_card.py'
      - 'tests/test_mlb_run_machine.py'
      - 'tests/test_mlb_mode_parity.py'
      - '.github/workflows/mlb-run-machine-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile canonical machine
        run: python -m py_compile sportsedge/mlb_run_machine.py
      - name: Run canonical machine contract
        run: python -m unittest tests.test_mlb_run_machine -v
      - name: Prove MANUAL/HYBRID/AUTOMATIC parity
        run: python -m unittest tests.test_mlb_mode_parity -v
      - name: Recheck unified market surface
        run: python -m unittest tests.test_full_mlb_market_surface tests.test_joint_market_engines -v
