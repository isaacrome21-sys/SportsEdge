name: mlb-moneyline-rolling-candidate

on:
  workflow_dispatch:
  push:
    branches: [mlb-moneyline-governance-completion]
    paths:
      - '.github/workflows/mlb-moneyline-rolling-candidate.yml'
      - 'scripts/build_mlb_moneyline_rolling_candidate.py'
      - 'tests/test_build_mlb_moneyline_rolling_candidate.py'
      - 'scripts/build_mlb_moneyline_preseason_evidence.py'
      - 'requirements-test.txt'

permissions:
  contents: write

concurrency:
  group: mlb-moneyline-rolling-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mlb-moneyline-governance-completion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile candidate
        run: python -m compileall -q scripts/build_mlb_moneyline_rolling_candidate.py tests/test_build_mlb_moneyline_rolling_candidate.py
      - name: Test chronology
        run: python -m pytest -q tests/test_build_mlb_moneyline_rolling_candidate.py
      - name: Evaluate frozen-development candidate
        run: python scripts/build_mlb_moneyline_rolling_candidate.py
      - name: Persist candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sportsedge-evidence-bot'
          git config user.email 'sportsedge-evidence-bot@users.noreply.github.com'
          git add artifacts/mlb_moneyline_rolling_v2
          if git diff --cached --quiet; then
            echo 'No candidate artifact changes.'
            exit 0
          fi
          git commit -m 'MLB: store rolling moneyline candidate artifact'
          git push origin HEAD:mlb-moneyline-governance-completion
