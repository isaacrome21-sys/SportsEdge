name: nfl-v2-diagnostic-contract

on:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/m2_v2_*.py'
      - 'tests/test_nfl_m2_v2*.py'
      - '.github/workflows/nfl-v2-diagnostic-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Compile NFL V2 modules
        run: python -m compileall -q sportsedge/sports/nfl/m2_v2_candidate.py sportsedge/sports/nfl/m2_v2_selector.py sportsedge/sports/nfl/m2_v2_validation.py

      - name: Run NFL V2 diagnostic contract tests
        run: python -m unittest discover -s tests -p 'test_nfl_m2_v2*.py' -v
