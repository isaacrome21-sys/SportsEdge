name: run-it-mlb-direct-shadow

on:
  workflow_dispatch:
  push:
    branches:
      - run-it-requests
    paths:
      - .github/workflows/run-it-mlb-direct-shadow.yml
      - ops/run_it_mlb_direct_shadow_trigger.json

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Diagnose DraftKings and StatsAPI identity surfaces
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from sportsedge.draftkings_game_market_source import fetch_board
          from sportsedge.mlb_source import fetch_schedule
          now = datetime.now(timezone.utc)
          slate = now.astimezone(ZoneInfo('America/Chicago')).date().isoformat()
          schedule = fetch_schedule(slate, now=now)
          board = fetch_board('baseball_mlb')
          print('STATSAPI_SCHEDULE', [(g.game_pk, g.away_name, g.home_name, g.game_date.isoformat() if hasattr(g.game_date, 'isoformat') else str(g.game_date)) for g in schedule])
          print('DK_EVENTS', [(e.get('id'), e.get('name'), e.get('startEventDate')) for e in (board.payload.get('events') or [])])
          PY
      - name: Run keyless DraftKings MLB shadow model
        shell: bash
        run: |
          set +e
          python scripts/run_mlb_direct_shadow.py --require-confirmed-lineup --output artifacts/run_it/mlb_direct_shadow_card.json
          code=$?
          echo "shadow_exit=$code"
          exit 0
      - name: Upload shadow model output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-it-mlb-direct-shadow
          path: |
            artifacts/run_it/mlb_direct_shadow_card.json
            artifacts/shadow_ledger/mlb
