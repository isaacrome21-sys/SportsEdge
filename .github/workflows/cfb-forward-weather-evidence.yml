name: cfb-forward-weather-evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  pull_request:
    paths:
      - 'scripts/capture_cfb_weather_pit_v2.py'
      - 'tests/test_capture_cfb_weather_pit_v2.py'
      - '.github/workflows/cfb-forward-weather-evidence.yml'

permissions:
  contents: read

concurrency:
  group: cfb-forward-weather-evidence-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  transport-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify fallback transport contract
        run: |
          python -m py_compile scripts/capture_cfb_weather_pit_v2.py
          python -m unittest tests.test_capture_cfb_weather_pit_v2 -v

      - name: Probe ESPN site and CDN transports
        run: |
          mkdir -p artifacts/cfb-forward-weather-probe
          python scripts/capture_cfb_weather_pit_v2.py \
            --probe-only \
            --status-out artifacts/cfb-forward-weather-probe/status.json

      - name: Upload non-authoritative transport probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-forward-weather-transport-probe-${{ github.run_id }}
          path: artifacts/cfb-forward-weather-probe/status.json
          if-no-files-found: error
          retention-days: 30

  capture:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify prospective weather capture contract
        run: |
          python -m py_compile scripts/capture_cfb_weather_pit.py scripts/capture_cfb_weather_pit_v2.py sportsedge/sports/cfb/forward_evidence.py
          python -m unittest tests.test_capture_cfb_weather_pit tests.test_capture_cfb_weather_pit_v2 tests.test_cfb_forward_evidence -v

      - name: Attach append-only data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data

      - name: Capture pre-kickoff weather and prestart attestation
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-forward-weather
          python scripts/capture_cfb_weather_pit_v2.py \
            --policy config/closing_line_archive_policy_v1.json \
            --out-dir .data-branch \
            --status-out artifacts/cfb-forward-weather/status.json
          echo "rows=$(jq -r '.observations_written // 0' artifacts/cfb-forward-weather/status.json)" >> "$GITHUB_OUTPUT"

      - name: Commit prospective observations append-only
        if: steps.capture.outputs.rows != '0'
        shell: bash
        run: |
          set -euo pipefail
          cd .data-branch
          git config user.name 'sportsedge-cfb-weather[bot]'
          git config user.email 'sportsedge-cfb-weather@users.noreply.github.com'
          git add history/cfb/weather
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "data(cfb): prospective pre-kickoff weather $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git fetch origin data || true
            git rebase origin/data || { git rebase --abort || true; sleep $((attempt * 5)); continue; }
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo 'CFB_WEATHER_DATA_PUSH_FAILED' >&2
          exit 1

      - name: Upload capture status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-forward-weather-${{ github.run_id }}
          path: artifacts/cfb-forward-weather/status.json
          if-no-files-found: warn
          retention-days: 30
