name: nhl-public-baseline-fit-run

on:
  workflow_dispatch:
  push:
    branches:
      - nhl/public-baseline-fit-run-20260929
    paths:
      - '.github/workflows/nhl-public-baseline-fit-run.yml'
      - 'scripts/collect_nhl_official_boxscores.py'
      - 'scripts/fit_nhl_public_baseline.py'
      - 'scripts/validate_nhl_public_baseline.py'
      - 'sportsedge/sports/nhl/official_boxscore_source.py'
      - 'sportsedge/sports/nhl/public_baseline.py'

permissions:
  contents: read

jobs:
  fit-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile NHL baseline code
        run: |
          python -m py_compile \
            scripts/collect_nhl_official_boxscores.py \
            scripts/fit_nhl_public_baseline.py \
            scripts/validate_nhl_public_baseline.py \
            sportsedge/sports/nhl/official_boxscore_source.py \
            sportsedge/sports/nhl/public_baseline.py

      - name: Run NHL baseline regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q \
            tests/test_nhl_official_boxscore_source.py \
            tests/test_nhl_public_baseline.py

      - name: Collect official NHL regular-season boxscores
        run: |
          mkdir -p artifacts/nhl
          python scripts/collect_nhl_official_boxscores.py \
            --start-date 2023-10-01 \
            --end-date 2026-09-28 \
            --game-type 2 \
            --sleep-seconds 0.05 \
            --output artifacts/nhl/official_boxscores_2023_2026.jsonl

      - name: Validate frozen coefficients on 2025-26 holdout
        run: |
          python scripts/validate_nhl_public_baseline.py \
            --input artifacts/nhl/official_boxscores_2023_2026.jsonl \
            --output artifacts/nhl/public_baseline_holdout_2025_26.json \
            --train-before 2025-07-01T00:00:00Z \
            --holdout-start 2025-10-01T00:00:00Z \
            --holdout-end 2026-07-01T00:00:00Z \
            --game-type 2 \
            --min-team-games 10 \
            --ridge 1.0 \
            --version nhl-public-boxscore-baseline-holdout-v1

      - name: Fit final development artifact on all collected history
        run: |
          python scripts/fit_nhl_public_baseline.py \
            --input artifacts/nhl/official_boxscores_2023_2026.jsonl \
            --output artifacts/nhl/public_baseline_v1.json \
            --version nhl-public-boxscore-baseline-v1 \
            --game-type 2 \
            --min-team-games 10 \
            --ridge 1.0

      - name: Bind artifact manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('artifacts/nhl')
          names = [
              'official_boxscores_2023_2026.jsonl',
              'public_baseline_holdout_2025_26.json',
              'public_baseline_v1.json',
          ]
          manifest = {
              'schema': 'sportsedge.nhl.public_baseline_run.v1',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'git_sha': '${{ github.sha }}',
              'authority': 'DEVELOPMENT_ONLY / NOT Model_P / NOT TRUTH_GATE / NOT OFFICIAL',
              'files': {},
          }
          for name in names:
              raw = (root / name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload NHL development fit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nhl-public-baseline-fit-${{ github.sha }}
          path: artifacts/nhl/
          if-no-files-found: error
          retention-days: 14
