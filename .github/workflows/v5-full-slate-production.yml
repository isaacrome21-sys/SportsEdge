name: v5-full-slate-production

# QUARANTINED: the historical production recipe referenced three scripts that are
# not present in the repository. Keep manual dispatch for audit visibility, but do
# not schedule or execute a partial/stubbed production lane.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed with quarantine status
        shell: bash
        run: |
          echo 'SPORTSEDGE_WORKFLOW_QUARANTINED=v5-full-slate-production'
          echo 'BLOCKER=MISSING_PRODUCTION_RUNTIME_SCRIPTS'
          echo 'Historical missing paths: attest_live_statcast_v5_game.py, finalize_statcast_v5_game_card.py, update_v5_pregame_archive.py'
          exit 1
