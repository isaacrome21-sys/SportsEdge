name: nfl-v2g-prospective-evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
  pull_request:
    paths:
      - 'config/research/nfl_v2g_prospective_evaluation_policy_2026-09-12.json'
      - 'config/research/nfl_v2g_prospective_evaluation_implementation_freeze_2026-09-12.json'
      - 'sportsedge/sports/nfl/v2g_prospective_evaluation.py'
      - 'scripts/run_nfl_v2g_prospective_evaluation.py'
      - 'tests/test_nfl_v2g_prospective_evaluation.py'
      - '.github/workflows/nfl-v2g-prospective-evaluation.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nfl-v2g-prospective-evaluation-pr-{0}', github.event.pull_request.number) || 'nfl-v2g-prospective-evaluation-persist' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen evaluator implementation
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          path=Path('config/research/nfl_v2g_prospective_evaluation_implementation_freeze_2026-09-12.json')
          if not path.exists(): raise SystemExit('NFL_V2G_EVAL_IMPLEMENTATION_FREEZE_MISSING')
          freeze=json.loads(path.read_text())
          if freeze.get('schema_version')!='SPORTSEDGE_NFL_V2G_PROSPECTIVE_EVALUATION_IMPLEMENTATION_FREEZE_V1' or freeze.get('status')!='FROZEN_BEFORE_FIRST_WEEK2_OUTCOME':
              raise SystemExit('NFL_V2G_EVAL_IMPLEMENTATION_FREEZE_INVALID')
          for item in freeze.get('files',[]):
              actual=subprocess.check_output(['git','hash-object',item['path']],text=True).strip().lower()
              expected=str(item['git_blob_sha1']).lower()
              if actual!=expected: raise SystemExit(f"NFL_V2G_EVAL_CODE_DRIFT:{item['path']}:{actual}:{expected}")
          for key in ('promotion_authority','may_create_model_p','market_eligibility_changed','truth_gate_pass_granted','official_status_granted'):
              if freeze.get(key) is not False: raise SystemExit(f'NFL_V2G_EVAL_AUTHORITY_INVALID:{key}')
          print('NFL_V2G_EVAL_IMPLEMENTATION_FROZEN')
          PY
      - name: Compile evaluator
        run: python -m py_compile sportsedge/sports/nfl/v2g_prospective_evaluation.py scripts/run_nfl_v2g_prospective_evaluation.py
      - name: Run evaluator contract tests
        run: python -m unittest -q tests.test_nfl_v2g_prospective_evaluation

  evaluate:
    if: github.event_name != 'pull_request'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore immutable prospective evidence state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add --detach .data-v2g origin/data
          test -d .data-v2g/evidence/nfl_v2g/prospective/forward_clv/2026 || { echo NFL_V2G_FORWARD_CLV_STATE_MISSING >&2; exit 78; }
          test -d .data-v2g/evidence/nfl_v2g/prospective/market_bindings/2026 || { echo NFL_V2G_MARKET_BINDINGS_MISSING >&2; exit 78; }
          mkdir -p .data-v2g/evidence/nfl_v2g/prospective/outcomes/2026
          mkdir -p .data-v2g/evidence/nfl_v2g/prospective/evaluation/2026
      - name: Evaluate canonical outcomes and fixed checkpoints
        run: |
          python scripts/run_nfl_v2g_prospective_evaluation.py \
            --policy config/research/nfl_v2g_prospective_evaluation_policy_2026-09-12.json \
            --forward-root .data-v2g/evidence/nfl_v2g/prospective/forward_clv/2026 \
            --binding-dir .data-v2g/evidence/nfl_v2g/prospective/market_bindings/2026 \
            --canonical-outcome-dir .data-v2g/evidence/nfl_v2g/prospective/outcomes/2026 \
            --evaluation-root .data-v2g/evidence/nfl_v2g/prospective/evaluation/2026
      - name: Assert evaluator did not mutate canonical outcomes
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C .data-v2g diff --quiet -- evidence/nfl_v2g/prospective/outcomes/2026; then
            echo NFL_V2G_EVAL_CANONICAL_OUTCOME_MUTATION >&2
            exit 97
          fi
      - name: Persist first-write evaluation and checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .data-v2g
            git config user.name sportsedge-v2g-evaluator-bot
            git config user.email sportsedge-v2g-evaluator-bot@users.noreply.github.com
            git add evidence/nfl_v2g/prospective/evaluation/2026 || true
            if git diff --cached --quiet; then
              echo NFL_V2G_NO_NEW_EVALUATION_BYTES
              exit 0
            fi
            git commit -m "evidence: evaluate NFL V2G prospective checkpoints ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:data; then exit 0; fi
              git fetch origin data
              git rebase origin/data
              sleep $((attempt * 2))
            done
            exit 98
          )
