name: cfb-sdv-forward-snapshot

on:
  workflow_run:
    workflows: ["cfb-sdv-card"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Verify fail-closed prospective exporter
        run: python -m unittest tests.test_cfb_sdv_forward_snapshot tests.test_cfb_forward_value_research -v
      - name: Retrieve exact prior card artifact (no backfill)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CARD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfb-card"
          gh run download "$CARD_RUN_ID" -n cfb-sdv-card -D "$RUNNER_TEMP/cfb-card"
          card="$(find "$RUNNER_TEMP/cfb-card" -type f -name cfb_sdv_card.json -print -quit)"
          test -n "$card"
          cp "$card" "$RUNNER_TEMP/cfb-forward-card.json"
      - name: Export pregame model forecasts as research-only evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_cfb_sdv_forward_snapshot.py \
            --card "$RUNNER_TEMP/cfb-forward-card.json" \
            --output artifacts/cfb/cfb_sdv_forward_snapshot.json | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/cfb/cfb_sdv_forward_snapshot.json").read_text())
          assert p["bets_enabled"] is False
          assert p["positive_ev_proven"] is False
          assert p["source_run_independently_attested"] is False
          assert p["sportsbook_price_receipt_verified"] is False
          PY
      - name: Preserve forward forecast snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-sdv-forward-snapshot-${{ github.event.workflow_run.id }}
          path: artifacts/cfb/cfb_sdv_forward_snapshot.json
          if-no-files-found: warn
          retention-days: 90
