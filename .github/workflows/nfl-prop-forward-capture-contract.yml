name: nfl-prop-forward-capture-contract

on:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/prop_forward_capture.py'
      - 'sportsedge/sports/nfl/draftkings_prop_event_schedule.py'
      - 'tests/test_nfl_prop_forward_capture.py'
      - 'tests/test_nfl_draftkings_prop_event_schedule.py'
      - '.github/workflows/nfl-prop-forward-capture-contract.yml'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run forward capture contracts
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 numpy==2.5.3
          python -m pytest tests/test_nfl_prop_forward_capture.py tests/test_nfl_draftkings_prop_event_schedule.py -q
      - name: Assert state machine remains evidence-only
        run: |
          python - <<'PY'
          from sportsedge.sports.nfl.prop_forward_capture import apply_snapshot
          q={
              'provider_event_id':'e','entity_name_normalized':'p','entity_name':'P',
              'market':'ANYTIME_TD','book_key':'draftkings_direct','side':'YES',
              'line':None,'american_odds':135,'provider':'DRAFTKINGS_WEB_RESEARCH',
          }
          out=apply_snapshot([q],captured_at='2026-09-13T16:30:00+00:00',event_starts={'e':'2026-09-13T18:00:00+00:00'})
          row=out.decisions[0]
          assert row['promotion_authority'] is False
          assert row['model_p_created'] is False
          assert row['reconstructed'] is False
          assert row['backfilled'] is False
          PY
