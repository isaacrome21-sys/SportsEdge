name: nfl-v2g-prospective-outcome-capture

on:
  workflow_dispatch:
  schedule:
    - cron: '47 11 * * *'
  pull_request:
    paths:
      - 'scripts/settle_nfl_v2g_prospective_outcomes.py'
      - 'tests/test_nfl_m2_v2g_outcomes.py'
      - '.github/workflows/nfl-v2g-prospective-outcome-capture.yml'

permissions:
  contents: write

concurrency:
  group: nfl-v2g-prospective-outcome-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1

      - name: Run prospective outcome contract tests
        run: python -m pytest tests/test_nfl_m2_v2g_outcomes.py -q

      - name: Restore immutable predictions and prior outcomes from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add --detach .data-v2g origin/data
          PRED_SRC=.data-v2g/evidence/nfl_v2g/prospective/predictions/2026
          test -d "$PRED_SRC" || { echo 'NFL_V2G_PROSPECTIVE_PREDICTIONS_MISSING' >&2; exit 78; }
          mkdir -p artifacts/football/v2g/prospective/predictions
          cp -R "$PRED_SRC"/. artifacts/football/v2g/prospective/predictions/
          mkdir -p artifacts/football/v2g/prospective/outcomes
          if [ -d .data-v2g/evidence/nfl_v2g/prospective/outcomes/2026 ]; then
            cp -R .data-v2g/evidence/nfl_v2g/prospective/outcomes/2026/. artifacts/football/v2g/prospective/outcomes/
          fi

      - name: Fetch exact current NFL result-source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/v2g/prospective
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            -o artifacts/football/v2g/prospective/games.csv
          sha256sum artifacts/football/v2g/prospective/games.csv

      - name: Capture objective postgame outcomes
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/settle_nfl_v2g_prospective_outcomes.py \
            --predictions-dir artifacts/football/v2g/prospective/predictions \
            --schedule artifacts/football/v2g/prospective/games.csv \
            --output-dir artifacts/football/v2g/prospective/outcomes \
            --settlement-code-git-sha "$GITHUB_SHA" \
            --observed-at-utc "$OBSERVED_AT" \
            --min-hours-after-kickoff 8 \
            | tee artifacts/football/v2g/prospective/outcome_summary.json

      - name: Assert outcome evidence remains non-promoting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.settle_nfl_v2g_prospective_outcomes import validate_outcome

          for path in sorted(Path('artifacts/football/v2g/prospective/outcomes').glob('*.json')):
              row = json.loads(path.read_text(encoding='utf-8'))
              validate_outcome(row)
              for key in (
                  'market_prices_consumed', 'promotion_authority', 'may_create_model_p',
                  'market_eligibility_changed', 'truth_gate_pass_granted', 'official_status_granted',
              ):
                  if row.get(key) is not False:
                      raise SystemExit(f'NFL_V2G_OUTCOME_AUTHORITY_INVALID:{path.name}:{key}')
          PY

      - name: Persist immutable result snapshot and outcomes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SCHEDULE_SHA="$(sha256sum artifacts/football/v2g/prospective/games.csv | awk '{print $1}')"
          SNAPSHOT_DIR=.data-v2g/evidence/nfl_v2g/prospective/outcome_schedule_snapshots
          OUTCOME_DIR=.data-v2g/evidence/nfl_v2g/prospective/outcomes/2026
          mkdir -p "$SNAPSHOT_DIR" "$OUTCOME_DIR"
          SNAPSHOT="$SNAPSHOT_DIR/${SCHEDULE_SHA}.csv"
          if [ -f "$SNAPSHOT" ]; then
            cmp "$SNAPSHOT" artifacts/football/v2g/prospective/games.csv
          else
            cp artifacts/football/v2g/prospective/games.csv "$SNAPSHOT"
          fi
          for src in artifacts/football/v2g/prospective/outcomes/*.json; do
            [ -e "$src" ] || continue
            dst="$OUTCOME_DIR/$(basename "$src")"
            if [ -f "$dst" ]; then
              cmp "$dst" "$src"
            else
              cp "$src" "$dst"
            fi
          done
          (
            cd .data-v2g
            git config user.name sportsedge-v2g-outcome-bot
            git config user.email sportsedge-v2g-outcome-bot@users.noreply.github.com
            git add evidence/nfl_v2g/prospective/outcome_schedule_snapshots evidence/nfl_v2g/prospective/outcomes
            if git diff --cached --quiet; then
              echo 'NFL_V2G_NO_NEW_OUTCOME_BYTES'
              exit 0
            fi
            git commit -m "evidence: capture prospective NFL V2G outcomes ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:data; then
                exit 0
              fi
              git fetch origin data
              git rebase origin/data
              sleep $((attempt * 2))
            done
            exit 98
          )

      - name: Upload outcome diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2g-prospective-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/football/v2g/prospective/outcome_summary.json
            artifacts/football/v2g/prospective/outcomes
          if-no-files-found: warn
          retention-days: 30
