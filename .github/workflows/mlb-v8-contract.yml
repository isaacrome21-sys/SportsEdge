name: mlb-v8-contract

on:
  pull_request:
    paths:
      - 'config/mlb_v8_evidence_policy.json'
      - 'scripts/build_mlb_v8_replay_archive.py'
      - 'scripts/backfill_mlb_v8_the_odds_api.py'
      - 'scripts/capture_mlb_v8_forward_evidence.py'
      - 'scripts/run_mlb_v8_forward_lane.py'
      - 'sportsedge/mlb_context_autopull.py'
      - 'sportsedge/mlb_objective_depth_sources.py'
      - 'sportsedge/statcast_daily_source.py'
      - 'tests/test_mlb_objective_depth_sources.py'
      - 'tests/test_mlb_v8_temporal_guards.py'
      - '.github/workflows/mlb-v8-contract.yml'
      - '.github/workflows/mlb-v8-evidence.yml'
      - '.github/workflows/mlb-v8-replay-backfill.yml'
  push:
    branches: [main]
    paths:
      - 'config/mlb_v8_evidence_policy.json'
      - 'scripts/build_mlb_v8_replay_archive.py'
      - 'scripts/backfill_mlb_v8_the_odds_api.py'
      - 'scripts/capture_mlb_v8_forward_evidence.py'
      - 'scripts/run_mlb_v8_forward_lane.py'
      - 'sportsedge/mlb_context_autopull.py'
      - 'sportsedge/mlb_objective_depth_sources.py'
      - 'sportsedge/statcast_daily_source.py'
      - 'tests/test_mlb_objective_depth_sources.py'
      - 'tests/test_mlb_v8_temporal_guards.py'
      - '.github/workflows/mlb-v8-contract.yml'
      - '.github/workflows/mlb-v8-evidence.yml'
      - '.github/workflows/mlb-v8-replay-backfill.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V8 evidence and objective-depth code
        run: |
          python -m py_compile \
            scripts/build_mlb_v8_replay_archive.py \
            scripts/backfill_mlb_v8_the_odds_api.py \
            scripts/capture_mlb_v8_forward_evidence.py \
            scripts/run_mlb_v8_forward_lane.py \
            sportsedge/mlb_context_autopull.py \
            sportsedge/mlb_objective_depth_sources.py \
            sportsedge/statcast_daily_source.py \
            tests/test_mlb_objective_depth_sources.py \
            tests/test_mlb_v8_temporal_guards.py
      - name: Run isolated V8 evidence self-tests
        run: |
          python scripts/build_mlb_v8_replay_archive.py --self-test
          python scripts/backfill_mlb_v8_the_odds_api.py --self-test
          python scripts/capture_mlb_v8_forward_evidence.py --self-test
          python scripts/run_mlb_v8_forward_lane.py --self-test
      - name: Run composed Statcast objective-depth regression tests
        run: python -m unittest -v tests.test_mlb_objective_depth_sources
      - name: Run V8 temporal leakage regression tests
        run: python -m unittest -v tests.test_mlb_v8_temporal_guards
      - name: Enforce frozen V8 governance
        run: |
          python - <<'PY'
          import json
          p=json.load(open('config/mlb_v8_evidence_policy.json'))
          assert p['policy_id'] == 'MLB_V8_EVIDENCE_V1'
          assert p['fail_closed'] is True
          assert p['effective_forward_date_ct'] == '2026-09-03'
          assert p['replay_window'] == {'start_date':'2026-03-01','end_date':'2026-08-31'}
          assert p['rules']['never_relabel_open_or_close_as_decision_snapshot'] is True
          assert p['rules']['paired_decision_close_required_for_clv'] is True
          assert p['promotion']['replay_alone_may_promote_v8'] is False
          assert p['promotion']['forward_holdout_required'] is True
          print('MLB_V8_CONTRACT_OK')
          PY
