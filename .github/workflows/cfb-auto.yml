name: cfb auto

on:
  workflow_dispatch:
    inputs:
      board_json:
        description: "DraftKings board JSON transcribed from the user's screenshots. Required; no sportsbook API is used."
        required: true
        type: string
      season:
        description: "Optional CFB season. Blank uses the current year."
        required: false
        type: string
      week:
        description: "Optional CFB week. Blank discovers the next future FBS week from CFBD."
        required: false
        type: string
      asof:
        description: "Optional timezone-aware ISO timestamp. Blank uses runner UTC now."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cfb-auto
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      CFB_MANUAL_BOARD_JSON: ${{ inputs.board_json }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run frozen CFB model against screenshot-supplied lines
        id: run
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_ASOF: ${{ inputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/run_it
          card="artifacts/run_it/cfb_auto_card_$(date -u +%F).json"
          args=(--output "$card" --bookmaker draftkings)
          [ -z "$INPUT_SEASON" ] || args+=(--season "$INPUT_SEASON")
          [ -z "$INPUT_WEEK" ] || args+=(--week "$INPUT_WEEK")
          [ -z "$INPUT_ASOF" ] || args+=(--asof "$INPUT_ASOF")
          set +e
          python scripts/run_cfb_auto.py "${args[@]}"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "card_path=$card" >> "$GITHUB_OUTPUT"

      - name: Assert manual-line card contract
        if: always()
        env:
          CARD_PATH: ${{ steps.run.outputs.card_path }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ.get("CARD_PATH") or "")
          if not path.is_file():
              raise SystemExit("CFB_AUTO_CARD_MISSING")
          card = json.loads(path.read_text())
          gov = card.get("governance") or {}
          if gov.get("sportsbook_api_used") is not False:
              raise SystemExit("CFB_AUTO_SPORTSBOOK_API_GUARD_FAILED")
          if gov.get("manual_market_board_required") is not True:
              raise SystemExit("CFB_AUTO_MANUAL_BOARD_GUARD_FAILED")

          if card.get("status") != "SUCCESS":
              raise SystemExit("CFB_AUTO_BLOCKED:" + str(card.get("blocker")))

          if card.get("market_input_source") != "MANUAL_SCREENSHOT_BOARD":
              raise SystemExit("CFB_AUTO_MARKET_SOURCE_INVALID")
          if card.get("run_status") not in {"READY", "BLOCKED", "DEGRADED"}:
              raise SystemExit("CFB_AUTO_RUN_STATUS_INVALID")

          report = card.get("report") or {}
          rows = report.get("results") or []
          if not rows:
              raise SystemExit("CFB_AUTO_NO_MARKET_ROWS")
          if any(row.get("engine_status") != "PRICED" for row in rows):
              raise SystemExit("CFB_AUTO_UNPRICED_MARKET_ROW")
          allowed = {"OFFICIAL_BET", "BLOCKED"}
          allowed_reasons = {"EDGE_POSITIVE", "NO_EDGE", "PAIRED_PRICE_REQUIRED_FOR_DEVIG", "CFB_QUOTE_STALE", "CFB_SETTLED_SAMPLE_SPACE_EMPTY", "NO_ENGINE"}
          for row in rows:
              if row.get("bet_status") not in allowed:
                  raise SystemExit("CFB_AUTO_BET_STATUS_INVALID")
              if row.get("bet_status") == "OFFICIAL_BET" and row.get("reason") != "EDGE_POSITIVE":
                  raise SystemExit("CFB_AUTO_BET_REASON_INVALID")
              if row.get("reason") not in allowed_reasons and row.get("bet_status") != "OFFICIAL_BET":
                  raise SystemExit("CFB_AUTO_ROW_REASON_INVALID:" + str(row.get("reason")))
          bets = sum(row.get("bet_status") == "OFFICIAL_BET" for row in rows)
          print(
              "CFB_AUTO_CARD_OK "
              f"rows={len(rows)} bets={bets} run_status={card['run_status']} "
              "market_source=MANUAL_SCREENSHOT_BOARD"
          )
          summary = card.get("summary") or {}
          if summary.get("both_sides") is not True or summary.get("catalog_complete") is not True:
              raise SystemExit("CFB_AUTO_PROP_SIDE_TOTAL_INCOMPLETE")
          if int(summary.get("prop_rows") or 0) < 40 or int(summary.get("side_rows") or 0) < 16 or int(summary.get("total_rows") or 0) < 10:
              raise SystemExit("CFB_AUTO_PROP_SIDE_TOTAL_COVERAGE")
          PY

      - name: Render CFB both-side board
        if: always() && steps.run.outputs.card_path != ''
        env:
          CARD_PATH: ${{ steps.run.outputs.card_path }}
        run: python scripts/render_football_board_card.py --engine-output "$CARD_PATH" --out-dir artifacts/cfb_myspari

      - name: Upload CFB auto card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-auto-card
          path: |
            artifacts/run_it/cfb_auto_card_*.json
            artifacts/cfb_myspari/
          if-no-files-found: error
          retention-days: 14
