name: cfb auto

on:
  workflow_dispatch:
    inputs:
      board_json:
        description: "DraftKings board JSON transcribed from the user's screenshots. Required; no sportsbook API is used."
        required: true
        type: string
      season:
        description: "Optional CFB season. Blank uses the current year."
        required: false
        type: string
      week:
        description: "Optional CFB week. Blank discovers the next future FBS week from CFBD."
        required: false
        type: string
      asof:
        description: "Optional timezone-aware ISO timestamp. Blank uses runner UTC now."
        required: false
        type: string
  pull_request:
    paths:
      - scripts/run_auto_cfb_resilient.py
      - scripts/render_cfb_myspari_card.py
      - tests/test_run_auto_cfb_resilient.py
      - .github/workflows/cfb-auto.yml

permissions:
  contents: read

concurrency:
  group: cfb-auto
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      CFB_MANUAL_BOARD_JSON: ${{ inputs.board_json }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Test selected PRIOR_CURRENT_BLEND card emit
        if: github.event_name == 'pull_request'
        run: python -m unittest tests.test_run_auto_cfb_resilient -v

      - name: Run selected PRIOR_CURRENT_BLEND card against screenshot-supplied lines
        id: run
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_ASOF: ${{ inputs.asof }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/run_it artifacts/cfb_myspari
          card="artifacts/live_cfb_card.json"
          args=(--output "$card")
          [ -z "$INPUT_SEASON" ] || args+=(--season "$INPUT_SEASON")
          [ -z "$INPUT_WEEK" ] || args+=(--week "$INPUT_WEEK")
          [ -z "$INPUT_ASOF" ] || args+=(--asof "$INPUT_ASOF")
          set +e
          python scripts/run_auto_cfb_resilient.py "${args[@]}"
          rc=$?
          set -e
          cp "$card" "artifacts/run_it/cfb_auto_card_$(date -u +%F).json"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "card_path=$card" >> "$GITHUB_OUTPUT"

      - name: Assert manual-line card contract
        if: github.event_name == 'workflow_dispatch'
        env:
          CARD_PATH: ${{ steps.run.outputs.card_path }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ.get("CARD_PATH") or "")
          if not path.is_file():
              raise SystemExit("CFB_AUTO_CARD_MISSING")
          card = json.loads(path.read_text())
          gov = card.get("governance") or {}
          if gov.get("sportsbook_api_used") is not False:
              raise SystemExit("CFB_AUTO_SPORTSBOOK_API_GUARD_FAILED")
          if gov.get("manual_market_board_required") is not True:
              raise SystemExit("CFB_AUTO_MANUAL_BOARD_GUARD_FAILED")
          if gov.get("freeze_status") == "FROZEN" or gov.get("artifact_sha256"):
              raise SystemExit("CFB_AUTO_FREEZE_WITH_NULL_HASH_FORBIDDEN")
          if gov.get("odds_api_called") is not False:
              raise SystemExit("CFB_AUTO_ODDS_API_GUARD_FAILED")
          if card.get("market_input_source") != "MANUAL_SCREENSHOT_BOARD":
              raise SystemExit("CFB_AUTO_MARKET_SOURCE_INVALID")
          funnel = card.get("funnel") or {}
          quotes = int(funnel.get("odds_rows_fetched") or 0)
          if quotes == 0 or card.get("run_status") == "BLOCKED_NO_ODDS":
              raise SystemExit("CFB_AUTO_ZERO_QUOTES")
          if card.get("run_status") != "READY":
              raise SystemExit("CFB_AUTO_MODEL_UNAVAILABLE")
          rows = card.get("results") or []
          if not rows:
              raise SystemExit("CFB_AUTO_NO_MARKET_ROWS")
          if any(row.get("model_p") is None for row in rows):
              raise SystemExit("CFB_AUTO_UNPRICED_MARKET_ROW")
          bets = [
              row for row in rows
              if row.get("model_p") is not None and row.get("edge") is not None and float(row["edge"]) > 0
          ]
          if any(row.get("reason") == "CFB_PROMOTION_EVIDENCE_REQUIRED" for row in rows):
              raise SystemExit("CFB_AUTO_FORCED_PROMOTION_BLOCK")
          if int(funnel.get("bets_emitted") or 0) != len(bets):
              raise SystemExit("CFB_AUTO_BET_EMIT_MISMATCH")
          print(
              "CFB_AUTO_CARD_OK "
              f"rows={len(rows)} bets={len(bets)} run_status={card['run_status']} "
              "market_source=MANUAL_SCREENSHOT_BOARD"
          )
          # Coverage is measured against the manual quotes supplied, not an
          # invented 40-prop/16-side/10-total threshold for a two-game input.
          if int(funnel.get("model_priced") or 0) != len(rows):
              raise SystemExit("CFB_AUTO_MODEL_PRICED_COUNT_MISMATCH")
          PY

      - name: Render CFB phone card
        if: github.event_name == 'workflow_dispatch' && hashFiles('artifacts/live_cfb_card.json') != ''
        run: python scripts/render_cfb_myspari_card.py --engine-output artifacts/live_cfb_card.json --out-dir artifacts/cfb_myspari
      - name: Render CFB both-side board
        if: always() && steps.run.outputs.card_path != ''
        env:
          CARD_PATH: ${{ steps.run.outputs.card_path }}
        run: python scripts/render_football_board_card.py --engine-output "$CARD_PATH" --out-dir artifacts/cfb_myspari

      - name: Upload CFB auto card
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-auto-card
          path: |
            artifacts/live_cfb_card.json
            artifacts/run_it/cfb_auto_card_*.json
            artifacts/cfb_myspari/
          if-no-files-found: error
          retention-days: 14
