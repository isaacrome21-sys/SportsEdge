name: pinnacle-football-market-shape-probe

# Read-only direct Pinnacle NFL capture + primary-market normalizer proof.
# Pull requests run deterministic tests only. A merge/path-filtered push performs
# one live capture, SHA-binds the raw bytes, normalizes primary period-0 markets,
# and preserves both raw and normalized artifacts. Zero predictive/wager authority.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_direct_market_feeds.py'
      - 'scripts/probe_pinnacle_football_market_shape.py'
      - 'scripts/normalize_pinnacle_nfl_markets.py'
      - 'tests/test_pinnacle_football_market_shape_probe.py'
      - 'tests/test_normalize_pinnacle_nfl_markets.py'
      - '.github/workflows/pinnacle-football-market-shape-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_direct_market_feeds.py'
      - 'scripts/probe_pinnacle_football_market_shape.py'
      - 'scripts/normalize_pinnacle_nfl_markets.py'
      - 'tests/test_pinnacle_football_market_shape_probe.py'
      - 'tests/test_normalize_pinnacle_nfl_markets.py'
      - '.github/workflows/pinnacle-football-market-shape-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify deterministic zero-authority contracts
        run: |
          python -m unittest tests.test_pinnacle_football_market_shape_probe -v
          python -m unittest tests.test_normalize_pinnacle_nfl_markets -v

      - name: Capture live matchup and straight-market shapes
        if: github.event_name != 'pull_request'
        id: live
        continue-on-error: true
        run: |
          mkdir -p artifacts/pinnacle-football-market-shape
          python -m scripts.probe_pinnacle_football_market_shape \
            --out-dir artifacts/pinnacle-football-market-shape \
            --status-out artifacts/pinnacle-football-market-shape/status.json

      - name: Enforce reachability and zero authority
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/pinnacle-football-market-shape/status.json
          jq -e '
            .state == "REACHABLE" and
            .authority.model_p_input == false and
            .authority.truth_gate_input == false and
            .authority.promotion_authority == false and
            .authority.eligibility_authority == false and
            .authority.staking_authority == false and
            .authority.official_authority == false and
            .authority.production_registry_authority == false and
            .authority.evidence_clock_authority == false and
            .authority.wager_placement_authority == false
          ' artifacts/pinnacle-football-market-shape/status.json >/dev/null
          jq '{state, reason, selection_rule, football_sport_id, selected_matchup, captures: (.captures | with_entries(.value |= {http_status,content_type,raw_sha256,raw_bytes,shape}))}' \
            artifacts/pinnacle-football-market-shape/status.json

      - name: Normalize live primary NFL markets
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          set -euo pipefail
          status=artifacts/pinnacle-football-market-shape/status.json
          jq -e '.state == "REACHABLE"' "$status" >/dev/null
          markets="$(find artifacts/pinnacle-football-market-shape/raw/pinnacle -maxdepth 1 -type f -name 'straight_markets-*.json' -print -quit)"
          test -n "$markets"
          python -m scripts.normalize_pinnacle_nfl_markets \
            --status "$status" \
            --markets "$markets" \
            --out artifacts/pinnacle-football-market-shape/normalized-primary.json
          jq -e '
            .state == "NORMALIZED" and
            .quote_count == 6 and
            ([.quotes[].market] | unique | sort) == ["h2h","spreads","totals"] and
            ([.quotes[].period] | unique) == [0] and
            ([.quotes[].is_alternate] | unique) == [false] and
            ([.quotes[].timestamp_source] | unique) == ["CAPTURED_AT"] and
            .authority.model_p_input == false and
            .authority.truth_gate_input == false and
            .authority.promotion_authority == false and
            .authority.eligibility_authority == false and
            .authority.staking_authority == false and
            .authority.official_authority == false and
            .authority.production_registry_authority == false and
            .authority.evidence_clock_authority == false and
            .authority.wager_placement_authority == false
          ' artifacts/pinnacle-football-market-shape/normalized-primary.json >/dev/null
          jq '{state,quote_count,scope,skipped,quotes:[.quotes[]|{market,designation,point,american_price,no_vig_probability,provider_version,timestamp_source}]}' \
            artifacts/pinnacle-football-market-shape/normalized-primary.json

      - name: Upload exact shape and normalized artifacts
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinnacle-football-market-shape-${{ github.sha }}
          path: artifacts/pinnacle-football-market-shape
          if-no-files-found: error
