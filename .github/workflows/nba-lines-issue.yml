name: nba-lines-issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: nba-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  card:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'nba-lines') || startsWith(github.event.issue.title, '[NBA LINES]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run NBA card
        id: card
        env:
          BODY: ${{ github.event.issue.body }}
          OBSERVED: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > issue_body.txt
          if PYTHONPATH=. python scripts/run_nba_lines_issue.py                --body-file issue_body.txt                --observed-at "$OBSERVED"                --issue "$ISSUE"                --out artifacts/nba/card.md; then
            gh issue comment "$ISSUE" --body-file artifacts/nba/card.md
          else
            if [[ -s intake_error.txt ]]; then
              { echo "Couldn't run the NBA card:"; echo; echo '~~~'; cat intake_error.txt; echo '~~~'; } > fail.md
            else
              echo "The NBA card run failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > fail.md
            fi
            gh issue comment "$ISSUE" --body-file fail.md
            exit 1
          fi

      - name: Persist NBA research capture and card
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          test -s issue_body.txt
          test -s artifacts/nba/card.md
          dest="ledger/nba_captures/issue-${ISSUE_NUMBER}"
          mkdir -p "$dest"
          cp issue_body.txt "$dest/issue_body.txt"
          cp artifacts/nba/card.md "$dest/card.md"
          printf '%s\n' "$ISSUE_UPDATED_AT" > "$dest/issue_updated_at.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          if git diff --cached --quiet; then
            echo "No NBA capture changes"
            exit 0
          fi
          git commit -m "Record NBA research capture for issue #${ISSUE_NUMBER}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
