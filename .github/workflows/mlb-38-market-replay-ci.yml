name: mlb-38-market-replay-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sportsedge/sports/mlb/**'
      - 'sportsedge/mlb_promotion_replay.py'
      - 'sportsedge/quote_bridge.py'
      - 'scripts/mlb_38_market_replay.py'
      - 'scripts/mlb_build_historical_request_plan.py'
      - 'scripts/mlb_ingest_historical_event_snapshot.py'
      - 'scripts/mlb_pit_replay_metrics.py'
      - 'tests/test_mlb_38_market_replay.py'
      - 'tests/test_mlb_historical_event_request_plan.py'
      - 'tests/test_mlb_pit_replay_metrics.py'
      - 'tests/test_mlb_provider_market_catalog.py'
      - 'tests/test_mlb_the_odds_api_materializer.py'
      - 'tests/test_mlb_the_odds_api_pairing_props.py'
      - 'config/mlb_replay_policy_v1.json'
      - 'config/mlb_market_catalog.json'
      - '.github/workflows/mlb-38-market-replay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-38-market-replay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile replay surface
        run: |
          python -m py_compile \
            sportsedge/sports/mlb/provider_market_catalog.py \
            sportsedge/sports/mlb/historical_event_request_plan.py \
            sportsedge/sports/mlb/historical_event_snapshot_ingest.py \
            sportsedge/sports/mlb/the_odds_api_materializer.py \
            sportsedge/sports/mlb/the_odds_api_pairing.py \
            sportsedge/mlb_promotion_replay.py \
            scripts/mlb_38_market_replay.py \
            scripts/mlb_build_historical_request_plan.py \
            scripts/mlb_ingest_historical_event_snapshot.py \
            scripts/mlb_pit_replay_metrics.py
      - name: Run 38-market replay tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_mlb_provider_market_catalog.py \
            tests/test_mlb_historical_event_request_plan.py \
            tests/test_mlb_the_odds_api_materializer.py \
            tests/test_mlb_the_odds_api_pairing_props.py \
            tests/test_mlb_pit_replay_metrics.py \
            tests/test_mlb_38_market_replay.py
      - name: Assert governance boundary remains non-authoritative
        run: |
          set -euo pipefail
          ! grep -R 'official_status_granted.: true' scripts/mlb_38_market_replay.py scripts/mlb_pit_replay_metrics.py
          ! grep -R 'eligibility_changed.: true' scripts/mlb_38_market_replay.py scripts/mlb_pit_replay_metrics.py
          ! grep -R 'model_p_created.: true' scripts/mlb_38_market_replay.py scripts/mlb_pit_replay_metrics.py
