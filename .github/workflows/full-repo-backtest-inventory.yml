name: full-repo-backtest-inventory

on:
  pull_request:
    paths:
      - '.github/workflows/full-repo-backtest-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Record reproducibility metadata and backtest entrypoint inventory
        run: |
          mkdir -p audit-output
          git rev-parse HEAD > audit-output/commit.txt
          python --version > audit-output/python.txt
          python -m pip freeze > audit-output/dependencies.txt
          find scripts sportsedge tests -type f \( -iname '*backtest*' -o -iname '*walkforward*' -o -iname '*evaluation*' -o -iname '*calibrat*' \) | sort > audit-output/candidate-entrypoints.txt
          find . -maxdepth 4 -type f \( -iname '*backtest*.yml' -o -iname '*backtest*.yaml' \) | sort > audit-output/backtest-workflows.txt
          git status --porcelain > audit-output/status-before.txt
      - name: Run complete repository test suite
        run: |
          set -o pipefail
          python -m pytest -q tests --junitxml=audit-output/pytest.xml 2>&1 | tee audit-output/pytest.log
      - name: Capture final repository state
        if: always()
        run: git status --porcelain > audit-output/status-after.txt
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-repo-backtest-inventory-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
