name: archive-smoke

on:
  pull_request:
    paths:
      - 'scripts/archive_raw_game_odds.py'
      - 'scripts/run_mlb_archive_lane.py'
      - 'tests/test_mlb_archive_lane.py'
      - '.github/workflows/archive-mlb-game-odds.yml'
      - '.github/workflows/archive-mlb-game-odds-failover.yml'
      - '.github/workflows/archive-mlb-game-odds-backup-dispatch.yml'
      - '.github/workflows/auto-mlb.yml'
      - '.github/workflows/archive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive scripts stay stdlib-only
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for filename in (
              'scripts/archive_raw_game_odds.py',
              'scripts/run_mlb_archive_lane.py',
          ):
              tree = ast.parse(Path(filename).read_text())
              bad = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name == 'sportsedge' or alias.name.startswith('sportsedge.'):
                              bad.append(alias.name)
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module == 'sportsedge' or module.startswith('sportsedge.'):
                          bad.append(module)
              if bad:
                  raise SystemExit(f'{filename} must not import sportsedge/*: {sorted(set(bad))}')
          print('Archive scripts are stdlib-only')
          PY
      - name: Compile archive lane in isolated mode
        run: >-
          python -I -m py_compile
          scripts/archive_raw_game_odds.py
          scripts/run_mlb_archive_lane.py
      - name: Run raw archive helper self-test
        run: python -I scripts/archive_raw_game_odds.py --self-test
      - name: Run durable archive lane self-test
        run: python -I scripts/run_mlb_archive_lane.py --self-test
      - name: Run archive durability contract tests
        run: python -m unittest tests.test_mlb_archive_lane -v
