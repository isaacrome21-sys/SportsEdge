name: archive-smoke

on:
  pull_request:
    paths:
      - 'scripts/archive_raw_game_odds.py'
      - '.github/workflows/archive-mlb-game-odds.yml'
      - '.github/workflows/archive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Verify no sportsedge imports
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('scripts/archive_raw_game_odds.py').read_text())
          bad = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name == 'sportsedge' or alias.name.startswith('sportsedge.'):
                          bad.append(alias.name)
              elif isinstance(node, ast.ImportFrom):
                  module = node.module or ''
                  if module == 'sportsedge' or module.startswith('sportsedge.'):
                      bad.append(module)
          if bad:
              raise SystemExit(f'Archive must not import sportsedge/*: {sorted(set(bad))}')
          print('No sportsedge imports found')
          PY
      - name: Verify durable ledger workflow contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/archive-mlb-game-odds.yml').read_text()
          required = [
              'permissions:\n  contents: write',
              'git fetch --depth=1 origin data:data',
              'git worktree add .data-branch data',
              'runtime/odds-budget/ledger.json',
              'runtime/archive-status/',
              'git push origin HEAD:data',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing durable archive contract: {missing}')
          forbidden = ['actions/cache@', 'save-always:']
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f'Archive workflow must not depend on ephemeral Actions cache: {found}')
          print('Durable data-branch ledger contract verified')
          PY
      - name: Compile in isolated mode
        run: python -I -m py_compile scripts/archive_raw_game_odds.py
      - name: Run bare stdlib self-test
        run: python -I scripts/archive_raw_game_odds.py --self-test
