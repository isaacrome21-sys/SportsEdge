name: archive-smoke

on:
  pull_request:
    paths:
      - 'scripts/archive_raw_game_odds.py'
      - '.github/workflows/archive-mlb-game-odds.yml'
      - '.github/workflows/archive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify no sportsedge imports
        shell: bash
        run: |
          if grep -Eq '(^|[[:space:]])(from|import)[[:space:]]+sportsedge' scripts/archive_raw_game_odds.py; then
            echo 'Archive must not import sportsedge/*' >&2
            exit 1
          fi
      - name: Compile in isolated mode
        run: python -I -m py_compile scripts/archive_raw_game_odds.py
      - name: Run bare stdlib self-test
        run: python -I scripts/archive_raw_game_odds.py --self-test
