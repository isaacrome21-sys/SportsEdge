name: cfb candidate prereg refreeze bootstrap

on:
  push:
    branches:
      - cfb/verified-candidate-prereg-refreeze-v2

permissions:
  contents: write

env:
  REFREEZE_SHA: f23d08bcc48c24368a78447c230a4f626afe1178
  REFREEZE_AT: '2026-09-17T11:36:44Z'
  TRIGGER_SHA: 9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170

jobs:
  materialize-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: cfb/verified-candidate-prereg-refreeze-v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Materialize exact verified prereg refreeze disposition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          bundle = next(
              row for row in registry['bundles']
              if row['bundle_id'] == 'CFB_CANDIDATE_PREREG_FREEZE_V1'
          )
          prior = bundle.get('disposition') or {}
          if prior.get('state') != 'REVOKED':
              raise SystemExit('CFB_CANDIDATE_BOOTSTRAP_EXPECTED_REVOKED_START')
          if prior.get('prior_forward_clock_invalidated') is not True:
              raise SystemExit('CFB_CANDIDATE_BOOTSTRAP_EXPECTED_INVALIDATED_PRIOR_CLOCK')

          trigger = next(
              row for row in registry['deltas']
              if int(row.get('pr') or 0) == 791
          )
          if trigger.get('merge_sha') != os.environ['TRIGGER_SHA']:
              raise SystemExit('CFB_CANDIDATE_BOOTSTRAP_TRIGGER_SHA_DRIFT')

          bundle['disposition'] = {
              'state': 'REFROZEN',
              'verification_schema': 'CFB_CANDIDATE_PREREG_REFREEZE_V1',
              'prior_bundle_freeze_sha': bundle['freeze_sha'],
              'trigger_delta_sha': os.environ['TRIGGER_SHA'],
              'new_bundle_id': 'CFB_CANDIDATE_PREREG_FREEZE_V2',
              'new_freeze_sha': os.environ['REFREEZE_SHA'],
              'forward_clock_restart_at': os.environ['REFREEZE_AT'],
              'prior_forward_clock_invalidated': True,
              'row_admissibility_semantics': 'PREREGISTRATION_ONLY_NO_EVALUATION_ROWS_V1',
              'selection_scope_only': True,
              'reason': 'MACHINE_VERIFIED_CANDIDATE_PREREG_BYTES_AND_CODE_MANIFEST; PR791_IN_ANCESTRY; ZERO_ATTEMPTS; NO_EVALUATION_ROWS; REFROZEN_FAIL_CLOSED_FOR_SELECTION_SCOPE_ONLY',
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'eligibility': False,
                  'staking': False,
                  'official': False,
                  'validation_attempt': False,
              },
          }
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - name: Prove prereg and verified-refreeze contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cfb_model_selection_prereg.py --out /tmp/cfb_candidate_prereg.json
          python -m pytest -q \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_reconciliation_catchup_pr791.py
          python scripts/build_reconciliation_registry_view.py \
            --output-policy /tmp/freeze_inventory_policy_effective.json \
            --output-registry /tmp/freeze_reconciliation_registry_effective.json \
            --attestation /tmp/reconciliation_coverage_attestation.json
          python scripts/reconcile_freeze_deltas.py \
            --registry /tmp/freeze_reconciliation_registry_effective.json \
            --current-main-ref origin/main \
            --output /tmp/freeze_reconciliation_report.json

      - name: Remove bootstrap and retain only governed change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cfb-candidate-prereg-refreeze-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/cfb-candidate-prereg-refreeze-bootstrap.yml
          git commit -m 'CFB: materialize machine-verified candidate prereg refreeze'
          git push origin HEAD:cfb/verified-candidate-prereg-refreeze-v2
