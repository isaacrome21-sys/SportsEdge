name: temp-reconcile-post713-patcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-reconcile-post713-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/reconcile-post-713-terminal-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/reconcile-post-713-terminal-merge
          fetch-depth: 0
      - name: Apply terminal-merge reconciliation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          MAIN = '4564a9d2ccd7a55b0547a4ebd5a1b714850aab99'
          registry_path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(registry_path.read_text())
          additions = [
              {
                  'delta_id': 'PR_705_RECONCILIATION_RELEASE_MERGE',
                  'pr': 705,
                  'merge_sha': '3fa151b22fb619031bde2fd7cbd75e1ee9c64471',
                  'note': 'The reconciliation release merge itself advanced main beyond the pre-merge registered point; registered here so the self-aging transition is explicit.'
              },
              {
                  'delta_id': 'PR_712_NFL_CAPTURE_INTEGRITY',
                  'pr': 712,
                  'merge_sha': 'a75250bfd5881c0cafe82a47a877d9ea764fc203',
                  'note': 'NFL 2026 capture-integrity hardening; exact-head reconciliation previously stopped before coverage/inventory/delta evaluation because the registry had self-aged after PR 705.'
              },
              {
                  'delta_id': 'PR_713_NFL_CAPTURE_QUARANTINE',
                  'pr': 713,
                  'merge_sha': MAIN,
                  'note': 'Quarantines unreconciled NFL capture rows while preserving no-backfill collection and repairs due-gate self-concealment.'
              },
          ]
          existing = {row['delta_id'] for row in registry['deltas']}
          for row in additions:
              if row['delta_id'] not in existing:
                  registry['deltas'].append(row)
          registry['reconciled_through_sha'] = MAIN
          registry_path.write_text(json.dumps(registry, indent=2) + '\n')

          module = Path('sportsedge/governance/freeze_reconciliation.py')
          text = module.read_text()
          anchor = '''def _covered(path: str, bundle: Mapping[str, Any]) -> bool:\n'''
          helper = '''TERMINAL_RECONCILIATION_MERGE_PATH_PREFIXES = (\n    "config/freeze_reconciliation_",\n    "sportsedge/governance/freeze_reconciliation.py",\n    "scripts/audit_freeze_inventory.py",\n    "scripts/build_reconciliation_registry_view.py",\n    "scripts/reconcile_freeze_deltas.py",\n    "tests/test_freeze_",\n    "tests/test_reconcile_freeze_deltas_cli.py",\n)\n\n\ndef main_matches_reconciliation_boundary(\n    repo: Path,\n    *,\n    policy: Mapping[str, Any],\n    reconciled_through_sha: str,\n    current_main_ref: str,\n) -> bool:\n    \"\"\"Accept exact equality or one reconciliation-only merge commit.\n\n    The merge exception is deliberately narrow: current main must be a two-parent\n    merge whose first parent is the exact registered reconciliation point, every\n    changed path must be reconciliation machinery, and the policy must remain\n    zero-authority. Any later ordinary main movement fails closed again.\n    \"\"\"\n    reconciled = resolve_sha(repo, reconciled_through_sha)\n    current = resolve_sha(repo, current_main_ref)\n    if current == reconciled:\n        return True\n    if any(bool(value) for value in (policy.get("authority") or {}).values()):\n        return False\n    parents = _git(repo, "rev-list", "--parents", "-n", "1", current).stdout.strip().split()\n    if len(parents) != 3:\n        return False\n    _, first, _second = parents\n    if first != reconciled:\n        return False\n    paths = changed_paths(repo, first, current)\n    if not paths:\n        return False\n    return all(\n        any(path.startswith(prefix) for prefix in TERMINAL_RECONCILIATION_MERGE_PATH_PREFIXES)\n        for path in paths\n    )\n\n\n'''
          if 'def main_matches_reconciliation_boundary(' not in text:
              if anchor not in text:
                  raise SystemExit('HELPER_INSERT_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    reconciled_through = resolve_sha(repo, str(registry["reconciled_through_sha"]))\n    if current_main_sha != reconciled_through:\n        blocks.append(\n            f"MAIN_ADVANCED_BEYOND_RECONCILIATION:{reconciled_through}:{current_main_sha}"\n        )\n'''
          new = '''    reconciled_through = resolve_sha(repo, str(registry["reconciled_through_sha"]))\n    if not main_matches_reconciliation_boundary(\n        repo,\n        policy=policy,\n        reconciled_through_sha=reconciled_through,\n        current_main_ref=current_main_sha,\n    ):\n        blocks.append(\n            f"MAIN_ADVANCED_BEYOND_RECONCILIATION:{reconciled_through}:{current_main_sha}"\n        )\n'''
          if old not in text:
              raise SystemExit('REPORT_REPLACEMENT_ANCHOR_NOT_FOUND')
          text = text.replace(old, new, 1)
          module.write_text(text)

          test_path = Path('tests/test_freeze_reconciliation.py')
          test = test_path.read_text()
          import_old = '''    build_reconciliation_report,\n    reconcile_delta_bundle,\n)'''
          import_new = '''    build_reconciliation_report,\n    main_matches_reconciliation_boundary,\n    reconcile_delta_bundle,\n)'''
          if 'main_matches_reconciliation_boundary,' not in test:
              if import_old not in test:
                  raise SystemExit('TEST_IMPORT_ANCHOR_NOT_FOUND')
              test = test.replace(import_old, import_new, 1)
          assert_old = '''    current_main = _git(Path.cwd(), "rev-parse", "origin/main")\n    assert registry["reconciled_through_sha"] == current_main\n    assert registry["deltas"][-1]["merge_sha"] == current_main\n'''
          assert_new = '''    current_main = _git(Path.cwd(), "rev-parse", "origin/main")\n    assert main_matches_reconciliation_boundary(\n        Path.cwd(),\n        policy=policy,\n        reconciled_through_sha=registry["reconciled_through_sha"],\n        current_main_ref=current_main,\n    )\n    assert registry["deltas"][-1]["merge_sha"] == registry["reconciled_through_sha"]\n'''
          if assert_old not in test:
              raise SystemExit('TEST_ASSERT_ANCHOR_NOT_FOUND')
          test = test.replace(assert_old, assert_new, 1)

          insertion_anchor = '''\ndef test_invalid_non_unconditional_policy_fails_closed(repo: dict[str, object]) -> None:\n'''
          extra = '''\ndef test_terminal_reconciliation_merge_is_narrow_and_self_closing(repo: dict[str, object]) -> None:\n    root = repo["root"]\n    reconciled = str(repo["inventory_drift"])\n    _git(root, "switch", "-c", "reconcile-terminal")\n    (root / "config").mkdir(exist_ok=True)\n    (root / "config" / "freeze_reconciliation_terminal_note.json").write_text("{}\\n")\n    branch_head = _commit(root, "reconciliation-only terminal change")\n    _git(root, "switch", "main")\n    _git(root, "merge", "--no-ff", branch_head, "-m", "merge reconciliation terminal")\n    merge_sha = _git(root, "rev-parse", "HEAD")\n    assert main_matches_reconciliation_boundary(\n        root,\n        policy=_policy(),\n        reconciled_through_sha=reconciled,\n        current_main_ref=merge_sha,\n    )\n    (root / "other.txt").write_text("ordinary movement\\n")\n    ordinary = _commit(root, "ordinary main movement")\n    assert not main_matches_reconciliation_boundary(\n        root,\n        policy=_policy(),\n        reconciled_through_sha=reconciled,\n        current_main_ref=ordinary,\n    )\n\n\ndef test_terminal_reconciliation_merge_rejects_nonreconciliation_path(repo: dict[str, object]) -> None:\n    root = repo["root"]\n    reconciled = str(repo["inventory_drift"])\n    _git(root, "switch", "-c", "bad-terminal")\n    (root / "other.txt").write_text("not governance only\\n")\n    branch_head = _commit(root, "non-reconciliation change")\n    _git(root, "switch", "main")\n    _git(root, "merge", "--no-ff", branch_head, "-m", "merge bad terminal")\n    current = _git(root, "rev-parse", "HEAD")\n    assert not main_matches_reconciliation_boundary(\n        root,\n        policy=_policy(),\n        reconciled_through_sha=reconciled,\n        current_main_ref=current,\n    )\n\n'''
          if 'test_terminal_reconciliation_merge_is_narrow_and_self_closing' not in test:
              if insertion_anchor not in test:
                  raise SystemExit('TEST_INSERT_ANCHOR_NOT_FOUND')
              test = test.replace(insertion_anchor, extra + insertion_anchor, 1)
          test_path.write_text(test)
          PY

          git rm .github/workflows/temp-reconcile-post713-patcher.yml
          git config user.name 'sportsedge-reconciliation[bot]'
          git config user.email 'sportsedge-reconciliation@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json sportsedge/governance/freeze_reconciliation.py tests/test_freeze_reconciliation.py
          git commit -m 'Governance: reconcile through #713 and close terminal merge seam'
          git push origin HEAD:fix/reconcile-post-713-terminal-merge
