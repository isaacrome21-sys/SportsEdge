name: mlb-additional-pit-archive

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request:
    paths:
      - 'scripts/archive_mlb_additional_odds.py'
      - 'sportsedge/additional_mlb_odds_source.py'
      - 'sportsedge/odds_budget.py'
      - 'sportsedge/odds_event_snapshot.py'
      - 'sportsedge/odds_keyring.py'
      - 'sportsedge/runtime.py'
      - 'tests/test_archive_mlb_additional_odds.py'
      - 'tests/test_odds_budget.py'
      - 'tests/test_odds_keyring.py'
      - 'tests/test_additional_binary_quote_provenance.py'
      - '.github/workflows/mlb-additional-pit-archive.yml'
  push:
    paths:
      - 'scripts/archive_mlb_additional_odds.py'
      - 'sportsedge/additional_mlb_odds_source.py'
      - 'sportsedge/odds_budget.py'
      - 'sportsedge/odds_event_snapshot.py'
      - 'sportsedge/odds_keyring.py'
      - 'sportsedge/runtime.py'
      - 'tests/test_archive_mlb_additional_odds.py'
      - 'tests/test_odds_budget.py'
      - 'tests/test_odds_keyring.py'
      - 'tests/test_additional_binary_quote_provenance.py'
      - '.github/workflows/mlb-additional-pit-archive.yml'

permissions:
  contents: write

# Shared paid-provider lock: two scheduled lanes must never spend from the same
# durable ledger concurrently.
concurrency:
  group: sportsedge-odds-api-paid-acquisition
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Compile additional PIT lane without model dependencies
        run: python -m py_compile scripts/archive_mlb_additional_odds.py sportsedge/additional_mlb_odds_source.py sportsedge/odds_budget.py sportsedge/odds_event_snapshot.py sportsedge/runtime.py
      - name: Prove acquisition import does not require NumPy
        run: python -I -c "import sys; sys.path.insert(0, '.'); import sportsedge.quote_bridge; import sportsedge.runtime; assert 'numpy' not in sys.modules"
      - name: Self-test additional PIT lane
        run: python scripts/archive_mlb_additional_odds.py --self-test
      - name: Run additional PIT archive tests
        run: python -m unittest discover -s tests -p 'test_archive_mlb_additional_odds.py'
      - name: Run odds budget tests
        run: python -m unittest discover -s tests -p 'test_odds_budget.py'
      - name: Run keyring quota-stop tests
        run: python -m unittest discover -s tests -p 'test_odds_keyring.py'
      - name: Verify binary participant provenance survives source to archive
        run: python -m unittest discover -s tests -p 'test_additional_binary_quote_provenance.py'
      - name: Recheck additional quote mappings
        run: python -m unittest discover -s tests -p 'test_additional_mlb_odds_source.py'
      - name: Recheck 36-market source capability
        run: python -m unittest discover -s tests -p 'test_mlb_quote_source_coverage.py'

  archive:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      SPORTSEDGE_ODDS_BUDGET_LEDGER: artifacts/odds_budget/ledger.json
      SPORTSEDGE_ODDS_DAILY_CREDIT_CAP: '12'
      SPORTSEDGE_ODDS_PROVIDER_RESERVE_CREDITS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Restore durable provider budget state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/odds_budget
          git fetch --depth=1 origin data:data
          if git cat-file -e data:runtime/odds-budget/ledger.json 2>/dev/null; then
            git show data:runtime/odds-budget/ledger.json > artifacts/odds_budget/ledger.json
          fi
      - name: Capture T-90 additional-market PIT quotes
        id: capture
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/additional_odds/status
          status_file="artifacts/additional_odds/status/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          python scripts/archive_mlb_additional_odds.py | tee "$status_file"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist immutable archive, execution status, and budget to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data:data
          git worktree add .data-branch data
          mkdir -p .data-branch/runtime/mlb-additional-pit .data-branch/runtime/odds-budget
          if [ -d artifacts/additional_odds ]; then
            cp -R artifacts/additional_odds/. .data-branch/runtime/mlb-additional-pit/
          fi
          if [ -f artifacts/odds_budget/ledger.json ]; then
            cp artifacts/odds_budget/ledger.json .data-branch/runtime/odds-budget/ledger.json
          fi
          cd .data-branch
          git config user.name sportsedge-archive-bot
          git config user.email sportsedge-archive-bot@users.noreply.github.com
          git add runtime/mlb-additional-pit runtime/odds-budget
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "archive: MLB additional PIT ${{ github.run_id }}"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort || true; sleep $((attempt * 2)); continue; }
            if git push origin HEAD:data; then
              pushed=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
      - name: Upload archive/status artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-additional-pit-${{ github.run_id }}
          path: |
            artifacts/additional_odds/
            artifacts/odds_budget/
          if-no-files-found: warn
          retention-days: 90
      - name: Propagate capture result after persistence
        if: always()
        shell: bash
        run: |
          code='${{ steps.capture.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Capture step did not emit an exit code.' >&2
            exit 99
          fi
          exit "$code"

# This lane captures quote evidence only. It does not grade outcomes, validate
# sportsbook settlement rules, create historical model scores, or promote markets.
