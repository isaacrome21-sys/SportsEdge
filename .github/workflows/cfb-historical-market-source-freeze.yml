name: cfb-historical-market-source-freeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/research/cfb_historical_market_source_v1.json'
      - 'scripts/materialize_cfb_historical_market_archive.py'
      - 'tests/test_cfb_historical_market_source.py'
      - '.github/workflows/cfb-historical-market-source-freeze.yml'

permissions:
  contents: read

jobs:
  source-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile freeze surface
        run: python -m py_compile scripts/materialize_cfb_historical_market_archive.py tests/test_cfb_historical_market_source.py

      - name: Run fail-closed source contract tests
        run: python -m pytest -q tests/test_cfb_historical_market_source.py

      - name: Materialize and verify exact pinned archive
        run: >-
          python scripts/materialize_cfb_historical_market_archive.py
          --config config/research/cfb_historical_market_source_v1.json
          --attestation-out artifacts/cfb/history/cfb_historical_market_attestation.json
          --archive-out artifacts/cfb/history/cfb_line_odds.csv.gz

      - name: Enforce research-only attestation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/cfb/history/cfb_historical_market_attestation.json').read_text())
          if p.get('status') != 'PASS':
              raise SystemExit('CFB_HISTORICAL_MARKET_ATTESTATION_STATUS_INVALID')
          if p.get('pit_certified') is not False or p.get('clv_authority') is not False:
              raise SystemExit('CFB_HISTORICAL_MARKET_PIT_OR_CLV_AUTHORITY_FORBIDDEN')
          if p.get('promotion_authority') is not False:
              raise SystemExit('CFB_HISTORICAL_MARKET_PROMOTION_AUTHORITY_FORBIDDEN')
          auth=p.get('authority') or {}
          for field in ('model_p_authority','truth_gate_authority','promotion_authority','staking_authority','official_bet_authority'):
              if auth.get(field) is not False:
                  raise SystemExit('CFB_HISTORICAL_MARKET_FORBIDDEN_AUTHORITY:'+field)
          if p['observed']['sha256'] != '7ae899d9035750dccf22470d7923087a2659052aeb37a44204c35fbf6bf38d4d':
              raise SystemExit('CFB_HISTORICAL_MARKET_SHA256_NOT_FROZEN')
          print('observed_sha256='+p['observed']['sha256'])
          print('rows='+str(p['profile']['row_count']))
          print('seasons='+str(p['profile']['season_min'])+'-'+str(p['profile']['season_max']))
          print('books='+str(p['profile']['book_count']))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-historical-market-freeze-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/cfb/history/cfb_historical_market_attestation.json
            artifacts/cfb/history/cfb_line_odds.csv.gz
          if-no-files-found: error
          retention-days: 30
