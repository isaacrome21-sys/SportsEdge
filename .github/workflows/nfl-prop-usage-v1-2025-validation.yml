name: nfl-prop-usage-v1-2025-validation

on:
  push:
    branches:
      - 'grok/nfl/prop-usage-v1-2025-validation'
    paths:
      - '.github/nfl_prop_usage_v1_2025_validation_once'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install frozen validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.5.3 pandas==2.3.3 pyarrow==21.0.0
          pyreadr==0.5.3 pytest==9.1.1

      - name: Compile and test before any target-source access
        run: |
          python -m py_compile \
            sportsedge/research/nfl_prop_usage_v1_validate_2025.py \
            scripts/validate_nfl_prop_usage_v1_2025.py \
            tests/test_nfl_prop_usage_v1_validate_2025.py \
            tests/test_nfl_prop_usage_v1_2025_validation_lock.py
          python -m pytest -q \
            tests/test_nfl_prop_usage_v1_validate_2025.py \
            tests/test_nfl_prop_usage_v1_2025_validation_lock.py \
            tests/test_nfl_prop_usage_v1_fit.py

      - name: Verify canonical prior artifact identities
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11208336341" --jq .digest)" = "sha256:4eb92be476a88b795f849e7f14d95258131e42c40f30dfce19d2bb373b613cf3"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11209170460" --jq .digest)" = "sha256:61f1c05bb6e06285a0f4bf0c1938d006b84eabf2635f1c7ad03837c1864c0332"
          mkdir -p /tmp/prop-fit /tmp/prop-source
          gh run download 36962280655 \
            -n nfl-prop-usage-v1-fit-dfe1914d6c5b70e727c17273dabd0bb033dc816d \
            -D /tmp/prop-fit
          gh run download 36963125590 \
            -n nfl-prop-v1-source-audit-438147dc660b9b62d54ad08511a441a7375cc650 \
            -D /tmp/prop-source
          echo "a1fa75f449183120b3017924873e800502c0098b69fdcb6a98e943b704cab9ac  /tmp/prop-fit/nfl_prop_usage_v1_fit.json" | sha256sum -c -
          echo "ee2de204bfb7e3ef1a5e5d054a448bc761e91acffa8717f252b635d585691560  /tmp/prop-source/source_audit.json" | sha256sum -c -
          echo "67c2b5e598dfa3dfe4ff0f0d1f9e312cf4a5facc34fb0306f242466deda93623  /tmp/prop-source/prekick_inactive_article_audit.json" | sha256sum -c -

      - name: Assert one-look lock before target access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("config/research/nfl_prop_usage_v1_2025_validation_lock.json").read_text())
          assert cfg["status"] == "FROZEN_BEFORE_2025_OUTCOME_ACCESS"
          assert cfg["validation_window"]["status"] == "UNSPENT"
          assert cfg["validation_window"]["one_look"] is True
          assert cfg["validation_window"]["second_look"] is False
          assert cfg["cohort"]["missing_or_ambiguous_evidence"] == "ZERO_MODEL_ROWS"
          assert cfg["source_identity"]["admitted_regular_season_games_with_strict_prekick_inactives"] == 52
          print("NFL_PROP_USAGE_V1_2025_ONE_LOOK_LOCK_OK")
          PY

      - name: Spend single frozen 2025 validation look
        run: >-
          python scripts/validate_nfl_prop_usage_v1_2025.py
          --fit /tmp/prop-fit/nfl_prop_usage_v1_fit.json
          --source-audit /tmp/prop-source/source_audit.json
          --inactive-audit /tmp/prop-source/prekick_inactive_article_audit.json
          --out artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation.json
          --summary-out artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation_summary.json
          --spend-out artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_spend_receipt.json

      - name: Enforce final one-look disposition
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation.json").read_text())
          s=json.loads(Path("artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation_summary.json").read_text())
          spend=json.loads(Path("artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_spend_receipt.json").read_text())
          assert r["status"] in {"VALIDATION_PASS","VALIDATION_FAIL"}
          assert r["validation_window_spent"] is True
          assert s["validation_window_spent"] is True
          assert spend["status"] == "VALIDATION_WINDOW_SPENT_BEFORE_TARGET_SOURCE_ACCESS"
          assert r["post_result_policy"]["v1_retune_allowed"] is False
          assert r["post_result_policy"]["second_2025_look_allowed"] is False
          for key in ("creates_model_p","truth_gate","official","promotion","staking","backfill"):
              assert r["authority"][key] is False
          print(json.dumps({
              "status":r["status"],
              "n_rows":r["n_rows"],
              "n_by_market":r["n_by_market"],
              "metrics":r["metrics"],
              "gates":r["gates"],
              "artifact_sha256":r["artifact_sha256"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-prop-usage-v1-2025-validation-${{ github.sha }}
          path: |
            artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_spend_receipt.json
            artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation.json
            artifacts/nfl_prop_usage_v1/nfl_prop_usage_v1_2025_validation_summary.json
          if-no-files-found: warn
          retention-days: 90
