name: mlb-rays-yankees-canonical-marginals-rerun
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mlb-rays-yankees-canonical-marginals-rerun.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rerun-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Rerun 100k game paths and canonical pitcher marginals
        run: >-
          PYTHONPATH=. python scripts/run_mlb_score_compatible_card_final.py
          --input manual_inputs/mlb/2026-10-07_rays_yankees_supplied.json
          --game-id 'Tampa Bay Rays@New York Yankees'
          --output artifacts/mlb_rays_yankees_20261007_canonical_marginals_rerun.json
          --simulations 100000
      - name: Assert pitcher marginals are not score-conditioned
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/mlb_rays_yankees_20261007_canonical_marginals_rerun.json").read_text())
          pitcher = [r for r in p["results"] if str(r["engine_market"]).startswith("PITCHER_")]
          assert pitcher, "PITCHER_ROWS_MISSING"
          assert len(p["results"]) == 34, "SOME_PAIRED_SIDES_MISSING"
          assert all(r["probability_source"] == "CANONICAL_PITCHER_MARGINAL" for r in pitcher), "CONDITIONED_PITCHER_PRICE_BLOCKED"
          assert all(r["mc_paths"] == 0 for r in pitcher), "PITCHER_ANALYTIC_SOURCE_IDENTITY_MISMATCH"
          assert all(r["postseason_workload_adjusted"] is False for r in pitcher), "UNSUPPORTED_POSTSEASON_WORKLOAD_CLAIM"
          assert all(d["card_status"] == "PASS" for d in p["card"]["decisions"] if d["engine_market"].startswith("PITCHER_")), "UNVALIDATED_PITCHER_RELEASE_BLOCKED"
          print("CANONICAL_PITCHER_MARGINAL_ONLY, paired sides present, pitcher guard intact")
          PY
      - name: Upload corrected research rerun
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-rays-yankees-20261007-canonical-marginals-rerun
          path: artifacts/mlb_rays_yankees_20261007_canonical_marginals_rerun.json
          if-no-files-found: warn
          retention-days: 14
