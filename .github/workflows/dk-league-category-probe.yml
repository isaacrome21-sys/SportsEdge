name: dk-league-category-probe

on:
  workflow_dispatch:
  push:
    branches: [mlb-moneyline-governance-completion]
    paths:
      - '.github/workflows/dk-league-category-probe.yml'
      - 'scripts/probe_dk_league_categories.py'
      - 'tests/test_probe_dk_league_categories.py'
      - 'tests/test_draftkings_game_line_category_map.py'
      - 'sportsedge/draftkings_game_market_source.py'
      - 'requirements-test.txt'

permissions:
  contents: write

concurrency:
  group: dk-league-category-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mlb-moneyline-governance-completion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile and test diagnostic
        run: |
          python -m compileall -q scripts/probe_dk_league_categories.py tests/test_probe_dk_league_categories.py tests/test_draftkings_game_line_category_map.py
          PYTHONPATH=. python -m pytest -q tests/test_probe_dk_league_categories.py tests/test_draftkings_game_line_category_map.py
      - name: Probe MLB and NFL live DraftKings league/category responses
        run: PYTHONPATH=. python scripts/probe_dk_league_categories.py --sports baseball_mlb americanfootball_nfl
      - name: Persist read-only diagnostic artifact on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sportsedge-evidence-bot'
          git config user.email 'sportsedge-evidence-bot@users.noreply.github.com'
          git add artifacts/dk_category_probe/latest.json
          if git diff --cached --quiet; then
            echo 'No diagnostic change.'
            exit 0
          fi
          git commit -m 'DK: store league category probe result'
          git push origin HEAD:mlb-moneyline-governance-completion
