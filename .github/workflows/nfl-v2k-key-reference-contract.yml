name: nfl-v2k-key-reference-contract

on:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/NFL_V2K_EMPIRICAL_KEY_REFERENCE_V1.json'
      - 'tests/test_nfl_v2k_empirical_key_reference.py'
      - '.github/workflows/nfl-v2k-key-reference-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Validate frozen reference schema and invariants
        run: python -m unittest tests.test_nfl_v2k_empirical_key_reference -v
      - name: Assert V2K implementation is still blocked until V2J verdict path permits it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('sportsedge/sports/nfl/NFL_V2K_EMPIRICAL_KEY_REFERENCE_V1.json').read_text())
          assert p['status']=='FROZEN_READY'
          assert p['authority_boundary']['model_p_authority'] is False
          assert p['authority_boundary']['promotion_authority'] is False
          assert p['structural_improvement_gate']['either_dimension_alone_counts_as_pass'] is False
          print('reference_frozen_without_candidate_authority=true')
          PY
