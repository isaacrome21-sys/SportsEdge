name: collection-runtime-contract

on:
  pull_request:
    paths:
      - 'scripts/archive_mlb_prop_odds.py'
      - 'scripts/capture_cfb_weather_pit.py'
      - 'scripts/probe_public_weather_forecast.py'
      - 'scripts/probe_draftkings_schema.py'
      - 'sportsedge/public_weather_forecast.py'
      - 'sportsedge/props_market_binding_stage7.py'
      - 'tests/test_archive_mlb_prop_odds.py'
      - 'tests/test_capture_cfb_weather_pit.py'
      - 'tests/test_public_weather_forecast.py'
      - 'tests/test_props_validation_provenance_stage6.py'
      - '.github/workflows/collection-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install existing pinned test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - name: Verify direct CLI without Python path injection
        run: python -I scripts/archive_mlb_prop_odds.py --self-test
      - name: Verify collection and market-validation boundaries
        run: >-
          python -m pytest -q
          tests/test_archive_mlb_prop_odds.py
          tests/test_capture_cfb_weather_pit.py
          tests/test_public_weather_forecast.py
          tests/test_cfb_forward_evidence.py
          tests/test_props_validation_provenance_stage6.py
          tests/test_props_stage7_binding_contract.py
          tests/test_props_validation_authority_contract.py
      - name: Verify public forecast transport and units
        run: python scripts/probe_public_weather_forecast.py
      - name: Inspect live DraftKings event and category schema
        run: python scripts/probe_draftkings_schema.py
      - name: Preserve transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-weather-probe-${{ github.run_id }}
          path: |
            artifacts/public-weather-probe/
            artifacts/draftkings-schema-probe/
          if-no-files-found: warn
