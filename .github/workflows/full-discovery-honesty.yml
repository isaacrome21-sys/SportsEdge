name: full-discovery-honesty

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["chatgpt/engineering-complete-20260908"]

permissions:
  contents: read

jobs:
  pytest-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile repository Python
        run: python -m compileall -q sportsedge scripts tests
      - name: Run full pytest discovery
        run: python -m pytest -q tests
