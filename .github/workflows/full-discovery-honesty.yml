name: full-discovery-honesty

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["chatgpt/engineering-complete-20260908"]

permissions:
  contents: read

jobs:
  pytest-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile repository Python
        run: python -m compileall -q sportsedge scripts tests
      - name: Run full pytest discovery
        run: python -m pytest -q tests

  historical-import-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install pre-fix discovery dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - name: Compare collection before and after floor resolver reorder
        shell: bash
        run: |
          set -euo pipefail
          PRE=390d27e4c574e99fe0f3d48595acdeda1c0e897b
          POST=4cecf9ca59a5a04613ed97b30945a2d2f9753aea
          git worktree add --detach /tmp/pre "$PRE"
          git worktree add --detach /tmp/post "$POST"
          set +e
          (cd /tmp/pre && python -m pytest --collect-only -q tests) >/tmp/pre.log 2>&1
          pre_rc=$?
          (cd /tmp/post && python -m pytest --collect-only -q tests) >/tmp/post.log 2>&1
          post_rc=$?
          set -e
          pre_errors=$(grep -c '^ERROR collecting ' /tmp/pre.log || true)
          post_errors=$(grep -c '^ERROR collecting ' /tmp/post.log || true)
          printf 'PRE_COMMIT=%s RC=%s COLLECTION_ERRORS=%s\n' "$PRE" "$pre_rc" "$pre_errors"
          printf 'POST_COMMIT=%s RC=%s COLLECTION_ERRORS=%s\n' "$POST" "$post_rc" "$post_errors"
          echo '--- PRE collection error headers ---'
          grep '^ERROR collecting ' /tmp/pre.log || true
          echo '--- POST collection error headers ---'
          grep '^ERROR collecting ' /tmp/post.log || true
          if [ "$pre_errors" -ne "$post_errors" ]; then
            echo 'COLLECTION_ERROR_SET_CHANGED_BY_REORDER_COMMIT'
          else
            echo 'COLLECTION_ERROR_COUNT_UNCHANGED_BY_REORDER_COMMIT'
          fi
