name: tmp-reconcile-through-pr833-bootstrap

on:
  push:
    branches:
      - fix/reconcile-through-pr833-20260918
    paths:
      - '.github/workflows/tmp-reconcile-through-pr833-bootstrap.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/reconcile-through-pr833-20260918
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Register exact late-main first-parent transitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(registry_path.read_text())
          expected_old = '374ffc70c7bfc2fae968ae4d506b2d325ec1ee5d'
          target = '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb'

          existing = {row['delta_id']: row for row in registry['deltas']}
          additions = [
              {
                  'delta_id': 'PR_830_RECONCILIATION_CATCHUP_MERGE',
                  'merge_sha': 'fc5fc8a7baa4daf2e82699972ee877bce3d869c6',
                  'note': 'Reconciliation-only merge after PR #826; registers the self-aging protected-main transition with zero model or betting authority.',
                  'pr': 830,
              },
              {
                  'delta_id': 'PR_832_CFB_PROVIDER_PREFLIGHT',
                  'merge_sha': '6491cff72832f46ce926c3d3dd22aca4c3d455ed',
                  'note': 'Adds zero-authority CFBD account/quota/weather/replay-budget preflight. Performs zero historical replay calls and consumes zero evaluation attempts.',
                  'pr': 832,
              },
              {
                  'delta_id': 'PR_833_CFB_WEEK1_EXECUTION_CORRECTION',
                  'merge_sha': target,
                  'note': 'Corrects Week-1 execution for frozen CFB candidate families and explicitly leaves the prior candidate prereg refreeze REVOKED pending separate post-merge machine refreeze; attempts remain zero and evaluation remains unrun.',
                  'pr': 833,
              },
          ]

          if registry['reconciled_through_sha'] not in {expected_old, target}:
              raise SystemExit(f"UNEXPECTED_RECONCILIATION_BOUNDARY:{registry['reconciled_through_sha']}")

          for row in additions:
              prior = existing.get(row['delta_id'])
              if prior is None:
                  registry['deltas'].append(row)
              elif prior != row:
                  raise SystemExit(f"DELTA_IDENTITY_DRIFT:{row['delta_id']}")

          registry['reconciled_through_sha'] = target

          bundle = next(row for row in registry['bundles'] if row['bundle_id'] == 'CFB_CANDIDATE_PREREG_FREEZE_V1')
          disposition = bundle.get('disposition') or {}
          if disposition.get('state') != 'REVOKED':
              raise SystemExit(f"CFB_CANDIDATE_PREREG_MUST_REMAIN_REVOKED:{disposition.get('state')}")

          prereg = json.loads(Path('config/cfb_model_candidate_prereg_v1.json').read_text())
          governance = prereg['governance']
          if governance.get('attempts_consumed') != 0 or governance.get('evaluation_performed') is not False:
              raise SystemExit('CFB_ATTEMPT_OR_EVALUATION_AUTHORITY_DRIFT')
          for key in ('model_p_created', 'promotion_authority', 'official_authority'):
              if governance.get(key) is not False:
                  raise SystemExit(f'CFB_AUTHORITY_DRIFT:{key}')

          registry_path.write_text(json.dumps(registry, separators=(',', ':')) + '\n')

          test_path = Path('tests/test_reconciliation_catchup_pr815.py')
          text = test_path.read_text()
          anchor = "    (826, '374ffc70c7bfc2fae968ae4d506b2d325ec1ee5d'),\n]"
          replacement = "    (826, '374ffc70c7bfc2fae968ae4d506b2d325ec1ee5d'),\n    (830, 'fc5fc8a7baa4daf2e82699972ee877bce3d869c6'),\n    (832, '6491cff72832f46ce926c3d3dd22aca4c3d455ed'),\n    (833, '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb'),\n]"
          if "(833, '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb')" not in text:
              if anchor not in text:
                  raise SystemExit('CATCHUP_TEST_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)
          text = text.replace('test_reconciliation_advances_through_pr826_in_first_parent_order', 'test_reconciliation_advances_through_pr833_in_first_parent_order')
          test_path.write_text(text)
          PY

      - name: Verify reconciliation and zero-attempt governance
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          git fetch --no-tags origin main
          python -m pytest -q tests/test_reconciliation_catchup_pr815.py tests/test_freeze_reconciliation.py

      - name: Commit reconciliation-only bytes to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/freeze_reconciliation_registry_v1.json tests/test_reconciliation_catchup_pr815.py; then
            echo 'No reconciliation changes needed.'
            exit 0
          fi
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json tests/test_reconciliation_catchup_pr815.py
          git commit -m 'Governance: reconcile protected main through PR 833'
          git push origin HEAD:fix/reconcile-through-pr833-20260918
