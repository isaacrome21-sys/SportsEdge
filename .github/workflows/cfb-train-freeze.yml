name: cfb-train-freeze

on:
  workflow_dispatch:
    inputs:
      confirm_consume_all_four_attempts:
        description: "PREFLIGHT_ONLY or explicit all-four bakeoff confirmation"
        required: true
        default: "PREFLIGHT_ONLY"
        type: choice
        options:
          - PREFLIGHT_ONLY
          - CONSUME_ALL_FOUR_CFB_ATTEMPTS
  pull_request:
    paths:
      - '.github/workflows/cfb-train-freeze.yml'
      - '.github/workflows/cfb-reconstructed-selection-materialize.yml'
      - 'scripts/acquire_cfb_reconstructed_selection.py'
      - 'scripts/materialize_cfb_reconstructed_selection.py'
      - 'sportsedge/sports/cfb/reconstructed_selection.py'
      - 'sportsedge/sports/cfb/candidate_bakeoff.py'
      - 'scripts/run_cfb_candidate_bakeoff.py'
      - 'config/cfb_candidate_bakeoff_evaluator_v1.json'
      - 'tests/test_cfb_candidate_bakeoff.py'
      - 'sportsedge/sports/cfb/candidate_live_source.py'
      - 'sportsedge/sports/cfb/selected_candidate_model.py'
      - 'sportsedge/sports/cfb/selected_candidate_artifact.py'
      - 'sportsedge/sports/cfb/selected_candidate_runtime.py'
      - 'sportsedge/sports/cfb/run_machine.py'
      - 'tests/test_cfb_selected_candidate_serving.py'
      - 'tests/test_cfb_selected_candidate_runtime.py'
      - 'tests/test_cfb_train_freeze_contract.py'
      - 'config/cfb_model_selection_policy_v1.json'
      - 'config/cfb_model_candidate_prereg_v1.json'
      - 'config/cfb_game_model_freeze.json'

permissions:
  contents: read

jobs:
  contract:
    name: CFB train/freeze pre-attempt contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Verify reconstructed and selected-candidate pre-attempt contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_cfb_reconstructed_selection.py \
            scripts/acquire_cfb_reconstructed_selection.py \
            scripts/materialize_cfb_reconstructed_selection.py \
            sportsedge/sports/cfb/reconstructed_selection.py \
            sportsedge/sports/cfb/candidate_bakeoff.py \
            scripts/run_cfb_candidate_bakeoff.py \
            sportsedge/sports/cfb/candidate_live_source.py \
            sportsedge/sports/cfb/selected_candidate_model.py \
            sportsedge/sports/cfb/selected_candidate_artifact.py \
            sportsedge/sports/cfb/selected_candidate_runtime.py
          python -m unittest \
            tests.test_cfb_candidate_bakeoff \
            tests.test_cfb_reconstructed_selection_preflight \
            tests.test_cfb_reconstructed_selection_acquisition \
            tests.test_cfb_reconstructed_selection_materializer \
            tests.test_cfb_selected_candidate_serving \
            tests.test_cfb_selected_candidate_runtime \
            tests.test_cfb_train_freeze_contract
      - name: Prove frozen selection policy is still unspent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('config/cfb_model_selection_policy_v1.json').read_text())
          prereg=json.loads(Path('config/cfb_model_candidate_prereg_v1.json').read_text())
          freeze=json.loads(Path('config/cfb_game_model_freeze.json').read_text())
          assert policy['status']=='FROZEN_BEFORE_CANDIDATE_EVALUATION'
          assert int(policy['candidate_attempt_budget'])==4
          assert int(policy['attempts_consumed'])==0
          assert prereg['governance']['attempts_consumed']==0
          assert prereg['governance']['evaluation_performed'] is False
          assert freeze['status']=='UNFROZEN'
          for key in ('promotion_authority','evidence_clock_authority'):
              assert freeze[key] is False
          print('CFB_TRAIN_FREEZE_PREATTEMPT_CONTRACT_OK')
          PY

  dispatch-gate:
    name: CFB train/freeze dispatch gate
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Verify provider without spending historical replay calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb
          private="$RUNNER_TEMP/cfb_cfbd_private_preflight.json"
          trap 'rm -f "$private"' EXIT
          python scripts/preflight_cfb_reconstructed_selection.py \
            --private-out "$private" \
            --public-out artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json').read_text())
          if r.get('status')!='VERIFIED_BEFORE_FIRST_REPLAY_CALL':
              raise SystemExit('CFB_TRAIN_FREEZE_PROVIDER_NOT_READY:'+','.join(r.get('blockers') or []))
          if r.get('historical_replay_calls_performed') != 0:
              raise SystemExit('CFB_TRAIN_FREEZE_REPLAY_CALL_LEAK')
          print('CFB_TRAIN_FREEZE_PROVIDER_READY_ZERO_REPLAY_CALLS')
          PY
      - name: Enforce explicit evaluation confirmation
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.confirm_consume_all_four_attempts }}"
          if [[ "$mode" == "PREFLIGHT_ONLY" ]]; then
            echo 'CFB_TRAIN_FREEZE_PREFLIGHT_ONLY status=VERIFIED_BEFORE_FIRST_REPLAY_CALL'
            echo 'No attempt consumed; no historical acquisition started.'
            exit 3
          fi
          if [[ "$mode" != "CONSUME_ALL_FOUR_CFB_ATTEMPTS" ]]; then
            echo "CFB_TRAIN_FREEZE_BLOCKED reason=CFB_TRAIN_FREEZE_CONFIRMATION_INVALID:$mode"
            exit 2
          fi
          echo 'CFB_TRAIN_FREEZE_EVALUATION_CONFIRMATION_ACCEPTED'
          echo 'Acquisition/evaluation remains fail-closed until the attempt execution job is merged.'
      - name: Upload redacted gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-train-freeze-preflight-${{ github.sha }}
          path: artifacts/cfb/cfbd_reconstructed_selection_preflight_public.json
          if-no-files-found: warn
          retention-days: 30