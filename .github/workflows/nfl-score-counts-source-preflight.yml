name: nfl-score-counts-source-preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/preflight_nfl_score_counts_sources.py'
      - 'tests/test_preflight_nfl_score_counts_sources.py'
      - 'config/research/nfl_score_counts_g1_source_contract_v1.json'
      - '.github/workflows/nfl-score-counts-source-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: PYTHONPATH=. python -m pytest -q tests/test_preflight_nfl_score_counts_sources.py
      - name: Verify exact frozen bytes and raw schema only
        run: PYTHONPATH=. python scripts/preflight_nfl_score_counts_sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-score-counts-source-preflight-${{ github.sha }}
          path: artifacts/football/score_counts/source_preflight.json
          if-no-files-found: warn
          retention-days: 30
