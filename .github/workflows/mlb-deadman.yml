name: mlb-deadman

on:
  workflow_dispatch:
  schedule:
    # Thirty-minute safety cadence. Rescue is dispatched only when the
    # canonical auto-mlb heartbeat is demonstrably stale or missing.
    - cron: '5,35 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  verify-and-rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify auto-mlb heartbeat
        id: heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_MINUTES: '45'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          repo = os.environ['REPO']
          max_age = float(os.environ.get('MAX_AGE_MINUTES', '45'))
          stale = False
          state = 'UNKNOWN'
          payload = {}
          try:
              raw = subprocess.check_output([
                  'gh','api',f'repos/{repo}/actions/workflows/auto-mlb.yml/runs',
                  '-f','branch=main','-f','per_page=10'
              ], text=True)
              runs = json.loads(raw).get('workflow_runs') or []
              completed = [r for r in runs if r.get('status') == 'completed']
              if not completed:
                  state = 'NO_COMPLETED_RUNS'
                  stale = True
              else:
                  latest = max(completed, key=lambda r: r.get('updated_at') or '')
                  stamp = latest.get('updated_at') or latest.get('run_started_at')
                  if not stamp:
                      state = 'LATEST_TIMESTAMP_MISSING'
                      stale = True
                  else:
                      then = datetime.fromisoformat(stamp.replace('Z','+00:00')).astimezone(timezone.utc)
                      age = (datetime.now(timezone.utc) - then).total_seconds()/60.0
                      stale = age > max_age
                      state = 'STALE' if stale else 'HEALTHY'
                      payload = {
                          'latest_run_id': latest.get('id'),
                          'latest_conclusion': latest.get('conclusion'),
                          'age_minutes': age,
                          'max_age_minutes': max_age,
                      }
          except Exception as exc:
              state = f'HEARTBEAT_API_UNAVAILABLE:{type(exc).__name__}'
              stale = False

          payload.update({'state': state, 'dispatch_rescue': stale})
          print(json.dumps(payload, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"dispatch_rescue={'true' if stale else 'false'}\n")
          PY

      - name: Dispatch archive failover only for stale or missing heartbeat
        if: steps.heartbeat.outputs.dispatch_rescue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run archive-mlb-game-odds-failover.yml --ref main
          echo 'DEADMAN_DISPATCHED_ARCHIVE_FAILOVER'

      - name: Record healthy or unknown no-dispatch state
        if: steps.heartbeat.outputs.dispatch_rescue != 'true'
        run: echo 'DEADMAN_NO_RESCUE_DISPATCH'
