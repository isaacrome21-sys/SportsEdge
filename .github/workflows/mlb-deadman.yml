name: mlb-deadman

on:
  workflow_dispatch:
  schedule:
    # Independent dead-man cadence, offset from the primary and backup archive crons.
    - cron: '5,20,35,50 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  verify-auto-mlb-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify auto-mlb has completed successfully and recently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_MINUTES: '45'
        run: python scripts/check_mlb_auto_heartbeat.py

  archive-rescue-dispatch:
    # This job is intentionally independent from heartbeat verification. The
    # archive workflow itself is fail-closed outside T-180/T-90/T0 and has a
    # durable dedupe/budget ledger, so an extra dispatch is cheap while a missed
    # point-in-time snapshot is not recoverable.
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch archive failover workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run archive-mlb-game-odds-failover.yml --ref main
          echo 'DEADMAN_DISPATCHED_ARCHIVE_FAILOVER'
