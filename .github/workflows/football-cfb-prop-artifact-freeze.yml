name: football-cfb-prop-artifact-freeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/cfb/prop_artifact_training.py'
      - 'scripts/build_cfb_prop_model_artifact.py'
      - 'tests/test_cfb_prop_artifact_training.py'
      - '.github/workflows/football-cfb-prop-artifact-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/cfb/prop_artifact_training.py'
      - 'scripts/build_cfb_prop_model_artifact.py'
      - 'tests/test_cfb_prop_artifact_training.py'
      - '.github/workflows/football-cfb-prop-artifact-freeze.yml'

permissions:
  contents: read

concurrency:
  group: football-cfb-prop-artifact-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CFB_2025_PARQUET_SHA256: aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63
    steps:
      - name: Checkout exact audited code SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check pyarrow==25.0.1
      - name: Run CFB prop fitter contract tests
        run: python -m pytest -q tests/test_cfb_prop_artifact_training.py
      - name: Download and normalize frozen completed 2025 ESPN CFB play-by-play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/cfb_prop_sources
          parquet='artifacts/football/cfb_prop_sources/play_by_play_2025.parquet'
          csv='artifacts/football/cfb_prop_sources/play_by_play_2025.csv'
          source='artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz'
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
            --output "$parquet" \
            'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_pbp/play_by_play_2025.parquet'
          echo "${CFB_2025_PARQUET_SHA256}  ${parquet}" | sha256sum --check --strict
          python - <<'PY'
          import pyarrow.csv as csv
          import pyarrow.parquet as parquet
          table = parquet.read_table('artifacts/football/cfb_prop_sources/play_by_play_2025.parquet')
          csv.write_csv(table, 'artifacts/football/cfb_prop_sources/play_by_play_2025.csv')
          PY
          gzip -n -c "$csv" > "$source"
          test -s "$source"
          sha256sum "$source"
          rm -f "$parquet" "$csv"
      - name: Build exact-SHA artifact attempt A
        env:
          TZ: UTC
          PYTHONHASHSEED: '1'
        run: >-
          python scripts/build_cfb_prop_model_artifact.py
          --pbp artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz
          --git-sha "$EVIDENCE_GIT_SHA"
          --artifact-version CFB_PROP_ESPN_2025_V1
          --seasons 2025
          --output artifacts/football/cfb_prop_freeze_a/model.json
          --artifact-path artifacts/football/cfb_offensive_prop_ab_model.json
          --diagnostics-output artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json
          --freeze-output artifacts/football/cfb_prop_freeze_a/freeze.json
      - name: Build exact-SHA artifact replay B under shifted timezone
        env:
          TZ: Pacific/Kiritimati
          PYTHONHASHSEED: '8675309'
        run: >-
          python scripts/build_cfb_prop_model_artifact.py
          --pbp artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz
          --git-sha "$EVIDENCE_GIT_SHA"
          --artifact-version CFB_PROP_ESPN_2025_V1
          --seasons 2025
          --output artifacts/football/cfb_prop_freeze_b/model.json
          --artifact-path artifacts/football/cfb_offensive_prop_ab_model.json
          --diagnostics-output artifacts/football/cfb_prop_freeze_b/fit_diagnostics.json
          --freeze-output artifacts/football/cfb_prop_freeze_b/freeze.json
      - name: Enforce deterministic artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          cmp artifacts/football/cfb_prop_freeze_a/model.json artifacts/football/cfb_prop_freeze_b/model.json
          cmp artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json artifacts/football/cfb_prop_freeze_b/fit_diagnostics.json
          cmp artifacts/football/cfb_prop_freeze_a/freeze.json artifacts/football/cfb_prop_freeze_b/freeze.json
      - name: Validate fitted artifact through shared production loader
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sportsedge.football_prop_run_machine import _load_artifact, canonical_hash
          model=json.loads(Path('artifacts/football/cfb_prop_freeze_a/model.json').read_text())
          freeze=json.loads(Path('artifacts/football/cfb_prop_freeze_a/freeze.json').read_text())
          diagnostics=json.loads(Path('artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json').read_text())
          expected=canonical_hash(model)
          assert diagnostics['status']=='PASS'
          assert diagnostics['team_count'] >= 100
          assert diagnostics['governance']['sportsbook_fields_consumed'] is False
          assert freeze['sport']=='CFB' and freeze['promotion_authority'] is False
          assert freeze['artifact_sha256']==expected
          profiles, actual, source_sha = _load_artifact(
              model, sport='CFB', expected_artifact_sha256=expected,
              runtime_code_git_sha=os.environ['EVIDENCE_GIT_SHA'])
          assert actual == expected
          assert source_sha == model['source_manifest_sha256']
          assert len(profiles) == diagnostics['team_count']
          print(f"CFB_PROP_REAL_FREEZE_OK artifact_sha256={expected} teams={len(profiles)}")
          PY
      - name: Upload immutable exact-SHA freeze bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-prop-frozen-bundle-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/football/cfb_prop_freeze_a/model.json
            artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json
            artifacts/football/cfb_prop_freeze_a/freeze.json
          if-no-files-found: error
          retention-days: 90
