name: football-cfb-prop-artifact-freeze

# Fresh verification is obtained via workflow_dispatch or a path-scoped PR/push.
# A successful model-artifact binding emits CFB_PROP_REAL_FREEZE_OK in the job log.
# The upstream release is mutable. If its bytes no longer equal the frozen source
# hash, do not refreeze: reverify the exact retained September 11 freeze bundle
# against its original code SHA and recorded file identities instead.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/sports/cfb/prop_artifact_training.py'
      - 'scripts/build_cfb_prop_model_artifact.py'
      - 'tests/test_cfb_prop_artifact_training.py'
      - 'artifacts/football/cfb_prop_freeze_2026-09-11/manifest.json'
      - '.github/workflows/football-cfb-prop-artifact-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/sports/cfb/prop_artifact_training.py'
      - 'scripts/build_cfb_prop_model_artifact.py'
      - 'tests/test_cfb_prop_artifact_training.py'
      - 'artifacts/football/cfb_prop_freeze_2026-09-11/manifest.json'
      - '.github/workflows/football-cfb-prop-artifact-freeze.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: football-cfb-prop-artifact-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CFB_2025_PARQUET_SHA256: aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63
      RETAINED_CODE_GIT_SHA: 1ef10af3f4c52366e812d255670b486d098b7fe7
      RETAINED_ARTIFACT_ID: '10263030950'
      RETAINED_ARTIFACT_ZIP_SHA256: e08529230e6f971dfba02344dadff9e9b120c7915f89576a295a750e5bc980ea
      RETAINED_ARTIFACT_SHA256: 4d77ac6d8b81f34d801ab9b186b8165d829f71d60917d2a54d2c97920f148795
      RETAINED_SOURCE_MANIFEST_SHA256: d9f7ba468680dcf3cb63321b3d6b624bf6ae079e426c70e2541d3cc9e4347d44
    steps:
      - name: Checkout exact audited code SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_GIT_SHA }}
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check pyarrow==25.0.1
      - name: Run CFB prop fitter contract tests
        run: python -m pytest -q tests/test_cfb_prop_artifact_training.py
      - name: Probe frozen completed 2025 ESPN CFB source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/cfb_prop_sources
          parquet='artifacts/football/cfb_prop_sources/play_by_play_2025.parquet'
          csv='artifacts/football/cfb_prop_sources/play_by_play_2025.csv'
          source='artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz'
          if ! curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
            --output "$parquet" \
            'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_pbp/play_by_play_2025.parquet'; then
            echo 'exact=false' >> "$GITHUB_OUTPUT"
            echo 'state=UPSTREAM_UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'CFB_PROP_FROZEN_SOURCE_REPLAY_BLOCKED reason=UPSTREAM_UNAVAILABLE'
            exit 0
          fi
          observed="$(sha256sum "$parquet" | awk '{print $1}')"
          echo "observed_sha256=${observed}" >> "$GITHUB_OUTPUT"
          if [ "$observed" != "$CFB_2025_PARQUET_SHA256" ]; then
            echo 'exact=false' >> "$GITHUB_OUTPUT"
            echo 'state=UPSTREAM_DRIFT' >> "$GITHUB_OUTPUT"
            echo "CFB_PROP_FROZEN_SOURCE_REPLAY_BLOCKED reason=UPSTREAM_DRIFT expected=${CFB_2025_PARQUET_SHA256} observed=${observed}"
            rm -f "$parquet"
            exit 0
          fi
          echo 'exact=true' >> "$GITHUB_OUTPUT"
          echo 'state=EXACT_FROZEN_SOURCE' >> "$GITHUB_OUTPUT"
          echo "${CFB_2025_PARQUET_SHA256}  ${parquet}" | sha256sum --check --strict
          python - <<'PY'
          import pyarrow.csv as csv
          import pyarrow.parquet as parquet
          table = parquet.read_table('artifacts/football/cfb_prop_sources/play_by_play_2025.parquet')
          csv.write_csv(table, 'artifacts/football/cfb_prop_sources/play_by_play_2025.csv')
          PY
          gzip -n -c "$csv" > "$source"
          test -s "$source"
          sha256sum "$source"
          rm -f "$parquet" "$csv"
      - name: Build exact-SHA artifact attempt A
        if: steps.source.outputs.exact == 'true'
        env:
          TZ: UTC
          PYTHONHASHSEED: '1'
        run: >-
          python scripts/build_cfb_prop_model_artifact.py
          --pbp artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz
          --git-sha "$EVIDENCE_GIT_SHA"
          --artifact-version CFB_PROP_ESPN_2025_V1
          --seasons 2025
          --output artifacts/football/cfb_prop_freeze_a/model.json
          --artifact-path artifacts/football/cfb_offensive_prop_ab_model.json
          --diagnostics-output artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json
          --freeze-output artifacts/football/cfb_prop_freeze_a/freeze.json
      - name: Build exact-SHA artifact replay B under shifted timezone
        if: steps.source.outputs.exact == 'true'
        env:
          TZ: Pacific/Kiritimati
          PYTHONHASHSEED: '8675309'
        run: >-
          python scripts/build_cfb_prop_model_artifact.py
          --pbp artifacts/football/cfb_prop_sources/play_by_play_2025__upstream-aa037920e980acf17317747f2010a031b3b7e1013a44a7b15db18b1dd9df0e63.csv.gz
          --git-sha "$EVIDENCE_GIT_SHA"
          --artifact-version CFB_PROP_ESPN_2025_V1
          --seasons 2025
          --output artifacts/football/cfb_prop_freeze_b/model.json
          --artifact-path artifacts/football/cfb_offensive_prop_ab_model.json
          --diagnostics-output artifacts/football/cfb_prop_freeze_b/fit_diagnostics.json
          --freeze-output artifacts/football/cfb_prop_freeze_b/freeze.json
      - name: Enforce deterministic artifact bytes
        if: steps.source.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmp artifacts/football/cfb_prop_freeze_a/model.json artifacts/football/cfb_prop_freeze_b/model.json
          cmp artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json artifacts/football/cfb_prop_freeze_b/fit_diagnostics.json
          cmp artifacts/football/cfb_prop_freeze_a/freeze.json artifacts/football/cfb_prop_freeze_b/freeze.json
      - name: Validate source-rebuilt artifact through shared production loader
        if: steps.source.outputs.exact == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sportsedge.football_prop_run_machine import _load_artifact, canonical_hash
          model=json.loads(Path('artifacts/football/cfb_prop_freeze_a/model.json').read_text())
          freeze=json.loads(Path('artifacts/football/cfb_prop_freeze_a/freeze.json').read_text())
          diagnostics=json.loads(Path('artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json').read_text())
          expected=canonical_hash(model)
          assert diagnostics['status']=='PASS'
          assert diagnostics['team_count'] >= 100
          assert diagnostics['governance']['sportsbook_fields_consumed'] is False
          assert freeze['sport']=='CFB' and freeze['promotion_authority'] is False
          assert freeze['artifact_sha256']==expected
          profiles, actual, source_sha = _load_artifact(
              model, sport='CFB', expected_artifact_sha256=expected,
              runtime_code_git_sha=os.environ['EVIDENCE_GIT_SHA'])
          assert actual == expected
          assert source_sha == model['source_manifest_sha256']
          assert len(profiles) == diagnostics['team_count']
          print(f"CFB_PROP_REAL_FREEZE_OK artifact_sha256={expected} teams={len(profiles)} verification=SOURCE_REBUILD source_replay=EXACT_FROZEN_SOURCE")
          PY
      - name: Checkout code bound to retained freeze
        if: steps.source.outputs.exact != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RETAINED_CODE_GIT_SHA }}
          path: .retained-code
          persist-credentials: false
      - name: Recover exact retained September 11 freeze bundle
        if: steps.source.outputs.exact != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/football/cfb_prop_retained
          zip='artifacts/football/cfb_prop_retained/bundle.zip'
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETAINED_ARTIFACT_ID}/zip"
          echo "${RETAINED_ARTIFACT_ZIP_SHA256}  ${zip}" | sha256sum --check --strict
          unzip -q "$zip" -d artifacts/football/cfb_prop_retained/extracted
          test -s artifacts/football/cfb_prop_retained/extracted/model.json
          test -s artifacts/football/cfb_prop_retained/extracted/fit_diagnostics.json
          test -s artifacts/football/cfb_prop_retained/extracted/freeze.json
      - name: Validate retained model-artifact hash binding
        if: steps.source.outputs.exact != 'true'
        env:
          SOURCE_REPLAY_STATE: ${{ steps.source.outputs.state }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          manifest=json.loads(Path('artifacts/football/cfb_prop_freeze_2026-09-11/manifest.json').read_text())
          root=Path('artifacts/football/cfb_prop_retained/extracted')
          assert manifest['schema_version']=='CFB_PROP_RETAINED_FREEZE_BUNDLE_V1'
          assert manifest['status']=='RETAINED_NON_PROMOTING'
          assert manifest['source_artifact_zip_sha256']==os.environ['RETAINED_ARTIFACT_ZIP_SHA256']
          assert manifest['bound_code_git_sha']==os.environ['RETAINED_CODE_GIT_SHA']
          assert manifest['artifact_sha256']==os.environ['RETAINED_ARTIFACT_SHA256']
          assert manifest['source_manifest_sha256']==os.environ['RETAINED_SOURCE_MANIFEST_SHA256']
          assert manifest['frozen_source_parquet_sha256']==os.environ['CFB_2025_PARQUET_SHA256']
          assert all(value is False for value in manifest['governance'].values())
          for name, expected in manifest['files'].items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected, (name, actual, expected)

          model=json.loads((root/'model.json').read_text())
          freeze=json.loads((root/'freeze.json').read_text())
          diagnostics=json.loads((root/'fit_diagnostics.json').read_text())
          assert model['code_git_sha']==os.environ['RETAINED_CODE_GIT_SHA']
          assert model['source_manifest_sha256']==os.environ['RETAINED_SOURCE_MANIFEST_SHA256']
          assert diagnostics['status']=='PASS'
          assert diagnostics['team_count'] >= 100
          assert diagnostics['governance']['sportsbook_fields_consumed'] is False
          assert freeze['sport']=='CFB' and freeze['promotion_authority'] is False
          assert freeze['code_git_sha']==os.environ['RETAINED_CODE_GIT_SHA']
          assert freeze['source_manifest_sha256']==os.environ['RETAINED_SOURCE_MANIFEST_SHA256']
          assert freeze['artifact_sha256']==os.environ['RETAINED_ARTIFACT_SHA256']

          sys.path.insert(0, '.retained-code')
          from sportsedge.football_prop_run_machine import _load_artifact, canonical_hash
          expected=canonical_hash(model)
          assert expected==os.environ['RETAINED_ARTIFACT_SHA256']
          profiles, actual, source_sha = _load_artifact(
              model, sport='CFB', expected_artifact_sha256=expected,
              runtime_code_git_sha=os.environ['RETAINED_CODE_GIT_SHA'])
          assert actual==expected
          assert source_sha==os.environ['RETAINED_SOURCE_MANIFEST_SHA256']
          assert len(profiles)==diagnostics['team_count']
          state=os.environ.get('SOURCE_REPLAY_STATE','UNKNOWN')
          print(f"CFB_PROP_REAL_FREEZE_OK artifact_sha256={expected} teams={len(profiles)} verification=RETAINED_ACTIONS_BUNDLE source_replay={state} bound_code_sha={os.environ['RETAINED_CODE_GIT_SHA']}")
          PY
      - name: Upload exact source-rebuilt freeze bundle
        if: steps.source.outputs.exact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-prop-frozen-bundle-${{ env.EVIDENCE_GIT_SHA }}
          path: |
            artifacts/football/cfb_prop_freeze_a/model.json
            artifacts/football/cfb_prop_freeze_a/fit_diagnostics.json
            artifacts/football/cfb_prop_freeze_a/freeze.json
          if-no-files-found: error
          retention-days: 90
      - name: Re-upload verified retained freeze bundle
        if: steps.source.outputs.exact != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-prop-retained-freeze-${{ env.RETAINED_CODE_GIT_SHA }}-${{ github.run_id }}
          path: |
            artifacts/football/cfb_prop_retained/extracted/model.json
            artifacts/football/cfb_prop_retained/extracted/fit_diagnostics.json
            artifacts/football/cfb_prop_retained/extracted/freeze.json
          if-no-files-found: error
          retention-days: 90
