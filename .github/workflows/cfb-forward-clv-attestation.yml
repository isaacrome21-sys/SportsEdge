name: CFB forward CLV attestation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sportsedge-cfb-free-attestation
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Contract tests
        run: |
          python -m unittest tests.test_cfb_forward_clv_network_attestation -v
          python -m unittest tests.test_cfb_forward_clv_attestation_record -v
          python -m unittest tests.test_cfb_forward_clv_settlement -v
      - name: Attach append-only data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
      - name: Collect free ESPN settlement observations
        run: |
          PYTHONPATH=. python scripts/cfb_forward_clv_attest_network.py --out-dir .data-branch
      - name: Commit append-only attestation observations
        shell: bash
        run: |
          set -euo pipefail
          cd .data-branch
          git config user.name 'sportsedge-cfb-attestation[bot]'
          git config user.email 'sportsedge-cfb-attestation@users.noreply.github.com'
          git add -A cfb_forward_clv/attestation_observations cfb_forward_clv/attestation_records 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cfb-forward-clv: ESPN attestation $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git fetch origin data
            if ! git rebase origin/data; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
