name: mlb-moneyline-preseason-evidence

on:
  workflow_dispatch:
  push:
    branches: [mlb-moneyline-governance-completion]
    paths-ignore:
      - 'data/mlb_moneyline_preseason/**'
      - 'artifacts/mlb_moneyline_preseason/**'

permissions:
  contents: write

concurrency:
  group: mlb-moneyline-preseason-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mlb-moneyline-governance-completion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test/evidence dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile touched modules
        run: python -m compileall -q sportsedge/mlb_moneyline_pit.py scripts/build_mlb_moneyline_preseason_evidence.py tests/test_mlb_moneyline_pit.py tests/test_build_mlb_moneyline_preseason_evidence.py
      - name: Run PIT and evidence tests
        run: python -m pytest -q tests/test_mlb_moneyline_pit.py tests/test_build_mlb_moneyline_preseason_evidence.py
      - name: Build real market-blind historical calibration holdout
        run: python scripts/build_mlb_moneyline_preseason_evidence.py --holdout-cutoff 2026-09-15
      - name: Persist generated evidence on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sportsedge-evidence-bot'
          git config user.email 'sportsedge-evidence-bot@users.noreply.github.com'
          git add data/mlb_moneyline_preseason artifacts/mlb_moneyline_preseason
          if git diff --cached --quiet; then
            echo 'No evidence changes to persist.'
            exit 0
          fi
          git commit -m 'MLB: store preseason PIT calibration evidence'
          git push origin HEAD:mlb-moneyline-governance-completion
