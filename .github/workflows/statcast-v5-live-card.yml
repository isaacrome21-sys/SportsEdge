name: statcast-v5-live-card

on:
  workflow_dispatch:
  push:
    branches: [statcast-required-v5-20260812]
    paths:
      - 'config/statcast_v5_deployments.json'
      - 'scripts/attest_live_statcast_v5_game.py'
      - 'scripts/finalize_statcast_v5_game_card.py'
      - '.github/workflows/statcast-v5-live-card.yml'

permissions:
  contents: read
  actions: read

jobs:
  live-card:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      SPORTSEDGE_STATCAST_V5_OUT: artifacts/statcast-v5-game
      SPORTSEDGE_V5_LIVE_SIMS: '250000'
      SPORTSEDGE_EXPECTED_V5_GAME_SHA256: d467b1221898fdb84562ea2b72a06287bfae3e58603e3b15a28fba40c9cc668e
      SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256: bf61487279ac9a506318e9dfa078a866450dd4e363b1d06356e58852954133b2
      SPORTSEDGE_PROJECTED_LINEUPS_URL: ${{ secrets.SPORTSEDGE_PROJECTED_LINEUPS_URL }}
      SPORTSEDGE_PROVIDER_TOKEN: ${{ secrets.SPORTSEDGE_PROVIDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact V5 runtime
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib
      - name: Require CI-bound GAME deployment and resolve promotion run
        id: deployment
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('config/statcast_v5_deployments.json'))
          for m in ('MONEYLINE','RUN_LINE','TOTALS'):
              assert d['markets'][m]['eligible'] is True, 'V5_GAME_NOT_DEPLOYED:'+m
          run=d.get('promotion_run_id')
          assert isinstance(run,int) and run>0, 'V5_PROMOTION_RUN_ID_MISSING'
          print('run_id='+str(run))
          PY
      - name: Download exact promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
        run: |
          mkdir -p artifacts/statcast-v5-game
          name=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("statcast-v5-game-evidence-")) | .name' | head -1)
          test -n "$name"
          gh run download "$RUN_ID" -n "$name" -D artifacts/promotion
          test -d artifacts/promotion/statcast-v5-game
          cp artifacts/promotion/statcast-v5-game/* artifacts/statcast-v5-game/
          test -f artifacts/promotion/live_statcast_v5_game_attestation.json
          echo "$SPORTSEDGE_EXPECTED_V5_GAME_SHA256  artifacts/statcast-v5-game/sportsedge_game_score_v5_statcast.joblib" | sha256sum -c -
          echo "$SPORTSEDGE_EXPECTED_V5_TRANSFORMER_SHA256  artifacts/statcast-v5-game/sportsedge_contact_transformer_v1.joblib" | sha256sum -c -
      - name: Restore prior-only live caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/sportsedge/statcast-v5-live
            .cache/sportsedge/mlb-history/game-v5
          key: statcast-v5-live-card-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            statcast-v5-live-prior-2026-${{ runner.os }}-
            statcast-v5-live-card-${{ runner.os }}-
      - name: Run fresh live V5 model and 250k Monte Carlo
        run: python scripts/attest_live_statcast_v5_game.py
      - name: Finalize Truth Gate card and eight-market accounting
        run: python scripts/finalize_statcast_v5_game_card.py
      - name: Upload live Full Model card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statcast-v5-live-card-${{ github.sha }}
          path: |
            artifacts/live_statcast_v5_game_attestation.json
            artifacts/live_statcast_v5_full_model_card.json
          if-no-files-found: warn
          retention-days: 14
