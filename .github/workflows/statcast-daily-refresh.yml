name: statcast-daily-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'
  push:
    paths:
      - 'sportsedge/statcast_daily_source.py'
      - 'scripts/refresh_statcast_daily.py'
      - 'config/mlb_source_freshness_contract.json'
      - '.github/workflows/statcast-daily-refresh.yml'

permissions:
  contents: write

concurrency:
  group: statcast-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install Statcast transport
        run: python -m pip install --disable-pip-version-check 'pybaseball>=2.2.7,<3'
      - name: Refresh 30-day Statcast batter/pitcher snapshot
        run: python scripts/refresh_statcast_daily.py --days 30 --output-dir artifacts/statcast
      - name: Persist immutable Statcast evidence to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data:data
          git worktree add .data-branch data
          RUN_DIR=".data-branch/runtime/statcast/runs/${GITHUB_RUN_ID}"
          LATEST_DIR=".data-branch/runtime/statcast/latest"
          mkdir -p "$RUN_DIR" "$LATEST_DIR"
          cp -R artifacts/statcast/. "$RUN_DIR"/ 2>/dev/null || true
          rm -rf "$LATEST_DIR"/*
          cp -R artifacts/statcast/. "$LATEST_DIR"/ 2>/dev/null || true
          printf '%s\n' "${GITHUB_RUN_ID}" > .data-branch/runtime/statcast/latest_run_id.txt
          cd .data-branch
          git config user.name sportsedge-data-bot
          git config user.email sportsedge-data-bot@users.noreply.github.com
          git add runtime/statcast
          if ! git diff --cached --quiet; then
            git commit -m "statcast: durable run ${GITHUB_RUN_ID}"
            git push origin HEAD:data
          fi
