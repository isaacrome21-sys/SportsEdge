name: statcast-daily-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'
  push:
    paths:
      - 'sportsedge/statcast_daily_source.py'
      - 'scripts/refresh_statcast_daily.py'
      - 'config/mlb_source_freshness_contract.json'
      - '.github/workflows/statcast-daily-refresh.yml'

permissions:
  contents: write

concurrency:
  group: statcast-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Prepare durable data worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          git worktree add --detach .data-branch FETCH_HEAD
      - name: Install Statcast transport
        id: install
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check 'pybaseball==2.2.7'
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh 30-day Statcast batter/pitcher snapshot
        id: refresh
        shell: bash
        run: |
          mkdir -p artifacts/statcast/$(date -u +%F)
          if [ '${{ steps.install.outputs.exit_code }}' != '0' ]; then
            python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          d = datetime.now(timezone.utc).date().isoformat()
          p = Path('artifacts/statcast') / d
          p.mkdir(parents=True, exist_ok=True)
          (p / 'manifest.json').write_text(json.dumps({'status':'ERROR','reason':'PYBASEBALL_INSTALL_FAILED','retrieved_at':datetime.now(timezone.utc).isoformat()}, indent=2) + '\n')
          PY
            echo 'exit_code=97' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=. python scripts/refresh_statcast_daily.py --days 30 --output-dir artifacts/statcast
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist immutable Statcast evidence to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .data-branch/.git ] && [ ! -f .data-branch/.git ]; then
            echo 'data branch worktree is unavailable' >&2
            exit 98
          fi
          RUN_DIR=".data-branch/runtime/statcast/runs/${GITHUB_RUN_ID}"
          LATEST_DIR=".data-branch/runtime/statcast/latest"
          mkdir -p "$RUN_DIR" "$LATEST_DIR"
          cp -R artifacts/statcast/. "$RUN_DIR"/ 2>/dev/null || true
          rm -rf "$LATEST_DIR"/*
          cp -R artifacts/statcast/. "$LATEST_DIR"/ 2>/dev/null || true
          printf '%s\n' "${GITHUB_RUN_ID}" > .data-branch/runtime/statcast/latest_run_id.txt
          cd .data-branch
          git config user.name sportsedge-data-bot
          git config user.email sportsedge-data-bot@users.noreply.github.com
          git add runtime/statcast
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "statcast: durable run ${GITHUB_RUN_ID}"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort || true; sleep $((attempt * 2)); continue; }
            if git push origin HEAD:data; then
              pushed=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
      - name: Upload Statcast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statcast-${{ github.run_id }}
          path: artifacts/statcast/**
          if-no-files-found: error
          retention-days: 30
      - name: Propagate collector result after persistence
        if: always()
        shell: bash
        run: |
          code='${{ steps.refresh.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Refresh step did not emit an exit code.' >&2
            exit 99
          fi
          exit "$code"
