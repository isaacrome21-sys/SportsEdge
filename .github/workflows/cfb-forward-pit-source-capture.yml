name: cfb-forward-pit-source-capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to snapshot prospectively'
        required: true
        default: '2026'
        type: string
  push:
    paths:
      - '.github/trigger-cfb-forward-pit'
  schedule:
    - cron: '17 10 * * *'
    - cron: '47 11 * * *'

permissions:
  contents: write

concurrency:
  group: cfb-forward-pit-source-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPTURE_GIT_SHA: ${{ github.sha }}
      CFB_FORWARD_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAPTURE_GIT_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile acquisition surface
        run: >-
          python -m py_compile
          sportsedge/sports/cfb/historical_release.py
          sportsedge/sports/cfb/history_cache.py
          sportsedge/sports/cfb/forward_pit_readiness.py
          scripts/cache_cfb_history.py

      - name: Snapshot predictive source bytes
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb_forward_pit/capture
          for dataset in schedules adv_team adv_situational adv_drives; do
            python scripts/cache_cfb_history.py \
              --dataset "$dataset" \
              --seasons "$CFB_FORWARD_SEASON" \
              --cache-root artifacts/cfb_forward_pit/source \
              | tee "artifacts/cfb_forward_pit/capture/${dataset}.json"
          done

      - name: Bind capture time and fail closed on market contamination
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('artifacts/cfb_forward_pit/source')
          manifests = sorted(root.glob('*/*/manifest.json'))
          if not manifests:
              raise SystemExit('CFB_FORWARD_PIT_CAPTURE_EMPTY')

          # Preserve sub-second precision. Source retrieval manifests record
          # microseconds, so truncating the capture time to whole seconds can
          # make a legitimately earlier retrieval appear to occur after capture.
          captured_at = datetime.now(timezone.utc)
          rows = []
          for manifest_path in manifests:
              payload = json.loads(manifest_path.read_text(encoding='utf-8'))
              asset = payload.get('asset') or {}
              dataset = str(asset.get('dataset') or '')
              if dataset == 'betting' or payload.get('market_role') != 'PREDICTIVE_INPUT':
                  raise SystemExit(f'CFB_FORWARD_PIT_MARKET_CONTAMINATION:{manifest_path}')
              cache_rel = payload.get('cache_relative_path')
              if not cache_rel:
                  raise SystemExit(f'CFB_FORWARD_PIT_CACHE_PATH_MISSING:{manifest_path}')
              cache_path = root / cache_rel
              if not cache_path.is_file():
                  raise SystemExit(f'CFB_FORWARD_PIT_ASSET_MISSING:{cache_rel}')
              actual = hashlib.sha256(cache_path.read_bytes()).hexdigest()
              expected = str(payload.get('content_sha256') or '').lower()
              if actual != expected:
                  raise SystemExit(f'CFB_FORWARD_PIT_HASH_MISMATCH:{cache_rel}')
              rows.append({
                  'dataset': dataset,
                  'season': asset.get('season'),
                  'release_tag': asset.get('release_tag'),
                  'release_id': asset.get('release_id'),
                  'asset_id': asset.get('asset_id'),
                  'asset_name': asset.get('asset_name'),
                  'content_sha256': expected,
                  'source_retrieved_at': payload.get('retrieved_at'),
                  'manifest_sha256': payload.get('manifest_sha256'),
                  'cache_relative_path': cache_rel,
              })

          classification = {
              'schema_version': 1,
              'sport': 'CFB',
              'capture_git_sha': os.environ['CAPTURE_GIT_SHA'].lower(),
              'season': int(os.environ['CFB_FORWARD_SEASON']),
              'captured_at_utc': captured_at.isoformat().replace('+00:00', 'Z'),
              'pit_classification': 'FORWARD_SOURCE_SNAPSHOT_FROM_RETRIEVAL_TIME_ONLY',
              'point_in_time_from_capture_forward': True,
              'retroactive_point_in_time_claim': False,
              'promotion_evidence': False,
              'model_p_created': False,
              'eligibility_changed': False,
              'market_data_in_predictive_capture': False,
              'usage_rule': (
                  'These bytes may support future PIT feature reconstruction only for decisions whose '
                  'as-of time is at or after this capture. They provide no PIT proof for earlier games.'
              ),
              'asset_count': len(rows),
              'assets': rows,
          }
          target = Path('artifacts/cfb_forward_pit/capture/classification.json')
          target.write_text(json.dumps(classification, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('artifacts/cfb_forward_pit/capture/id.txt').write_text(
              captured_at.strftime('%Y%m%dT%H%M%SZ') + '-' + os.environ['CAPTURE_GIT_SHA'][:12] + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': 'CFB_FORWARD_PIT_SOURCE_SNAPSHOT_CAPTURED',
              'captured_at_utc': classification['captured_at_utc'],
              'asset_count': len(rows),
              'promotion_evidence': False,
          }, sort_keys=True))
          PY

      - name: Validate complete forward snapshot binding before persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from sportsedge.sports.cfb.forward_pit_readiness import audit_cfb_forward_pit_snapshot

          report = audit_cfb_forward_pit_snapshot(
              Path('artifacts/cfb_forward_pit/capture/classification.json')
          )
          if report.get('source_asof_ready') is not True:
              raise SystemExit(
                  'CFB_FORWARD_PIT_SOURCE_BINDING_INVALID:'
                  + json.dumps(report, sort_keys=True)
              )
          if report.get('truth_gate_ready') is not False:
              raise SystemExit('CFB_FORWARD_PIT_TRUTH_GATE_AUTHORITY_FORBIDDEN')
          if report.get('promotion_authority') is not False:
              raise SystemExit('CFB_FORWARD_PIT_PROMOTION_AUTHORITY_FORBIDDEN')
          if report.get('eligibility_changed') is not False:
              raise SystemExit('CFB_FORWARD_PIT_ELIGIBILITY_CHANGE_FORBIDDEN')
          if report.get('paired_market_evidence_present') is not False:
              raise SystemExit('CFB_FORWARD_PIT_PAIRED_MARKET_EVIDENCE_FORBIDDEN')
          required_blockers = {
              'PAIRED_MARKET_EVIDENCE_MISSING',
              'PROMOTION_EVIDENCE_NOT_ESTABLISHED',
          }
          if not required_blockers.issubset(set(report.get('blockers') or [])):
              raise SystemExit('CFB_FORWARD_PIT_GOVERNANCE_BLOCKERS_MISSING')
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Persist immutable forward snapshot on data branch
        env:
          DATA_BRANCH: data
        run: |
          set -euo pipefail
          capture_id="$(tr -d '\n' < artifacts/cfb_forward_pit/capture/id.txt)"
          git fetch --no-tags origin "${DATA_BRANCH}:${DATA_BRANCH}"
          worktree_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true; rm -rf "$worktree_dir"' EXIT
          git worktree add "$worktree_dir" "${DATA_BRANCH}"
          dest="$worktree_dir/history/cfb/forward-pit/${capture_id}"
          test ! -e "$dest" || { echo "CFB_FORWARD_PIT_CAPTURE_ID_COLLISION:${capture_id}" >&2; exit 1; }
          mkdir -p "$dest"
          cp -a artifacts/cfb_forward_pit/source "$dest/source"
          cp -a artifacts/cfb_forward_pit/capture "$dest/capture"
          cd "$worktree_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "history/cfb/forward-pit/${capture_id}"
          git commit -m "data(cfb): forward PIT source snapshot ${capture_id}"
          git push origin "HEAD:${DATA_BRANCH}"

      - name: Upload capture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-forward-pit-${{ env.CAPTURE_GIT_SHA }}-${{ github.run_id }}
          path: artifacts/cfb_forward_pit/**
          if-no-files-found: error
          retention-days: 30
