name: odds-api-paid-consumer-invariant

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/odds_api_request_projection_v3.json'
      - 'config/closing_line_archive_policy_v1.json'
      - 'config/football_nfl_forward_clv_provider_policy_v1.json'
      - 'config/mlb_game_odds_failover_provider_policy_v1.json'
      - 'config/nfl_2026_confirmation_provider_policy_v1.json'
      - 'config/nfl_2026_provider_budget_v1.json'
      - 'config/nfl_2026_capture.json'
      - 'scripts/audit_paid_odds_consumers.py'
      - 'scripts/capture_closing_line_archive_v3.py'
      - 'scripts/archive_raw_game_odds.py'
      - 'sportsedge/sports/nfl/odds_source.py'
      - 'tests/test_paid_odds_consumer_projection.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/odds_api_request_projection_v3.json'
      - 'config/closing_line_archive_policy_v1.json'
      - 'config/football_nfl_forward_clv_provider_policy_v1.json'
      - 'config/mlb_game_odds_failover_provider_policy_v1.json'
      - 'config/nfl_2026_confirmation_provider_policy_v1.json'
      - 'config/nfl_2026_provider_budget_v1.json'
      - 'config/nfl_2026_capture.json'
      - 'scripts/audit_paid_odds_consumers.py'
      - 'scripts/capture_closing_line_archive_v3.py'
      - 'scripts/archive_raw_game_odds.py'
      - 'sportsedge/sports/nfl/odds_source.py'
      - 'tests/test_paid_odds_consumer_projection.py'

permissions:
  contents: read

jobs:
  audit:
    name: derived paid Odds API consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Derive every secret-touching paid consumer and enforce spend invariants
        run: |
          python scripts/audit_paid_odds_consumers.py --out artifacts/odds-api-paid-consumer-audit.json
          python -m pytest -q tests/test_paid_odds_consumer_projection.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odds-api-paid-consumer-audit-${{ github.sha }}
          path: artifacts/odds-api-paid-consumer-audit.json
          if-no-files-found: ignore
