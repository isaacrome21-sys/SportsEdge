name: cfb-historical-market-benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/research/cfb_historical_market_source_v1.json'
      - 'sportsedge/sports/cfb/history_cache.py'
      - 'sportsedge/sports/cfb/market_benchmark.py'
      - 'scripts/build_cfb_historical_market_benchmark.py'
      - 'tests/test_cfb_market_benchmark.py'
      - '.github/workflows/cfb-historical-market-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile benchmark surface
        run: >-
          python -m py_compile
          sportsedge/sports/cfb/market_benchmark.py
          scripts/build_cfb_historical_market_benchmark.py
          tests/test_cfb_market_benchmark.py

      - name: Run benchmark unit contracts
        run: python -m pytest -q tests/test_cfb_market_benchmark.py tests/test_cfb_history_cache.py

      - name: Build benchmark from exact frozen archive
        run: >-
          python scripts/build_cfb_historical_market_benchmark.py
          --contract config/research/cfb_historical_market_source_v1.json
          --cache-root artifacts/cfb/history/cache
          --output artifacts/cfb/history/cfb_historical_market_benchmark_v1.json

      - name: Enforce benchmark authority and source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/cfb/history/cfb_historical_market_benchmark_v1.json').read_text())
          if p.get('schema_version') != 'CFB_HISTORICAL_MARKET_BENCHMARK_V1':
              raise SystemExit('CFB_MARKET_BENCHMARK_SCHEMA_INVALID')
          if p.get('status') != 'RESEARCH_ONLY_NOT_PROMOTION_EVIDENCE':
              raise SystemExit('CFB_MARKET_BENCHMARK_STATUS_INVALID')
          if p.get('source_sha256') != '7ae899d9035750dccf22470d7923087a2659052aeb37a44204c35fbf6bf38d4d':
              raise SystemExit('CFB_MARKET_BENCHMARK_SOURCE_SHA_MISMATCH')
          if p.get('row_count') != 1183529 or p.get('season_start') != 2006 or p.get('season_end') != 2025:
              raise SystemExit('CFB_MARKET_BENCHMARK_SOURCE_PROFILE_MISMATCH')
          auth=p.get('authority') or {}
          if not auth or any(value is not False for value in auth.values()):
              raise SystemExit('CFB_MARKET_BENCHMARK_AUTHORITY_MUST_BE_ZERO')
          interpretation=p.get('interpretation') or {}
          if interpretation.get('market_reference_may_rank_model_candidates') is not False:
              raise SystemExit('CFB_MARKET_BENCHMARK_CANDIDATE_SELECTION_FORBIDDEN')
          if interpretation.get('row_order_has_temporal_semantics') is not False:
              raise SystemExit('CFB_MARKET_BENCHMARK_TEMPORAL_SEMANTICS_FORBIDDEN')
          refs=p.get('reference_game_counts') or {}
          for market in ('spread','total','money_line'):
              if int(refs.get(market,0)) <= 0:
                  raise SystemExit('CFB_MARKET_BENCHMARK_REFERENCE_COVERAGE_EMPTY:'+market)
          print('report_sha256='+p['report_sha256'])
          print('reference_game_counts='+json.dumps(refs,sort_keys=True))
          print('ambiguous_book_game_groups='+json.dumps(p.get('ambiguous_book_game_groups') or {},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-historical-market-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cfb/history/cfb_historical_market_benchmark_v1.json
          if-no-files-found: error
          retention-days: 30
