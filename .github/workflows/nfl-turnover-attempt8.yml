name: NFL Attempt 8 turnover-adjusted efficiency
on:
  workflow_dispatch:
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install research dependencies
        run: python -m pip install --upgrade numpy pandas pyarrow
      - name: Fit NFL turnover-adjusted candidate
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -u scripts/fit_nfl_turnover_attempt8.py --seasons 2010,2011,2012,2013,2014,2015,2016,2017,2018,2019 --policy config/nfl_research_search_policy_v1.json --out artifacts/football_baselines_attempt8.json 2>&1 | tee artifacts/fit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-turnover-attempt8-diagnostics
          path: artifacts/fit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-turnover-attempt8
          path: artifacts/football_baselines_attempt8.json
