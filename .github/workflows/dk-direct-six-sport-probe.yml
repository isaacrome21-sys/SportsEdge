name: DK direct six-sport source probe
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Verify coverage tests
        run: python -m pip install pytest==9.1.1 && python -m pytest -q tests/test_dk_direct_six_sport_probe.py
      - name: Read-only direct source probe
        run: python scripts/probe_direct_dk_six_sports.py
      - name: Publish capture coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dk-direct-coverage-${{ github.run_id }}
          path: artifacts/dk_direct/six_sport_probe.json
          if-no-files-found: warn
          retention-days: 14
