name: direct-market-feed-probe

# One-shot reachability/shape probe for anonymous read-only Pinnacle + FanDuel
# sportsbook feeds. PRs run contract tests only. A merge/path-filtered push runs
# the live probe once and uploads raw provider bytes + the zero-authority summary.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_direct_market_feeds.py'
      - 'scripts/normalize_fanduel_nfl_markets.py'
      - 'tests/test_direct_market_feed_probe.py'
      - 'tests/test_fanduel_nfl_market_normalizer.py'
      - '.github/workflows/direct-market-feed-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_direct_market_feeds.py'
      - 'scripts/normalize_fanduel_nfl_markets.py'
      - 'tests/test_direct_market_feed_probe.py'
      - 'tests/test_fanduel_nfl_market_normalizer.py'
      - '.github/workflows/direct-market-feed-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify direct-feed probe contract
        run: python -m unittest tests.test_direct_market_feed_probe -v

      - name: Probe live anonymous read-only feeds
        if: github.event_name != 'pull_request'
        id: live
        continue-on-error: true
        run: |
          mkdir -p artifacts/direct-market-feed-probe
          python scripts/probe_direct_market_feeds.py \
            --out-dir artifacts/direct-market-feed-probe \
            --status-out artifacts/direct-market-feed-probe/status.json

      - name: Enforce zero authority and exact reachability
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/direct-market-feed-probe/status.json
          jq -e '
            .authority.model_p_input == false and
            .authority.truth_gate_input == false and
            .authority.promotion_authority == false and
            .authority.eligibility_authority == false and
            .authority.staking_authority == false and
            .authority.official_authority == false and
            .authority.production_registry_authority == false and
            .authority.evidence_clock_authority == false and
            .authority.wager_placement_authority == false
          ' artifacts/direct-market-feed-probe/status.json >/dev/null
          jq '{state, providers: (.providers | with_entries(.value |= {state,http_status,content_type,raw_sha256,raw_bytes,shape,reason}))}' \
            artifacts/direct-market-feed-probe/status.json
          jq -e '.state == "REACHABLE"' artifacts/direct-market-feed-probe/status.json >/dev/null

      - name: Upload direct-feed probe artifact
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-market-feed-probe-${{ github.sha }}
          path: artifacts/direct-market-feed-probe
          if-no-files-found: error
