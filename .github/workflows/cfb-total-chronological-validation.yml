name: cfb-total-chronological-validation

on:
  pull_request:
    paths:
      - 'scripts/research_cfb_total_chronological.py'
      - 'tests/test_cfb_total_chronological.py'
      - '.github/workflows/cfb-total-chronological-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/research_cfb_total_chronological.py'
      - 'tests/test_cfb_total_chronological.py'
      - '.github/workflows/cfb-total-chronological-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen numerical tooling
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run chronological evaluation invariants
        run: python -m unittest tests.test_cfb_total_chronological -v
      - name: Refit strictly earlier seasons and evaluate against historical closes
        run: |
          python scripts/research_cfb_total_chronological.py \
            --output artifacts/cfb/cfb_total_chronological_research.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cfb-total-chronological-${{ github.sha }}
          path: artifacts/cfb/cfb_total_chronological_research.json
          if-no-files-found: warn
          retention-days: 60
