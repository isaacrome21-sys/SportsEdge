name: v7-shadow-cycle

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore V7 shadow state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/v7-shadow-state
          key: v7-shadow-state-${{ github.run_id }}
          restore-keys: |
            v7-shadow-state-

      - name: Build current V7 feature bundle when normalized sources exist
        run: |
          if [ -f artifacts/v7-shadow-state/source_bundle.json ]; then
            python scripts/build_v7_feature_bundle.py
          else
            echo 'V7_SOURCE_BUNDLE_MISSING; shadow cycle will remain explicitly blocked.'
          fi

      - name: Run V7 shadow cycle
        run: |
          python scripts/run_v7_shadow_cycle.py --allow-blocked

      - name: Verify blocked/captured state is explicit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/v7-shadow-state/v7_shadow_status.json')
          if not p.exists():
              raise SystemExit('V7_SHADOW_STATUS_MISSING')
          value = json.loads(p.read_text())
          if value.get('state') not in {'BLOCKED', 'CAPTURED'}:
              raise SystemExit('V7_SHADOW_STATUS_INVALID')
          if value.get('state') == 'CAPTURED' and value.get('sportsbook_data_used') is not False:
              raise SystemExit('V7_SPORTSBOOK_CONTAMINATION')
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Upload V7 shadow state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-shadow-cycle-${{ github.run_id }}
          path: artifacts/v7-shadow-state
          if-no-files-found: error
          retention-days: 90
