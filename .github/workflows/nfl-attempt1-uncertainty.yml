name: NFL attempt one uncertainty
on:
  push:
    branches: [research/nfl-attempt1-uncertainty]
    paths:
      - '.github/workflows/nfl-attempt1-uncertainty.yml'
      - 'scripts/nfl_attempt1_uncertainty.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Reproduce frozen 2019 comparison and paired uncertainty
        run: python scripts/nfl_attempt1_uncertainty.py --out artifacts/nfl_attempt1_uncertainty.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-attempt1-uncertainty-${{ github.sha }}
          path: artifacts/nfl_attempt1_uncertainty.json
