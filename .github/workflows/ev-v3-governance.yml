name: ev-v3-governance

on:
  pull_request:
    paths:
      - 'config/ev_tracker_policy_v3.json'
      - 'config/ev_tracker_policy_manifest.json'
      - 'config/ev_tracker_v3_activation.json'
      - 'config/ev_tracker_v3_quiescence_disposition.json'
      - 'config/nfl_confirmation_v3_suspension.json'
      - 'sportsedge/ev_suspension_v3.py'
      - 'scripts/ev_credential_health.py'
      - 'scripts/ev_tracker_v3_gate.py'
      - 'scripts/ev_tracker_v3_health_patch.py'
      - 'scripts/ev_v3_state.py'
      - 'tests/test_ev_*v3*.py'
      - 'tests/test_ev_credential_health.py'
      - 'tests/test_nfl_confirmation_v3_suspension.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: V3 policy and state-machine tests
        run: >-
          python -m pytest -q
          tests/test_ev_suspension_v3.py
          tests/test_ev_credential_health.py
          tests/test_ev_tracker_v3_policy.py
          tests/test_ev_tracker_v3_gate.py
          tests/test_ev_v3_state.py
          tests/test_ev_tracker_v3_no_authority.py
          tests/test_ev_tracker_v3_quiescence.py
          tests/test_ev_tracker_v3_outage_threshold.py
          tests/test_ev_tracker_v3_health_patch.py
          tests/test_nfl_confirmation_v3_suspension.py
