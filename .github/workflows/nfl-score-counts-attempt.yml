name: nfl-score-counts-attempt

on:
  workflow_dispatch:
    inputs:
      attempt_number:
        description: Frozen development attempt number
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      confirmation:
        description: Type CONSUME_SCORE_COUNTS_ATTEMPT_N for the selected N
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-score-counts-attempt-${{ inputs.attempt_number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Consume selected frozen development attempt
        run: |
          PYTHONPATH=. python scripts/run_nfl_score_counts_attempt.py \
            --attempt-number "${{ inputs.attempt_number }}" \
            --confirm "${{ inputs.confirmation }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-score-counts-attempt-${{ inputs.attempt_number }}-${{ github.sha }}
          path: artifacts/football/score_counts/attempt_${{ inputs.attempt_number }}/
          if-no-files-found: error
          retention-days: 90
