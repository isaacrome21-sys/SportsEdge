name: manual-mlb-snapshot

on:
  push:
    branches: [main, feat/manual-mlb-snapshot-runner, sportsedge/stage0-coverage-health-v2, feature/mlb-no-quote-age-block]
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - sportsedge/mlb_empirical_support.py
      - tests/test_mlb_empirical_support.py
      - sportsedge/mlb_myspari_own_model.py
      - sportsedge/mlb_context_card.py
      - scripts/acquire_mlb_card_context.py
      - tests/test_mlb_context_card.py
      - scripts/render_mlb_myspari_card.py
      - tests/test_mlb_myspari_own_model.py
      - sportsedge/mlb_lines_intake.py
      - scripts/intake_mlb_lines_issue.py
      - tests/test_mlb_lines_intake.py
      - tests/test_mlb_same_game_guard.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
      - .github/workflows/mlb-lines-issue.yml
  pull_request:
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - sportsedge/mlb_empirical_support.py
      - tests/test_mlb_empirical_support.py
      - sportsedge/mlb_myspari_own_model.py
      - sportsedge/mlb_context_card.py
      - scripts/acquire_mlb_card_context.py
      - tests/test_mlb_context_card.py
      - scripts/render_mlb_myspari_card.py
      - tests/test_mlb_myspari_own_model.py
      - sportsedge/mlb_lines_intake.py
      - scripts/intake_mlb_lines_issue.py
      - tests/test_mlb_lines_intake.py
      - tests/test_mlb_same_game_guard.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
      - .github/workflows/mlb-lines-issue.yml
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Canonical manual MLB JSON path. Leave blank to resolve the current Chicago-date file automatically.'
        required: false
        default: ''
      max_age_minutes:
        description: 'Maximum quote age for a live run.'
        required: false
        default: '60'

permissions:
  contents: read

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Resolve the complete push range, including multi-commit pushes.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Verify canonical manual market contract and live guards
        run: PYTHONPATH=. python -m unittest tests.test_manual_quote_contract tests.test_manual_mlb_live_guards tests.test_mlb_myspari_own_model tests.test_mlb_empirical_support tests.test_mlb_context_card tests.test_mlb_same_game_guard tests.test_mlb_lines_intake
      - name: Resolve input
        id: resolve
        shell: bash
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.input_path }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=America/Chicago date +%F)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REGRESSION_FIXTURE="tests/fixtures/manual_mlb_snapshot_supported.json"
            [[ -f "$REGRESSION_FIXTURE" ]] || { echo "NO_REGRESSION_FIXTURE: $REGRESSION_FIXTURE" >&2; exit 1; }
            echo "path=$REGRESSION_FIXTURE" >> "$GITHUB_OUTPUT"
            echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
            echo "live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${DISPATCH_INPUT:-}" ]]; then
            INPUT="$DISPATCH_INPUT"
          else
            INPUT=""
            if [[ "$EVENT_NAME" == "push" ]]; then
              BASE="$PUSH_BEFORE"
              if [[ "$BASE" =~ ^0+$ ]]; then
                BASE="$(git hash-object -t tree /dev/null)"
              fi
              CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$PUSH_AFTER" -- 'manual_inputs/mlb/*.json')" || {
                echo "MLB_INPUT_DIFF_FAILED: $BASE..$PUSH_AFTER" >&2
                exit 1
              }
              mapfile -t CHANGED_FILES < <(printf '%s\n' "$CHANGED" | sed '/^$/d')
              if [[ ${#CHANGED_FILES[@]} -gt 1 ]]; then
                echo "AMBIGUOUS_CHANGED_MLB_SNAPSHOT: ${CHANGED_FILES[*]} — dispatch with input_path" >&2
                exit 1
              elif [[ ${#CHANGED_FILES[@]} -eq 1 ]]; then
                INPUT="${CHANGED_FILES[0]}"
              fi
            fi
            if [[ -z "$INPUT" ]]; then
            mapfile -t MATCHES < <(find manual_inputs/mlb -maxdepth 1 -type f -name '20??-??-??*.json' | sort)
            [[ ${#MATCHES[@]} -gt 0 ]] || {
              echo "DATED_INPUT_NOT_LOADED: no dated manual_inputs/mlb snapshot" >&2
              exit 1
            }
            # Earliest current/future slate date wins; several files for that date is
            # ambiguous and fails instead of silently taking the alphabetically last.
            NEXT_DATE=""
            for CANDIDATE in "${MATCHES[@]}"; do
              CANDIDATE_DATE="$(basename "$CANDIDATE" | cut -c1-10)"
              if [[ ! "$CANDIDATE_DATE" < "$RUN_DATE" ]] && [[ -z "$NEXT_DATE" || "$CANDIDATE_DATE" < "$NEXT_DATE" ]]; then
                NEXT_DATE="$CANDIDATE_DATE"
              fi
            done
            [[ -n "$NEXT_DATE" ]] || { echo "NO_CURRENT_OR_FUTURE_MLB_SNAPSHOT" >&2; exit 1; }
            mapfile -t SAME_DAY < <(printf '%s\n' "${MATCHES[@]}" | grep "/${NEXT_DATE}" )
            if [[ ${#SAME_DAY[@]} -ne 1 ]]; then
              echo "AMBIGUOUS_MLB_SNAPSHOT for ${NEXT_DATE}: ${SAME_DAY[*]} — dispatch with input_path to choose one" >&2
              exit 1
            fi
            INPUT="${SAME_DAY[0]}"
            fi
          fi

          [[ -f "$INPUT" ]] || { echo "MANUAL_INPUT_NOT_FOUND: $INPUT" >&2; exit 1; }
          BASENAME="$(basename "$INPUT")"
          # The slate date comes from the file name, so a board for tomorrow can be
          # priced tonight. Past slates are still refused, and the runner still
          # enforces first_pitch == run date and not-yet-started games.
          FILE_DATE="${BASENAME:0:10}"
          [[ "$FILE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "MANUAL_INPUT_FILENAME_DATE_MISSING: path=$INPUT" >&2
            exit 1
          }
          [[ ! "$FILE_DATE" < "$RUN_DATE" ]] || {
            echo "MANUAL_INPUT_SLATE_IN_PAST: file_date=$FILE_DATE today=$RUN_DATE path=$INPUT" >&2
            exit 1
          }
          RUN_DATE="$FILE_DATE"
          echo "Resolved MLB snapshot: $INPUT (sha256 $(sha256sum "$INPUT" | cut -c1-12))"
          echo "path=$INPUT" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "live=true" >> "$GITHUB_OUTPUT"

      - name: Run regression fixture
        if: steps.resolve.outputs.live != 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --allow-stale --output artifacts/manual_mlb_snapshot_card.json

      - name: Run SportsEdge on current supplied lines
        if: steps.resolve.outputs.live == 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --run-date "${{ steps.resolve.outputs.run_date }}" --max-age-minutes "${{ github.event.inputs.max_age_minutes || '60' }}" --output artifacts/manual_mlb_snapshot_card.json

      - name: Retrieve pregame context (Statcast, umpire, weather/roof, park, lineups)
        if: always() && hashFiles('artifacts/manual_mlb_snapshot_card.json') != ''
        continue-on-error: true
        run: PYTHONPATH=. python scripts/acquire_mlb_card_context.py --engine-output artifacts/manual_mlb_snapshot_card.json --out-dir artifacts/mlb_context

      - name: Render MySpariEdge-style card from SportsEdge engine output
        if: always() && hashFiles('artifacts/manual_mlb_snapshot_card.json') != ''
        run: |
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.resolve.outputs.path }}" \
            --context-dir artifacts/mlb_context \
            --out-dir artifacts/mlb_myspari
          cat artifacts/mlb_myspari/card.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert main remains read-only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo 'MANUAL_MLB_RESULT_ARTIFACT_ONLY_NO_DIRECT_MAIN_WRITE'

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-mlb-snapshot-card
          path: |
            artifacts/manual_mlb_snapshot_card.json
            artifacts/mlb_myspari/
            artifacts/mlb_context/
          if-no-files-found: warn
