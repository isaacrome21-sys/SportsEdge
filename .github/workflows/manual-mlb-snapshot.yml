name: manual-mlb-snapshot

on:
  push:
    branches: [main, feat/manual-mlb-snapshot-runner, sportsedge/stage0-coverage-health-v2, feature/mlb-no-quote-age-block]
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - sportsedge/mlb_myspari_own_model.py
      - scripts/render_mlb_myspari_card.py
      - tests/test_mlb_myspari_own_model.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
  pull_request:
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - sportsedge/mlb_myspari_own_model.py
      - scripts/render_mlb_myspari_card.py
      - tests/test_mlb_myspari_own_model.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Canonical manual MLB JSON path. Leave blank to resolve the current Chicago-date file automatically.'
        required: false
        default: ''
      max_age_minutes:
        description: 'Maximum quote age for a live run.'
        required: false
        default: '60'

permissions:
  contents: read

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Verify canonical manual market contract and live guards
        run: PYTHONPATH=. python -m unittest tests.test_manual_quote_contract tests.test_manual_mlb_live_guards tests.test_mlb_myspari_own_model
      - name: Resolve input
        id: resolve
        shell: bash
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.input_path }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=America/Chicago date +%F)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REGRESSION_FIXTURE="tests/fixtures/manual_mlb_snapshot_supported.json"
            [[ -f "$REGRESSION_FIXTURE" ]] || { echo "NO_REGRESSION_FIXTURE: $REGRESSION_FIXTURE" >&2; exit 1; }
            echo "path=$REGRESSION_FIXTURE" >> "$GITHUB_OUTPUT"
            echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
            echo "live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${DISPATCH_INPUT:-}" ]]; then
            INPUT="$DISPATCH_INPUT"
          elif [[ "${{ github.event_name }}" == "push" ]] && CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'manual_inputs/mlb/*.json' 2>/dev/null | sort | tail -1)" && [[ -n "$CHANGED" ]]; then
            INPUT="$CHANGED"
          else
            mapfile -t MATCHES < <(find manual_inputs/mlb -maxdepth 1 -type f -name "${RUN_DATE}*.json" | sort)
            [[ ${#MATCHES[@]} -gt 0 ]] || {
              echo "TODAY_INPUT_NOT_LOADED: no manual_inputs/mlb/${RUN_DATE}*.json" >&2
              exit 1
            }
            INPUT="${MATCHES[-1]}"
          fi

          [[ -f "$INPUT" ]] || { echo "MANUAL_INPUT_NOT_FOUND: $INPUT" >&2; exit 1; }
          BASENAME="$(basename "$INPUT")"
          # The slate date comes from the file name, so a board for tomorrow can be
          # priced tonight. Past slates are still refused, and the runner still
          # enforces first_pitch == run date and not-yet-started games.
          FILE_DATE="${BASENAME:0:10}"
          [[ "$FILE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "MANUAL_INPUT_FILENAME_DATE_MISSING: path=$INPUT" >&2
            exit 1
          }
          [[ ! "$FILE_DATE" < "$RUN_DATE" ]] || {
            echo "MANUAL_INPUT_SLATE_IN_PAST: file_date=$FILE_DATE today=$RUN_DATE path=$INPUT" >&2
            exit 1
          }
          RUN_DATE="$FILE_DATE"
          echo "path=$INPUT" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "live=true" >> "$GITHUB_OUTPUT"

      - name: Run regression fixture
        if: steps.resolve.outputs.live != 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --allow-stale --output artifacts/manual_mlb_snapshot_card.json

      - name: Run SportsEdge on current supplied lines
        if: steps.resolve.outputs.live == 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --run-date "${{ steps.resolve.outputs.run_date }}" --max-age-minutes "${{ github.event.inputs.max_age_minutes || '60' }}" --output artifacts/manual_mlb_snapshot_card.json

      - name: Render MySpariEdge-style card from SportsEdge engine output
        if: always() && hashFiles('artifacts/manual_mlb_snapshot_card.json') != ''
        run: |
          PYTHONPATH=. python scripts/render_mlb_myspari_card.py \
            --engine-output artifacts/manual_mlb_snapshot_card.json \
            --snapshot "${{ steps.resolve.outputs.path }}" \
            --out-dir artifacts/mlb_myspari
          cat artifacts/mlb_myspari/card.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert main remains read-only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo 'MANUAL_MLB_RESULT_ARTIFACT_ONLY_NO_DIRECT_MAIN_WRITE'

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-mlb-snapshot-card
          path: |
            artifacts/manual_mlb_snapshot_card.json
            artifacts/mlb_myspari/
          if-no-files-found: warn
