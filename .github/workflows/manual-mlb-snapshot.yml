name: manual-mlb-snapshot

on:
  push:
    branches: [main, feat/manual-mlb-snapshot-runner, sportsedge/stage0-coverage-health-v2]
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
  pull_request:
    paths:
      - sportsedge/manual_quote.py
      - sportsedge/canonical_manual_mlb.py
      - sportsedge/manual_mlb_snapshot.py
      - sportsedge/engine_registry.py
      - sportsedge/generic_market_engine.py
      - sportsedge/quote_bridge.py
      - scripts/run_manual_mlb_snapshot.py
      - tests/test_manual_quote_contract.py
      - tests/test_manual_mlb_live_guards.py
      - tests/fixtures/manual_mlb_snapshot_supported.json
      - manual_inputs/mlb/**
      - .github/workflows/manual-mlb-snapshot.yml
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Canonical manual MLB JSON path. Leave blank to resolve the current Chicago-date file automatically.'
        required: false
        default: ''
      max_age_minutes:
        description: 'Maximum quote age for a live run.'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify canonical manual market contract and live guards
        run: PYTHONPATH=. python -m unittest tests.test_manual_quote_contract tests.test_manual_mlb_live_guards
      - name: Resolve input
        id: resolve
        shell: bash
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.input_path }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=America/Chicago date +%F)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REGRESSION_FIXTURE="tests/fixtures/manual_mlb_snapshot_supported.json"
            [[ -f "$REGRESSION_FIXTURE" ]] || { echo "NO_REGRESSION_FIXTURE: $REGRESSION_FIXTURE" >&2; exit 1; }
            echo "path=$REGRESSION_FIXTURE" >> "$GITHUB_OUTPUT"
            echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
            echo "live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${DISPATCH_INPUT:-}" ]]; then
            INPUT="$DISPATCH_INPUT"
          else
            mapfile -t MATCHES < <(find manual_inputs/mlb -maxdepth 1 -type f -name "${RUN_DATE}*.json" | sort)
            [[ ${#MATCHES[@]} -gt 0 ]] || {
              echo "TODAY_INPUT_NOT_LOADED: no manual_inputs/mlb/${RUN_DATE}*.json" >&2
              exit 1
            }
            INPUT="${MATCHES[-1]}"
          fi

          [[ -f "$INPUT" ]] || { echo "MANUAL_INPUT_NOT_FOUND: $INPUT" >&2; exit 1; }
          BASENAME="$(basename "$INPUT")"
          [[ "$BASENAME" == "${RUN_DATE}"*.json ]] || {
            echo "MANUAL_INPUT_FILENAME_DATE_MISMATCH: run_date=$RUN_DATE path=$INPUT" >&2
            exit 1
          }
          echo "path=$INPUT" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "live=true" >> "$GITHUB_OUTPUT"

      - name: Run regression fixture
        if: steps.resolve.outputs.live != 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --allow-stale --output artifacts/manual_mlb_snapshot_card.json

      - name: Run SportsEdge on current supplied lines
        if: steps.resolve.outputs.live == 'true'
        run: PYTHONPATH=. python scripts/run_manual_mlb_snapshot.py --input "${{ steps.resolve.outputs.path }}" --run-date "${{ steps.resolve.outputs.run_date }}" --max-age-minutes "${{ github.event.inputs.max_age_minutes || '60' }}" --output artifacts/manual_mlb_snapshot_card.json

      - name: Persist latest audited result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp artifacts/manual_mlb_snapshot_card.json artifacts/manual_mlb_snapshot_card_latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/manual_mlb_snapshot_card_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist latest manual MLB SportsEdge result"
          git push
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-mlb-snapshot-card
          path: artifacts/manual_mlb_snapshot_card.json
          if-no-files-found: warn
