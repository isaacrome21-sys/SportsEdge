name: reconcile-pr799-pr791-once

on:
  push:
    branches:
      - fix/freeze-reconciliation-inventory-20260914
    paths:
      - '.github/workflows/reconcile-pr799-pr791-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/freeze-reconciliation-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Patch reconciliation registry deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text(encoding='utf-8'))

          expected = 'f8afb5c5e3251b6ede8a39ef25c47fdd07dfb7ee'
          target = '9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170'
          if registry.get('reconciled_through_sha') not in {expected, target}:
              raise SystemExit('UNEXPECTED_RECONCILIATION_BOUNDARY:' + str(registry.get('reconciled_through_sha')))

          by_id = {b['bundle_id']: b for b in registry.get('bundles', [])}
          bundle = by_id['CFB_CANDIDATE_PREREG_FREEZE_V1']
          desired_disposition = {
              'state': 'REFROZEN',
              'new_bundle_id': 'CFB_CANDIDATE_PREREG_FREEZE_V2',
              'new_freeze_sha': target,
              'forward_clock_restart_at': '2026-09-17T00:24:26Z',
              'reason': 'PR_791_CHANGED_COVERED_FIRST_EVALUATION_READINESS_WORKFLOW_TO_ALIGN_FROZEN_SELECTION_SCOPE; NO_EVALUATION_PERFORMED_AND_ATTEMPTS_CONSUMED_REMAIN_ZERO; REFROZEN_CONSERVATIVELY_UNDER_RECONCILIATION_POLICY',
          }
          existing = bundle.get('disposition')
          if existing not in (None, desired_disposition):
              raise SystemExit('CFB_CANDIDATE_DISPOSITION_CONFLICT')
          bundle['disposition'] = desired_disposition

          wanted = [
              {
                  'delta_id': 'PR_799_RECONCILIATION_RELEASE_MERGE',
                  'pr': 799,
                  'merge_sha': '6aa3edfa33e13e0b81d57586e1600ec5b5d17ccb',
                  'note': 'Reconciliation-only merge that advanced main beyond the PR_797 anchor; registered explicitly before reconciling the subsequent covered CFB candidate-readiness change.',
              },
              {
                  'delta_id': 'PR_791_CFB_SELECTION_READINESS_SCOPE',
                  'pr': 791,
                  'merge_sha': target,
                  'note': 'Changes covered CFB candidate first-evaluation readiness semantics to align with the frozen selection-scope amendment while preserving zero attempts, no evaluation, and zero model/promotion/betting authority; affected bundle is conservatively REFROZEN.',
              },
          ]
          seen = {d.get('delta_id'): d for d in registry.get('deltas', [])}
          for row in wanted:
              prior = seen.get(row['delta_id'])
              if prior is None:
                  registry['deltas'].append(row)
              elif prior != row:
                  raise SystemExit('DELTA_CONFLICT:' + row['delta_id'])

          registry['reconciled_through_sha'] = target
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('config/freeze_reconciliation_registry_v1.json').read_text())
          assert r['reconciled_through_sha'] == '9a4f81a6a2a2eaf3c77c1ff9f0510f99a3a3a170'
          b = {x['bundle_id']: x for x in r['bundles']}['CFB_CANDIDATE_PREREG_FREEZE_V1']
          assert b['disposition']['state'] == 'REFROZEN'
          assert b['disposition']['new_freeze_sha'] == r['reconciled_through_sha']
          ids = {d['delta_id'] for d in r['deltas']}
          assert {'PR_799_RECONCILIATION_RELEASE_MERGE','PR_791_CFB_SELECTION_READINESS_SCOPE'} <= ids
          PY
      - name: Commit registry patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/freeze_reconciliation_registry_v1.json; then
            echo 'registry already patched'
            exit 0
          fi
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json
          git commit -m 'Governance: reconcile PR799 and PR791 drift'
          git push origin HEAD:fix/freeze-reconciliation-inventory-20260914
