name: nfl-prop-v1-source-audit

on:
  push:
    branches:
      - 'grok/nfl/prop-v1-source-audit'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install source-audit dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.3.3 pyarrow==21.0.0 requests==2.32.5 pyreadr==0.5.3

      - name: Compile source audit
        run: python -m py_compile scripts/audit_nfl_prop_v1_sources.py

      - name: Assert source-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/audit_nfl_prop_v1_sources.py").read_text()
          forbidden = [
              "Brier",
              "predicted P(over)",
              "observed",
              "actual_value",
              "run_unified_nfl_model",
              "estimate_p",
          ]
          for token in forbidden:
              if token in p:
                  raise SystemExit(f"PROP_SOURCE_AUDIT_MODEL_SCORING_TOKEN:{token}")
          print("NFL_PROP_V1_SOURCE_ONLY_BOUNDARY_OK")
          PY

      - name: Audit immutable 2025 prop tape and lineup sources
        run: >-
          python scripts/audit_nfl_prop_v1_sources.py
          --out artifacts/nfl_prop_v1_source_audit/source_audit.json

      - name: Summarize admission result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/nfl_prop_v1_source_audit/source_audit.json").read_text())
          if r["status"] != "SOURCE_AUDIT_ONLY_NO_2025_MODEL_SCORING":
              raise SystemExit("PROP_SOURCE_AUDIT_STATUS_INVALID")
          if r["capability"]["frozen_2025_validation_window_spent"] is not False:
              raise SystemExit("PROP_SOURCE_AUDIT_SPENT_WINDOW")
          if r["authority"]["model_scoring"] is not False:
              raise SystemExit("PROP_SOURCE_AUDIT_MODEL_AUTHORITY")
          print(json.dumps({
              "capability": r["capability"],
              "prop_market_source": r["prop_market_source"],
              "injury_status_counts": r["injury_source"].get("report_status_counts", {}),
              "weekly_roster_status_counts": r["weekly_roster_source"].get("status_counts", {}),
              "depth": {
                  "rows": r["depth_chart_source"].get("rows"),
                  "dt_nonnull": r["depth_chart_source"].get("dt_nonnull"),
                  "qb_rank1_rows": r["depth_chart_source"].get("qb_rank1_rows"),
                  "qb_rank1_teams": r["depth_chart_source"].get("qb_rank1_teams"),
              },
              "receipts": r["receipts"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-prop-v1-source-audit-${{ github.sha }}
          path: artifacts/nfl_prop_v1_source_audit/source_audit.json
          if-no-files-found: error
          retention-days: 30
