name: tmp-nfl-det-car-unified-research

on:
  push:
    branches:
      - run/nfl-det-car-20261004
    paths:
      - '.github/workflows/tmp-nfl-det-car-unified.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run unified NFL research model
        run: |
          python - <<'PY'
          import csv, io, json
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import Request, urlopen
          from sportsedge.nfl_unified_phone import build_unified_phone_card
          from sportsedge.sports.nfl.full_auto import fetch_nflverse_depth_charts

          def fetch_csv(uri):
              req=Request(uri,headers={"User-Agent":"SportsEdge/1.0","Accept":"text/csv"})
              with urlopen(req,timeout=60) as resp:
                  raw=resp.read()
              rows=[dict(r) for r in csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))]
              return rows, sha256(raw).hexdigest()

          def fetch_stats(seasons):
              all_rows=[]; receipts=[]
              for season in seasons:
                  uri=f"https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_{season}.csv"
                  rows,digest=fetch_csv(uri)
                  for r in rows:
                      if not r.get("recent_team") and r.get("team"):
                          r["recent_team"]=r.get("team")
                  all_rows.extend(rows)
                  receipts.append({"season":str(season),"source_uri":uri,"raw_sha256":digest})
              return all_rows, receipts

          def fetch_injuries(season):
              uri=f"https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_{season}.csv"
              rows,digest=fetch_csv(uri)
              if not rows:
                  raise RuntimeError("INJURY_ROWS_EMPTY")
              keys=set(rows[0])
              print("INJURY_COLUMNS",sorted(keys))
              alias=None
              for cand in ("date_modified","last_modified","report_date","date_updated","modified","date"):
                  if cand in keys:
                      alias=cand; break
              if alias is None:
                  raise RuntimeError("INJURY_DATE_ALIAS_NOT_FOUND")
              for r in rows:
                  if not r.get("date_modified"):
                      r["date_modified"]=r.get(alias)
              return rows,uri,digest,alias

          ticket=json.loads(Path("manual_inputs/nfl_det_car_20261004.json").read_text())
          history=json.loads(Path("manual_inputs/nfl_det_car_history_20261004.json").read_text())
          schedule_games=[{
              "game_id":"2026_04_DET_CAR","away_team":"DET","home_team":"CAR",
              "season":2026,"week":4,"kickoff_ts":"2026-10-05T00:20:00+00:00"
          }]
          depth_rows, depth_uri, depth_sha = fetch_nflverse_depth_charts(season=2026)
          player_rows, player_receipts = fetch_stats([2025,2026])
          injury_rows, injury_uri, injury_sha, injury_date_alias = fetch_injuries(2026)

          payload=build_unified_phone_card(
              ticket,
              history=history,
              schedule_games=schedule_games,
              depth_rows=depth_rows,
              player_rows=player_rows,
              injury_rows=injury_rows,
              injury_source_ready=True,
              n_sims=50000,
              seed=21,
          )
          payload["source_status"]={
              "schedule":"MANUAL_EXACT_FROM_SCREENSHOT_MATCHUP",
              "depth":"AVAILABLE",
              "player_stats":"AVAILABLE_SCHEMA_ADAPTED_TEAM_TO_RECENT_TEAM",
              "injuries":f"AVAILABLE_DATE_ALIAS:{injury_date_alias}",
          }
          payload["source_receipts"]={
              "depth_uri":depth_uri,"depth_sha256":depth_sha,
              "player_stats":player_receipts,
              "injury_uri":injury_uri,"injury_sha256":injury_sha,
          }
          out=Path("artifacts/run_it/nfl_det_car_20261004.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+"\n")
          print(json.dumps({"status":"OK","rows":len(payload.get("rows") or []),"selected_rows":len(payload.get("selected_rows") or []),"source_status":payload.get("source_status")},sort_keys=True))
          PY
      - name: Print model readout
        if: always() && hashFiles('artifacts/run_it/nfl_det_car_20261004.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/run_it/nfl_det_car_20261004.json").read_text())
          print("SCHEMA",p.get("schema"))
          print("SOURCE_STATUS",json.dumps(p.get("source_status"),sort_keys=True))
          print("SELECTED_ROWS",len(p.get("selected_rows") or []))
          for row in sorted(p.get("selected_rows") or [],key=lambda x:float(x.get("ev_per_dollar") or -999),reverse=True):
              print(json.dumps({"market":row.get("market"),"player":row.get("player"),"selection":row.get("selection"),"line":row.get("line"),"price":row.get("price_american"),"estimate_p":row.get("estimate_p"),"edge":row.get("edge_probability_points"),"ev":row.get("ev_per_dollar"),"score":row.get("score_0_100"),"raw":row.get("raw")},sort_keys=True))
          reasons={}
          for row in p.get("rows") or []:
              if row.get("status")=="NO_MODEL":
                  reasons[row.get("reason")]=reasons.get(row.get("reason"),0)+1
          print("NO_MODEL_REASONS",json.dumps(reasons,sort_keys=True))
          for g in p.get("games") or []:
              print("ATTEMPT9_RAW",json.dumps(g.get("attempt9_raw"),sort_keys=True))
              print("SCORE_MEANS",json.dumps(g.get("score_means"),sort_keys=True))
          PY
      - name: Upload DET-CAR research card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-det-car-20261004-unified
          path: artifacts/run_it/nfl_det_car_20261004.json
          if-no-files-found: warn
          retention-days: 14
