name: tmp-nfl-det-car-unified-research

on:
  push:
    branches:
      - run/nfl-det-car-20261004
    paths:
      - '.github/workflows/tmp-nfl-det-car-unified.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Run unified NFL research model
        run: |
          python scripts/run_nfl_unified_lines_card.py \
            --input manual_inputs/nfl_det_car_20261004.json \
            --history manual_inputs/nfl_det_car_history_20261004.json \
            --output artifacts/run_it/nfl_det_car_20261004.json \
            --n-sims 50000 \
            --seed 21 \
            --horizon-days 1
      - name: Print model readout
        if: always() && hashFiles('artifacts/run_it/nfl_det_car_20261004.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/run_it/nfl_det_car_20261004.json").read_text())
          print("SCHEMA",p.get("schema"))
          print("SOURCE_STATUS",json.dumps(p.get("source_status"),sort_keys=True))
          print("SELECTED_ROWS",len(p.get("selected_rows") or []))
          for row in sorted(p.get("selected_rows") or [],key=lambda x:float(x.get("ev_per_dollar") or -999),reverse=True):
              print(json.dumps({
                  "market":row.get("market"),"player":row.get("player"),"selection":row.get("selection"),
                  "line":row.get("line"),"price":row.get("price_american"),
                  "estimate_p":row.get("estimate_p"),"edge":row.get("edge_probability_points"),
                  "ev":row.get("ev_per_dollar"),"score":row.get("score_0_100"),
                  "raw":row.get("raw")
              },sort_keys=True))
          reasons={}
          for row in p.get("rows") or []:
              if row.get("status")=="NO_MODEL":
                  reasons[row.get("reason")]=reasons.get(row.get("reason"),0)+1
          print("NO_MODEL_REASONS",json.dumps(reasons,sort_keys=True))
          for g in p.get("games") or []:
              print("ATTEMPT9_RAW",json.dumps(g.get("attempt9_raw"),sort_keys=True))
              print("SCORE_MEANS",json.dumps(g.get("score_means"),sort_keys=True))
          PY
      - name: Upload DET-CAR research card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-det-car-20261004-unified
          path: artifacts/run_it/nfl_det_car_20261004.json
          if-no-files-found: warn
          retention-days: 14
