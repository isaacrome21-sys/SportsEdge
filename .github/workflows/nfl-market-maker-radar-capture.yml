name: nfl-market-maker-radar-capture

# Direct-public, zero-authority NFL market snapshot lane.
# Price-leadership observations and takeability offsets are PIT-sensitive and
# cannot be reconstructed honestly later. Persistence is not execution evidence.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/capture_nfl_market_maker_radar.py'
      - 'scripts/capture_nfl_market_maker_radar_v2.py'
      - 'scripts/normalize_pinnacle_nfl_markets.py'
      - 'scripts/normalize_fanduel_nfl_markets.py'
      - 'sportsedge/draftkings_game_market_source.py'
      - 'scripts/analyze_market_maker_radar.py'
      - 'scripts/analyze_market_maker_radar_v2.py'
      - 'scripts/recheck_market_maker_candidate_persistence.py'
      - 'scripts/log_market_maker_execution_attempt.py'
      - 'scripts/evaluate_market_maker_execution_pilot.py'
      - 'scripts/settle_market_maker_candidate_ledger.py'
      - 'scripts/settle_market_maker_candidate_ledger_v2.py'
      - 'config/market_maker_radar_v1.json'
      - 'config/market_maker_radar_v2.json'
      - 'config/workflow_cron_policy_v1.json'
      - '.github/workflows/nfl-market-maker-radar-capture.yml'
  pull_request:
    paths:
      - 'scripts/capture_nfl_market_maker_radar.py'
      - 'scripts/capture_nfl_market_maker_radar_v2.py'
      - 'tests/test_capture_nfl_market_maker_radar.py'
      - 'tests/test_capture_nfl_market_maker_radar_v2.py'
      - 'scripts/normalize_pinnacle_nfl_markets.py'
      - 'scripts/normalize_fanduel_nfl_markets.py'
      - 'sportsedge/draftkings_game_market_source.py'
      - 'scripts/analyze_market_maker_radar.py'
      - 'scripts/analyze_market_maker_radar_v2.py'
      - 'scripts/recheck_market_maker_candidate_persistence.py'
      - 'scripts/log_market_maker_execution_attempt.py'
      - 'scripts/evaluate_market_maker_execution_pilot.py'
      - 'scripts/settle_market_maker_candidate_ledger.py'
      - 'scripts/settle_market_maker_candidate_ledger_v2.py'
      - 'tests/test_market_maker_radar.py'
      - 'tests/test_market_maker_radar_v2.py'
      - 'tests/test_market_maker_candidate_settlement.py'
      - 'tests/test_market_maker_candidate_settlement_v2.py'
      - 'tests/test_market_maker_candidate_persistence.py'
      - 'tests/test_market_maker_execution_attempts.py'
      - 'tests/test_nfl_market_maker_radar_workflow.py'
      - 'config/market_maker_radar_v1.json'
      - 'config/market_maker_radar_v2.json'
      - 'config/workflow_cron_policy_v1.json'
      - '.github/workflows/nfl-market-maker-radar-capture.yml'

permissions:
  contents: write

concurrency:
  group: sportsedge-nfl-market-maker-radar-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify direct radar contracts
        run: |
          python -m unittest tests.test_capture_nfl_market_maker_radar -v
          python -m unittest tests.test_capture_nfl_market_maker_radar_v2 -v
          python -m unittest tests.test_market_maker_radar -v
          python -m unittest tests.test_market_maker_radar_v2 -v
          python -m unittest tests.test_market_maker_candidate_settlement -v
          python -m unittest tests.test_market_maker_candidate_settlement_v2 -v
          python -m unittest tests.test_market_maker_candidate_persistence -v
          python -m unittest tests.test_market_maker_execution_attempts -v
          python -m unittest tests.test_nfl_market_maker_radar_workflow -v
          python -m unittest tests.test_normalize_pinnacle_nfl_markets -v
          python -m unittest tests.test_fanduel_nfl_market_normalizer -v
          python -m unittest tests.test_direct_dk_game_market_source -v

      - name: Attach append-only data branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:data
            git worktree add .data-branch data
          else
            git worktree add --detach .data-branch
            (cd .data-branch && git checkout --orphan data && git rm -rf --quiet . || true)
          fi

      - name: Capture concurrent Pinnacle DK FanDuel NFL snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nfl-market-maker-radar
          python -m scripts.capture_nfl_market_maker_radar_v2 \
            --out-root .data-branch \
            --status-out artifacts/nfl-market-maker-radar/capture-status.json
          jq -e '
            (.state == "CAPTURED" or .state == "PARTIAL") and
            .rows_written > 0 and
            .transport_mode == "CONCURRENT_PROVIDER_START" and
            .authority.model_p_input == false and
            .authority.truth_gate_input == false and
            .authority.promotion_authority == false and
            .authority.eligibility_authority == false and
            .authority.staking_authority == false and
            .authority.official_authority == false and
            .authority.evidence_clock_authority == false and
            .authority.wager_placement_authority == false
          ' artifacts/nfl-market-maker-radar/capture-status.json >/dev/null

      - name: Analyze timing-eligible radar history and ledger stale candidates
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analyze_market_maker_radar_v2 \
            --policy config/market_maker_radar_v2.json \
            --input-root .data-branch/archive/market-maker-radar/nfl \
            --ledger-out-root .data-branch \
            --since-hours 24 \
            --out artifacts/nfl-market-maker-radar/latest.json
          jq -e '
            .model_p_authority == false and
            .truth_gate_input == false and
            .promotion_authority == false and
            .eligibility_authority == false and
            .staking_authority == false and
            .official_authority == false and
            .automatic_wager_authority == false and
            .manual_candidate_review_authority == true and
            .primary_metric == "REALIZED_ROI_ON_FILLED_WAGERS" and
            .process_metric == "CLV" and
            .run_it_independence.counts_as_independent_context_class == false
          ' artifacts/nfl-market-maker-radar/latest.json >/dev/null

      - name: Wait until 30-second persistence offset
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          NEW_CANDIDATES="$(jq -r '.candidate_ledger_new_count' artifacts/nfl-market-maker-radar/latest.json)"
          if [ "${NEW_CANDIDATES}" -gt 0 ]; then
            python - <<'PY'
          import json, time
          from datetime import datetime, timedelta, timezone
          with open('artifacts/nfl-market-maker-radar/capture-status.json', encoding='utf-8') as fh:
              capture = json.load(fh)
          captured_at = datetime.fromisoformat(capture['captured_at'].replace('Z', '+00:00')).astimezone(timezone.utc)
          delay = (captured_at + timedelta(seconds=30) - datetime.now(timezone.utc)).total_seconds()
          if delay > 0: time.sleep(delay)
          PY
          fi

      - name: Re-poll stale candidates at 30 seconds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.recheck_market_maker_candidate_persistence \
            --policy config/market_maker_radar_v2.json \
            --analysis-report artifacts/nfl-market-maker-radar/latest.json \
            --out-root .data-branch \
            --offset-seconds 30 \
            --status-out artifacts/nfl-market-maker-radar/persistence-30.json
          jq -e '(.state == "NO_NEW_CANDIDATES" or .state == "COMPLETE") and .requested_offset_seconds == 30 and .clv_role == "DETECTOR_PROCESS_CHECK_NOT_EDGE_VALIDATION"' artifacts/nfl-market-maker-radar/persistence-30.json >/dev/null

      - name: Wait until 180-second persistence offset
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          NEW_CANDIDATES="$(jq -r '.candidate_ledger_new_count' artifacts/nfl-market-maker-radar/latest.json)"
          if [ "${NEW_CANDIDATES}" -gt 0 ]; then
            python - <<'PY'
          import json, time
          from datetime import datetime, timedelta, timezone
          with open('artifacts/nfl-market-maker-radar/capture-status.json', encoding='utf-8') as fh:
              capture = json.load(fh)
          captured_at = datetime.fromisoformat(capture['captured_at'].replace('Z', '+00:00')).astimezone(timezone.utc)
          delay = (captured_at + timedelta(seconds=180) - datetime.now(timezone.utc)).total_seconds()
          if delay > 0: time.sleep(delay)
          PY
          fi

      - name: Re-poll stale candidates at 180 seconds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.recheck_market_maker_candidate_persistence \
            --policy config/market_maker_radar_v2.json \
            --analysis-report artifacts/nfl-market-maker-radar/latest.json \
            --out-root .data-branch \
            --offset-seconds 180 \
            --status-out artifacts/nfl-market-maker-radar/persistence-180.json
          jq -e '(.state == "NO_NEW_CANDIDATES" or .state == "COMPLETE") and .requested_offset_seconds == 180 and .clv_role == "DETECTOR_PROCESS_CHECK_NOT_EDGE_VALIDATION"' artifacts/nfl-market-maker-radar/persistence-180.json >/dev/null

      - name: Evaluate execution-evidence accrual state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.evaluate_market_maker_execution_pilot \
            --policy config/market_maker_radar_v2.json \
            --ledger-root .data-branch \
            --out artifacts/nfl-market-maker-radar/execution-pilot.json
          jq -e '.edge_evidence == false and .model_p_authority == false and .promotion_authority == false and .staking_authority == false and .official_authority == false' artifacts/nfl-market-maker-radar/execution-pilot.json >/dev/null

      - name: Settle exact-contract CLV process checks
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.settle_market_maker_candidate_ledger_v2 \
            --policy config/market_maker_radar_v2.json \
            --archive-root .data-branch/archive/market-maker-radar/nfl \
            --ledger-root .data-branch \
            --out artifacts/nfl-market-maker-radar/settlement.json
          jq -e '
            .primary_metric == "REALIZED_ROI_ON_FILLED_WAGERS" and
            .process_metric == "CLV" and
            .clv_role == "DETECTOR_PROCESS_CHECK_NOT_EDGE_VALIDATION" and
            .model_p_authority == false and
            .promotion_authority == false and
            .staking_authority == false and
            .official_authority == false and
            .automatic_wager_authority == false
          ' artifacts/nfl-market-maker-radar/settlement.json >/dev/null

      - name: Commit append-only observations candidates persistence and settlements
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd .data-branch
          git config user.name 'sportsedge-radar[bot]'
          git config user.email 'sportsedge-radar@users.noreply.github.com'
          git add -A archive/market-maker-radar
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          CAPTURE_ID="$(jq -r '.capture_id' ../artifacts/nfl-market-maker-radar/capture-status.json)"
          ROWS="$(jq -r '.rows_written' ../artifacts/nfl-market-maker-radar/capture-status.json)"
          NEW_CANDIDATES="$(jq -r '.candidate_ledger_new_count' ../artifacts/nfl-market-maker-radar/latest.json)"
          P30="$(jq -r '.new_persistence_count // 0' ../artifacts/nfl-market-maker-radar/persistence-30.json)"
          P180="$(jq -r '.new_persistence_count // 0' ../artifacts/nfl-market-maker-radar/persistence-180.json)"
          NEW_SETTLEMENTS="$(jq -r '.new_settlement_count' ../artifacts/nfl-market-maker-radar/settlement.json)"
          git commit -m "nfl-market-maker-radar: ${CAPTURE_ID} rows=${ROWS} candidates=${NEW_CANDIDATES} persistence30=${P30} persistence180=${P180} settlements=${NEW_SETTLEMENTS} [LAYER_B_NOT_EVIDENCE]"
          for attempt in 1 2 3; do
            git fetch origin data || true
            if ! git rebase origin/data; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo 'NFL_RADAR_DATA_PUSH_FAILED' >&2
          exit 1

      - name: Upload capture and radar diagnostic
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-market-maker-radar-${{ github.run_id }}
          path: artifacts/nfl-market-maker-radar
          if-no-files-found: warn
