name: NFL PAPER final-grade evidence (manual)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Existing [NFL LINES] issue with merged pregame snapshots"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  nfl-paper-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and test strict NFL grading
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nfl_paper_grader.py tests/test_nfl_final_receipts.py
      - name: Capture source-bound ESPN final and strict PAPER grade
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          if [[ ! "${ISSUE}" =~ ^[0-9]+$ ]]; then
            echo "REFUSED: ISSUE_INVALID" >&2
            exit 2
          fi
          python scripts/capture_nfl_paper_final_receipt.py \
            --issue "$ISSUE" \
            --out "ledger/nfl_final_receipts/${ISSUE}.json"
          python scripts/grade_nfl_paper_issue.py \
            --issue "$ISSUE" \
            --final-receipt "ledger/nfl_final_receipts/${ISSUE}.json" \
            --source-raw "ledger/nfl_final_receipts/${ISSUE}.json.raw.json" \
            --output "ledger/nfl_paper_grades/${ISSUE}.json"
      - name: Propose immutable grading evidence, never write protected main
        env:
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/nfl-paper-grade-issue-${ISSUE}-run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add \
            "ledger/nfl_final_receipts/${ISSUE}.json" \
            "ledger/nfl_final_receipts/${ISSUE}.json.raw.json" \
            "ledger/nfl_paper_grades/${ISSUE}.json"
          git commit -m "NFL PAPER grade issue ${ISSUE} with source-bound ESPN receipt"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "NFL PAPER grade receipt for [NFL LINES] #${ISSUE}" \
            --body "Immutable ESPN raw-byte and SHA-256 receipt, independent kickoff, strict entry_and_close CLV. All grades PAPER. No fallback/backfill. Review before merging."
      - name: Keep source receipt and grade as review artifact if PR is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-paper-grade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ledger/nfl_final_receipts/
            ledger/nfl_paper_grades/
          retention-days: 90
          if-no-files-found: warn
