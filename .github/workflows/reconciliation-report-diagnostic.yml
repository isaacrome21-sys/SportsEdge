name: reconciliation-report-diagnostic

on:
  push:
    branches:
      - governance/reconcile-post-898-20260921
    paths:
      - '.github/workflows/reconciliation-report-diagnostic.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-post-898-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Build canonicalized registry in workspace
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          target="ed628eaa978dd11a2097da91fa006067fb55e717"
          test "$actual" = "$target" || { echo "MAIN_MOVED:$actual:expected=$target"; exit 1; }
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          registry_path = Path('config/freeze_reconciliation_registry_v1.json')
          extension_path = Path('config/reconciliation_coverage_v1.json')
          registry = json.loads(registry_path.read_text())
          extension = json.loads(extension_path.read_text())
          anchor = str(registry['reconciled_through_sha'])
          target = 'ed628eaa978dd11a2097da91fa006067fb55e717'

          if extension.get('schema') != 'SPORTSEDGE_RECONCILIATION_COVERAGE_EXTENSION_V1':
              raise SystemExit('RECONCILIATION_COVERAGE_EXTENSION_SCHEMA_INVALID')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          subprocess.check_call(['git', 'merge-base', '--is-ancestor', anchor, target])
          commits = [x for x in git('rev-list', '--first-parent', '--reverse', f'{anchor}..{target}').splitlines() if x]
          existing = {str(row.get('merge_sha') or '') for row in registry.get('deltas') or [] if isinstance(row, dict)}
          for sha in commits:
              if sha in existing:
                  continue
              subject = git('show', '-s', '--format=%s', sha)
              body = git('show', '-s', '--format=%B', sha)
              match = re.search(r'(?:pull request |PR\s*#?)#?(\d+)', body, flags=re.I)
              registry.setdefault('deltas', []).append({
                  'delta_id': f'MAIN_CATCHUP_{sha[:12].upper()}',
                  'merge_sha': sha,
                  'note': 'Protected-main first-parent catch-up classification; machine matrix determines bundle impact. Subject: ' + subject,
                  'pr': int(match.group(1)) if match else 0,
              })
              existing.add(sha)

          bundles = {str(row.get('bundle_id') or ''): row for row in registry.get('bundles') or [] if isinstance(row, dict)}
          for bundle_id, ext in sorted((extension.get('bundle_extensions') or {}).items()):
              bundle = bundles.get(str(bundle_id))
              if bundle is None:
                  raise SystemExit(f'RECONCILIATION_EXTENSION_UNKNOWN_BUNDLE:{bundle_id}')
              bundle['coverage_paths'] = sorted(set(map(str, bundle.get('coverage_paths') or [])) | set(map(str, ext.get('coverage_paths') or [])))
              bundle['coverage_prefixes'] = sorted(set(map(str, bundle.get('coverage_prefixes') or [])) | set(map(str, ext.get('coverage_prefixes') or [])))

          exact = registry.setdefault('exact_exemptions', {})
          for path, reason in sorted((extension.get('exact_exemptions') or {}).items()):
              path, reason = str(path), str(reason)
              if path in exact and str(exact[path]) != reason:
                  raise SystemExit('RECONCILIATION_EXEMPTION_CONFLICT:' + path)
              exact[path] = reason

          registry['bundle_inventory_complete'] = False
          prop = bundles['NFL_PROP_MODEL_FREEZE_V1']
          prop['disposition'] = {
              'prior_forward_clock_invalidated': True,
              'reason': 'PR_898_CHANGED_COVERED_NFL_PROP_TEST_SURFACE; RESEARCH_CHALLENGER_MERGED_WITHOUT_FULL_REFREEZE; REVOKED_FAIL_CLOSED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'state': 'REVOKED',
          }
          registry['reconciled_through_sha'] = target
          registry_path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - name: Build and persist machine report summary
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/reconciliation_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/reconciliation_report.json').read_text())
          summary = {
              'outcome_counts': report.get('outcome_counts') or {},
              'release_blocks': sorted(report.get('release_blocks') or []),
              'authority': report.get('authority') or {},
              'drift_confirmed_rows': [
                  row for row in report.get('rows') or []
                  if row.get('outcome') == 'DRIFT_CONFIRMED'
              ],
              'inventory': report.get('inventory') or {},
          }
          Path('ops').mkdir(exist_ok=True)
          Path('ops/reconciliation_report_summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY
          git checkout -- config/freeze_reconciliation_registry_v1.json
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/reconciliation_report_summary.json
          git commit -m 'Governance: record reconciliation report summary'
          git push origin HEAD:governance/reconcile-post-898-20260921
