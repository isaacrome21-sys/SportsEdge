name: reconciliation-report-diagnostic

on:
  push:
    branches:
      - governance/reconcile-post-898-20260921
    paths:
      - '.github/workflows/reconciliation-report-diagnostic.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-post-898-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Build canonicalized registry in workspace
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          target="ed628eaa978dd11a2097da91fa006067fb55e717"
          test "$actual" = "$target" || { echo "MAIN_MOVED:$actual:expected=$target"; exit 1; }
          python - <<'PY'
          import json, re, subprocess
          from pathlib import import Path
          PY
