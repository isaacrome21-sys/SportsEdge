name: NFL 2026 line capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = validate setup only; capture = capture if a window is open"
        type: choice
        options: [check, capture]
        default: check
  pull_request:
    paths:
      - 'scripts/audit_nfl_2026_capture_gaps.py'
      - 'tests/test_nfl_2026_capture_gap_audit.py'
      - 'config/nfl_2026_capture.json'
      - '.github/workflows/nfl-2026-line-capture.yml'
  # Frozen confirmation evidence is independent of the forward-CLV collector.
  # Ten-minute polling is gated against the free nflverse schedule before the
  # paid DraftKings capture path runs, so the 30..15 minute FINAL window gets a
  # chance without spending odds-provider credits outside a frozen window.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify no-backfill gap-audit contract
        run: |
          python3 -m py_compile scripts/audit_nfl_2026_capture_gaps.py
          python3 -m unittest -q tests.test_nfl_2026_capture_gap_audit

      - name: Gate scheduled run to a frozen capture window using free schedule data
        if: github.event_name == 'schedule'
        id: due
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            -o "$RUNNER_TEMP/nfl-games.csv"
          python3 - <<'PY'
          import csv, json, os
          from collections import Counter
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          cfg = json.loads(Path('config/nfl_2026_capture.json').read_text())
          now = datetime.now(timezone.utc)
          tz = ZoneInfo(cfg['timezone'])
          local = now.astimezone(tz)
          anchor = date.fromisoformat(cfg['week1_tuesday_local_date'])

          hh, mm = map(int, cfg['opener_local_time'].split(':'))
          opener_target = local.replace(hour=hh, minute=mm, second=0, microsecond=0)
          opener_window_open = (
              local.strftime('%A') == cfg['opener_weekday']
              and opener_target <= local < opener_target + timedelta(minutes=int(cfg['opener_window_minutes']))
          )
          opener_week = ((local.date() - anchor).days // 7 + 1) if opener_window_open else 0
          if opener_week < int(cfg['first_week']):
              opener_window_open = False
              opener_week = 0
          opener_path = Path(cfg['output_dir']) / f"week{opener_week:02d}" / 'opener.json' if opener_week else None
          opener_due = bool(opener_window_open and opener_path and not opener_path.is_file())

          # Count already-materialized FINAL rows by kickoff so repeated polling
          # asks the paid provider only for still-missing rows.
          captured_final = Counter()
          for path in Path(cfg['output_dir']).glob('week*/final/*.json'):
              try:
                  record = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              for game in record.get('games') or []:
                  raw = str(game.get('commence_time') or '').strip()
                  if not raw:
                      continue
                  try:
                      dt = datetime.fromisoformat(raw.replace('Z', '+00:00')).astimezone(timezone.utc)
                  except ValueError:
                      continue
                  captured_final[dt.strftime('%Y-%m-%dT%H:%M:%SZ')] += 1

          expected_open_final = Counter()
          eastern = ZoneInfo('America/New_York')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'nfl-games.csv'), newline='', encoding='utf-8-sig') as handle:
              for row in csv.DictReader(handle):
                  if str(row.get('season') or '') != '2026':
                      continue
                  gameday = str(row.get('gameday') or '').strip()
                  gametime = str(row.get('gametime') or '').strip()
                  if not gameday or not gametime:
                      continue
                  try:
                      kickoff = datetime.fromisoformat(f'{gameday}T{gametime}').replace(tzinfo=eastern).astimezone(timezone.utc)
                  except ValueError:
                      continue
                  week = (kickoff.astimezone(tz).date() - anchor).days // 7 + 1
                  if week < int(cfg['first_week']):
                      continue
                  start = kickoff - timedelta(minutes=int(cfg['final_minutes_before_kickoff']))
                  end = min(start + timedelta(minutes=int(cfg['final_window_minutes'])), kickoff)
                  if start <= now < end:
                      expected_open_final[kickoff.strftime('%Y-%m-%dT%H:%M:%SZ')] += 1

          final_due_kickoffs = []
          for kickoff_z, expected_count in sorted(expected_open_final.items()):
              missing = max(0, expected_count - captured_final[kickoff_z])
              final_due_kickoffs.extend([kickoff_z] * missing)

          final_due = bool(final_due_kickoffs)
          due = opener_due or final_due
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"due={'true' if due else 'false'}\n")
              output.write(f"opener_due={'true' if opener_due else 'false'}\n")
              output.write(f"opener_week={opener_week}\n")
              output.write(f"final_due={'true' if final_due else 'false'}\n")
              output.write('final_due_kickoffs=' + json.dumps(final_due_kickoffs, separators=(',', ':')) + '\n')
          print(json.dumps({
              'due': due,
              'opener_window_open': opener_window_open,
              'opener_due': opener_due,
              'opener_week': opener_week,
              'final_due': final_due,
              'final_due_kickoffs': final_due_kickoffs,
              'checked_at_utc': now.isoformat(),
          }))
          PY

      - name: Record elapsed missing windows without backfill
        if: github.event_name == 'schedule'
        run: python3 scripts/audit_nfl_2026_capture_gaps.py --schedule-csv "$RUNNER_TEMP/nfl-games.csv"

      - name: Run capture
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        id: run
        env:
          ODDS_API_KEY_1: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          WORKFLOW_PATH: .github/workflows/nfl-2026-line-capture.yml
          MODE: ${{ github.event_name == 'schedule' && 'capture' || inputs.mode || 'check' }}
        run: |
          set +e
          python3 scripts/nfl_2026_line_capture.py "$MODE"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Verify every due scheduled capture materialized
        if: github.event_name == 'schedule' && steps.due.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --schedule-csv "$RUNNER_TEMP/nfl-games.csv"
            --github-run-id "$GITHUB_RUN_ID"
            --verify-final-kickoffs '${{ steps.due.outputs.final_due_kickoffs }}'
          )
          if [ '${{ steps.due.outputs.opener_due }}' = 'true' ]; then
            args+=(--verify-opener-week '${{ steps.due.outputs.opener_week }}')
          fi
          python3 scripts/audit_nfl_2026_capture_gaps.py "${args[@]}"

      - name: Commit captures and absence markers
        if: always() && (github.event_name == 'schedule' || (steps.run.outcome != 'skipped' && inputs.mode == 'capture'))
        run: |
          DIR=data/nfl_2026_confirmation/captures
          [ -d "$DIR" ] || { echo "No capture directory yet"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "NFL 2026 confirmation evidence (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((i * 5))
          done
          echo "PUSH_FAILED"
          exit 1

      - name: Fail job if capture or check failed
        if: steps.run.outcome != 'skipped' && steps.run.outputs.rc != '0'
        run: exit 1
