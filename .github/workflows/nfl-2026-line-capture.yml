name: NFL 2026 line capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = validate setup only; capture = capture if a window is open"
        type: choice
        options: [check, capture]
        default: check
  pull_request:
    paths:
      - 'scripts/nfl_2026_line_capture.py'
      - 'scripts/audit_nfl_2026_capture_gaps.py'
      - 'scripts/stamp_nfl_2026_capture_quarantine.py'
      - 'scripts/odds_api_quota_guard.py'
      - 'scripts/nfl_2026_provider_preflight.py'
      - 'scripts/nfl_direct_dk_preflight.py'
      - 'sportsedge/nfl_direct_capture_source.py'
      - 'sportsedge/draftkings_game_market_source.py'
      - 'sportsedge/nfl_confirmation_schedule.py'
      - 'tests/test_nfl_direct_capture_source.py'
      - 'tests/test_nfl_2026_direct_capture_wiring.py'
      - 'tests/test_nfl_confirmation_schedule.py'
      - 'tests/test_nfl_direct_dk_preflight.py'
      - 'tests/test_nfl_2026_capture_gap_audit.py'
      - 'tests/test_nfl_2026_provider_budget.py'
      - 'config/nfl_2026_capture.json'
      - 'config/nfl_research_search_policy_v1.json'
      - 'config/nfl_2026_capture_adjudication.json'
      - 'config/nfl_2026_provider_budget_v1.json'
      - 'docs/nfl_direct_capture_source_contract_v1.md'
      - '.github/workflows/nfl-2026-line-capture.yml'
  # Frozen confirmation evidence is independent of the forward-CLV collector.
  # Ten-minute polling is gated against the free nflverse schedule. Direct
  # DraftKings web JSON is primary; the paid provider is whole-source fallback.
  # Split cron entries preserve scheduler-delay-safe hourly health identity.
  schedule:
    - cron: '3 * * * *'
    - cron: '13 * * * *'
    - cron: '23 * * * *'
    - cron: '33 * * * *'
    - cron: '43 * * * *'
    - cron: '53 * * * *'

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      NFL_SCHEDULE_CSV: ${{ runner.temp }}/nfl-games.csv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify capture, source binding, no-backfill, and provider contracts
        run: |
          python3 -m py_compile \
            scripts/nfl_2026_line_capture.py \
            scripts/audit_nfl_2026_capture_gaps.py \
            scripts/stamp_nfl_2026_capture_quarantine.py \
            scripts/odds_api_quota_guard.py \
            scripts/nfl_2026_provider_preflight.py \
            scripts/nfl_direct_dk_preflight.py \
            sportsedge/nfl_direct_capture_source.py \
            sportsedge/draftkings_game_market_source.py \
            sportsedge/nfl_confirmation_schedule.py
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          cfg = json.loads(Path('config/nfl_2026_capture.json').read_text())
          bindings = cfg.get('source_code_bindings') or {}
          if not bindings:
              raise SystemExit('NFL_SOURCE_CODE_BINDINGS_MISSING')
          for path, expected in sorted(bindings.items()):
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'NFL_SOURCE_CODE_BINDING_MISMATCH:{path}:expected={expected}:actual={actual}')
          print('NFL_SOURCE_CODE_BINDINGS_OK')
          PY
          python3 -m unittest -q \
            tests.test_nfl_direct_capture_source \
            tests.test_nfl_2026_direct_capture_wiring \
            tests.test_nfl_confirmation_schedule \
            tests.test_nfl_direct_dk_preflight \
            tests.test_nfl_2026_capture_gap_audit \
            tests.test_nfl_2026_provider_budget

      - name: Fetch NFL schedule snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv' \
            -o "$NFL_SCHEDULE_CSV"
          test -s "$NFL_SCHEDULE_CSV"

      - name: Gate scheduled run to a frozen capture window using free schedule data
        if: github.event_name == 'schedule'
        id: due
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, os
          from collections import Counter
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          cfg = json.loads(Path('config/nfl_2026_capture.json').read_text())
          now = datetime.now(timezone.utc)
          tz = ZoneInfo(cfg['timezone'])
          local = now.astimezone(tz)
          anchor = date.fromisoformat(cfg['week1_tuesday_local_date'])

          def valid_capture_record(record, kind):
              if record.get('capture_kind') != kind:
                  return False
              if record.get('book') != cfg.get('bookmaker'):
                  return False
              if record.get('source_class') not in cfg.get('source_priority', []):
                  return False
              if not record.get('retrieved_at_utc'):
                  return False
              hashes = record.get('hashes')
              if not isinstance(hashes, dict) or not hashes:
                  return False
              schedule = record.get('schedule')
              if not isinstance(schedule, dict):
                  return False
              if schedule.get('matching_semantics') != 'KICKOFF_UTC_MULTIPLICITY' or not schedule.get('sha256'):
                  return False
              games = record.get('games')
              if not isinstance(games, list) or not games:
                  return False
              for game in games:
                  if game.get('spread', {}).get('status') != 'OK':
                      return False
                  if game.get('total', {}).get('status') != 'OK':
                      return False
              return True

          hh, mm = map(int, cfg['opener_local_time'].split(':'))
          opener_target = local.replace(hour=hh, minute=mm, second=0, microsecond=0)
          opener_window_open = (
              local.strftime('%A') == cfg['opener_weekday']
              and opener_target <= local < opener_target + timedelta(minutes=int(cfg['opener_window_minutes']))
          )
          opener_week = ((local.date() - anchor).days // 7 + 1) if opener_window_open else 0
          if opener_week < int(cfg['first_week']):
              opener_window_open = False
              opener_week = 0
          opener_path = Path(cfg['output_dir']) / f"week{opener_week:02d}" / 'opener.json' if opener_week else None
          opener_existing_valid = False
          if opener_path and opener_path.is_file():
              try:
                  opener_existing_valid = valid_capture_record(json.loads(opener_path.read_text()), 'OPENER')
              except (OSError, json.JSONDecodeError):
                  opener_existing_valid = False
          opener_due = bool(opener_window_open and opener_path and not opener_existing_valid)

          captured_final = Counter()
          for path in Path(cfg['output_dir']).glob('week*/final/*.json'):
              try:
                  record = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              if not valid_capture_record(record, 'FINAL'):
                  continue
              for game in record.get('games') or []:
                  raw = str(game.get('commence_time') or '').strip()
                  if not raw:
                      continue
                  try:
                      dt = datetime.fromisoformat(raw.replace('Z', '+00:00')).astimezone(timezone.utc)
                  except ValueError:
                      continue
                  captured_final[dt.strftime('%Y-%m-%dT%H:%M:%SZ')] += 1

          expected_open_final = Counter()
          eastern = ZoneInfo('America/New_York')
          with open(os.environ['NFL_SCHEDULE_CSV'], newline='', encoding='utf-8-sig') as handle:
              for row in csv.DictReader(handle):
                  if str(row.get('season') or '') != '2026':
                      continue
                  gameday = str(row.get('gameday') or '').strip()
                  gametime = str(row.get('gametime') or '').strip()
                  if not gameday or not gametime:
                      continue
                  try:
                      kickoff = datetime.fromisoformat(f'{gameday}T{gametime}').replace(tzinfo=eastern).astimezone(timezone.utc)
                  except ValueError:
                      continue
                  week = (kickoff.astimezone(tz).date() - anchor).days // 7 + 1
                  if week < int(cfg['first_week']):
                      continue
                  start = kickoff - timedelta(minutes=int(cfg['final_minutes_before_kickoff']))
                  end = min(start + timedelta(minutes=int(cfg['final_window_minutes'])), kickoff)
                  if start <= now < end:
                      expected_open_final[kickoff.strftime('%Y-%m-%dT%H:%M:%SZ')] += 1

          final_due_kickoffs = []
          for kickoff_z, expected_count in sorted(expected_open_final.items()):
              missing = max(0, expected_count - captured_final[kickoff_z])
              final_due_kickoffs.extend([kickoff_z] * missing)

          final_due = bool(final_due_kickoffs)
          due = opener_due or final_due
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"due={'true' if due else 'false'}\n")
              output.write(f"opener_due={'true' if opener_due else 'false'}\n")
              output.write(f"opener_week={opener_week}\n")
              output.write(f"final_due={'true' if final_due else 'false'}\n")
              output.write('final_due_kickoffs=' + json.dumps(final_due_kickoffs, separators=(',', ':')) + '\n')
          print(json.dumps({
              'due': due,
              'opener_window_open': opener_window_open,
              'opener_existing_valid': opener_existing_valid,
              'opener_due': opener_due,
              'opener_week': opener_week,
              'final_due': final_due,
              'final_due_kickoffs': final_due_kickoffs,
              'checked_at_utc': now.isoformat(),
          }))
          PY

      - name: Diagnose fallback provider health
        if: github.event_name == 'schedule'
        id: preflight
        shell: bash
        env:
          SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.due.outputs.due }}' != 'true' && '${{ github.event.schedule }}' != '3 * * * *' ]]; then
            echo 'state=SKIPPED_CADENCE' >> "$GITHUB_OUTPUT"
            echo 'provider_probe_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p artifacts/nfl-provider-preflight
          set +e
          python3 scripts/nfl_2026_provider_preflight.py \
            --schedule-csv "$NFL_SCHEDULE_CSV" \
            --out artifacts/nfl-provider-preflight/status.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist redacted fallback-provider preflight metadata to data branch
        if: github.event_name == 'schedule' && steps.preflight.outputs.provider_probe_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/nfl-provider-preflight/status.json
          git fetch --depth=1 origin data:data
          git worktree add .provider-data data
          day="$(date -u +%F)"
          dest=".provider-data/runtime/nfl-2026-provider-preflight/$day/preflight_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          install -D -m 0644 artifacts/nfl-provider-preflight/status.json "$dest"
          cd .provider-data
          git config user.name sportsedge-archive-bot
          git config user.email sportsedge-archive-bot@users.noreply.github.com
          git add runtime/nfl-2026-provider-preflight
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nfl: persist provider preflight $GITHUB_RUN_ID"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin data && git push --quiet origin HEAD:data; then exit 0; fi
            sleep $((i * 5))
          done
          echo 'NFL_PROVIDER_PREFLIGHT_PERSIST_FAILED' >&2
          exit 1

      - name: Record elapsed missing windows without backfill
        if: github.event_name == 'schedule'
        run: python3 scripts/audit_nfl_2026_capture_gaps.py --schedule-csv "$NFL_SCHEDULE_CSV"

      - name: Run capture
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.due.outputs.due == 'true'
        id: run
        env:
          ODDS_API_KEY_1: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          WORKFLOW_PATH: .github/workflows/nfl-2026-line-capture.yml
          MODE: ${{ github.event_name == 'schedule' && 'capture' || inputs.mode || 'check' }}
        run: |
          set +e
          python3 scripts/nfl_2026_line_capture.py "$MODE"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Stamp current-run captures as adjudication-pending
        if: steps.run.outcome != 'skipped'
        run: python3 scripts/stamp_nfl_2026_capture_quarantine.py --github-run-id "$GITHUB_RUN_ID"

      - name: Verify every due scheduled capture materialized
        if: github.event_name == 'schedule' && steps.due.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --schedule-csv "$NFL_SCHEDULE_CSV"
            --github-run-id "$GITHUB_RUN_ID"
            --verify-final-kickoffs '${{ steps.due.outputs.final_due_kickoffs }}'
          )
          if [ '${{ steps.due.outputs.opener_due }}' = 'true' ]; then
            args+=(--verify-opener-week '${{ steps.due.outputs.opener_week }}')
          fi
          python3 scripts/audit_nfl_2026_capture_gaps.py "${args[@]}"

      - name: Commit captures and absence markers
        if: always() && (github.event_name == 'schedule' || (steps.run.outcome != 'skipped' && inputs.mode == 'capture'))
        run: |
          DIR=data/nfl_2026_confirmation/captures
          [ -d "$DIR" ] || { echo "No capture directory yet"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "NFL 2026 confirmation evidence (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((i * 5))
          done
          echo "PUSH_FAILED"
          exit 1

      - name: Report blocked fallback provider
        if: >-
          always() && github.event_name == 'schedule' &&
          steps.preflight.outputs.state == 'PROVIDER_BLOCKED_PREFLIGHT'
        run: |
          echo 'NFL_FALLBACK_PROVIDER_BLOCKED: direct DraftKings remains the primary capture path'

      - name: Fail job if capture or check failed
        if: steps.run.outcome != 'skipped' && steps.run.outputs.rc != '0'
        run: exit 1
