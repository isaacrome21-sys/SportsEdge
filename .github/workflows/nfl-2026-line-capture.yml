name: NFL 2026 line capture

on:
  # Dispatch-only legacy confirmation capture. The scheduled authority is
  # football-nfl-forward-clv-collection.yml; keeping this workflow scheduled
  # would duplicate DraftKings game-line spend.
  workflow_dispatch:
    inputs:
      mode:
        description: "check = validate setup only; capture = capture if a window is open"
        type: choice
        options: [check, capture]
        default: check

permissions:
  contents: write

concurrency:
  group: sportsedge-paid-odds-api
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run capture
        id: run
        env:
          ODDS_API_KEY_1: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
          WORKFLOW_PATH: .github/workflows/nfl-2026-line-capture.yml
        run: |
          set +e
          python3 scripts/nfl_2026_line_capture.py "${{ inputs.mode || 'capture' }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Commit captures
        if: always() && (inputs.mode || 'capture') == 'capture'
        run: |
          DIR=data/nfl_2026_confirmation/captures
          [ -d "$DIR" ] || { echo "No capture directory yet"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "NFL 2026 line capture (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((i * 5))
          done
          echo "PUSH_FAILED"
          exit 1

      - name: Fail job if capture or check failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
