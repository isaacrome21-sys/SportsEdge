name: paper-slate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build PAPER slate from DK board + public results
        run: python scripts/paper_slate_engine.py --out artifacts/paper_slate.json
      - name: Upload PAPER slate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-slate-${{ github.run_id }}
          path: artifacts/paper_slate.json
          if-no-files-found: warn
          retention-days: 7
