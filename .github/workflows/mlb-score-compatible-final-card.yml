name: mlb-score-compatible-final-card

on:
  push:
    branches: [fix/mlb-score-compatible-card-final2-20260929]
    paths:
      - scripts/run_mlb_score_compatible_card_final.py
      - tests/test_mlb_score_compatible_card_final.py
      - .github/workflows/mlb-score-compatible-final-card.yml
      - manual_inputs/mlb/2026-09-29_dk_full_supplied.json
  pull_request:
    paths:
      - scripts/run_mlb_score_compatible_card_final.py
      - tests/test_mlb_score_compatible_card_final.py
      - .github/workflows/mlb-score-compatible-final-card.yml
      - manual_inputs/mlb/2026-09-29_dk_full_supplied.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-final-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile final runner
        run: >-
          python -m py_compile
          sportsedge/mlb_joint_card_coupled_research.py
          scripts/run_mlb_score_compatible_joint_research.py
          scripts/run_mlb_score_compatible_card_final.py
      - name: Test joint invariants and card guard
        run: >-
          PYTHONPATH=. python -m unittest
          tests.test_mlb_joint_card_research
          tests.test_mlb_joint_card_coupled_research
          tests.test_mlb_score_compatible_card_final -v
      - name: Run 100k BOS-NYY final research card
        run: >-
          PYTHONPATH=. python scripts/run_mlb_score_compatible_card_final.py
          --input manual_inputs/mlb/2026-09-29_dk_full_supplied.json
          --game-id 'Boston Red Sox@New York Yankees'
          --output artifacts/mlb_score_compatible_final_bos_nyy_20260929.json
          --simulations 100000
      - name: Upload final research card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-score-compatible-final-bos-nyy-20260929
          path: artifacts/mlb_score_compatible_final_bos_nyy_20260929.json
          if-no-files-found: error
          retention-days: 14
