name: tmp-reconcile-pr839-bootstrap

on:
  push:
    branches:
      - fix/cfb-preflight-acquisition-ready-current-main
    paths:
      - '.github/workflows/tmp-reconcile-pr839-bootstrap.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/cfb-preflight-acquisition-ready-current-main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Register reconciliation merge and preserve zero authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(registry_path.read_text())
          expected_old = '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb'
          target = '529b06af94061a5eb86efd9909b15b62cefce938'
          row = {
              'delta_id': 'PR_839_RECONCILIATION_CATCHUP_MERGE',
              'merge_sha': target,
              'note': 'Reconciliation-only merge registering protected main through PR #833; candidate prereg remains REVOKED, attempts remain zero, and no model or betting authority is granted.',
              'pr': 839,
          }

          if registry['reconciled_through_sha'] not in {expected_old, target}:
              raise SystemExit(f"UNEXPECTED_RECONCILIATION_BOUNDARY:{registry['reconciled_through_sha']}")
          existing = {item['delta_id']: item for item in registry['deltas']}
          prior = existing.get(row['delta_id'])
          if prior is None:
              registry['deltas'].append(row)
          elif prior != row:
              raise SystemExit('PR_839_DELTA_IDENTITY_DRIFT')
          registry['reconciled_through_sha'] = target

          bundle = next(item for item in registry['bundles'] if item['bundle_id'] == 'CFB_CANDIDATE_PREREG_FREEZE_V1')
          if (bundle.get('disposition') or {}).get('state') != 'REVOKED':
              raise SystemExit('CFB_CANDIDATE_PREREG_MUST_REMAIN_REVOKED')

          prereg = json.loads(Path('config/cfb_model_candidate_prereg_v1.json').read_text())
          gov = prereg['governance']
          if gov.get('attempts_consumed') != 0 or gov.get('evaluation_performed') is not False:
              raise SystemExit('CFB_ATTEMPT_OR_EVALUATION_AUTHORITY_DRIFT')
          for key in ('model_p_created', 'promotion_authority', 'official_authority'):
              if gov.get(key) is not False:
                  raise SystemExit(f'CFB_AUTHORITY_DRIFT:{key}')

          registry_path.write_text(json.dumps(registry, separators=(',', ':')) + '\n')

          test_path = Path('tests/test_reconciliation_catchup_pr815.py')
          text = test_path.read_text()
          anchor = "    (833, '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb'),\n]"
          replacement = "    (833, '4fc4aa9a60b69137a0efc4d7d59ccee95f53b0bb'),\n    (839, '529b06af94061a5eb86efd9909b15b62cefce938'),\n]"
          if "(839, '529b06af94061a5eb86efd9909b15b62cefce938')" not in text:
              if anchor not in text:
                  raise SystemExit('PR839_TEST_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)
          text = text.replace('test_reconciliation_advances_through_pr833_in_first_parent_order', 'test_reconciliation_advances_through_pr839_in_first_parent_order')
          test_path.write_text(text)
          PY

      - name: Verify reconciliation and zero-attempt governance
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          git fetch --no-tags origin main
          python -m pytest -q tests/test_reconciliation_catchup_pr815.py tests/test_freeze_reconciliation.py

      - name: Commit reconciliation bytes to branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/freeze_reconciliation_registry_v1.json tests/test_reconciliation_catchup_pr815.py; then
            echo 'No reconciliation changes needed.'
            exit 0
          fi
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json tests/test_reconciliation_catchup_pr815.py
          git commit -m 'Governance: register PR 839 reconciliation merge'
          git push origin HEAD:fix/cfb-preflight-acquisition-ready-current-main
