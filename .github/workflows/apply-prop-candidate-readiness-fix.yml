name: Apply prop candidate readiness repair

on:
  push:
    branches:
      - fix/prop-candidate-readiness-split

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prop-candidate-readiness-split
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply repair
        run: python scripts/apply_prop_candidate_fix.py

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1 PyYAML==6.0.2

      - name: Compile changed Python
        run: python -m py_compile sportsedge/run_it_control.py sportsedge/football_prop_extended_run_machine.py sportsedge/football_prop_readiness.py

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_prop_candidate_readiness_split.py

      - name: Commit tested repair
        shell: bash
        run: |
          rm scripts/apply_prop_candidate_fix.py
          rm .github/workflows/apply-prop-candidate-readiness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate model candidates from official prop readiness"
          git push origin HEAD:fix/prop-candidate-readiness-split
