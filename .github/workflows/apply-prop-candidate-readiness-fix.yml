name: Apply prop candidate readiness repair

on:
  push:
    branches:
      - fix/prop-candidate-readiness-split

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prop-candidate-readiness-split
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fail-closed candidate/readiness split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) A valid Model_P that is promotion-blocked is PARTIAL, not a dead engine.
          replace_once(
              "sportsedge/run_it_control.py",
              '''    if all(row.get("bet_status") == "BLOCKED" for row in rows):
                  return "BLOCKED", "ALL_MARKETS_BLOCKED", models, official
              if payload.get("status") in {"BLOCKED", "FAILED", "ERROR"} or str(report.get("run_status", "")).startswith("BLOCKED"):
                  return "BLOCKED", "RUN_REPORTED_BLOCKED", models, official
          ''',
              '''    if all(row.get("bet_status") == "BLOCKED" for row in rows):
                  if models > 0:
                      return "PARTIAL", "MODEL_OUTPUT_PRESENT_OFFICIAL_GATES_BLOCKED", models, official
                  return "BLOCKED", "ALL_MARKETS_BLOCKED", models, official
              if payload.get("status") in {"BLOCKED", "FAILED", "ERROR"} or str(report.get("run_status", "")).startswith("BLOCKED"):
                  if models > 0:
                      return "PARTIAL", "MODEL_OUTPUT_PRESENT_RUN_REPORTED_OFFICIAL_BLOCK", models, official
                  return "BLOCKED", "RUN_REPORTED_BLOCKED", models, official
          ''',
          )

          # 2) Ordinary O/U props may be quoted one-sided. Never invent the other side.
          replace_once(
              "sportsedge/football_prop_extended_run_machine.py",
              '''        for (player_id, line), pair in grouped.items():
                  if set(pair) != {"OVER", "UNDER"}:
                      raise FootballPropRunError(f"FOOTBALL_PROP_PAIRED_PRICE_REQUIRED:{key}:{player_id}:{line}")
                  offers.append({
                      "family": family,
                      "provider_market": key,
                      "stat": (
                          OFFENSIVE_OU_MARKETS.get(key)
                          or KICKER_OU_MARKETS.get(key)
                          or DEFENDER_OU_MARKETS.get(key)
                      ),
                      "player_id": player_id,
                      "player_name": pair["OVER"]["player_name"],
                      "line": line,
                      "over_price": pair["OVER"]["american_odds"],
                      "under_price": pair["UNDER"]["american_odds"],
                      "stale": bool(stale),
                  })
          ''',
              '''        for (player_id, line), pair in grouped.items():
                  for side in ("OVER", "UNDER"):
                      selected = pair.get(side)
                      if selected is None:
                          continue
                      opposite = "UNDER" if side == "OVER" else "OVER"
                      opposite_row = pair.get(opposite)
                      offers.append({
                          "family": family,
                          "provider_market": key,
                          "stat": (
                              OFFENSIVE_OU_MARKETS.get(key)
                              or KICKER_OU_MARKETS.get(key)
                              or DEFENDER_OU_MARKETS.get(key)
                          ),
                          "player_id": player_id,
                          "player_name": selected["player_name"],
                          "line": line,
                          "side": side,
                          "american_odds": selected["american_odds"],
                          "opposite_price": None if opposite_row is None else opposite_row["american_odds"],
                          "over_price": None if pair.get("OVER") is None else pair["OVER"]["american_odds"],
                          "under_price": None if pair.get("UNDER") is None else pair["UNDER"]["american_odds"],
                          "paired": opposite_row is not None,
                          "stale": bool(stale),
                      })
          ''',
          )

          # Keep 2+ TD blocked until its distribution is separately validated.
          replace_once(
              "sportsedge/football_prop_extended_run_machine.py",
              '''            else:
                      if raw_side not in {"OVER", "UNDER"}:
                          continue
                      side = raw_side
                      line = _finite(raw.get("point"), f"FOOTBALL_PROP_LINE_INVALID:{key}")
                  player_id, player_name = _player_id(offensive_names, raw)
          ''',
              '''            else:
                      if raw_side not in {"OVER", "UNDER"}:
                          continue
                      side = raw_side
                      line = _finite(raw.get("point"), f"FOOTBALL_PROP_LINE_INVALID:{key}")
                      if line > 0.5:
                          # 2+ TD remains NO_ENGINE/promotion-blocked until the
                          # football scoring distribution is separately validated.
                          continue
                  player_id, player_name = _player_id(offensive_names, raw)
          ''',
          )

          # Raw-price economics are valid with one offered side; no-vig remains unavailable.
          replace_once(
              "sportsedge/football_prop_extended_run_machine.py",
              '''def _scorer_market(paths, *, player_id: str, line: float) -> dict[str, float]:
          ''',
              '''def _raw_price_economics(
              *, model_p: float, push_p: float, american_odds: float,
          ) -> tuple[float, float, float]:
              win = _finite(model_p, "FOOTBALL_PROP_WIN_PROBABILITY_INVALID")
              push = _finite(push_p, "FOOTBALL_PROP_PUSH_PROBABILITY_INVALID")
              if not 0 <= win <= 1 or not 0 <= push <= 1 or win + push > 1 + 1e-12:
                  raise FootballPropRunError("FOOTBALL_PROP_PROBABILITY_MASS_INVALID")
              settled = 1.0 - push
              if settled <= 0:
                  raise FootballPropRunError("FOOTBALL_PROP_SETTLED_SAMPLE_SPACE_EMPTY")
              odds = _finite(american_odds, "FOOTBALL_PROP_ODDS_INVALID")
              if abs(odds) < 100:
                  raise FootballPropRunError("FOOTBALL_PROP_ODDS_INVALID")
              decimal = american_to_decimal(odds)
              profit = decimal - 1.0
              loss = max(0.0, 1.0 - win - push)
              ev = win * profit - loss
              break_even = 1.0 / decimal
              kelly = max(0.0, min(1.0, ev / (profit * settled)))
              return break_even, ev, kelly


def _scorer_market(paths, *, player_id: str, line: float) -> dict[str, float]:
          ''',
          )

          p = Path("sportsedge/football_prop_extended_run_machine.py")
          text = p.read_text(encoding="utf-8")
          start = text.index('            fair_over, fair_under, sensitivity = _devig_pair(', text.index('        for offer in ou_offers:'))
          end = text.index('\n\n        for offer in scorer_offers:', start)
          replacement = '''            side = str(offer["side"])
              price = float(offer["american_odds"])
              model_p = float(market["over"] if side == "OVER" else market["under"])
              push_p = float(market["push"])
              stale = bool(offer["stale"])
              fair_market_p = edge = ev = kelly = break_even_p = None
              market_no_vig_p: float | str | None = None
              sensitivity = None
              if not stale:
                  break_even_p, ev, kelly = _raw_price_economics(
                      model_p=model_p, push_p=push_p, american_odds=price,
                  )
                  if offer["paired"]:
                      fair_over, fair_under, sensitivity = _devig_pair(
                          float(offer["over_price"]), float(offer["under_price"]),
                          policy=devig_policy, game_id=game_id, book_key=book_key, offer=offer,
                      )
                      fair_market_p = fair_over if side == "OVER" else fair_under
                      market_no_vig_p = float(fair_market_p)
                      edge, ev, kelly = _price_economics(
                          model_p=model_p, push_p=push_p,
                          american_odds=price, fair_market_p=float(fair_market_p),
                      )
                  else:
                      market_no_vig_p = "UNAVAILABLE_ONE_SIDED"
              results.append({
                  "sport": resolved,
                  "game_id": game_id,
                  "provider_event_id": event_id,
                  "bookmaker": book_key,
                  "family": family,
                  "provider_market": offer["provider_market"],
                  "market": offer["stat"],
                  "player_id": offer["player_id"],
                  "player_name": offer["player_name"],
                  "side": side,
                  "line": offer["line"],
                  "american_odds": price,
                  "model_p": model_p,
                  "push_p": push_p,
                  "fair_market_p": fair_market_p,
                  "market_no_vig_p": market_no_vig_p,
                  "break_even_p": break_even_p,
                  "edge": edge,
                  "ev_per_dollar": ev,
                  "kelly_fraction": kelly,
                  "quote_fresh": not stale,
                  "paired_price_available": bool(offer["paired"]),
                  "model_status": "MODEL_OUTPUT_QUOTE_STALE" if stale else "MODEL_CANDIDATE",
                  "bet_status": "BLOCKED",
                  "official_eligible": False,
                  "reason": f"{resolved}_PROP_QUOTE_STALE" if stale else f"{resolved}_PROP_PROMOTION_EVIDENCE_REQUIRED",
                  "distribution_sha256": dist_hash,
                  "model_artifact_sha256": artifact_sha,
                  "model_training_source_sha256": training_sha,
                  "live_feature_source_sha256": feature_sha,
                  "live_feature_asof": feature_asof.isoformat(),
                  "devig": sensitivity,
              })'''
          text = text[:start] + replacement + text[end:]

          scorer_old = '''            fair_market_p = edge = ev = kelly = None
              sensitivity = None
              reason = f"{resolved}_PROP_PROMOTION_EVIDENCE_REQUIRED"
              if stale:
                  reason = f"{resolved}_PROP_QUOTE_STALE"
              elif offer["paired"]:
                  fair_primary, _, sensitivity = _devig_pair(
                      offer["primary_price"], offer["opposite_price"], policy=devig_policy,
                      game_id=game_id, book_key=book_key, offer=offer,
                  )
                  fair_market_p = fair_primary
                  edge, ev, kelly = _price_economics(
                      model_p=model_p,
                      push_p=push_p,
                      american_odds=float(offer["primary_price"]),
                      fair_market_p=float(fair_primary),
                  )
              else:
                  reason = f"{resolved}_PROP_PAIRED_PRICE_REQUIRED"
          '''
          scorer_new = '''            fair_market_p = edge = ev = kelly = break_even_p = None
              market_no_vig_p: float | str | None = None
              sensitivity = None
              reason = f"{resolved}_PROP_PROMOTION_EVIDENCE_REQUIRED"
              if stale:
                  reason = f"{resolved}_PROP_QUOTE_STALE"
              else:
                  break_even_p, ev, kelly = _raw_price_economics(
                      model_p=model_p,
                      push_p=push_p,
                      american_odds=float(offer["primary_price"]),
                  )
                  if offer["paired"]:
                      fair_primary, _, sensitivity = _devig_pair(
                          offer["primary_price"], offer["opposite_price"], policy=devig_policy,
                          game_id=game_id, book_key=book_key, offer=offer,
                      )
                      fair_market_p = fair_primary
                      market_no_vig_p = float(fair_primary)
                      edge, ev, kelly = _price_economics(
                          model_p=model_p,
                          push_p=push_p,
                          american_odds=float(offer["primary_price"]),
                          fair_market_p=float(fair_primary),
                      )
                  else:
                      market_no_vig_p = "UNAVAILABLE_ONE_SIDED"
          '''
          if text.count(scorer_old) != 1:
              raise SystemExit(f"scorer economics patch target count={text.count(scorer_old)}")
          text = text.replace(scorer_old, scorer_new, 1)
          text = text.replace(
              '''                "fair_market_p": fair_market_p,
                  "edge": edge,
          ''',
              '''                "fair_market_p": fair_market_p,
                  "market_no_vig_p": market_no_vig_p,
                  "break_even_p": break_even_p,
                  "edge": edge,
          ''',
              1,
          )
          text = text.replace(
              '''                "paired_price_available": bool(offer["paired"]),
                  "bet_status": "BLOCKED",
          ''',
              '''                "paired_price_available": bool(offer["paired"]),
                  "model_status": "MODEL_OUTPUT_QUOTE_STALE" if stale else "MODEL_CANDIDATE",
                  "bet_status": "BLOCKED",
          ''',
              1,
          )
          text = text.replace(
              '''            "decisions": len(results),
                  "official_bets": 0,
          ''',
              '''            "decisions": len(results),
                  "model_candidates": sum(row.get("model_status") == "MODEL_CANDIDATE" for row in results),
                  "official_bets": 0,
          ''',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # 3) Preserve candidate state while independently resolving OFFICIAL gates.
          p = Path("sportsedge/football_prop_readiness.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '''    official_bets = 0

              for row in report["results"]:
          ''',
              '''    official_bets = 0
              model_candidate_rows = 0

              for row in report["results"]:
          ''',
              1,
          )
          marker = '''        row["official_eligible"] = False

                  if evidence_state["ready"]:
          '''
          insertion = '''        row["official_eligible"] = False
              raw_model_p = row.get("model_p")
              has_model_p = (
                  isinstance(raw_model_p, (int, float))
                  and not isinstance(raw_model_p, bool)
                  and 0.0 <= float(raw_model_p) <= 1.0
              )
              if has_model_p:
                  row.setdefault(
                      "model_status",
                      "MODEL_CANDIDATE" if row.get("quote_fresh") is True else "MODEL_OUTPUT_QUOTE_STALE",
                  )
                  if row.get("fair_market_p") is None and row.get("quote_fresh") is True:
                      row.setdefault("market_no_vig_p", "UNAVAILABLE_ONE_SIDED")
                  if row.get("model_status") == "MODEL_CANDIDATE":
                      model_candidate_rows += 1

                  if evidence_state["ready"]:
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"readiness candidate patch target count={text.count(marker)}")
          text = text.replace(marker, insertion, 1)
          text = text.replace(
              '''            row["reason"] = f"{sport}_PROP_PAIRED_PRICE_REQUIRED"
          ''',
              '''            row["reason"] = f"{sport}_PROP_OFFICIAL_FAIR_MARKET_PROBABILITY_REQUIRED"
          ''',
              1,
          )
          text = text.replace(
              '''    report["summary"]["official_bets"] = official_bets
          ''',
              '''    report["summary"]["official_bets"] = official_bets
              report["summary"]["model_candidate_rows"] = model_candidate_rows
          ''',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # 4) Reconcile source-of-truth catalog with engines that actually exist.
          p = Path("config/football_market_surface.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          implemented = {
              "passing_yards", "completions", "attempts", "passing_tds", "interceptions",
              "rush_yards", "longest_completion", "pass_plus_rush_yards",
              "rushing_yards", "receiving_yards", "receptions", "rush_attempts",
              "rush_plus_rec_yards", "longest_reception", "longest_rush", "anytime_td",
              "receiving_tds", "rushing_tds", "rush_plus_rec_tds",
              "fg_made", "kicking_points", "xp_made",
              "player_sacks", "solo_tackles", "tackles_assists", "player_interceptions",
          }
          changed = set()
          for market in data.get("markets", []):
              if market.get("market") in implemented:
                  states = market.get("engine_state_by_sport")
                  if not isinstance(states, dict):
                      raise SystemExit(f"missing engine_state_by_sport for {market.get('market')}")
                  for sport in ("NFL", "CFB"):
                      states[sport] = "IMPLEMENTED"
                  changed.add(market.get("market"))
          required = {
              "passing_yards", "completions", "attempts", "passing_tds", "interceptions",
              "rushing_yards", "receiving_yards", "receptions", "rush_attempts",
              "rush_plus_rec_yards", "longest_reception", "longest_rush", "anytime_td",
              "fg_made", "kicking_points", "xp_made", "player_sacks", "tackles_assists",
              "player_interceptions",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f"catalog patch expected markets missing: {missing}")
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          p = Path("config/run_it_surface.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["sports"]["NFL"]["notes"] = (
              "RUN IT executes the canonical NFL game lane plus the shared-path extended player-prop lane. "
              "Implemented pass/rush/receiving, 1+ TD scorer, kicker and supported defender markets may emit "
              "MODEL_CANDIDATE rows while OFFICIAL remains artifact/evidence/certification/frozen-floor gated. "
              "First/last TD and 2+ TD remain NO_ENGINE/blocked pending their required ordering/distribution validation."
          )
          data["sports"]["CFB"]["notes"] = (
              "RUN IT executes the canonical CFB game lane plus the shared-path extended player-prop lane. "
              "Implemented pass/rush/receiving, 1+ TD scorer, kicker and supported defender markets may emit "
              "MODEL_CANDIDATE rows while OFFICIAL remains artifact/evidence/certification/frozen-floor gated. "
              "First/last TD and 2+ TD remain NO_ENGINE/blocked pending their required ordering/distribution validation."
          )
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          # 5) Focused regression tests: candidate != official, one-sided != no-engine.
          test = r'''from __future__ import annotations

          from datetime import datetime, timezone
          import json
          from pathlib import Path

          import pytest

          from sportsedge.football_prop_extended_run_machine import (
              _ou_offers,
              _raw_price_economics,
              _scorer_offers,
          )
          from sportsedge.run_it_control import _card_state


          def test_run_it_treats_model_output_with_official_blocks_as_partial(tmp_path: Path) -> None:
              path = tmp_path / "card.json"
              path.write_text(json.dumps({"report": {"results": [
                  {"model_p": 0.58, "bet_status": "BLOCKED"},
              ]}}), encoding="utf-8")
              status, blocker, models, official = _card_state(path, None)
              assert status == "PARTIAL"
              assert blocker == "MODEL_OUTPUT_PRESENT_OFFICIAL_GATES_BLOCKED"
              assert models == 1
              assert official == 0


          def test_run_it_keeps_true_no_model_blocked(tmp_path: Path) -> None:
              path = tmp_path / "card.json"
              path.write_text(json.dumps({"report": {"results": [
                  {"model_p": None, "bet_status": "BLOCKED"},
              ]}}), encoding="utf-8")
              status, blocker, models, official = _card_state(path, None)
              assert status == "BLOCKED"
              assert blocker == "ALL_MARKETS_BLOCKED"
              assert models == 0
              assert official == 0


          def test_one_sided_raw_price_economics() -> None:
              break_even, ev, kelly = _raw_price_economics(
                  model_p=0.64, push_p=0.0, american_odds=-150,
              )
              assert break_even == pytest.approx(0.60)
              assert ev == pytest.approx(0.0666666667)
              assert kelly > 0


          def test_one_sided_ou_offer_is_preserved_without_inventing_opposite() -> None:
              now = datetime(2026, 9, 10, 15, 1, tzinfo=timezone.utc)
              start = datetime(2026, 9, 10, 22, 0, tzinfo=timezone.utc)
              event = {"bookmakers": [{"key": "draftkings", "markets": [{
                  "key": "player_rush_yds",
                  "last_update": "2026-09-10T15:00:00Z",
                  "outcomes": [{
                      "name": "Over", "description": "CMC", "point": 67.5, "price": -115,
                  }],
              }]}]}
              offers = _ou_offers(
                  event=event,
                  book_key="draftkings",
                  game_start=start,
                  current=now,
                  quote_ttl_seconds=180,
                  name_maps={"OFFENSE": {"cmc": "p1"}, "KICKER": {}, "DEFENSE": {}},
              )
              assert len(offers) == 1
              assert offers[0]["side"] == "OVER"
              assert offers[0]["paired"] is False
              assert offers[0]["opposite_price"] is None


          def test_two_plus_td_stays_blocked_from_scorer_surface() -> None:
              now = datetime(2026, 9, 10, 15, 1, tzinfo=timezone.utc)
              start = datetime(2026, 9, 10, 22, 0, tzinfo=timezone.utc)
              event = {"bookmakers": [{"key": "draftkings", "markets": [{
                  "key": "player_tds_over",
                  "last_update": "2026-09-10T15:00:00Z",
                  "outcomes": [{
                      "name": "Over", "description": "CMC", "point": 1.5, "price": 220,
                  }],
              }]}]}
              offers = _scorer_offers(
                  event=event,
                  book_key="draftkings",
                  game_start=start,
                  current=now,
                  quote_ttl_seconds=180,
                  offensive_names={"cmc": "p1"},
              )
              assert offers == []


          def test_catalog_truth_matches_implemented_prop_engines() -> None:
              root = Path(__file__).resolve().parents[1]
              payload = json.loads((root / "config/football_market_surface.json").read_text())
              by_name = {row["market"]: row for row in payload["markets"]}
              for name in (
                  "passing_yards", "receiving_yards", "rushing_yards", "receptions",
                  "anytime_td", "fg_made", "kicking_points", "player_sacks",
                  "tackles_assists", "player_interceptions",
              ):
                  assert by_name[name]["engine_state_by_sport"] == {"NFL": "IMPLEMENTED", "CFB": "IMPLEMENTED"}
              for name in ("targets", "first_td", "two_plus_td"):
                  assert by_name[name]["engine_state_by_sport"] == {"NFL": "NO_ENGINE", "CFB": "NO_ENGINE"}
          '''
          # Remove accidental YAML indentation from the embedded test.
          lines = test.splitlines()
          normalized = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("tests/test_prop_candidate_readiness_split.py").write_text(normalized, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1 PyYAML==6.0.2

      - name: Compile changed Python
        run: python -m py_compile sportsedge/run_it_control.py sportsedge/football_prop_extended_run_machine.py sportsedge/football_prop_readiness.py

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_prop_candidate_readiness_split.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-prop-candidate-readiness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sportsedge/run_it_control.py sportsedge/football_prop_extended_run_machine.py sportsedge/football_prop_readiness.py config/football_market_surface.json config/run_it_surface.json tests/test_prop_candidate_readiness_split.py .github/workflows/apply-prop-candidate-readiness-fix.yml
          git commit -m "Separate model candidates from official prop readiness"
          git push origin HEAD:fix/prop-candidate-readiness-split
