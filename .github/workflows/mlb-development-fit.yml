name: mlb-development-fit

# Free, provider-independent MLB model development lane.
# HARD BOUNDARY: this workflow and its runner may not access 2025+ data.
# 2024 is development validation, not the sacred final holdout.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fit_mlb_development.py'
      - 'scripts/fit_mlb_baseline.py'
      - 'tests/test_mlb_development.py'
      - '.github/workflows/mlb-development-fit.yml'
      - '.github/workflows/mlb-baseline-fit.yml'

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install pinned numpy
        run: python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Compile and run development guard tests
        run: |
          python -m py_compile scripts/fit_mlb_baseline.py scripts/fit_mlb_development.py tests/test_mlb_development.py
          python -m unittest tests.test_mlb_development -v

      - name: Fit 2021-2024 development experiment
        run: |
          python scripts/fit_mlb_development.py \
            --seasons '2021,2022,2023,2024' \
            --validation-season 2024 \
            --out artifacts/mlb_development_report.json

      - name: Enforce no sacred-holdout access or promotion claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/mlb_development_report.json').read_text(encoding='utf-8'))
          if report.get('status') != 'RESEARCH_ONLY_NOT_MODEL_P':
              raise SystemExit('MLB_DEV_STATUS_INVALID')
          if report.get('sacred_2025_accessed') is not False:
              raise SystemExit('MLB_DEV_SACRED_2025_ACCESS_FORBIDDEN')
          if report.get('max_allowed_season') != 2024:
              raise SystemExit('MLB_DEV_MAX_SEASON_INVALID')
          if max(int(year) for year in report.get('seasons', {})) > 2024:
              raise SystemExit('MLB_DEV_POST_2024_ROW_FORBIDDEN')
          if report.get('promotion_changed') is not False:
              raise SystemExit('MLB_DEV_PROMOTION_CHANGE_FORBIDDEN')
          if report.get('truth_gate_evidence') is not False or report.get('official_evidence') is not False:
              raise SystemExit('MLB_DEV_PROMOTION_EVIDENCE_FORBIDDEN')
          if report.get('holdout_class') != 'DEVELOPMENT_VALIDATION_NOT_FINAL':
              raise SystemExit('MLB_DEV_HOLDOUT_CLASS_INVALID')
          PY

      - name: Upload development report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-development-report-${{ github.run_id }}
          path: artifacts/mlb_development_report.json
          if-no-files-found: error
          retention-days: 30
