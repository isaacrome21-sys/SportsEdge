name: mlb-portfolio-guard-ci

on:
  push:
    branches:
      - full-model-reconcile-20260813
    paths:
      - sportsedge/mlb_portfolio_guard.py
      - tests/test_mlb_portfolio_guard.py
      - audit/ML_V5_DOG_FAVORITE_CALIBRATION_PREDECLARATION_2026-08-13.md
      - .github/workflows/mlb-portfolio-guard-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-portfolio-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile guard
        run: python -m py_compile sportsedge/mlb_portfolio_guard.py
      - name: Run portfolio guard regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_mlb_portfolio_guard.py
