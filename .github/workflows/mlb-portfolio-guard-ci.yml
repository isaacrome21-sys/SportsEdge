name: mlb-portfolio-guard-ci

on:
  push:
    branches:
      - full-model-reconcile-20260813
    paths:
      - scripts/run_auto_mlb.py
      - sportsedge/truth_gate.py
      - sportsedge/game_risk_guard.py
      - sportsedge/mlb_portfolio_guard.py
      - sportsedge/mlb_decision_settlement.py
      - sportsedge/ml_dog_calibration.py
      - tests/test_game_risk_guard.py
      - tests/test_mlb_portfolio_guard.py
      - tests/test_mlb_decision_settlement.py
      - tests/test_ml_dog_calibration.py
      - audit/ML_V5_DOG_FAVORITE_CALIBRATION_PREDECLARATION_2026-08-13.md
      - .github/workflows/mlb-portfolio-guard-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ml-calibration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile modules and hardened runner
        run: |
          python -m py_compile sportsedge/truth_gate.py
          python -m py_compile sportsedge/game_risk_guard.py
          python -m py_compile sportsedge/mlb_portfolio_guard.py
          python -m py_compile sportsedge/mlb_decision_settlement.py
          python -m py_compile sportsedge/ml_dog_calibration.py
          python -m py_compile scripts/run_auto_mlb.py
      - name: Run calibration and wager-guard regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_game_risk_guard.py \
            tests/test_mlb_portfolio_guard.py \
            tests/test_mlb_decision_settlement.py \
            tests/test_ml_dog_calibration.py
