name: reconcile-pr898-machine-evidence

on:
  push:
    branches:
      - governance/reconcile-pr898-machine-evidence-20260921
    paths:
      - .github/workflows/reconcile-pr898-machine-evidence.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/reconcile-pr898-machine-evidence-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Pin exact protected main
        env:
          EXPECTED_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN" || { echo "MAIN_MOVED:$actual expected=$EXPECTED_MAIN"; exit 1; }

      - name: Register every unclassified first-parent main commit in working tree
        env:
          TARGET_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          anchor = str(registry['reconciled_through_sha'])
          target = os.environ['TARGET_MAIN']

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          subprocess.check_call(['git', 'merge-base', '--is-ancestor', anchor, target])
          commits = [x for x in git('rev-list', '--first-parent', '--reverse', f'{anchor}..{target}').splitlines() if x]
          existing = {str(row.get('merge_sha') or '') for row in registry.get('deltas') or [] if isinstance(row, dict)}
          added = []
          for sha in commits:
              if sha in existing:
                  continue
              subject = git('show', '-s', '--format=%s', sha)
              body = git('show', '-s', '--format=%B', sha)
              match = re.search(r'(?:pull request |PR\s*#?)#?(\d+)', body, flags=re.I)
              pr = int(match.group(1)) if match else 0
              row = {
                  'delta_id': f'MAIN_CATCHUP_{sha[:12].upper()}',
                  'merge_sha': sha,
                  'note': 'Protected-main first-parent catch-up classification; machine matrix determines bundle impact. Subject: ' + subject,
                  'pr': pr,
              }
              registry.setdefault('deltas', []).append(row)
              existing.add(sha)
              added.append(row)
          registry['reconciled_through_sha'] = target
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps({'anchor': anchor, 'target': target, 'first_parent_commits': len(commits), 'added': len(added)}, sort_keys=True))
          PY

      - name: Machine-prove unresolved PR898 NFL prop drift
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/pre_disposition_report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pre_disposition_report.json').read_text())
          counts = report.get('outcome_counts') or {}
          blocks = sorted(report.get('release_blocks') or [])
          rows = report.get('matrix') or report.get('rows') or []
          nfl = [
              row for row in rows
              if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1'
              and row.get('outcome') == 'DRIFT_CONFIRMED'
          ]
          print('outcome_counts=' + json.dumps(counts, sort_keys=True))
          print('release_blocks=' + json.dumps(blocks))
          print('NFL_PROP_MODEL_FREEZE_V1_DRIFT_ROWS=' + json.dumps(nfl, sort_keys=True))
          if not nfl:
              raise SystemExit('NFL_PROP_DRIFT_NOT_MACHINE_CONFIRMED')
          PY

      - name: Apply fail-closed terminal disposition only after machine evidence
        env:
          TARGET_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          target = next(row for row in registry['bundles'] if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1')
          prior = target.get('disposition')
          if prior not in (None, {}):
              raise SystemExit('NFL_PROP_FREEZE_ALREADY_HAS_DISPOSITION')
          target['disposition'] = {
              'state': 'REVOKED',
              'revoked_at': '2026-09-21T13:34:04Z',
              'prior_forward_clock_invalidated': True,
              'reason': 'PR_898_CHANGED_COVERED_NFL_PROP_SURFACE; MACHINE_CLASSIFIER_CONFIRMED_DRIFT; NO_MACHINE_VERIFIED_REFREEZE; REVOKED_FAIL_CLOSED',
              'trigger_delta_sha': os.environ['TARGET_MAIN'],
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'eligibility': False,
                  'staking': False,
                  'official': False,
              },
          }
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          PY

      - name: Reclassify and require clean terminal reconciliation
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/post_disposition_report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/post_disposition_report.json').read_text())
          allowed = {'ACTIVE_FREEZE_BUNDLE_INVENTORY_INCOMPLETE'}
          blocks = set(report.get('release_blocks') or [])
          unexpected = sorted(blocks - allowed)
          print('post_outcome_counts=' + json.dumps(report.get('outcome_counts') or {}, sort_keys=True))
          print('post_release_blocks=' + json.dumps(sorted(blocks)))
          print('post_authority=' + json.dumps(report.get('authority') or {}, sort_keys=True))
          if unexpected:
              raise SystemExit('UNRESOLVED_RECONCILIATION_DRIFT:' + ','.join(unexpected))
          if any(bool(v) for v in (report.get('authority') or {}).values()):
              raise SystemExit('RECONCILIATION_AUTHORITY_ESCALATION')
          PY

      - name: Focused reconciliation contracts
        run: |
          python -m pytest -q \
            tests/test_freeze_reconciliation.py \
            tests/test_reconcile_freeze_deltas_cli.py \
            tests/test_freeze_inventory.py

      - name: Persist durable registry only
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-pr898-machine-evidence.yml
          git config user.name 'sportsedge-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/freeze_reconciliation_registry_v1.json .github/workflows/reconcile-pr898-machine-evidence.yml
          git diff --cached --quiet && { echo 'NO_RECONCILIATION_CHANGE'; exit 1; }
          git commit -m 'Governance: reconcile PR898 machine-confirmed NFL prop drift'
          git push origin HEAD:governance/reconcile-pr898-machine-evidence-20260921
