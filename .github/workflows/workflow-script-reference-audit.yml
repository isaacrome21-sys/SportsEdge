name: workflow-script-reference-audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_workflow_script_refs.py'
      - 'scripts/audit_paid_odds_api_concurrency.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_workflow_script_refs.py'
      - 'scripts/audit_paid_odds_api_concurrency.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install audit parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate repository-local workflow script references
        run: python scripts/audit_workflow_script_refs.py
      - name: Validate paid Odds API jobs use the repo-wide lock
        run: python scripts/audit_paid_odds_api_concurrency.py
