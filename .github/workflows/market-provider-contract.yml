name: market-provider-contract

on:
  pull_request:
    paths:
      - 'config/market_provider_contract_v1.json'
      - 'config/provider_consumer_registry_v1.json'
      - 'docs/market_provider_migration_20260915.md'
      - 'docs/market_provider_spend_audit_20260915.md'
      - 'docs/free_provider_public_repo_adoption.md'
      - 'docs/provider_abstraction_terminal_state.md'
      - 'docs/provider_abstraction_change_summary.md'
      - 'sportsedge/market_provider_contract.py'
      - 'sportsedge/market_provider_router.py'
      - 'sportsedge/free_game_market_acquisition.py'
      - 'sportsedge/espn_game_odds_source.py'
      - 'tests/test_market_provider_contract.py'
      - 'tests/test_market_provider_router.py'
      - 'tests/test_free_game_market_acquisition.py'
      - 'tests/test_provider_usage_attribution.py'
      - 'tests/test_provider_migration_ledger.py'
      - 'tests/test_provider_frozen_exclusion.py'
      - 'tests/test_provider_consumer_registry.py'
      - 'tests/test_provider_branch_scope.py'
      - 'tests/test_free_provider_cli_scope.py'
      - 'tests/test_provider_change_summary.py'
      - 'tests/test_espn_game_odds_source.py'
      - 'scripts/audit_market_provider_migration.py'
      - 'scripts/provider_usage_attribution.py'
      - 'scripts/run_free_mlb_game_markets.py'
      - '.github/workflows/market-provider-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile
        run: python3 -m py_compile sportsedge/market_provider_contract.py sportsedge/market_provider_router.py sportsedge/free_game_market_acquisition.py scripts/audit_market_provider_migration.py scripts/provider_usage_attribution.py scripts/run_free_mlb_game_markets.py
      - name: Provider contract tests
        run: python3 -m unittest -q tests.test_market_provider_contract tests.test_market_provider_router tests.test_free_game_market_acquisition tests.test_provider_usage_attribution tests.test_provider_migration_ledger tests.test_provider_frozen_exclusion tests.test_provider_consumer_registry tests.test_provider_branch_scope tests.test_free_provider_cli_scope tests.test_provider_change_summary tests.test_espn_game_odds_source
      - name: Migration audit
        run: python3 scripts/audit_market_provider_migration.py
      - name: Frozen confirmation exclusion
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          ! grep -Fxq 'scripts/nfl_2026_line_capture.py' <<<"$changed"
          ! grep -Fxq 'config/nfl_2026_capture.json' <<<"$changed"
          ! grep -Fxq '.github/workflows/nfl-2026-line-capture.yml' <<<"$changed"
