name: MLB auto grade

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional [MLB LINES] issue number; blank scans open MLB line issues"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mlb-auto-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Select ledger branch
        env:
          LEDGER_BRANCH: automation/mlb-auto-grade-ledger
        run: |
          git fetch origin "$LEDGER_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$LEDGER_BRANCH"; then
            git checkout -B "$LEDGER_BRANCH" "origin/$LEDGER_BRANCH"
            git rebase origin/main
          else
            git checkout -b "$LEDGER_BRANCH" origin/main
          fi

      - name: Grade finalized MLB cards
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTED_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_ISSUE:-}" ]; then
            issues="$REQUESTED_ISSUE"
          else
            issues="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title | startswith("[MLB LINES]")) | .number')"
          fi
          if [ -z "$issues" ]; then
            echo "No MLB line issues to grade."
            exit 0
          fi
          while read -r issue; do
            [ -z "$issue" ] && continue
            echo "Checking issue #$issue"
            python scripts/grade_mlb_card.py "$issue"
          done <<< "$issues"

      - name: Persist ledger changes through PR
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_BRANCH: automation/mlb-auto-grade-ledger
        run: |
          set -euo pipefail
          if git diff --quiet -- ledger/mlb_ledger.csv; then
            echo "No ledger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/mlb_ledger.csv
          git commit -m "ledger: record finalized MLB card grades"
          git push --force-with-lease origin "$LEDGER_BRANCH"
          existing="$(gh pr list --state open --head "$LEDGER_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$LEDGER_BRANCH" \
              --title "ledger: automated MLB card grades" \
              --body "Automated settlement rows from final MLB StatsAPI box scores. Main-card units use posted card prices only; LEAN props remain outside the ledger record. This PR is intentionally not auto-merged."
          else
            echo "Updated existing ledger PR #$existing"
          fi
