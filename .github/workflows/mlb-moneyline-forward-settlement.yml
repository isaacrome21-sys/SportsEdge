name: mlb-moneyline-forward-settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: mlb-moneyline-forward-settlement-v2
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Install frozen test/runtime dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Contract tests
        run: |
          python -m py_compile \
            scripts/settle_mlb_moneyline_forward_evidence_v2.py \
            scripts/persist_forward_evidence_data_branch.py \
            sportsedge/mlb_moneyline_forward_lane.py \
            sportsedge/mlb_moneyline_paper_decision.py \
            sportsedge/mlb_moneyline_v2_settlement.py \
            sportsedge/mlb_moneyline_v2_checkpoint.py \
            sportsedge/mlb_moneyline_v2_checkpoint_runtime.py \
            sportsedge/mlb_moneyline_v2_probation.py \
            sportsedge/mlb_moneyline_v2_probation_runtime.py
          python -m unittest \
            tests.test_mlb_moneyline_forward_lane \
            tests.test_mlb_moneyline_paper_decision \
            tests.test_capture_mlb_moneyline_paper_decisions \
            tests.test_mlb_moneyline_v2_settlement \
            tests.test_settle_mlb_moneyline_forward_evidence_v2 \
            tests.test_mlb_moneyline_v2_checkpoint \
            tests.test_mlb_moneyline_v2_probation \
            tests.test_persist_forward_evidence_data_branch -v

      - name: Restore cumulative forward evidence from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          for path in \
            data/mlb_forward_predictions \
            data/mlb_forward_capture \
            data/mlb_forward_decisions \
            data/mlb_forward_evidence \
            data/mlb_forward_settlement_raw; do
            if git cat-file -e "origin/data:$path" 2>/dev/null; then
              git archive origin/data "$path" | tar -x
            fi
          done

      - name: Settle frozen PAPER bets and score V2 evidence state
        id: settle
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/settle_mlb_moneyline_forward_evidence_v2.py \
            --report artifacts/mlb_moneyline_forward_gate_report_v2.json | tee settlement_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate fixed 50/100/150 V2 checkpoints
        id: checkpoint
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m sportsedge.mlb_moneyline_v2_checkpoint_runtime \
            --evidence-root data/mlb_forward_evidence \
            --report artifacts/mlb_moneyline_v2_checkpoint_report.json | tee checkpoint_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate checkpoint-50 PROBATION readiness
        id: probation
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m sportsedge.mlb_moneyline_v2_probation_runtime \
            --checkpoint-report artifacts/mlb_moneyline_v2_checkpoint_report.json \
            --report artifacts/mlb_moneyline_v2_probation_readiness.json | tee probation_readiness_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist immutable completed evidence to data branch
        id: persist
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/persist_forward_evidence_data_branch.py \
            --path data/mlb_forward_evidence \
            --path data/mlb_forward_settlement_raw \
            --branch data \
            --worktree "$RUNNER_TEMP/sportsedge-mlb-settlement-data" | tee settlement_persistence_result.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload V2 settlement, checkpoint, and readiness receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-moneyline-forward-settlement-v2-${{ github.run_id }}
          path: |
            settlement_result.json
            checkpoint_result.json
            probation_readiness_result.json
            settlement_persistence_result.json
            artifacts/mlb_moneyline_forward_gate_report_v2.json
            artifacts/mlb_moneyline_v2_checkpoint_report.json
            artifacts/mlb_moneyline_v2_probation_readiness.json
            data/mlb_forward_evidence/**
            data/mlb_forward_settlement_raw/**
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce fail-closed settlement, checkpoint, and readiness integrity
        if: always()
        shell: bash
        run: |
          settlement_rc='${{ steps.settle.outputs.exit_code }}'
          checkpoint_rc='${{ steps.checkpoint.outputs.exit_code }}'
          probation_rc='${{ steps.probation.outputs.exit_code }}'
          persist_rc='${{ steps.persist.outputs.exit_code }}'
          test -n "$settlement_rc" && test "$settlement_rc" -eq 0
          test -n "$checkpoint_rc" && test "$checkpoint_rc" -eq 0
          test -n "$probation_rc" && test "$probation_rc" -eq 0
          test -n "$persist_rc" && test "$persist_rc" -eq 0
