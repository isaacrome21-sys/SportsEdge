name: cfb train artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/cfb_sdv_materialize_request_v1.json'
  pull_request:
    paths:
      - 'config/cfb_sportsdataverse_candidate_prereg_v1.json'
      - 'config/cfb_sportsdataverse_source_contract_v1.json'
      - 'config/cfb_sportsdataverse_historical_weather_contract_v1.json'
      - 'scripts/materialize_cfb_sportsdataverse_training.py'
      - 'sportsedge/sports/cfb/sportsdataverse_*.py'
      - 'tests/test_cfb_sportsdataverse_*.py'
      - '.github/workflows/cfb-train-artifact.yml'

permissions:
  contents: read

concurrency:
  group: cfb-train-artifact
  cancel-in-progress: false

jobs:
  contract:
    name: CFB SDV public training contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile SDV materialization path
        run: |
          python -m py_compile \
            scripts/materialize_cfb_sportsdataverse_training.py \
            sportsedge/sports/cfb/sportsdataverse_acquisition.py \
            sportsedge/sports/cfb/sportsdataverse_csv.py \
            sportsedge/sports/cfb/sportsdataverse_history.py \
            sportsedge/sports/cfb/sportsdataverse_materializer.py \
            sportsedge/sports/cfb/sportsdataverse_training_rows.py \
            sportsedge/sports/cfb/sportsdataverse_candidate_families.py \
            sportsedge/sports/cfb/sportsdataverse_candidate_model.py \
            sportsedge/sports/cfb/sportsdataverse_weather.py \
            sportsedge/sports/cfb/sportsdataverse_weather_transport.py \
            sportsedge/sports/cfb/sportsdataverse_weather_receipts.py \
            sportsedge/sports/cfb/sportsdataverse_venue_source.py

      - name: Run SDV unit contracts without network
        run: |
          python -m pytest -q \
            tests/test_cfb_sportsdataverse_acquisition.py \
            tests/test_cfb_sportsdataverse_csv.py \
            tests/test_cfb_sportsdataverse_materializer.py \
            tests/test_cfb_sportsdataverse_candidate_model.py \
            tests/test_cfb_sportsdataverse_weather_contract.py \
            tests/test_cfb_sportsdataverse_weather_receipts.py \
            tests/test_cfb_sportsdataverse_weather_transport.py \
            tests/test_cfb_sportsdataverse_venue_source.py \
            tests/test_cfb_sportsdataverse_training_materializer.py

      - name: Assert attempt budget remains untouched
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/cfb_sportsdataverse_candidate_prereg_v1.json').read_text())
          g=p['governance']
          assert g['attempts_consumed']==0
          assert g['evaluation_performed'] is False
          assert g['model_p_created'] is False
          assert g['promotion_authority'] is False
          assert g['official_authority'] is False
          print('CFB_SDV_ZERO_ATTEMPT_CONTRACT_OK')
          PY

  materialize:
    name: Materialize public SDV training rows
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate explicit main-push materialization request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request=json.loads(Path('config/cfb_sdv_materialize_request_v1.json').read_text())
          prereg=json.loads(Path('config/cfb_sportsdataverse_candidate_prereg_v1.json').read_text())
          if request.get('schema') != 'CFB_SDV_MATERIALIZE_REQUEST_V1':
              raise SystemExit('CFB_SDV_MATERIALIZE_REQUEST_SCHEMA_INVALID')
          if request.get('mode') != 'ZERO_ATTEMPT_PUBLIC_TRAINING_MATERIALIZATION':
              raise SystemExit('CFB_SDV_MATERIALIZE_REQUEST_MODE_INVALID')
          if request.get('consume_candidate_attempts') is not False:
              raise SystemExit('CFB_SDV_MATERIALIZE_REQUEST_ATTEMPT_CONSUMPTION_FORBIDDEN')
          if request.get('run_candidate_evaluation') is not False:
              raise SystemExit('CFB_SDV_MATERIALIZE_REQUEST_EVALUATION_FORBIDDEN')
          expected=request.get('expected_hash_binding') or {}
          actual=prereg.get('hash_binding') or {}
          if expected != actual:
              raise SystemExit('CFB_SDV_MATERIALIZE_REQUEST_HASH_BINDING_MISMATCH')
          print('CFB_SDV_MAIN_PUSH_MATERIALIZATION_REQUEST_OK')
          PY

      - name: Verify frozen prereg binding before source acquisition
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('config/cfb_sportsdataverse_candidate_prereg_v1.json').read_text())
          h=p['hash_binding']
          subprocess.run([
            'python','scripts/cfb_sportsdataverse_prereg_hash.py',
            '--verify-code',h['code_manifest_sha256'],
            '--verify-config',h['config_bundle_sha256'],
          ],check=True)
          PY

      - name: Restore public source and weather cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/cfb-sdv-public
          key: cfb-sdv-public-v1-${{ hashFiles('config/cfb_sportsdataverse_source_contract_v1.json', 'config/cfb_sportsdataverse_historical_weather_contract_v1.json') }}-${{ github.run_id }}
          restore-keys: |
            cfb-sdv-public-v1-${{ hashFiles('config/cfb_sportsdataverse_source_contract_v1.json', 'config/cfb_sportsdataverse_historical_weather_contract_v1.json') }}-

      - name: Materialize frozen public training bundle
        run: |
          set -euo pipefail
          python scripts/materialize_cfb_sportsdataverse_training.py \
            --cache-root .cache/cfb-sdv-public \
            --out-dir artifacts/cfb/sportsdataverse-selection

      - name: Save verified public source and weather cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/cfb-sdv-public
          key: cfb-sdv-public-v1-${{ hashFiles('config/cfb_sportsdataverse_source_contract_v1.json', 'config/cfb_sportsdataverse_historical_weather_contract_v1.json') }}-${{ github.run_id }}

      - name: Persist immutable zero-attempt training bundle to data branch
        run: |
          set -euo pipefail
          test -s artifacts/cfb/sportsdataverse-selection/training_rows.json
          test -s artifacts/cfb/sportsdataverse-selection/training_manifest.json
          git fetch --no-tags origin data:data
          rm -rf _cfb_data
          git worktree add _cfb_data data
          target='_cfb_data/history/cfb/sportsdataverse-selection'
          mkdir -p "$target"
          cp artifacts/cfb/sportsdataverse-selection/*.json "$target/"
          git -C _cfb_data config user.name 'SportsEdge CFB automation'
          git -C _cfb_data config user.email 'actions@github.com'
          git -C _cfb_data add history/cfb/sportsdataverse-selection
          if git -C _cfb_data diff --cached --quiet; then
            echo 'CFB_SDV_TRAINING_BUNDLE_ALREADY_CURRENT'
          else
            git -C _cfb_data commit -m 'data: persist frozen CFB SportsDataverse training bundle'
            git -C _cfb_data push origin HEAD:data
          fi

      - name: Record model-artifact governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/cfb/sportsdataverse-selection/training_manifest.json').read_text())
          status={
            'schema':'CFB_TRAIN_ARTIFACT_STATUS_V1',
            'status':'BLOCKED',
            'reason':'CFB_SDV_GOVERNED_SELECTION_REQUIRED_BEFORE_ARTIFACT',
            'training_rows_materialized':True,
            'training_rows_sha256':m['training_rows_sha256'],
            'attempts_consumed':0,
            'evaluation_performed':False,
            'model_fit_performed':False,
            'model_artifact_created':False,
            'model_p_created':False,
            'promotion_authority':False,
            'official_authority':False,
          }
          Path('artifacts/cfb/cfb_train_artifact_status.json').write_text(
            json.dumps(status,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(status,sort_keys=True))
          PY

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfb-sdv-training-bundle
          path: |
            artifacts/cfb/sportsdataverse-selection/*.json
            artifacts/cfb/cfb_train_artifact_status.json
          if-no-files-found: warn
          retention-days: 30
