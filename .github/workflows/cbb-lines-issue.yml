name: cbb-lines-issue

# Owner/Muse posts DraftKings CBB lines as a "[CBB LINES]" issue in the
# sportsedge.cbb_lines_intake grammar; this prices them NON_COUNTED with
# CBB_TORVIK_EFFICIENCY_V1 and replies on the issue with the card.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: cbb-lines-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  card:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[CBB LINES]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Price and reply
        env:
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          # Slate date from the title ("[CBB LINES] 2026-11-02"), else today (CT).
          day=$(printf '%s' "$TITLE" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          day=${day:-$(TZ=America/Chicago date +%F)}
          if ! python scripts/run_cbb_daily_card.py --date "$day" --issue "$ISSUE" --post 2> err.txt; then
            { echo "CBB card did not run:"; echo; echo '```'; tail -20 err.txt; echo '```'; } > fail.md
            gh issue comment "$ISSUE" --body-file fail.md
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cbb-lines-issue-${{ github.event.issue.number }}
          path: artifacts/
          if-no-files-found: warn
