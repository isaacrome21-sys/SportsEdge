name: V7 backfill source readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/v7_feature_backfill_policy_v1.json"
      - "config/v7_backfill_source_requirements_v1.json"
      - "config/v7_reduced_feature_contract_v1.json"
      - "sportsedge/v7_backfill_source_readiness.py"
      - "sportsedge/v7_reduced_feature_contract.py"
      - "sportsedge/v7_training.py"
      - "scripts/audit_v7_backfill_source_readiness.py"
      - "scripts/train_v7_candidate.py"
      - "tests/test_v7_backfill_source_readiness.py"
      - "tests/test_v7_reduced_feature_contract.py"
      - ".github/workflows/v7-backfill-source-readiness.yml"
  push:
    branches: [main]
    paths:
      - "config/v7_feature_backfill_policy_v1.json"
      - "config/v7_backfill_source_requirements_v1.json"
      - "config/v7_reduced_feature_contract_v1.json"
      - "sportsedge/v7_backfill_source_readiness.py"
      - "sportsedge/v7_reduced_feature_contract.py"
      - "sportsedge/v7_training.py"
      - "scripts/audit_v7_backfill_source_readiness.py"
      - "scripts/train_v7_candidate.py"
      - "tests/test_v7_backfill_source_readiness.py"
      - "tests/test_v7_reduced_feature_contract.py"
      - ".github/workflows/v7-backfill-source-readiness.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact code head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run focused contract tests
        run: python -m pytest -q tests/test_v7_backfill_source_readiness.py tests/test_v7_reduced_feature_contract.py
      - name: Checkout durable data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: data
          path: data-branch
          persist-credentials: false
      - name: Audit durable replay sources
        shell: bash
        run: |
          set -euo pipefail
          DATA_REF="$(git -C data-branch rev-parse HEAD)"
          PYTHONPATH=. python scripts/audit_v7_backfill_source_readiness.py \
            --source-root data-branch/evidence/mlb_v8_replay_sources \
            --data-ref "$DATA_REF" \
            --output artifacts/v7-backfill-source-readiness/report.json
      - name: Enforce fail-closed report invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/v7-backfill-source-readiness/report.json").read_text())
          assert r["admitted_feature_count"] == 12
          assert 0 <= r["source_ready_feature_count"] <= 12
          assert r["promotion_authority"] is False
          assert r["reduced_feature_contract_ready"] is True
          assert isinstance(r["reduced_feature_contract_file_sha256"], str) and len(r["reduced_feature_contract_file_sha256"]) == 64
          assert isinstance(r["reduced_feature_contract_sha256"], str) and len(r["reduced_feature_contract_sha256"]) == 64
          assert len(r["reduced_feature_paths"]) == 12
          assert "REDUCED_FEATURE_CONTRACT_NOT_FROZEN" not in r["candidate_training_blockers"]
          if r["source_ready_feature_count"] < 12:
              assert r["source_readiness_state"] == "BLOCKED_SOURCE_COVERAGE"
              assert r["candidate_training_allowed"] is False
              assert r["candidate_training_blockers"] == ["SOURCE_COVERAGE"]
          else:
              assert r["source_readiness_state"] == "READY_SOURCE_COVERAGE"
              assert r["candidate_training_allowed"] is True
              assert r["candidate_training_blockers"] == []
          print(json.dumps({"state": r["source_readiness_state"], "source_ready_feature_count": r["source_ready_feature_count"], "admitted_feature_count": r["admitted_feature_count"], "reduced_feature_contract_ready": r["reduced_feature_contract_ready"], "candidate_training_allowed": r["candidate_training_allowed"], "data_ref": r["data_ref"]}, sort_keys=True))
          PY
      - name: Upload source-readiness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-backfill-source-readiness-${{ github.sha }}
          path: artifacts/v7-backfill-source-readiness/report.json
          if-no-files-found: error
          retention-days: 30
