name: null-default-audit

on:
  pull_request:
    paths:
      - 'sportsedge/**'
      - 'scripts/**'
      - 'tests/test_null_default_audit.py'
      - '.github/workflows/null-default-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inventory null-coalescing defaults
        run: python scripts/audit_null_defaults.py --out artifacts/null-default-audit.json
      - name: Upload null-default audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: null-default-audit
          path: artifacts/null-default-audit.json
          if-no-files-found: error
          retention-days: 14
