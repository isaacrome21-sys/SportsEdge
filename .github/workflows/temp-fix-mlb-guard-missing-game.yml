name: temp-fix-mlb-guard-missing-game

on:
  push:
    branches:
      - fix/mlb-phone-intake-guard-20260929
    paths:
      - .github/workflows/temp-fix-mlb-guard-missing-game.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mlb-phone-intake-guard-20260929
          fetch-depth: 0
      - name: Preserve fail-neutral missing game identity guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          model = Path('sportsedge/mlb_myspari_own_model.py')
          text = model.read_text(encoding='utf-8')
          old = '''    for row in rows:\n        if row.get("status") == "ACTIONABLE":\n            by_game.setdefault(str(row.get("game_id")), []).append(row)\n'''
          new = '''    for row in rows:\n        if row.get("status") != "ACTIONABLE":\n            continue\n        game_id = row.get("game_id")\n        if game_id in {None, ""}:\n            # Fail neutral rather than treating unrelated unknown games as one game.\n            continue\n        by_game.setdefault(str(game_id), []).append(row)\n'''
          if old not in text:
              raise SystemExit('expected guard snippet not found')
          model.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_mlb_same_game_guard.py')
          t = test.read_text(encoding='utf-8')
          marker = '''    def test_other_games_and_pass_rows_untouched(self):\n'''
          insert = '''    def test_missing_game_ids_are_fail_neutral(self):\n        high = _row("TOTALS", "OVER", 0.20, game=None)\n        quiet = _row("PITCHER_OUTS", "OVER", 0.30, game=None)\n        apply_same_game_guard([high, quiet])\n        self.assertEqual((high["status"], quiet["status"]), ("ACTIONABLE", "ACTIONABLE"))\n        self.assertNotIn("presentation_reason_codes", high)\n        self.assertNotIn("presentation_reason_codes", quiet)\n\n'''
          if marker not in t:
              raise SystemExit('test insertion marker not found')
          test.write_text(t.replace(marker, insert + marker, 1), encoding='utf-8')
          PY
          rm .github/workflows/temp-fix-mlb-guard-missing-game.yml
          python -m py_compile sportsedge/mlb_myspari_own_model.py tests/test_mlb_same_game_guard.py
          python -m unittest tests.test_mlb_same_game_guard -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sportsedge/mlb_myspari_own_model.py tests/test_mlb_same_game_guard.py .github/workflows/temp-fix-mlb-guard-missing-game.yml
          git diff --cached --check
          git commit -m 'MLB: keep same-game guard fail-neutral without game identity'
          git push origin HEAD:fix/mlb-phone-intake-guard-20260929
