name: mlb-postseason-k-outs-2026-shadow-forward

on:
  pull_request:
    paths:
      - 'sportsedge/mlb_postseason_k_outs_forward_shadow.py'
      - 'scripts/run_mlb_postseason_k_outs_forward_shadow.py'
      - 'tests/test_mlb_postseason_k_outs_forward_shadow.py'
      - '.github/workflows/mlb-postseason-k-outs-2026-shadow-forward.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - mlb-prop-pit-archive
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: mlb-postseason-k-outs-2026-shadow-forward-${{ github.event.pull_request.number || 'runtime' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pregame feature runtime
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Compile pregame research paths
        run: >-
          python -m py_compile
          sportsedge/mlb_postseason_k_outs_forward_shadow.py
          scripts/run_mlb_postseason_k_outs_forward_shadow.py
      - name: Verify strictly pregame identity, settlement and historical transfer labels
        run: PYTHONPATH=. python -m unittest tests.test_mlb_postseason_k_outs_forward_shadow -v

  capture-and-grade:
    needs: contract
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install production-compatible research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Restore pre-existing create-only predictions and settlements from data branch
        run: |
          set -euo pipefail
          git fetch origin data
          if git cat-file -e origin/data:data/mlb_postseason_k_outs_forward_2026 2>/dev/null; then
            git archive origin/data data/mlb_postseason_k_outs_forward_2026 | tar -x
          fi
      - name: Observe today's postseason games and settle only earlier pregame predictions
        id: capture
        shell: bash
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=. python scripts/run_mlb_postseason_k_outs_forward_shadow.py \
            --output-root data/mlb_postseason_k_outs_forward_2026 \
            | tee /tmp/mlb_postseason_k_outs_shadow_status.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist forward evidence with immutable path identities
        id: persist
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=. python scripts/persist_forward_evidence_data_branch.py \
            --path data/mlb_postseason_k_outs_forward_2026 \
            --branch data \
            --worktree "$RUNNER_TEMP/sportsedge-mlb-postseason-k-outs-shadow-data" \
            --message "evidence: pregame postseason pitcher shadow forecasts and real settlements" \
            | tee /tmp/mlb_postseason_k_outs_shadow_persistence.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload 2026 pregame and settlement receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-postseason-k-outs-forward-shadow-${{ github.run_id }}
          path: |
            /tmp/mlb_postseason_k_outs_shadow_status.json
            /tmp/mlb_postseason_k_outs_shadow_persistence.json
            data/mlb_postseason_k_outs_forward_2026/**
          if-no-files-found: warn
          retention-days: 90
      - name: Fail closed on unproved forward evidence
        if: always()
        run: |
          test '${{ steps.capture.outputs.exit_code }}' -eq 0
          test '${{ steps.persist.outputs.exit_code }}' -eq 0
