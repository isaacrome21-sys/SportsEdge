name: truth-gate-floor-provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/truth_gate_floors.json'
      - 'sportsedge/edge_floors.py'
      - 'sportsedge/floor_provenance.py'
      - 'sportsedge/orchestrator.py'
      - 'sportsedge/shared_artifact.py'
      - 'tests/test_edge_floors.py'
      - 'tests/test_floor_provenance.py'
      - 'tests/test_floor_production_path.py'
      - 'tests/test_shared_artifact.py'
      - '.github/workflows/truth-gate-floor-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'config/truth_gate_floors.json'
      - 'sportsedge/edge_floors.py'
      - 'sportsedge/floor_provenance.py'
      - 'sportsedge/orchestrator.py'
      - 'sportsedge/shared_artifact.py'
      - 'tests/test_edge_floors.py'
      - 'tests/test_floor_provenance.py'
      - 'tests/test_floor_production_path.py'
      - 'tests/test_shared_artifact.py'
      - '.github/workflows/truth-gate-floor-provenance.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run provenance, floor, artifact, and production-path contract tests
        run: >-
          python -m unittest
          tests.test_edge_floors
          tests.test_floor_provenance
          tests.test_floor_production_path
          tests.test_shared_artifact
          -v
      - name: Verify every checked-in frozen floor from historical Git bytes
        run: |
          python - <<'PY'
          from sportsedge.floor_provenance import report_verified, verify_floor_config_provenance
          verified = verify_floor_config_provenance(
              config_path='config/truth_gate_floors.json', repo_root='.'
          )
          print(report_verified(verified))
          PY
