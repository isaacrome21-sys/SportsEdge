name: manual-mlb-props-final-20261006

on:
  push:
    branches:
      - 'run/mlb-fast-20261006-1500-two-games'
    paths:
      - '.github/workflows/manual-mlb-props-final-20261006.yml'

permissions:
  contents: read

jobs:
  price-props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.3

      - name: Price current LAD-ATL DK props
        run: >-
          python scripts/run_manual_mlb_snapshot.py
          --input manual_inputs/mlb/2026-10-06_dodgers_braves_props_1510.json
          --history-cache-dir .cache/mlb-history
          --run-date 2026-10-06
          --max-age-minutes 60
          --output artifacts/lad_atl_props.json

      - name: Acquire LAD-ATL context
        run: >-
          python scripts/acquire_mlb_card_context.py
          --engine-output artifacts/lad_atl_props.json
          --out-dir artifacts/lad_atl_context

      - name: Render LAD-ATL prop card
        run: >-
          python scripts/render_mlb_myspari_card.py
          --engine-output artifacts/lad_atl_props.json
          --snapshot manual_inputs/mlb/2026-10-06_dodgers_braves_props_1510.json
          --context-dir artifacts/lad_atl_context
          --out-dir artifacts/lad_atl_prop_card

      - name: Price user-supplied MIL-SD DK prop snapshot
        run: >-
          python scripts/run_manual_mlb_snapshot.py
          --input manual_inputs/mlb/2026-10-06_brewers_padres_props_1159.json
          --history-cache-dir .cache/mlb-history
          --allow-stale
          --output artifacts/mil_sd_props.json

      - name: Acquire MIL-SD context
        run: >-
          python scripts/acquire_mlb_card_context.py
          --engine-output artifacts/mil_sd_props.json
          --out-dir artifacts/mil_sd_context

      - name: Render MIL-SD prop card
        run: >-
          python scripts/render_mlb_myspari_card.py
          --engine-output artifacts/mil_sd_props.json
          --snapshot manual_inputs/mlb/2026-10-06_brewers_padres_props_1159.json
          --context-dir artifacts/mil_sd_context
          --out-dir artifacts/mil_sd_prop_card

      - name: Print prop cards
        run: |
          echo "LAD_ATL_PROP_CARD_BEGIN"
          cat artifacts/lad_atl_prop_card/card.md
          echo "LAD_ATL_PROP_CARD_END"
          echo "MIL_SD_PROP_CARD_BEGIN"
          cat artifacts/mil_sd_prop_card/card.md
          echo "MIL_SD_PROP_CARD_END"

      - name: Upload prop results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-props-final-${{ github.sha }}
          path: |
            artifacts/lad_atl_props.json
            artifacts/lad_atl_context/
            artifacts/lad_atl_prop_card/
            artifacts/mil_sd_props.json
            artifacts/mil_sd_context/
            artifacts/mil_sd_prop_card/
          if-no-files-found: error
          retention-days: 14
