name: nfl-v2k-preregistration-addendum-v2

on:
  pull_request:
    paths:
      - 'sportsedge/sports/nfl/NFL_V2K_PREREGISTRATION_ADDENDUM_V2.json'
      - 'sportsedge/sports/nfl/NFL_V2K_CLEAN_PREREG_2026-09-13.md'
      - 'sportsedge/sports/nfl/NFL_V2K_EMPIRICAL_KEY_REFERENCE_V1.json'
      - 'sportsedge/sports/nfl/NFL_V2K_ATTEMPT_LEDGER_V1.json'
      - 'sportsedge/sports/nfl/NFL_V2K_HUMAN_POLICY_SELECTION_V1.json'
      - 'sportsedge/sports/nfl/NFL_V2K_IMPLEMENTATION_ADMISSION_V3.json'
      - 'tests/test_nfl_v2k_preregistration_addendum_v2.py'
      - '.github/workflows/nfl-v2k-preregistration-addendum-v2.yml'

permissions:
  contents: read

jobs:
  verify-addendum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile addendum contract
        run: python -m py_compile tests/test_nfl_v2k_preregistration_addendum_v2.py
      - name: Enforce immutable semantics and zero authority
        run: PYTHONPATH=. python tests/test_nfl_v2k_preregistration_addendum_v2.py
