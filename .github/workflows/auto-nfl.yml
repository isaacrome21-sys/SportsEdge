name: auto-nfl

on:
  workflow_dispatch:
    inputs:
      board_json:
        description: "NFL board JSON transcribed from the user's screenshots. Required; no Odds API is used."
        required: true
        type: string
      history_json:
        description: "Optional prior-game history JSON so attempt-9 can forecast margin and total."
        required: false
        type: string

  pull_request:
    paths:
      - scripts/run_auto_nfl_resilient.py
      - tests/test_run_auto_nfl_resilient.py
      - .github/workflows/auto-nfl.yml

permissions:
  contents: read

concurrency:
  group: auto-nfl
  cancel-in-progress: false

jobs:
  run-card:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Test attempt-9 baseline side emit
        if: github.event_name == 'pull_request'
        run: python -m unittest tests.test_run_auto_nfl_resilient -v
      - name: Run NFL card against screenshot-supplied lines
        if: github.event_name == 'workflow_dispatch'
        env:
          SPORTSEDGE_NFL_BOARD: ${{ inputs.board_json }}
          SPORTSEDGE_NFL_HISTORY: ${{ inputs.history_json }}
        run: |
          set +e
          python scripts/run_auto_nfl_resilient.py --output artifacts/live_nfl_card.json --board-output artifacts/live_nfl_board.json
          rc=$?
          set -e
          python - << 'PY'
          import json
          from pathlib import Path
          card = json.loads(Path("artifacts/live_nfl_card.json").read_text())
          if card.get("odds_api_called") is not False:
              raise SystemExit("NFL_AUTO_ODDS_API_GUARD_FAILED")
          funnel = card.get("funnel") or {}
          quotes = int(funnel.get("odds_rows_fetched") or 0)
          if quotes == 0 or card.get("run_status") == "BLOCKED_NO_ODDS":
              raise SystemExit("NFL_AUTO_ZERO_QUOTES")
          rows = card.get("results") or []
          bets = [
              row for row in rows
              if row.get("model_p") is not None and row.get("edge") is not None and float(row["edge"]) > 0
          ]
          if int(funnel.get("bets_emitted") or 0) != len(bets):
              raise SystemExit("NFL_AUTO_BET_EMIT_MISMATCH")
          if not any(row.get("model_p") is not None for row in rows if str(row.get("market")) in {"spread", "moneyline", "total"}):
              raise SystemExit("NFL_AUTO_SIDES_UNPRICED")
          print(f"NFL_AUTO_CARD_OK rows={len(rows)} bets={len(bets)} run_status={card.get('run_status')}")
          PY
          exit $rc
      - name: Render NFL both-side board
        if: always() && hashFiles('artifacts/live_nfl_card.json') != ''
        run: python scripts/render_football_board_card.py --engine-output artifacts/live_nfl_card.json --out-dir artifacts/nfl_myspari
      - name: Upload NFL auto card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-nfl-card
          path: |
            artifacts/live_nfl_card.json
            artifacts/live_nfl_board.json
            artifacts/nfl_myspari/
          if-no-files-found: error
          retention-days: 14
