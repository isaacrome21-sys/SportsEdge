name: freeze-reconciliation-hold

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-merge-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Fetch exact current main
        run: git fetch --no-tags origin main

      - name: Audit workflow writers with target-aware fail-closed classification
        run: >-
          PYTHONPATH=. python scripts/audit_direct_main_writers.py
          --ref HEAD
          --output artifacts/governance/direct_main_writer_guard.json

      - name: Enforce unconditional hold before classification
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('config/freeze_reconciliation_policy_v1.json').read_text())
          if policy['main_merge_hold'] != 'UNCONDITIONAL':
              raise SystemExit('FREEZE_RECONCILIATION_HOLD_NOT_UNCONDITIONAL')
          if policy['status'] == 'ACTIVE_BLOCKED' and os.environ.get('EVENT_NAME') == 'pull_request':
              allowed = policy['authorized_reconciliation_branch']
              actual = os.environ.get('HEAD_REF') or ''
              if actual != allowed:
                  raise SystemExit(f'FREEZE_RECONCILIATION_MAIN_MERGE_BLOCKED:{actual}:allowed={allowed}')
          authority = policy.get('authority') or {}
          if any(authority.values()):
              raise SystemExit('FREEZE_RECONCILIATION_AUTHORITY_ESCALATION_FORBIDDEN')
          print('freeze_hold=PASS status=' + policy['status'])
          PY

      - name: Test reconciliation inventory and writer state machines
        run: >-
          python -m pytest -q
          tests/test_freeze_reconciliation.py
          tests/test_reconciliation_content_boundary.py
          tests/test_freeze_inventory.py
          tests/test_direct_main_writer_guard.py
          tests/test_reconcile_freeze_deltas_cli.py

      - name: Build hash-bound effective coverage view
        run: >-
          python scripts/build_reconciliation_registry_view.py
          --output-policy /tmp/freeze_inventory_policy_effective.json
          --output-registry /tmp/freeze_reconciliation_registry_effective.json
          --attestation artifacts/governance/reconciliation_coverage_attestation.json

      - name: Audit complete governance surface inventory
        run: >-
          PYTHONPATH=. python scripts/audit_freeze_inventory.py
          --policy /tmp/freeze_inventory_policy_effective.json
          --registry /tmp/freeze_reconciliation_registry_effective.json
          --ref HEAD
          --output artifacts/governance/freeze_inventory_report.json

      - name: Enforce computed inventory whenever registry claims complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('artifacts/governance/freeze_inventory_report.json').read_text())
          claimed = inventory['registry_claimed_complete']
          if claimed and inventory['release_blocks']:
              raise SystemExit('FREEZE_INVENTORY_FALSE_COMPLETE_CLAIM:' + ','.join(inventory['release_blocks']))
          print('inventory_computed_complete=' + str(inventory['computed_complete']))
          print('inventory_unmapped_count=' + str(len(inventory['unmapped_paths'])))
          if inventory['unmapped_paths']:
              print('inventory_unmapped=' + '|'.join(inventory['unmapped_paths']))
          PY

      - name: Compare pre-722 and post-722 governed-surface identity
        run: >-
          PYTHONPATH=. python scripts/compute_reconciliation_content_digest.py
          --ref a6e5a155edc9bc59676816091473a8540d694e0c
          --compare-ref bd47021bd2d0fbb748e64795f0b37108a70b4389
          --output artifacts/governance/reconciliation_content_digest_a6_vs_bd.json

      - name: Reconcile each registered delta and enforce content-identity boundary
        run: >-
          PYTHONPATH=. python scripts/reconcile_freeze_deltas_content_boundary.py
          --registry /tmp/freeze_reconciliation_registry_effective.json
          --current-main-ref origin/main
          --candidate-ref HEAD
          --output artifacts/governance/freeze_reconciliation_report.json

      - name: Prove hold is still fail closed while inventory dispositions or writers remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/governance/freeze_reconciliation_report.json').read_text())
          writer_guard = json.loads(Path('artifacts/governance/direct_main_writer_guard.json').read_text())
          if report['policy_status'] == 'ACTIVE_BLOCKED' and report['release_authorized']:
              raise SystemExit('ACTIVE_BLOCKED_POLICY_CANNOT_AUTHORIZE_RELEASE')
          if any((report.get('authority') or {}).values()):
              raise SystemExit('FREEZE_RECONCILIATION_REPORT_AUTHORITY_ESCALATION')
          if any((writer_guard.get('authority') or {}).values()):
              raise SystemExit('DIRECT_MAIN_WRITER_GUARD_AUTHORITY_ESCALATION')
          blocking = list(writer_guard.get('blocking_findings') or ())
          print('release_ready=' + str(report['release_ready']))
          print('release_authorized=' + str(report['release_authorized']))
          print('release_blocks=' + ','.join(report['release_blocks']))
          print('direct_main_writer_status=' + str(writer_guard['status']))
          print('direct_main_writer_blocking_findings=' + str(len(blocking)))
          for finding in blocking:
              print('writer_finding=' + str(finding.get('workflow')) + ':' + str(finding.get('reason')))
          policy = json.loads(Path('config/freeze_reconciliation_policy_v1.json').read_text())
          enforcement = policy['direct_main_writer_guard'].get('enforcement', 'BLOCKING')
          print('direct_main_writer_enforcement=' + enforcement)
          if blocking and enforcement == 'BLOCKING':
              raise SystemExit('ACTIVE_OR_UNRESOLVED_DIRECT_MAIN_WRITER')
          if enforcement not in {'BLOCKING', 'DIAGNOSTIC_USER_WAIVER'}:
              raise SystemExit('DIRECT_MAIN_WRITER_ENFORCEMENT_INVALID')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freeze-reconciliation-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/governance/*.json
          if-no-files-found: warn
          retention-days: 30
