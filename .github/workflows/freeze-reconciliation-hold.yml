name: freeze-reconciliation-hold

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-merge-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Fetch exact current main
        run: git fetch --no-tags origin main

      - name: Block active direct-main workflow writers
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          policy = json.loads(Path('config/freeze_reconciliation_policy_v1.json').read_text())
          guard = policy.get('direct_main_writer_guard') or {}
          if guard.get('required') is not True:
              raise SystemExit('DIRECT_MAIN_WRITER_GUARD_NOT_REQUIRED')
          if guard.get('status') != 'FROZEN_FAIL_CLOSED':
              raise SystemExit('DIRECT_MAIN_WRITER_GUARD_NOT_FROZEN')

          prefix = str(guard.get('workflow_prefix') or '')
          suffixes = tuple(str(v) for v in (guard.get('workflow_suffixes') or ()))
          write_marker = str(guard.get('write_permission_marker') or '')
          push_markers = tuple(str(v) for v in (guard.get('direct_push_markers') or ()))
          allowed = {str(v) for v in (guard.get('allowed_paths') or ())}
          if not prefix or not suffixes or not write_marker or not push_markers:
              raise SystemExit('DIRECT_MAIN_WRITER_GUARD_CONFIG_INCOMPLETE')
          if allowed:
              raise SystemExit('DIRECT_MAIN_WRITER_EXEMPTIONS_FORBIDDEN_DURING_HOLD')

          tree = subprocess.run(
              ['git', 'ls-tree', '-r', '--name-only', 'origin/main'],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          workflow_paths = sorted(
              path for path in tree
              if path.startswith(prefix) and path.endswith(suffixes)
          )
          active = []
          inspected = []
          for path in workflow_paths:
              text = subprocess.run(
                  ['git', 'show', f'origin/main:{path}'],
                  check=True, capture_output=True, text=True,
              ).stdout
              has_write = write_marker in text
              matched_push = sorted(marker for marker in push_markers if marker in text)
              inspected.append({
                  'path': path,
                  'contents_write': has_write,
                  'direct_push_markers': matched_push,
              })
              if has_write and matched_push and path not in allowed:
                  active.append(path)

          current_main = subprocess.run(
              ['git', 'rev-parse', 'origin/main'],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          artifact = {
              'schema': 'SPORTSEDGE_DIRECT_MAIN_WRITER_GUARD_V1',
              'status': 'BLOCKED_ACTIVE_DIRECT_MAIN_WRITER' if active else 'QUIESCED',
              'current_main_sha': current_main,
              'workflow_count': len(workflow_paths),
              'active_direct_main_writers': active,
              'inspected_workflows': inspected,
              'authority': {
                  'model_p': False,
                  'truth_gate': False,
                  'promotion': False,
                  'staking': False,
                  'official': False,
                  'validation_attempt': False,
                  'untouched_readout': False,
              },
          }
          out = Path('artifacts/governance/direct_main_writer_guard.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(artifact, indent=2, sort_keys=True) + '\n')
          print('direct_main_writer_status=' + artifact['status'])
          print('active_direct_main_writers=' + ','.join(active))
          if active:
              raise SystemExit('ACTIVE_DIRECT_MAIN_WRITER:' + ','.join(active))
          PY

      - name: Enforce unconditional hold before classification
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('config/freeze_reconciliation_policy_v1.json').read_text())
          if policy['main_merge_hold'] != 'UNCONDITIONAL':
              raise SystemExit('FREEZE_RECONCILIATION_HOLD_NOT_UNCONDITIONAL')
          if policy['status'] == 'ACTIVE_BLOCKED' and os.environ.get('EVENT_NAME') == 'pull_request':
              allowed = policy['authorized_reconciliation_branch']
              actual = os.environ.get('HEAD_REF') or ''
              if actual != allowed:
                  raise SystemExit(f'FREEZE_RECONCILIATION_MAIN_MERGE_BLOCKED:{actual}:allowed={allowed}')
          authority = policy.get('authority') or {}
          if any(authority.values()):
              raise SystemExit('FREEZE_RECONCILIATION_AUTHORITY_ESCALATION_FORBIDDEN')
          print('freeze_hold=PASS status=' + policy['status'])
          PY

      - name: Test reconciliation and inventory state machines
        run: python -m pytest -q tests/test_freeze_reconciliation.py tests/test_freeze_inventory.py

      - name: Audit complete governance surface inventory
        run: >-
          PYTHONPATH=. python scripts/audit_freeze_inventory.py
          --ref HEAD
          --output artifacts/governance/freeze_inventory_report.json

      - name: Enforce computed inventory whenever registry claims complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('artifacts/governance/freeze_inventory_report.json').read_text())
          claimed = inventory['registry_claimed_complete']
          if claimed and inventory['release_blocks']:
              raise SystemExit('FREEZE_INVENTORY_FALSE_COMPLETE_CLAIM:' + ','.join(inventory['release_blocks']))
          print('inventory_computed_complete=' + str(inventory['computed_complete']))
          print('inventory_unmapped_count=' + str(len(inventory['unmapped_paths'])))
          if inventory['unmapped_paths']:
              print('inventory_unmapped=' + '|'.join(inventory['unmapped_paths']))
          PY

      - name: Reconcile each registered delta against each bundle
        run: >-
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py
          --current-main-ref origin/main
          --output artifacts/governance/freeze_reconciliation_report.json

      - name: Prove hold is still fail closed while inventory or dispositions remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/governance/freeze_reconciliation_report.json').read_text())
          if report['policy_status'] == 'ACTIVE_BLOCKED' and report['release_ready']:
              raise SystemExit('ACTIVE_BLOCKED_POLICY_CANNOT_REPORT_RELEASE_READY')
          if any((report.get('authority') or {}).values()):
              raise SystemExit('FREEZE_RECONCILIATION_REPORT_AUTHORITY_ESCALATION')
          print('release_ready=' + str(report['release_ready']))
          print('release_blocks=' + ','.join(report['release_blocks']))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freeze-reconciliation-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/governance/*.json
          if-no-files-found: warn
          retention-days: 30
