name: freeze-reconciliation-hold

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-merge-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Fetch exact current main
        run: git fetch --no-tags origin main

      - name: Enforce unconditional hold before classification
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('config/freeze_reconciliation_policy_v1.json').read_text())
          if policy['main_merge_hold'] != 'UNCONDITIONAL':
              raise SystemExit('FREEZE_RECONCILIATION_HOLD_NOT_UNCONDITIONAL')
          if policy['status'] == 'ACTIVE_BLOCKED' and os.environ.get('EVENT_NAME') == 'pull_request':
              allowed = policy['authorized_reconciliation_branch']
              actual = os.environ.get('HEAD_REF') or ''
              if actual != allowed:
                  raise SystemExit(f'FREEZE_RECONCILIATION_MAIN_MERGE_BLOCKED:{actual}:allowed={allowed}')
          authority = policy.get('authority') or {}
          if any(authority.values()):
              raise SystemExit('FREEZE_RECONCILIATION_AUTHORITY_ESCALATION_FORBIDDEN')
          print('freeze_hold=PASS status=' + policy['status'])
          PY

      - name: Test reconciliation state machine
        run: python -m pytest -q tests/test_freeze_reconciliation.py

      - name: Reconcile each registered delta against each bundle
        run: >-
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py
          --current-main-ref origin/main
          --output artifacts/governance/freeze_reconciliation_report.json

      - name: Prove hold is still fail closed while inventory or dispositions remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/governance/freeze_reconciliation_report.json').read_text())
          if report['policy_status'] == 'ACTIVE_BLOCKED' and report['release_ready']:
              raise SystemExit('ACTIVE_BLOCKED_POLICY_CANNOT_REPORT_RELEASE_READY')
          if any((report.get('authority') or {}).values()):
              raise SystemExit('FREEZE_RECONCILIATION_REPORT_AUTHORITY_ESCALATION')
          print('release_ready=' + str(report['release_ready']))
          print('release_blocks=' + ','.join(report['release_blocks']))
          PY
