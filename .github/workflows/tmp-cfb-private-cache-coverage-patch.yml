name: tmp-cfb-private-cache-coverage-patch

on:
  push:
    branches:
      - cfb/reconstructed-selection-private-cache-contract-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Add exact zero-authority coverage and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/reconciliation_coverage_v1.json')
          data = json.loads(path.read_text())
          exact = data.setdefault('exact_exemptions', {})
          exact['sportsedge/sports/cfb/reconstructed_selection_acquisition.py'] = (
              'CFB_RECONSTRUCTED_SELECTION_ACQUISITION_CACHE_CONTRACT_ONLY_NO_NETWORK_MODEL_TRUTH_GATE_PROMOTION_STAKING_OR_OFFICIAL_AUTHORITY'
          )
          exact['tests/test_cfb_reconstructed_selection_acquisition.py'] = (
              'TEST_ONLY_CFB_RECONSTRUCTED_SELECTION_ACQUISITION_CONTRACT_NO_RUNTIME_AUTHORITY'
          )
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          rm .github/workflows/tmp-cfb-private-cache-coverage-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/reconciliation_coverage_v1.json .github/workflows/tmp-cfb-private-cache-coverage-patch.yml
          git diff --cached --check
          git commit -m 'CFB: classify private-cache acquisition contract as zero-authority'
          git push origin HEAD:cfb/reconstructed-selection-private-cache-contract-v1
