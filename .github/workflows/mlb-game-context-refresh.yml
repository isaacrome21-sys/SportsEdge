name: mlb-game-context-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 15-23 * * *'
    - cron: '8,23,38,53 0-5 * * *'
  push:
    paths:
      - 'sportsedge/mlb_game_context_source.py'
      - 'scripts/refresh_mlb_game_context.py'
      - 'config/mlb_source_freshness_contract.json'
      - '.github/workflows/mlb-game-context-refresh.yml'

permissions:
  contents: write

concurrency:
  group: mlb-game-context-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Prepare durable data worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          git worktree add --detach .data-branch FETCH_HEAD
      - name: Refresh weather lineups umpire catcher context
        id: refresh
        shell: bash
        run: |
          set +e
          python scripts/refresh_mlb_game_context.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist immutable context evidence to data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .data-branch/.git ] && [ ! -f .data-branch/.git ]; then
            echo 'data branch worktree is unavailable' >&2
            exit 98
          fi
          RUN_DIR=".data-branch/runtime/mlb-context/runs/${GITHUB_RUN_ID}"
          LATEST_DIR=".data-branch/runtime/mlb-context/latest"
          mkdir -p "$RUN_DIR" "$LATEST_DIR"
          cp -R artifacts/mlb-context/. "$RUN_DIR"/ 2>/dev/null || true
          rm -rf "$LATEST_DIR"/*
          cp -R artifacts/mlb-context/. "$LATEST_DIR"/ 2>/dev/null || true
          printf '%s\n' "${GITHUB_RUN_ID}" > .data-branch/runtime/mlb-context/latest_run_id.txt
          cd .data-branch
          git config user.name sportsedge-data-bot
          git config user.email sportsedge-data-bot@users.noreply.github.com
          git add runtime/mlb-context
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "mlb-context: durable run ${GITHUB_RUN_ID}"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort || true; sleep $((attempt * 2)); continue; }
            if git push origin HEAD:data; then
              pushed=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
      - name: Upload context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-context-${{ github.run_id }}
          path: artifacts/mlb-context/**
          if-no-files-found: error
          retention-days: 30
      - name: Propagate collector result after persistence
        if: always()
        shell: bash
        run: |
          code='${{ steps.refresh.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Refresh step did not emit an exit code.' >&2
            exit 99
          fi
          exit "$code"
