name: diagnose-pr898-reconciliation

on:
  push:
    branches:
      - governance/diagnose-pr898-reconciliation-20260921
    paths:
      - .github/workflows/diagnose-pr898-reconciliation.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: governance/diagnose-pr898-reconciliation-20260921
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Pin protected main and stage catch-up in working tree only
        env:
          EXPECTED_MAIN: ed628eaa978dd11a2097da91fa006067fb55e717
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN" || { echo "MAIN_MOVED:$actual expected=$EXPECTED_MAIN"; exit 1; }
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          path = Path('config/freeze_reconciliation_registry_v1.json')
          registry = json.loads(path.read_text())
          anchor = str(registry['reconciled_through_sha'])
          target = 'ed628eaa978dd11a2097da91fa006067fb55e717'

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          subprocess.check_call(['git', 'merge-base', '--is-ancestor', anchor, target])
          commits = [x for x in git('rev-list', '--first-parent', '--reverse', f'{anchor}..{target}').splitlines() if x]
          existing = {str(row.get('merge_sha') or '') for row in registry.get('deltas') or [] if isinstance(row, dict)}
          added = []
          for sha in commits:
              if sha in existing:
                  continue
              subject = git('show', '-s', '--format=%s', sha)
              body = git('show', '-s', '--format=%B', sha)
              match = re.search(r'(?:pull request |PR\s*#?)#?(\d+)', body, flags=re.I)
              pr = int(match.group(1)) if match else 0
              row = {
                  'delta_id': f'DIAG_MAIN_CATCHUP_{sha[:12].upper()}',
                  'merge_sha': sha,
                  'note': 'Diagnostic first-parent catch-up; machine matrix determines bundle impact. Subject: ' + subject,
                  'pr': pr,
              }
              registry.setdefault('deltas', []).append(row)
              existing.add(sha)
              added.append(row)
          registry['reconciled_through_sha'] = target
          path.write_text(json.dumps(registry, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps({'anchor': anchor, 'target': target, 'first_parent_commits': len(commits), 'added': len(added)}, sort_keys=True))
          PY

      - name: Run classifier and print exact decision evidence
        run: |
          set +e
          PYTHONPATH=. python scripts/reconcile_freeze_deltas.py \
            --repo . \
            --current-main-ref origin/main \
            --output /tmp/reconciliation_report.json
          classifier_status=$?
          set -e
          echo "classifier_status=$classifier_status"
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/reconciliation_report.json')
          if not p.exists():
              raise SystemExit('REPORT_NOT_WRITTEN')
          report = json.loads(p.read_text())
          rows = report.get('matrix') or report.get('rows') or []
          nfl = [
              row for row in rows
              if row.get('bundle_id') == 'NFL_PROP_MODEL_FREEZE_V1'
              and row.get('outcome') == 'DRIFT_CONFIRMED'
          ]
          print('outcome_counts=' + json.dumps(report.get('outcome_counts') or {}, sort_keys=True))
          print('release_blocks=' + json.dumps(sorted(report.get('release_blocks') or [])))
          print('NFL_PROP_MODEL_FREEZE_V1_DRIFT_CONFIRMED=' + json.dumps(nfl, sort_keys=True))
          print('authority=' + json.dumps(report.get('authority') or {}, sort_keys=True))
          PY
          exit "$classifier_status"
