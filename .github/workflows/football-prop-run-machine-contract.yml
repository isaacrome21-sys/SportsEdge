name: football-prop-run-machine-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsedge/football_prop_run_machine.py'
      - 'sportsedge/football_prop_odds_source.py'
      - 'sportsedge/football_prop_surface.py'
      - 'sportsedge/core/simulate/drive_play.py'
      - 'sportsedge/core/simulate/usage.py'
      - 'sportsedge/core/simulate/player_markets.py'
      - 'scripts/run_football_props_auto.py'
      - 'scripts/run_football_auto_bundle.py'
      - 'config/football_prop_engine_surface.json'
      - 'config/nfl_prop_model_freeze.json'
      - 'config/cfb_prop_model_freeze.json'
      - 'config/run_it_surface.json'
      - 'tests/test_football_prop_run_machine.py'
      - 'tests/test_football_prop_odds_source.py'
      - 'tests/test_football_prop_surface.py'
      - '.github/workflows/football-prop-run-machine-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/football_prop_run_machine.py'
      - 'sportsedge/football_prop_odds_source.py'
      - 'sportsedge/football_prop_surface.py'
      - 'sportsedge/core/simulate/drive_play.py'
      - 'sportsedge/core/simulate/usage.py'
      - 'sportsedge/core/simulate/player_markets.py'
      - 'scripts/run_football_props_auto.py'
      - 'scripts/run_football_auto_bundle.py'
      - 'config/football_prop_engine_surface.json'
      - 'config/nfl_prop_model_freeze.json'
      - 'config/cfb_prop_model_freeze.json'
      - 'config/run_it_surface.json'
      - 'tests/test_football_prop_run_machine.py'
      - 'tests/test_football_prop_odds_source.py'
      - 'tests/test_football_prop_surface.py'
      - '.github/workflows/football-prop-run-machine-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile football prop production boundary
        run: >-
          python -m py_compile
          sportsedge/football_prop_run_machine.py
          sportsedge/football_prop_odds_source.py
          sportsedge/football_prop_surface.py
          scripts/run_football_props_auto.py
          scripts/run_football_auto_bundle.py
          tests/test_football_prop_run_machine.py
          tests/test_football_prop_odds_source.py
          tests/test_football_prop_surface.py
      - name: Run football prop contract tests
        run: >-
          python -m unittest
          tests.test_football_prop_run_machine
          tests.test_football_prop_odds_source
          tests.test_football_prop_surface -v
      - name: Assert A+B market surface and explicit exclusions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.football_prop_run_machine import PROVIDER_MARKET_TO_STAT
          from sportsedge.football_prop_surface import require_executable_prop_surface

          surface = json.loads(Path('config/football_prop_engine_surface.json').read_text())
          assert set(surface['implemented_ab_markets'].values()) == set(PROVIDER_MARKET_TO_STAT)
          for sport in ('NFL', 'CFB'):
              spec = require_executable_prop_surface(sport)
              assert spec['engine_state'] == 'IMPLEMENTED_FAIL_CLOSED'
              assert spec['promotion_state'] == 'BLOCKED_EVIDENCE_REQUIRED'
          excluded = surface['explicit_no_engine']
          for market in ('targets', 'anytime_td', 'first_td', 'two_plus_td', 'kicker_props', 'defensive_player_props'):
              assert market in excluded
          assert surface['governance']['official_bets_allowed'] is False
          PY
      - name: Assert real football prop artifacts remain unfrozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for sport in ('nfl', 'cfb'):
              path = Path(f'config/{sport}_prop_model_freeze.json')
              freeze = json.loads(path.read_text())
              assert freeze['schema_version'] == 1
              assert freeze['status'] == 'UNFROZEN'
              assert freeze['hash_algorithm'] == 'CANONICAL_JSON_SHA256_V1'
              assert freeze['artifact_sha256'] is None
              assert not Path(freeze['artifact_path']).exists()
          print('FOOTBALL_PROP_FREEZE_STATES_OK NFL=UNFROZEN CFB=UNFROZEN')
          PY
      - name: Assert missing fitted artifacts fail closed
        shell: bash
        run: |
          for sport in NFL CFB; do
            lower=$(printf '%s' "$sport" | tr '[:upper:]' '[:lower:]')
            set +e
            python scripts/run_football_props_auto.py \
              --sport "$sport" \
              --model-artifact "/tmp/definitely-missing-${lower}-prop-model.json" \
              --output "/tmp/${lower}-prop-card.json"
            rc=$?
            set -e
            test "$rc" -eq 2
            SPORT="$sport" LOWER="$lower" python - <<'PY'
          import json, os
          from pathlib import Path
          sport = os.environ['SPORT']
          lower = os.environ['LOWER']
          payload = json.loads(Path(f'/tmp/{lower}-prop-card.json').read_text())
          assert payload['status'] == 'BLOCKED'
          assert payload['blocker'] == f'{sport}_PROP_FROZEN_MODEL_ARTIFACT_REQUIRED'
          assert payload['governance']['fail_closed'] is True
          PY
          done
      - name: Assert arbitrary bytes cannot bypass independent freeze binding
        shell: bash
        run: |
          for sport in NFL CFB; do
            lower=$(printf '%s' "$sport" | tr '[:upper:]' '[:lower:]')
            printf '{}\n' > "/tmp/${lower}-prop-model-present.json"
            set +e
            python scripts/run_football_props_auto.py \
              --sport "$sport" \
              --model-artifact "/tmp/${lower}-prop-model-present.json" \
              --output "/tmp/${lower}-prop-unfrozen-card.json"
            rc=$?
            set -e
            test "$rc" -eq 2
            SPORT="$sport" LOWER="$lower" python - <<'PY'
          import json, os
          from pathlib import Path
          sport = os.environ['SPORT']
          lower = os.environ['LOWER']
          payload = json.loads(Path(f'/tmp/{lower}-prop-unfrozen-card.json').read_text())
          assert payload['status'] == 'BLOCKED'
          assert payload['blocker'] == f'{sport}_PROP_FROZEN_MODEL_BINDING_REQUIRED'
          assert payload['governance']['fail_closed'] is True
          PY
          done
      - name: Assert RUN IT routes both football sports through bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          surface = json.loads(Path('config/run_it_surface.json').read_text())
          for sport in ('NFL', 'CFB'):
              lower = sport.lower()
              row = surface['sports'][sport]
              assert row['lane'] == 'PREGAME_MODEL_AND_PLAYER_PROPS'
              assert row['automatic_completeness'] == 'EXECUTABLE_FAIL_CLOSED'
              assert row['automatic_command'] == [
                  'python', 'scripts/run_football_auto_bundle.py', '--sport', sport,
                  '--output', f'artifacts/run_it/{lower}_card.json'
              ]
          assert Path('scripts/run_football_auto_bundle.py').is_file()
          PY
