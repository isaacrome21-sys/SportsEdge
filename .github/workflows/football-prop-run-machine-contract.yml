name: football-prop-run-machine-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sports/common/promotion_evidence.py'
      - 'sportsedge/football_prop_run_machine.py'
      - 'sportsedge/football_prop_extended_run_machine.py'
      - 'sportsedge/football_prop_odds_source.py'
      - 'sportsedge/football_prop_surface.py'
      - 'sportsedge/football_prop_evidence.py'
      - 'sportsedge/football_prop_certification.py'
      - 'sportsedge/football_prop_readiness.py'
      - 'sportsedge/sports/nfl/prop_code_surface.py'
      - 'sportsedge/sports/cfb/prop_bundle.py'
      - 'sportsedge/core/simulate/**'
      - 'scripts/run_football_props_auto.py'
      - 'scripts/run_football_auto_bundle.py'
      - 'config/football_prop_engine_surface.json'
      - 'config/promotion_evidence_policy_v2.json'
      - 'config/promotion_evidence_policy_manifest.json'
      - 'config/nfl_prop_model_freeze.json'
      - 'config/cfb_prop_model_freeze.json'
      - 'config/nfl_prop_code_surface_v1.json'
      - 'config/cfb_prop_code_surface_v1.json'
      - 'config/nfl_prop_evidence.json'
      - 'config/cfb_prop_evidence.json'
      - 'config/nfl_prop_certification.json'
      - 'config/cfb_prop_certification.json'
      - 'config/run_it_surface.json'
      - 'artifacts/football/nfl_prop_artifact_bundle_v1.json'
      - 'artifacts/football/nfl_prop_bundle_parts/**'
      - 'artifacts/football/cfb_prop_artifact_bundle_v1.json'
      - 'artifacts/football/cfb_prop_bundle_parts/**'
      - 'tests/test_football_prop_*.py'
      - 'tests/test_nfl_prop_code_surface.py'
      - '.github/workflows/football-prop-run-machine-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sports/common/promotion_evidence.py'
      - 'sportsedge/football_prop_run_machine.py'
      - 'sportsedge/football_prop_extended_run_machine.py'
      - 'sportsedge/football_prop_odds_source.py'
      - 'sportsedge/football_prop_surface.py'
      - 'sportsedge/football_prop_evidence.py'
      - 'sportsedge/football_prop_certification.py'
      - 'sportsedge/football_prop_readiness.py'
      - 'sportsedge/sports/nfl/prop_code_surface.py'
      - 'sportsedge/sports/cfb/prop_bundle.py'
      - 'sportsedge/core/simulate/**'
      - 'scripts/run_football_props_auto.py'
      - 'scripts/run_football_auto_bundle.py'
      - 'config/football_prop_engine_surface.json'
      - 'config/promotion_evidence_policy_v2.json'
      - 'config/promotion_evidence_policy_manifest.json'
      - 'config/nfl_prop_model_freeze.json'
      - 'config/cfb_prop_model_freeze.json'
      - 'config/nfl_prop_code_surface_v1.json'
      - 'config/cfb_prop_code_surface_v1.json'
      - 'config/nfl_prop_evidence.json'
      - 'config/cfb_prop_evidence.json'
      - 'config/nfl_prop_certification.json'
      - 'config/cfb_prop_certification.json'
      - 'config/run_it_surface.json'
      - 'artifacts/football/nfl_prop_artifact_bundle_v1.json'
      - 'artifacts/football/nfl_prop_bundle_parts/**'
      - 'artifacts/football/cfb_prop_artifact_bundle_v1.json'
      - 'artifacts/football/cfb_prop_bundle_parts/**'
      - 'tests/test_football_prop_*.py'
      - 'tests/test_nfl_prop_code_surface.py'
      - '.github/workflows/football-prop-run-machine-contract.yml'

permissions:
  contents: read

concurrency:
  group: football-prop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up contracted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Install contracted test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile football prop production boundary
        run: >-
          python -m py_compile
          sports/common/promotion_evidence.py
          sportsedge/football_prop_run_machine.py
          sportsedge/football_prop_extended_run_machine.py
          sportsedge/football_prop_odds_source.py
          sportsedge/football_prop_surface.py
          sportsedge/football_prop_evidence.py
          sportsedge/football_prop_certification.py
          sportsedge/football_prop_readiness.py
          sportsedge/sports/nfl/prop_code_surface.py
          sportsedge/sports/cfb/prop_bundle.py
          scripts/run_football_props_auto.py
          scripts/run_football_auto_bundle.py
          tests/test_football_prop_run_machine.py
          tests/test_football_prop_extended_run_machine.py
          tests/test_football_prop_odds_source.py
          tests/test_football_prop_surface.py
          tests/test_football_prop_runtime_truth.py
          tests/test_football_prop_certification.py
          tests/test_nfl_prop_code_surface.py
      - name: Run football prop contract tests
        run: >-
          python -m pytest -q
          tests/test_football_prop_run_machine.py
          tests/test_football_prop_extended_run_machine.py
          tests/test_football_prop_odds_source.py
          tests/test_football_prop_surface.py
          tests/test_football_prop_runtime_truth.py
          tests/test_football_prop_certification.py
          tests/test_nfl_prop_code_surface.py
      - name: Assert runtime surface and registry-derived readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.football_prop_extended_run_machine import PROVIDER_MARKETS
          from sportsedge.football_prop_surface import require_executable_prop_surface
          surface = json.loads(Path('config/football_prop_engine_surface.json').read_text())
          declared = {market for values in surface['implemented_provider_markets'].values() for market in values}
          assert declared == set(PROVIDER_MARKETS)
          expected = {
              'NFL': '3efa5cc92b5ed1bf53a99cbe0d6e7792d01791a77c8f684874d66213b73d9570',
              'CFB': '923cfd1be42d31a87d9f31ddffce406d44bfc1bb003d1c625f5a4258f7773f23',
          }
          for sport, digest in expected.items():
              row=require_executable_prop_surface(sport)
              assert row['engine_state']=='IMPLEMENTED_FAIL_CLOSED'
              assert row['promotion_state']=='AUTOMATIC_TRUTH_GATE_GATED'
              assert row['readiness_state']=='REGISTRY_DERIVED'
              assert row['runtime_state']=='ARTIFACT_FROZEN_EVIDENCE_GATED'
              assert row['frozen_artifact_sha256']==digest
          gov=surface['governance']
          assert gov['market_prices_can_create_model_p'] is False
          assert gov['one_sided_market_can_create_model_p'] is False
          assert gov['one_sided_market_can_create_fair_market_p'] is False
          assert gov['one_sided_offer_ev_allowed_with_model_p'] is True
          assert gov['paired_price_required_for_devig'] is True
          PY
      - name: Assert checked-in football prop artifact claims remain truthful
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.football_prop_run_machine import canonical_hash
          from sportsedge.sports.cfb.prop_bundle import load_cfb_prop_artifact_bundle
          from sportsedge.sports.nfl.prop_code_surface import (
              load_nfl_prop_artifact_bundle,
              verify_cfb_prop_code_surface,
              verify_nfl_prop_code_surface,
          )
          root=Path('.').resolve()
          nfl=json.loads(Path('config/nfl_prop_model_freeze.json').read_text())
          nfl_model=load_nfl_prop_artifact_bundle(root=root, bundle_path=root / nfl['artifact_path'])
          assert nfl['schema_version']==1
          assert nfl['status']=='FROZEN'
          assert nfl['promotion_authority'] is False
          assert canonical_hash(nfl_model)==nfl['artifact_sha256']=='3efa5cc92b5ed1bf53a99cbe0d6e7792d01791a77c8f684874d66213b73d9570'
          nfl_attestation=verify_nfl_prop_code_surface(root=root, registry=nfl, artifact=nfl_model)
          assert nfl_attestation['status']=='COMPATIBLE'
          assert nfl_attestation['promotion_authority'] is False

          cfb=json.loads(Path('config/cfb_prop_model_freeze.json').read_text())
          cfb_model=load_cfb_prop_artifact_bundle(root=root, bundle_path=root / cfb['artifact_path'])
          assert cfb['schema_version']==1
          assert cfb['status']=='FROZEN'
          assert cfb['promotion_authority'] is False
          assert canonical_hash(cfb_model)==cfb['artifact_sha256']=='923cfd1be42d31a87d9f31ddffce406d44bfc1bb003d1c625f5a4258f7773f23'
          assert cfb_model['source_manifest_sha256']==cfb['source_manifest_sha256']=='f25faa32ad8f1ddde16573a5919eeb108d267a04768a3b088d7db34b7682aa25'
          cfb_attestation=verify_cfb_prop_code_surface(root=root, registry=cfb, artifact=cfb_model)
          assert cfb_attestation['status']=='COMPATIBLE'
          assert cfb_attestation['promotion_authority'] is False
          PY
      - name: Assert active V2 promotion policy is the only prop certification authority
        run: |
          python - <<'PY'
          from sportsedge.football_prop_certification import active_promotion_policy_binding
          binding=active_promotion_policy_binding()
          assert binding['policy_id']=='PROMOTION_EVIDENCE_POLICY_V2'
          assert binding['evidence_ref']=='refs/heads/main'
          assert binding['official_checkpoint_graded_bets']==150
          assert len(binding['policy_sha256'])==64
          PY
      - name: Assert production evidence and certification do not self-promote
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.football_prop_evidence import EVIDENCE_GROUPS
          for sport in ('nfl','cfb'):
              evidence=json.loads(Path(f'config/{sport}_prop_evidence.json').read_text())
              assert set(evidence['groups'])==set(EVIDENCE_GROUPS)
              assert all(row['status']=='MISSING' for row in evidence['groups'].values())
              assert all(row['evidence_sha256'] is None for row in evidence['groups'].values())
              assert all(row['model_artifact_sha256'] is None for row in evidence['groups'].values())
              cert=json.loads(Path(f'config/{sport}_prop_certification.json').read_text())
              assert cert['schema_version']=='FOOTBALL_PROP_CERTIFICATION_V2'
              assert cert['markets']=={}
          PY
      - name: Assert missing fitted artifacts fail closed
        shell: bash
        run: |
          for sport in NFL CFB; do
            lower=$(printf '%s' "$sport" | tr '[:upper:]' '[:lower:]')
            set +e
            python scripts/run_football_props_auto.py --sport "$sport" --model-artifact "/tmp/definitely-missing-${lower}-prop-model.json" --output "/tmp/${lower}-prop-card.json"
            rc=$?
            set -e
            test "$rc" -eq 2
          done
      - name: Assert arbitrary bytes cannot bypass independent freeze binding
        shell: bash
        run: |
          for sport in NFL CFB; do
            lower=$(printf '%s' "$sport" | tr '[:upper:]' '[:lower:]')
            printf '{}\n' > "/tmp/${lower}-prop-model-present.json"
            set +e
            python scripts/run_football_props_auto.py --sport "$sport" --model-artifact "/tmp/${lower}-prop-model-present.json" --output "/tmp/${lower}-prop-unfrozen-card.json"
            rc=$?
            set -e
            test "$rc" -eq 2
          done
      - name: Assert RUN IT routes both football sports through bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          surface=json.loads(Path('config/run_it_surface.json').read_text())
          for sport in ('NFL','CFB'):
              lower=sport.lower(); row=surface['sports'][sport]
              assert row['lane']=='PREGAME_MODEL_AND_PLAYER_PROPS'
              assert row['automatic_completeness']=='EXECUTABLE_FAIL_CLOSED'
              assert row['automatic_command']==['python','scripts/run_football_auto_bundle.py','--sport',sport,'--output',f'artifacts/run_it/{lower}_card.json']
          assert Path('scripts/run_football_auto_bundle.py').is_file()
          PY
