name: MLB V7 StatsAPI history

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sportsedge/mlb_v7_statsapi_history.py"
      - "sportsedge/mlb_v7_final_timecode.py"
      - "scripts/acquire_mlb_v7_statsapi_history_shard.py"
      - "scripts/finalize_mlb_v7_statsapi_history.py"
      - "scripts/probe_mlb_v7_finalization_sources.py"
      - "tests/test_mlb_v7_statsapi_history.py"
      - "tests/test_mlb_v7_final_timecode.py"
      - ".github/workflows/mlb-v7-statsapi-history.yml"
      - ".github/workflows/mlb-v7-statsapi-history-persist.yml"
  push:
    branches: [main]
    paths:
      - "sportsedge/mlb_v7_statsapi_history.py"
      - "sportsedge/mlb_v7_final_timecode.py"
      - "scripts/acquire_mlb_v7_statsapi_history_shard.py"
      - "scripts/finalize_mlb_v7_statsapi_history.py"
      - "scripts/probe_mlb_v7_finalization_sources.py"
      - "tests/test_mlb_v7_statsapi_history.py"
      - "tests/test_mlb_v7_final_timecode.py"
      - ".github/workflows/mlb-v7-statsapi-history.yml"
      - ".github/workflows/mlb-v7-statsapi-history-persist.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact code head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run focused contract tests
        run: python -m pytest -q tests/test_mlb_v7_statsapi_history.py tests/test_mlb_v7_final_timecode.py tests/test_mlb_v7_travel_history.py
      - name: Prove real one-day shard without attestation authority
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/acquire_mlb_v7_statsapi_history_shard.py \
            --start 2025-04-01 \
            --end 2025-04-01 \
            --output-root artifacts/mlb-v7-statsapi-history/2025-04-01
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/mlb-v7-statsapi-history/2025-04-01/shard_report.json")
          r = json.loads(p.read_text())
          assert r["state"] == "SHARD_READY"
          assert r["scheduled_final_game_count"] == r["normalized_final_game_count"]
          assert r["normalized_team_row_count"] == 2 * r["normalized_final_game_count"]
          assert r["failures"] == []
          assert r["promotion_authority"] is False
          assert r["candidate_training_allowed"] is False
          assert r["attestation_authority"] is False
          print(json.dumps({"state": r["state"], "final_games": r["normalized_final_game_count"], "team_rows": r["normalized_team_row_count"]}, sort_keys=True))
          PY
      - name: Diagnose official finalization sources for blocked game
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/probe_mlb_v7_finalization_sources.py \
            --game-id 778485 \
            --output-root artifacts/mlb-v7-finalization-probe
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlb-v7-statsapi-history-probe-${{ github.sha }}
          path: |
            artifacts/mlb-v7-statsapi-history/2025-04-01
            artifacts/mlb-v7-finalization-probe
          if-no-files-found: error
          retention-days: 30
