name: archive-mlb-game-odds

on:
  workflow_dispatch:
  schedule:
    # Lightweight forward-evidence lane only. MLB start times are normally on a
    # five-minute grid; :02/:22/:42 is always within the archive's +/-8 minute
    # T-180/T-90/T0 acceptance window. Limit automatic runs to MLB season hours
    # rather than burning private-repo Actions minutes around the clock.
    - cron: '2,22,42 13-23,0-3 * 3-11 *'

permissions:
  contents: write

concurrency:
  group: archive-mlb-game-odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SPORTSEDGE_ODDS_API_KEY: ${{ secrets.SPORTSEDGE_ODDS_API_KEY }}
      SPORTSEDGE_ODDS_API_KEY_2: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_2 }}
      SPORTSEDGE_ODDS_API_KEY_3: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_3 }}
      SPORTSEDGE_ODDS_API_KEY_4: ${{ secrets.SPORTSEDGE_ODDS_API_KEY_4 }}
      SPORTSEDGE_ODDS_BOOKMAKERS: draftkings
      SPORTSEDGE_ODDS_DAILY_BUDGET_CREDITS: '12'
      SPORTSEDGE_ODDS_BUDGET_LEDGER: .cache/sportsedge/odds-budget/ledger.json
      SPORTSEDGE_ARCHIVE_SOURCE: scheduled-primary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify runner Python
        run: python3 --version
      - name: Verify V8 evidence contracts
        run: |
          python3 -I scripts/mlb_v8_evidence.py --self-test
          python3 -I scripts/persist_mlb_v8_evidence.py --self-test
      - name: Run canonical durable MLB archive lane
        run: python3 -I scripts/run_mlb_archive_lane.py
      - name: Package clean V8 forward market evidence
        if: always()
        run: python3 -I scripts/mlb_v8_evidence.py --market
      - name: Persist clean V8 forward evidence
        if: always()
        run: python3 -I scripts/persist_mlb_v8_evidence.py
      - name: Upload archive execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-raw-game-odds-${{ github.run_id }}
          path: |
            artifacts/raw_odds/**
            artifacts/mlb_v8/**
            .cache/sportsedge/odds-budget/ledger.json
          if-no-files-found: error
          retention-days: 90
