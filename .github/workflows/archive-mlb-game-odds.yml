name: archive-mlb-game-odds

# Keyless DraftKings direct-web paired moneyline forward capture.
#
# This workflow previously ran a paid The Odds API poller and was parked for the
# remainder of 2026. It now has exactly one purpose: run the direct paired
# capture and retain its evidence. No Odds API secrets, no paid budget ledger,
# no fallback provider.
#
# Transport failure, an empty board, or an in-window one-sided market exits 2
# and fails visibly. NO_CAPTURE_DUE is green only when the acquired MLB board
# is non-empty and no game is inside T60/T30/T10.
#
# Grants no promotion authority. Does not read or modify config/deployments.json
# or the frozen moneyline edge floor. Retained rows are FORWARD_CAPTURE_PARTIAL.

on:
  workflow_dispatch:
  push:
    branches: [mlb-keyless-forward-capture]
    paths:
      - '.github/workflows/archive-mlb-game-odds.yml'
      - 'scripts/capture_mlb_direct_paired_ml.py'
      - 'scripts/persist_captured_evidence.py'
      - 'sportsedge/direct_web_capture_source.py'
      - 'sportsedge/draftkings_game_market_source.py'
      - 'tests/test_capture_mlb_direct_paired_ml.py'
      - 'tests/test_direct_web_capture_source.py'
      - 'tests/test_draftkings_game_line_category_map.py'
      - 'tests/test_persist_captured_evidence.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: mlb-direct-paired-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mlb-keyless-forward-capture

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Contract tests
        run: |
          python -m py_compile scripts/capture_mlb_direct_paired_ml.py \
            sportsedge/direct_web_capture_source.py \
            sportsedge/draftkings_game_market_source.py
          python -m unittest \
            tests.test_direct_web_capture_source \
            tests.test_capture_mlb_direct_paired_ml \
            tests.test_draftkings_game_line_category_map \
            tests.test_persist_captured_evidence -v

      - name: Capture
        run: |
          set -o pipefail
          python scripts/capture_mlb_direct_paired_ml.py \
            --output-dir data/mlb_forward_capture | tee capture_result.json

      - name: Persist retained observations
        run: |
          git config user.name  "sportsedge-capture"
          git config user.email "sportsedge-capture@users.noreply.github.com"
          python scripts/persist_captured_evidence.py \
            --path data/mlb_forward_capture \
            --branch main
