name: archive-mlb-game-odds

# Keyless DraftKings direct-web paired moneyline forward capture.
#
# This workflow previously ran a paid The Odds API poller and was parked for the
# remainder of 2026. It now has exactly one purpose: run the direct paired
# capture and retain its evidence. No Odds API secrets, no paid budget ledger,
# no fallback provider.
#
# A transport failure or an in-window one-sided market exits 2 and fails the job
# visibly. A slate with no game inside a capture window exits 0: that is a
# routine no-op, not a block, and must not be reported as failure.
#
# Grants no promotion authority. Does not read or modify config/deployments.json
# or the frozen moneyline edge floor. Retained rows are FORWARD_CAPTURE_PARTIAL.

on:
  workflow_dispatch:
  schedule:
    # Wake every 5 minutes; the script decides whether any game sits inside a
    # defined pregame window (T60 / T30 / T10) and writes at most one row per
    # (event, window). Waking is cheap; writing is event-relative.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: mlb-direct-paired-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      # Scripts are executed by path, so Python otherwise starts with scripts/
      # as sys.path[0]. Keep the repository root importable for sportsedge.*.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Persistence rebuilds onto the remote tip on a push race, so the
          # working tree must be able to fetch and reset against origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d870655
        with:
          python-version: '3.12'

      - name: Contract tests
        run: |
          python -m py_compile scripts/capture_mlb_direct_paired_ml.py \
            sportsedge/direct_web_capture_source.py
          python -m unittest \
            tests.test_direct_web_capture_source \
            tests.test_capture_mlb_direct_paired_ml \
            tests.test_persist_captured_evidence -v

      - name: Capture
        run: |
          set -o pipefail
          python scripts/capture_mlb_direct_paired_ml.py \
            --output-dir data/mlb_forward_capture | tee capture_result.json

      # A green acquisition followed by a failed push is NOT retained evidence.
      # This step commits, handles a main-moved race by rebuilding onto the new
      # remote tip, refuses to retry a branch-protection refusal, and verifies
      # the commit is present on the remote before reporting success.
      - name: Persist retained observations
        run: |
          git config user.name  "sportsedge-capture"
          git config user.email "sportsedge-capture@users.noreply.github.com"
          python scripts/persist_captured_evidence.py \
            --path data/mlb_forward_capture \
            --branch main
