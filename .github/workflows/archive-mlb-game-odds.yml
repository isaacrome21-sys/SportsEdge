name: archive-mlb-game-odds

# Prospective MLB MONEYLINE evidence lane.
#
# Every five minutes this workflow independently captures a market-blind Model_P
# prediction when a Preview game is 40-60 minutes from first pitch, then captures
# exact two-sided DraftKings moneylines in the existing T60/T30/T10 windows.
# The prediction is produced only from live-observed MLB StatsAPI game-log data;
# sportsbook prices never enter Model_P. Both paths remain zero-authority until
# frozen calibration/CLV/sample/production-parity gates are satisfied.
#
# Transport failure, a due Model_P failure, an empty DraftKings board, or an
# in-window one-sided market fails visibly. NO_PREDICTION_DUE/NO_CAPTURE_DUE are
# green only when their respective preconditions are genuinely absent.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: mlb-direct-paired-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Contract tests
        run: |
          python -m py_compile \
            scripts/capture_mlb_moneyline_model_p.py \
            scripts/capture_mlb_direct_paired_ml.py \
            sportsedge/mlb_moneyline_forward_prediction.py \
            sportsedge/mlb_moneyline_forward_ledger.py \
            sportsedge/direct_web_capture_source.py \
            sportsedge/draftkings_game_market_source.py
          python -m unittest \
            tests.test_mlb_moneyline_forward_prediction \
            tests.test_direct_web_capture_source \
            tests.test_capture_mlb_direct_paired_ml \
            tests.test_draftkings_game_line_category_map \
            tests.test_persist_captured_evidence -v

      - name: Capture market-blind Model_P predictions
        run: |
          set +e
          set -o pipefail
          python scripts/capture_mlb_moneyline_model_p.py \
            --output-dir data/mlb_forward_predictions | tee model_p_result.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > model_p_exit_code.txt
          exit 0

      - name: Persist Model_P predictions
        run: |
          git config user.name  "sportsedge-capture"
          git config user.email "sportsedge-capture@users.noreply.github.com"
          python scripts/persist_captured_evidence.py \
            --path data/mlb_forward_predictions \
            --branch main

      - name: Capture paired DraftKings quotes
        run: |
          set -o pipefail
          python scripts/capture_mlb_direct_paired_ml.py \
            --output-dir data/mlb_forward_capture | tee capture_result.json

      - name: Persist retained observations
        run: |
          git config user.name  "sportsedge-capture"
          git config user.email "sportsedge-capture@users.noreply.github.com"
          python scripts/persist_captured_evidence.py \
            --path data/mlb_forward_capture \
            --branch main

      - name: Enforce Model_P capture status
        if: always()
        run: |
          rc=$(cat model_p_exit_code.txt 2>/dev/null || echo 2)
          test "$rc" -eq 0
