name: nfl-attempt9-model-p-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/public_training_sources_v1.json'
      - 'scripts/build_nfl_attempt9_runtime_artifact.py'
      - 'scripts/build_nfl_attempt9_model_p_artifact.py'
      - 'sportsedge/sports/nfl/attempt9_model_p.py'
      - 'sportsedge/truth_gate.py'
      - 'tests/test_nfl_attempt9_model_p.py'
      - '.github/workflows/nfl-attempt9-model-p-contract.yml'

permissions:
  contents: read

jobs:
  model-p-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.3'
      - name: Run Model_P regressions
        run: python -m unittest -v tests.test_nfl_attempt9_model_p
      - name: Reconstruct exact frozen attempt-9 runtime
        env:
          OPENBLAS_CORETYPE: ZEN
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p artifacts/nfl-attempt9-model-p
          python scripts/build_nfl_attempt9_runtime_artifact.py \
            --output artifacts/nfl-attempt9-model-p/runtime.json
      - name: Build exposed-history probability wrapper
        env:
          OPENBLAS_CORETYPE: ZEN
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m scripts.build_nfl_attempt9_model_p_artifact \
            --runtime artifacts/nfl-attempt9-model-p/runtime.json \
            --source-config config/public_training_sources_v1.json \
            --output artifacts/nfl-attempt9-model-p/model_p.json \
            --code-git-sha "$(git rev-parse HEAD)"
      - name: Assert Model_P exists but promotion and OFFICIAL remain false
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sportsedge.sports.nfl.attempt9_model_p import verify_model_p_artifact
          artifact=json.loads(Path('artifacts/nfl-attempt9-model-p/model_p.json').read_text())
          verify_model_p_artifact(artifact)
          assert artifact['authority']['creates_model_p'] is True
          for key in ('historical_fit_promotion_authority','deployed','truth_gate_pass','official_authority','staking_authority'):
              if artifact['authority'][key] is not False:
                  raise SystemExit(f'NFL_ATTEMPT9_MODEL_P_AUTHORITY_LEAK:{key}')
          assert artifact['calibration_fit']['role']=='SELECTION_EXPOSED_FIT_ONLY_NOT_PROMOTION_EVIDENCE'
          assert artifact['prospective_evidence']['inherited_m2_evidence_allowed'] is False
          assert artifact['prospective_evidence']['backfill_allowed'] is False
          PY
      - name: Upload Model_P contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-attempt9-model-p-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nfl-attempt9-model-p
          if-no-files-found: warn
          retention-days: 30
