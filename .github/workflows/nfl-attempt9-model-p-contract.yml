name: nfl-attempt9-model-p-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/public_training_sources_v1.json'
      - 'artifacts/football/nfl_attempt9_runtime_v1.json'
      - 'artifacts/football/nfl_attempt9_model_p_v1.json'
      - 'scripts/build_nfl_attempt9_runtime_artifact.py'
      - 'scripts/build_nfl_attempt9_model_p_artifact.py'
      - 'sportsedge/sports/nfl/attempt9_model_p.py'
      - 'sportsedge/truth_gate.py'
      - 'tests/test_nfl_attempt9_model_p.py'
      - 'tests/test_nfl_attempt9_frozen_artifacts.py'
      - '.github/workflows/nfl-attempt9-model-p-contract.yml'

permissions:
  contents: read

jobs:
  model-p-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.3'
      - name: Run Model_P and frozen-artifact regressions
        run: |
          python -m unittest -v \
            tests.test_nfl_attempt9_model_p \
            tests.test_nfl_attempt9_frozen_artifacts
      - name: Verify committed known-good runtime and Model_P artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/nfl-attempt9-model-p
          cp artifacts/football/nfl_attempt9_runtime_v1.json artifacts/nfl-attempt9-model-p/runtime.json
          cp artifacts/football/nfl_attempt9_model_p_v1.json artifacts/nfl-attempt9-model-p/model_p.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from sportsedge.sports.nfl.attempt9_model_p import verify_model_p_artifact

          runtime=json.loads(Path('artifacts/nfl-attempt9-model-p/runtime.json').read_text())
          model_p=json.loads(Path('artifacts/nfl-attempt9-model-p/model_p.json').read_text())
          body=dict(runtime)
          expected_runtime=body.pop('artifact_sha256')
          actual_runtime=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':'),default=str).encode()).hexdigest()
          if actual_runtime != expected_runtime:
              raise SystemExit(f'NFL_ATTEMPT9_RUNTIME_ARTIFACT_SHA_MISMATCH:{actual_runtime}:{expected_runtime}')
          verify_model_p_artifact(model_p)
          if model_p['runtime_artifact_sha256'] != expected_runtime:
              raise SystemExit('NFL_ATTEMPT9_MODEL_P_RUNTIME_BINDING_MISMATCH')
          if model_p['source_sha256'] != runtime['source']['sha256']:
              raise SystemExit('NFL_ATTEMPT9_MODEL_P_SOURCE_BINDING_MISMATCH')
          if model_p['authority']['creates_model_p'] is not True:
              raise SystemExit('NFL_ATTEMPT9_MODEL_P_MISSING')
          for key in ('historical_fit_promotion_authority','deployed','truth_gate_pass','official_authority','staking_authority'):
              if model_p['authority'][key] is not False:
                  raise SystemExit(f'NFL_ATTEMPT9_MODEL_P_AUTHORITY_LEAK:{key}')
          print(json.dumps({
              'status':'FROZEN_HOSTED_ARTIFACTS_VERIFIED',
              'runtime_artifact_sha256':expected_runtime,
              'model_p_artifact_sha256':model_p['artifact_sha256'],
              'creates_model_p':True,
              'promotion_authority':False,
              'truth_gate_pass':False,
              'official_authority':False,
              'staking_authority':False,
              'backfill_allowed':False,
          },sort_keys=True))
          PY
      - name: Probe runner numeric compatibility without changing frozen identity
        env:
          OPENBLAS_CORETYPE: ZEN
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set +e
          python scripts/build_nfl_attempt9_runtime_artifact.py \
            --output artifacts/nfl-attempt9-model-p/runtime_reconstruction_probe.json \
            > artifacts/nfl-attempt9-model-p/reconstruction_probe.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'NFL_ATTEMPT9_HOST_RECONSTRUCTION=EXACT_COMPATIBLE' | tee artifacts/nfl-attempt9-model-p/reconstruction_probe_status.txt
          else
            echo 'NFL_ATTEMPT9_HOST_RECONSTRUCTION=NUMERICALLY_DIVERGENT_DIAGNOSTIC_ONLY' | tee artifacts/nfl-attempt9-model-p/reconstruction_probe_status.txt
            echo "exit_code=$rc" >> artifacts/nfl-attempt9-model-p/reconstruction_probe_status.txt
            rm -f artifacts/nfl-attempt9-model-p/runtime_reconstruction_probe.json
          fi
          exit 0
      - name: Assert historical fit cannot self-promote
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          artifact=json.loads(Path('artifacts/football/nfl_attempt9_model_p_v1.json').read_text())
          assert artifact['calibration_fit']['role']=='SELECTION_EXPOSED_FIT_ONLY_NOT_PROMOTION_EVIDENCE'
          assert artifact['prospective_evidence']['inherited_m2_evidence_allowed'] is False
          assert artifact['prospective_evidence']['backfill_allowed'] is False
          assert artifact['prospective_evidence']['historical_fit_counts_as_promotion_evidence'] is False
          PY
      - name: Upload Model_P contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-attempt9-model-p-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nfl-attempt9-model-p
          if-no-files-found: warn
          retention-days: 30
