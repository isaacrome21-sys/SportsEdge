name: mlb-sportsdataio-production-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-mlb-sportsdataio-production-acceptance'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Probe SportsDataIO MLB production odds path without retaining raw bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          now = datetime.now(timezone.utc)
          out = Path('artifacts/sportsdataio-probe')
          out.mkdir(parents=True, exist_ok=True)
          target = out / 'probe.json'
          key = os.environ.get('SPORTSDATAIO_API_KEY', '').strip()
          row = {
              'schema': 'SPORTSEDGE_MLB_SPORTSDATAIO_ACCEPTANCE_V1',
              'provider': 'SPORTSDATAIO',
              'sport': 'MLB',
              'run_at_utc': now.isoformat(),
              'probe_scope': 'PRODUCTION_MLB_ODDS_PATH_ONLY',
              'endpoint': '/v3/mlb/odds/json/GameOddsByDate/2026-09-12',
              'historical_archive_access_proven': False,
              'historical_bytes_persisted': False,
              'raw_bytes_persisted': False,
              'promotion_authority': False,
              'may_change_market_eligibility': False,
          }
          if not key:
              row['status'] = 'BLOCKED_NO_SPORTSDATAIO_API_KEY'
              target.write_text(json.dumps(row, indent=2, sort_keys=True) + '\n')
              print(json.dumps(row, sort_keys=True))
              raise SystemExit(2)

          req = Request(
              'https://api.sportsdata.io/v3/mlb/odds/json/GameOddsByDate/2026-09-12',
              headers={
                  'Accept': 'application/json',
                  'Ocp-Apim-Subscription-Key': key,
                  'User-Agent': 'SportsEdge-SportsDataIO-Acceptance/1',
              },
          )
          try:
              with urlopen(req, timeout=25) as response:
                  raw = response.read()
                  payload = json.loads(raw.decode('utf-8'))
                  row.update({
                      'status': 'PRODUCTION_ODDS_PATH_PASS_HISTORICAL_ARCHIVE_UNPROVEN',
                      'http_status': getattr(response, 'status', 200),
                      'response_sha256': sha256(raw).hexdigest(),
                      'response_byte_length': len(raw),
                      'rows_returned': len(payload) if isinstance(payload, list) else None,
                      'raw_retention': 'DISCARDED_AFTER_HASH_ACCEPTANCE_ONLY',
                  })
          except HTTPError as exc:
              body = exc.read().decode('utf-8', errors='replace')[:500]
              row.update({
                  'status': 'BLOCKED_SPORTSDATAIO_AUTH_OR_PRODUCT_ACCESS' if exc.code in (401, 403) else 'BLOCKED_SPORTSDATAIO_HTTP',
                  'http_status': exc.code,
                  'error_body_sha256': sha256(body.encode()).hexdigest(),
              })
          except Exception as exc:
              row.update({'status': 'BLOCKED_SPORTSDATAIO_TRANSPORT', 'error_type': type(exc).__name__})

          target.write_text(json.dumps(row, indent=2, sort_keys=True) + '\n')
          print(json.dumps(row, sort_keys=True))
          raise SystemExit(0 if row['status'].startswith('PRODUCTION_ODDS_PATH_PASS') else 3)
          PY
      - name: Persist sanitized acceptance metadata only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/sportsdataio-probe/probe.json
          git fetch --depth=1 origin data:data
          worktree_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true; rm -rf "$worktree_dir"' EXIT
          git worktree add "$worktree_dir" data
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dest="$worktree_dir/runtime/provider-acceptance/sportsdataio/$stamp.json"
          install -D -m 0644 artifacts/sportsdataio-probe/probe.json "$dest"
          cd "$worktree_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/provider-acceptance/sportsdataio
          git commit -m "data(mlb): persist SportsDataIO acceptance metadata $stamp"
          git push origin HEAD:data
