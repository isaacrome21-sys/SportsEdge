name: nfl-v2k-attempt1-development-validation
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONSUME_ATTEMPT_1 to run the frozen 50,000-path Attempt 1 (consumes 1 of 5 attempts).'
        required: true
  pull_request:
    paths:
      - 'scripts/run_nfl_v2k_attempt1.py'
      - 'sportsedge/sports/nfl/v2k_attempt1_validation.py'
      - 'sportsedge/sports/nfl/v2k_drive_core.py'
      - 'sportsedge/sports/nfl/v2k_drive_source.py'
      - 'sportsedge/sports/nfl/NFL_V2K_*.json'
      - 'tests/test_nfl_v2k_*.py'
      - '.github/workflows/nfl-v2k-attempt1-development-validation.yml'
permissions:
  contents: read
concurrency:
  group: nfl-v2k-attempt1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - run: python -m py_compile scripts/run_nfl_v2k_attempt1.py sportsedge/sports/nfl/v2k_attempt1_validation.py
      # Fixture-only tests: PR CI never reads the development window, so it cannot consume Attempt 1.
      - run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_nfl_v2k_attempt1_runner.py
          tests/test_nfl_v2k_attempt0_core.py
          tests/test_nfl_v2k_rng_identity.py
          tests/test_nfl_v2k_development_validation_preattempt.py

  simulate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'CONSUME_ATTEMPT_1' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        fold: [F1, F2, F3, F4, F5]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Materialize frozen NFL sources
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2k/sources
          --attestation-out artifacts/football/v2k/source_attestation.json
      - name: Simulate fold shard
        run: >-
          python scripts/run_nfl_v2k_attempt1.py simulate
          --fold ${{ matrix.fold }} --shard-index ${{ matrix.shard }} --shard-count 2
          --paths 50000 --code-sha ${{ github.sha }}
          --pbp-dir artifacts/football/v2k/sources/pbp
          --schedule artifacts/football/v2k/sources/games.csv
          --out artifacts/football/v2k/shards/${{ matrix.fold }}_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2k-attempt1-shard-${{ matrix.fold }}-${{ matrix.shard }}
          path: artifacts/football/v2k/shards/${{ matrix.fold }}_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Materialize frozen NFL sources
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2k/sources
          --attestation-out artifacts/football/v2k/source_attestation.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nfl-v2k-attempt1-shard-*
          path: artifacts/football/v2k/shards
      - name: Evaluate pre-registered gates
        run: >-
          python scripts/run_nfl_v2k_attempt1.py evaluate
          --shards-dir artifacts/football/v2k/shards
          --pbp-dir artifacts/football/v2k/sources/pbp
          --schedule artifacts/football/v2k/sources/games.csv
          --out artifacts/football/v2k/nfl_v2k_attempt1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2k-attempt1-${{ github.sha }}
          path: |
            artifacts/football/v2k/source_attestation.json
            artifacts/football/v2k/nfl_v2k_attempt1.json
          if-no-files-found: error
          retention-days: 90
