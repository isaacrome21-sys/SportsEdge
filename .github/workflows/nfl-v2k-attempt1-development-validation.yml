name: nfl-v2k-attempt1-development-validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_nfl_v2k_attempt1.py'
      - '.github/workflows/nfl-v2k-attempt1-development-validation.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 pytest==9.1.1
      - run: python -m py_compile scripts/run_nfl_v2k_attempt1.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_nfl_v2k_attempt0_core.py tests/test_nfl_v2k_rng_identity.py
  attempt1:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Materialize frozen NFL sources
        run: >-
          python scripts/materialize_nfl_frozen_sources.py
          --source-contract config/nfl_promotion_source_freeze_v1.json
          --output-root artifacts/football/v2k/sources
          --attestation-out artifacts/football/v2k/source_attestation.json
      - name: Run V2K Attempt 1
        run: >-
          PYTHONPATH=. python scripts/run_nfl_v2k_attempt1.py
          --pbp-dir artifacts/football/v2k/sources/pbp
          --source-manifest-sha b7ff10325b69dd140e8c9d40971475595871e43f8d5a3c2ed2d9ffa8774c0723
          --code-sha ${{ github.sha }}
          --paths 50000
          --out artifacts/football/v2k/nfl_v2k_attempt1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-v2k-attempt1-${{ github.sha }}
          path: |
            artifacts/football/v2k/source_attestation.json
            artifacts/football/v2k/nfl_v2k_attempt1.json
          if-no-files-found: error
          retention-days: 90
