# COPY THIS FILE over .github/workflows/capper-vetter.yml (Claude's GitHub
# integration lacks the workflows permission). Change vs head 9e31a707:
# cron removed (cron policy), issue_comment trigger added, tracker edited in place.
name: capper-vetter

# CAPPER_VETTER_V1 (EXTERNAL_EV add-on). Reads "[CAPPER]" issues, pulls tip
# times, DK closes and finals from ESPN's free public scoreboard, grades each
# outside account, and posts the ranked table on the "[CAPPER RANKINGS]"
# issue. Writes nothing to the repository (freeze-reconciliation hold);
# outputs are an artifact plus an issue comment.
on:
  pull_request:
    paths:
      - 'sportsedge/capper_vetter.py'
      - 'sportsedge/capper_pipeline.py'
      - 'scripts/run_capper_vetter.py'
      - 'config/capper_vetter_v1.json'
      - 'tests/test_capper_vetter.py'
      - 'tests/test_capper_pipeline.py'
      - '.github/workflows/capper-vetter.yml'
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
# No schedule: SPORTSEDGE_WORKFLOW_CRON_POLICY_V1 does not list this
# workflow, and the frozen policy is not relaxed for it. Grades refresh
# whenever a [CAPPER] issue is filed, edited or commented ("close:",
# "result:"), and on manual dispatch. Each run rewrites ONE tracker
# issue body in place, so event-triggered runs never spam comments.

permissions:
  contents: read
  issues: write

concurrency:
  group: capper-vetter
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q tests/test_capper_vetter.py tests/test_capper_pipeline.py

  grade:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'issues' || github.event_name == 'issue_comment') &&
       !github.event.issue.pull_request &&
       startsWith(github.event.issue.title, '[CAPPER]') &&
       !startsWith(github.event.issue.title, '[CAPPER RANKINGS]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: '.python-version'
      - name: Grade outside cappers
        run: |
          python scripts/run_capper_vetter.py --post
          cat artifacts/capper_vetter/rankings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capper-vetter-${{ github.run_id }}
          path: artifacts/capper_vetter/
          if-no-files-found: warn
          retention-days: 30
