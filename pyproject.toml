# Repository-level interpreter and development dependency contract.
# SportsEdge is not published as a Python package. A package version is therefore
# intentionally not fabricated here; it remains dynamic until a real release/version
# source exists.

[project]
name = "sportsedge"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
  "numpy==2.5.3",
  "pytest==9.1.1",
  "PyYAML==6.0.2",
  "beautifulsoup4==4.13.5",
  "lxml==6.1.3",
  "requests==2.32.5",
  "Pillow==12.3.0",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "ruff==0.17.1",
  "pybaseball==2.2.7",
]
